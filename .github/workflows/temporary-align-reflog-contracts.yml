name: Temporary align reflog contracts

on:
  push:
    branches:
      - perf/reflog-index-evidence

permissions:
  contents: write

concurrency:
  group: temporary-align-reflog-contracts
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/reflog-index-evidence
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Align migration, index and adoption expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('jgit-storage-hibernate-core/src/test/java')

          migration = root / 'io/github/carstenartur/jgit/storage/hibernate/CoreSchemaMigrationIntegrationTest.java'
          text = migration.read_text(encoding='utf-8')
          old = 'new ExpectedMigration("0.1.18", "optimize reverse reflog reads"));'
          new = (
              'new ExpectedMigration("0.1.18", "optimize reverse reflog reads"),\n'
              '      new ExpectedMigration("0.9.1", "add reflog reference key"));'
          )
          if old in text:
              text = text.replace(old, new, 1)
          elif 'new ExpectedMigration("0.9.1", "add reflog reference key")' not in text:
              raise SystemExit('Could not update the Core migration expectation')
          migration.write_text(text, encoding='utf-8')

          for path in root.rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(
                  'assertEquals("0.1.18", flyway.info().current().getVersion().getVersion());',
                  'assertEquals("0.9.1", flyway.info().current().getVersion().getVersion());',
              )
              text = text.replace('IDX_REFLOG_REPO_REF_ID', 'IDX_REFLOG_REPO_REF_KEY_ID')
              text = text.replace(
                  'indexExists(connection, "git_reflog", "idx_reflog_repo_id")',
                  'indexExists(connection, "git_reflog", "idx_reflog_repo_ref_key_id")',
              )
              if path.name == 'CoreSqlServerSchemaMigrationIntegrationTest.java':
                  anchor = (
                      'assertTrue(indexExists(connection, "git_reflog", '
                      '"idx_reflog_repo_ref_key_id"));'
                  )
                  column_assertion = (
                      'assertTrue(columnExists(connection, "git_reflog", "ref_name_key"));'
                  )
                  if anchor in text and column_assertion not in text:
                      text = text.replace(
                          anchor, anchor + '\n      ' + column_assertion, 1
                      )
              if text != original:
                  path.write_text(text, encoding='utf-8')

          adoption_specs = {
              'LegacyCoreSchemaAdoptionIntegrationTest.java': (
                  'statement.execute("alter table git_reflog alter column repository_name set data type varchar(255)");',
                  'statement.execute("drop index if exists idx_reflog_repo_ref_key_id");\n'
                  '      statement.execute("alter table git_reflog drop column if exists ref_name_key");\n'
                  '      statement.execute("alter table git_reflog alter column repository_name set data type varchar(255)");',
              ),
              'LegacyCorePostgreSqlSchemaAdoptionIntegrationTest.java': (
                  'statement.execute("alter table git_reflog alter column repository_name type varchar(255)");',
                  'statement.execute("drop index if exists idx_reflog_repo_ref_key_id");\n'
                  '      statement.execute("alter table git_reflog drop column if exists ref_name_key");\n'
                  '      statement.execute("alter table git_reflog alter column repository_name type varchar(255)");',
              ),
              'LegacyCoreSqlServerSchemaAdoptionIntegrationTest.java': (
                  'statement.execute("alter table git_reflog alter column repository_name varchar(255) not null");',
                  'statement.execute("drop index if exists idx_reflog_repo_ref_key_id on git_reflog");\n'
                  '      if (columnExists(connection, "git_reflog", "ref_name_key")) {\n'
                  '        statement.execute("alter table git_reflog drop column ref_name_key");\n'
                  '      }\n'
                  '      statement.execute("alter table git_reflog alter column repository_name varchar(255) not null");',
              ),
          }
          for file_name, (anchor, replacement) in adoption_specs.items():
              matches = list(root.rglob(file_name))
              if not matches:
                  continue
              path = matches[0]
              text = path.read_text(encoding='utf-8')
              if anchor in text and 'drop column if exists ref_name_key' not in text and 'drop column ref_name_key' not in text:
                  path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          # Current-schema adoption fixtures must prove that the historical shape was actually
          # recreated before Flyway adopts it.
          for path in root.rglob('*SchemaAdoptionIntegrationTest.java'):
              text = path.read_text(encoding='utf-8')
              assertion_anchor = 'assertTrue(columnExists(connection, "git_reflog", "message"));'
              missing_key = 'assertFalse(columnExists(connection, "git_reflog", "ref_name_key"));'
              if assertion_anchor in text and missing_key not in text and 'downgradeToPreLibrarySchema' in text:
                  text = text.replace(
                      assertion_anchor,
                      assertion_anchor + '\n      ' + missing_key,
                      1,
                  )
                  path.write_text(text, encoding='utf-8')

          Path('.github/workflows/temporary-align-reflog-contracts.yml').unlink()
          PY
          git diff --check
          mvn -B -pl jgit-storage-hibernate-core -DskipITs test
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Align schema contracts with the reflog reference key'
          git push origin HEAD:perf/reflog-index-evidence
