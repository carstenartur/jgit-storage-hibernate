name: Apply storage byte metrics

on:
  push:
    branches:
      - perf/storage-byte-metrics-v2

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/storage-byte-metrics-v2
          fetch-depth: 0
      - name: Reconstruct and verify implementation
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/storage-byte-metrics.tar.gz"
          cat .tmp/storage-byte-metrics.aa \
              .tmp/storage-byte-metrics.ab \
              .tmp/storage-byte-metrics.ac \
              .tmp/storage-byte-metrics.ad \
              .tmp/storage-byte-metrics.ae \
              .tmp/storage-byte-metrics.af \
              .tmp/storage-byte-metrics.ag \
              .tmp/storage-byte-metrics.ah \
            | base64 --decode > "$archive"
          echo "2628fcdea43cf8ce811cb6a3ba1c7d0e68d5b4bbf858b15dcda6bba7e2889131  $archive" \
            | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$GITHUB_WORKSPACE"
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .tmp/storage-byte-metrics.aa \
                 .tmp/storage-byte-metrics.ab \
                 .tmp/storage-byte-metrics.ac \
                 .tmp/storage-byte-metrics.ad \
                 .tmp/storage-byte-metrics.ae \
                 .tmp/storage-byte-metrics.af \
                 .tmp/storage-byte-metrics.ag \
                 .tmp/storage-byte-metrics.ah \
                 .github/workflows/apply-storage-byte-metrics.yml
          git add jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/transaction/StorageByteMetrics.java
          git add jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/objects/StorageByteCounters.java
          git add jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/objects/StagedPackExtensionStore.java
          git add jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/objects/ReadAheadHibernateObjDatabase.java
          git add jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/repository/HibernateRepository.java
          git add jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/transaction/StorageByteMetricsTest.java
          git add jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/objects/StorageByteMetricsH2Test.java
          git add docs/operations/storage-byte-metrics.md
          git commit -m 'Measure staged, persisted and read-ahead payload bytes'
          git push origin HEAD:perf/storage-byte-metrics-v2
