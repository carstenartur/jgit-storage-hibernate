name: Repair issue 285 diagnostic expectations

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: repair-issue285-expectations-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Align generated tests with contextual diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-issue285-jmh-schema-validation.py')
          text = path.read_text(encoding='utf-8')

          context_guard = 'if name not in {"array", "result", "backend", "params"}:'
          if text.count(context_guard) != 2:
              raise SystemExit(
                  f'Expected two generated context guards, found {text.count(context_guard)}'
              )
          text = text.replace(
              context_guard,
              'if name not in {"array", "result", "backend", "operation", "params"}:',
          )

          anchor = 'layout_test_path.write_text(layout_tests, encoding="utf-8")'
          if text.count(anchor) != 1:
              raise SystemExit('Could not locate layout test write anchor exactly once')
          additions = '''layout_tests = replace_once(
              layout_tests,
              'with self.assertRaisesRegex(ValueError, "primary score"):',
              'with self.assertRaisesRegex(ValueError, "primaryMetric score"):',
              "layout primary-score diagnostic expectation",
          )
          layout_tests = replace_once(
              layout_tests,
              '"primary percentile",',
              '"primaryMetric percentile",',
              "layout primary-percentile diagnostic expectation",
          )
          '''.replace('          ', '')
          text = text.replace(anchor, additions + anchor)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify repaired helper parses
        run: python3 -m py_compile .github/scripts/apply-issue285-jmh-schema-validation.py

      - name: Remove this one-shot workflow
        run: rm .github/workflows/repair-issue285-test-expectations.yml

      - name: Commit helper repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/scripts/apply-issue285-jmh-schema-validation.py \
            .github/workflows/repair-issue285-test-expectations.yml
          if git diff --cached --quiet; then
            echo 'Expected issue #285 expectation repair produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Align issue 285 diagnostic expectations'
          git push origin "HEAD:${HEAD_REF}"
