name: Inspect Security Javadoc Source

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/inspect-security-javadoc-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Materialize the Security module
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/scripts/security-phase1-module.b64.part-00-0 \
            .github/scripts/security-phase1-module.b64.part-00-1 \
            .github/scripts/security-phase1-module.b64.part-01 \
            .github/scripts/security-phase1-module.b64.part-02 \
            .github/scripts/security-phase1-module.b64.part-03 \
            .github/scripts/security-phase1-module.b64.part-04 \
            > .github/scripts/security-phase1-module.b64
          python3 .github/scripts/generate-security-phase1.py
      - name: Order the membership table and dependent statements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "jgit-storage-hibernate-security/src/main/resources/db/migration/"
              "jgit-storage-hibernate/security"
          )
          identifier = (
              r'(?:git_security_group_member|"git_security_group_member"|'
              r'\[git_security_group_member\])'
          )
          table_start = re.compile(
              rf"(?im)^\s*create\s+table\s+{identifier}\s*\("
          )
          index_start = re.compile(
              rf"(?im)^\s*create\s+(?:unique\s+)?index\b[^;]*?"
              rf"\bon\s+{identifier}\s*\("
          )
          alter_start = re.compile(
              rf"(?im)^\s*alter\s+table\s+{identifier}\b"
          )

          def take_statement(sql: str, start: int) -> tuple[str, str]:
              semicolon = sql.find(";", start)
              if semicolon < 0:
                  raise SystemExit(f"Unterminated SQL statement in {sql[start:start + 160]}")
              end = semicolon + 1
              suffix = re.match(
                  r"[ \t]*(?:\r?\n[ \t]*GO[ \t]*)?(?:\r?\n)?",
                  sql[end:],
                  flags=re.IGNORECASE,
              )
              if suffix:
                  end += suffix.end()
              return sql[start:end].strip(), sql[:start] + sql[end:]

          paths = sorted(root.glob("*/V0_11_0__create_security_schema.sql"))
          if {path.parent.name for path in paths} != {
              "h2", "hsqldb", "postgresql", "sqlserver"
          }:
              raise SystemExit(f"Unexpected migration set: {paths}")

          for path in paths:
              sql = path.read_text(encoding="utf-8")
              match = table_start.search(sql)
              if match is None:
                  raise SystemExit(f"Missing membership table in {path}")
              table, sql = take_statement(sql, match.start())
              dependents: list[str] = []
              while True:
                  matches = [
                      item
                      for pattern in (index_start, alter_start)
                      if (item := pattern.search(sql)) is not None
                  ]
                  if not matches:
                      break
                  item = min(matches, key=lambda candidate: candidate.start())
                  statement, sql = take_statement(sql, item.start())
                  dependents.append(statement)
              reordered = sql.rstrip() + "\n\n" + table + "\n"
              if dependents:
                  reordered += "\n" + "\n\n".join(dependents) + "\n"
              path.write_text(reordered, encoding="utf-8")
              print(f"Reordered {path.parent.name}; dependents={len(dependents)}")
          PY
      - name: Run Core and Security tests
        shell: bash
        run: mvn -B -ntp -pl jgit-storage-hibernate-security -am clean test
      - name: Inspect source side effects after tests
        shell: bash
        run: |
          set -euo pipefail
          echo '::group::Source files created or changed by tests'
          git status --short
          find . -type f -iname '*SecureRefDatabase*' -print | sort
          grep -RIn -B5 -A10 -E \
            'SecureRefDatabase|Expected old ids are deliberately read only from|\{@link RefUpdate\}' \
            . \
            --exclude='security-phase1-module.b64*' \
            --exclude-dir=.git || true
          echo '::endgroup::'
          echo '::group::Security source inventory after tests'
          find jgit-storage-hibernate-security -type f -name '*.java' -print | sort
          echo '::endgroup::'
      - name: Run package after tests without cleaning
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/security-package-after-tests.log"
          set +e
          mvn -B -ntp -pl jgit-storage-hibernate-security -am package -DskipTests \
            > "$log" 2>&1
          status=$?
          set -e
          echo "Maven package exit status after tests: $status"
          echo '::group::Relevant package output'
          grep -n -B20 -A60 -E \
            'SecureRefDatabase|RefUpdate|reference not found|maven-javadoc-plugin|BUILD FAILURE|BUILD SUCCESS' \
            "$log" | tail -n 1000 || true
          echo '::endgroup::'
          echo '::group::Sources after package attempt'
          git status --short
          find . -type f -iname '*SecureRefDatabase*' -print | sort
          grep -RIn -B5 -A10 -E \
            'SecureRefDatabase|Expected old ids are deliberately read only from|\{@link RefUpdate\}' \
            . \
            --exclude='security-phase1-module.b64*' \
            --exclude-dir=.git || true
          echo '::endgroup::'
          exit "$status"
