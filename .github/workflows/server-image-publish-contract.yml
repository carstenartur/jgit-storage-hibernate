name: Server image publication contract

on:
  push:
    branches: [ main ]
    paths:
      - 'README.md'
      - '.dockerignore'
      - '.env.example'
      - 'compose.yaml'
      - 'compose.build.yaml'
      - 'docs/current-release-version.txt'
      - 'docs/release-process.md'
      - 'jgit-storage-hibernate-server/**'
      - 'jgit-storage-hibernate-testcontainers/**'
      - '.github/server-image-publication-request.json'
      - '.github/scripts/dispatch-generated-pr-checks.sh'
      - '.github/scripts/test_dispatch_generated_pr_checks.py'
      - '.github/scripts/select_published_server_version.py'
      - '.github/scripts/test_select_published_server_version.py'
      - '.github/scripts/test_release_server_image_dispatch_workflow.py'
      - '.github/scripts/smoke_server_compose.sh'
      - '.github/scripts/test_smoke_server_compose_cleanup.py'
      - '.github/scripts/test_server_image_publish_workflow.py'
      - '.github/scripts/update-release-metadata.py'
      - '.github/scripts/test_update_release_metadata.py'
      - '.github/scripts/verify-release-consistency.py'
      - '.github/workflows/release-server-image-dispatch.yml'
      - '.github/workflows/server-image.yml'
      - '.github/workflows/server-image-publish.yml'
      - '.github/workflows/server-image-publish-contract.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'README.md'
      - '.dockerignore'
      - '.env.example'
      - 'compose.yaml'
      - 'compose.build.yaml'
      - 'docs/current-release-version.txt'
      - 'docs/release-process.md'
      - 'jgit-storage-hibernate-server/**'
      - 'jgit-storage-hibernate-testcontainers/**'
      - '.github/server-image-publication-request.json'
      - '.github/scripts/dispatch-generated-pr-checks.sh'
      - '.github/scripts/test_dispatch_generated_pr_checks.py'
      - '.github/scripts/select_published_server_version.py'
      - '.github/scripts/test_select_published_server_version.py'
      - '.github/scripts/test_release_server_image_dispatch_workflow.py'
      - '.github/scripts/smoke_server_compose.sh'
      - '.github/scripts/test_smoke_server_compose_cleanup.py'
      - '.github/scripts/test_server_image_publish_workflow.py'
      - '.github/scripts/update-release-metadata.py'
      - '.github/scripts/test_update_release_metadata.py'
      - '.github/scripts/verify-release-consistency.py'
      - '.github/workflows/release-server-image-dispatch.yml'
      - '.github/workflows/server-image.yml'
      - '.github/workflows/server-image-publish.yml'
      - '.github/workflows/server-image-publish-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify versioned GHCR publication contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse and test publication contract
        run: |
          python3 -m py_compile \
            .github/scripts/select_published_server_version.py \
            .github/scripts/test_select_published_server_version.py \
            .github/scripts/test_release_server_image_dispatch_workflow.py \
            .github/scripts/test_smoke_server_compose_cleanup.py \
            .github/scripts/test_server_image_publish_workflow.py \
            .github/scripts/update-release-metadata.py \
            .github/scripts/test_update_release_metadata.py \
            .github/scripts/verify-release-consistency.py
          bash -n .github/scripts/smoke_server_compose.sh
          python3 .github/scripts/test_select_published_server_version.py
          python3 .github/scripts/test_release_server_image_dispatch_workflow.py
          python3 .github/scripts/test_smoke_server_compose_cleanup.py
          python3 .github/scripts/test_server_image_publish_workflow.py
          python3 .github/scripts/test_update_release_metadata.py
          python3 .github/scripts/verify-release-consistency.py

      - name: Validate stable and source-build Compose deployments
        env:
          JSH_DATABASE_PASSWORD: contract-database-password
          JSH_ADMIN_PASSWORD: contract-admin-password
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.build.yaml config --quiet
