name: Finalize memory-first staging v2

on:
  push:
    branches:
      - perf/memory-first-staging-v2

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/memory-first-staging-v2
          fetch-depth: 0
      - name: Finalize bounded staging implementation
        shell: python
        run: |
          from pathlib import Path

          buffer_path = Path('jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/objects/PackExtensionStagingBuffer.java')
          text = buffer_path.read_text()
          text = text.replace(
              ' * bound is exceeded, the already written prefix is copied once to a temporary file and all subsequent\n'
              ' * writes continue there. Positional reads retain identical semantics before and after the spill.\n',
              ' * bound is exceeded, the already written prefix is copied once to a temporary file and all\n'
              ' * subsequent writes continue there. Positional reads retain identical semantics before and after the\n'
              ' * spill.\n')

          old = '''  private boolean ensureMemoryCapacity(int requiredCapacity) {
              if (requiredCapacity <= memory.length) {
                return true;
              }
              int newCapacity = Math.max(INITIAL_CAPACITY, memory.length);
              while (newCapacity < requiredCapacity) {
                newCapacity = Math.min(MAX_MEMORY_BYTES, Math.multiplyExact(newCapacity, 2));
              }
              long additionalBytes = newCapacity - memory.length;
              if (!reserveMemory(additionalBytes)) {
                return false;
              }
              try {
                memory = Arrays.copyOf(memory, newCapacity);
                return true;
              } catch (RuntimeException | Error allocationFailure) {
                releaseMemory(additionalBytes);
                throw allocationFailure;
              }
            }
          '''
          new = '''  private boolean ensureMemoryCapacity(int requiredCapacity) {
              if (requiredCapacity <= memory.length) {
                return true;
              }
              int preferredCapacity = Math.max(INITIAL_CAPACITY, memory.length);
              while (preferredCapacity < requiredCapacity) {
                preferredCapacity =
                    Math.min(MAX_MEMORY_BYTES, Math.multiplyExact(preferredCapacity, 2));
              }
              if (resizeMemory(preferredCapacity)) {
                return true;
              }

              // A deliberately narrow owner budget is useful for tests and embedded integrations.
              // Fall back to the smallest practical allocation without adding another reservation
              // attempt to the ordinary process-budget-only path.
              int constrainedCapacity = Math.max(1024, requiredCapacity);
              return constrainedCapacity != preferredCapacity && resizeMemory(constrainedCapacity);
            }

            private boolean resizeMemory(int newCapacity) {
              long additionalBytes = newCapacity - memory.length;
              if (!reserveMemory(additionalBytes)) {
                return false;
              }
              try {
                memory = Arrays.copyOf(memory, newCapacity);
                return true;
              } catch (RuntimeException | Error allocationFailure) {
                releaseMemory(additionalBytes);
                throw allocationFailure;
              }
            }
          '''
          if text.count(old) != 1:
              raise SystemExit('memory capacity source shape changed')
          text = text.replace(old, new)

          old = '    return readFile(fileChannel, fileSize, position, destination);\n'
          new = '''    int count = readFile(fileChannel, fileSize, position, destination);
              if (count > 0) {
                storageByteCounters.recordTemporaryFileBytesRead(count);
              }
              return count;
          '''
          if text.count(old) != 1:
              raise SystemExit(f'expected one open-stream file read, found {text.count(old)}')
          text = text.replace(old, new)

          old = '''      if (discarded.compareAndSet(false, true)) {
                PROCESS_MEMORY_BUDGET.release(data.length);
                if (ownerMemoryBudget != null) {
                ownerMemoryBudget.release(data.length);
              }
              }
          '''
          new = '''      if (discarded.compareAndSet(false, true)) {
                PROCESS_MEMORY_BUDGET.release(data.length);
                if (ownerMemoryBudget != null) {
                  ownerMemoryBudget.release(data.length);
                }
              }
          '''
          if text.count(old) != 1:
              raise SystemExit('memory payload cleanup source shape changed')
          buffer_path.write_text(text.replace(old, new))

          metric_test = Path('jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/objects/StorageByteMetricsH2Test.java')
          text = metric_test.read_text()
          text = text.replace(
              '  void countsTemporaryFileTrafficAndCommittedInlinePayloadBytes() throws Exception {',
              '  void memoryFirstInlineStagingAvoidsTemporaryFileTraffic() throws Exception {')
          old = '''      assertEquals(payload.length, delta.temporaryFileBytesWritten());
              assertEquals(payload.length + 17L, delta.temporaryFileBytesRead());
          '''
          new = '''      assertEquals(0, delta.temporaryFileBytesWritten());
              assertEquals(0, delta.temporaryFileBytesRead());
          '''
          if text.count(old) != 1:
              raise SystemExit('inline byte-metric expectations changed')
          metric_test.write_text(text.replace(old, new))
      - name: Commit final source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-memory-first-v2b.yml
          git add jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/objects/PackExtensionStagingBuffer.java
          git add jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/objects/StorageByteMetricsH2Test.java
          git commit -m 'Finalize bounded memory-first staging'
          git push origin HEAD:perf/memory-first-staging-v2
