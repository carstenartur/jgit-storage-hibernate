name: Execute OCI image backfill 0.11.2

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths:
      - '.github/image-backfill-request.json'
      - '.github/workflows/execute-image-backfill-0.11.2.yml'

concurrency:
  group: execute-image-backfill-0.11.2
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  packages: write

jobs:
  publish:
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.head.ref == 'image-backfill/v0.11.2'
      }}
    name: Publish and anonymously verify v0.11.2
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RELEASE_TAG: v0.11.2
      VERSION: 0.11.2
      IMAGE_NAME: ghcr.io/carstenartur/jgit-storage-hibernate-server
    steps:
      - name: Checkout immutable release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v0.11.2
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify annotated tag, source commit and Maven reactor version
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          test "$tag_commit" = "$head_commit"
          actual_version="$(mvn -B -ntp -q help:evaluate \
            -Dexpression=project.version -DforceStdout)"
          test "$actual_version" = "$VERSION"
          [[ "$actual_version" != *-SNAPSHOT ]]
          printf 'revision=%s\n' "$head_commit" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish release image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: jgit-storage-hibernate-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          tags: |
            ghcr.io/carstenartur/jgit-storage-hibernate-server:0.11.2
            ghcr.io/carstenartur/jgit-storage-hibernate-server:latest
            ghcr.io/carstenartur/jgit-storage-hibernate-server:edge
          labels: |
            org.opencontainers.image.title=jgit-storage-hibernate-server
            org.opencontainers.image.description=PostgreSQL-backed JGit Smart HTTP server with searchable history
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.verify.outputs.revision }}
            org.opencontainers.image.version=0.11.2
            org.opencontainers.image.licenses=BSD-3-Clause
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify anonymous multi-architecture distribution
        id: distribution
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io >/dev/null 2>&1 || true
          anonymous_config="$(mktemp -d)"
          for tag in 0.11.2 latest edge; do
            manifest=''
            published=false
            for attempt in $(seq 1 12); do
              if manifest="$(docker --config "$anonymous_config" buildx imagetools inspect \
                  "$IMAGE_NAME:$tag" 2>&1)"; then
                published=true
                break
              fi
              sleep 5
            done
            if [[ "$published" != true ]]; then
              printf '%s\n' "$manifest" >&2
              printf 'Image %s:%s is not anonymously readable. Set the GHCR package visibility to Public and rerun this job.\n' \
                "$IMAGE_NAME" "$tag" >&2
              exit 1
            fi
            printf '%s\n' "$manifest"
            grep -q 'linux/amd64' <<< "$manifest"
            grep -q 'linux/arm64' <<< "$manifest"
          done

      - name: Record durable backfill evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVISION: ${{ steps.verify.outputs.revision }}
          DIGEST: ${{ steps.build.outputs.digest }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DISTRIBUTION_OUTCOME: ${{ steps.distribution.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [[ "$DISTRIBUTION_OUTCOME" == success ]]; then
            result='SUCCESS'
          else
            result='FAILURE'
          fi
          cat > backfill-evidence.md <<EOF
          ## OCI image backfill: $result

          - release tag: \`$RELEASE_TAG\`
          - image version: \`$VERSION\`
          - source revision: \`${REVISION:-unresolved}\`
          - manifest digest: \`${DIGEST:-unavailable}\`
          - build outcome: \`${BUILD_OUTCOME:-not-run}\`
          - anonymous distribution outcome: \`${DISTRIBUTION_OUTCOME:-not-run}\`
          - image tags checked: \`0.11.2\`, \`latest\`, \`edge\`
          - platforms required: \`linux/amd64\`, \`linux/arm64\`
          - workflow run: $RUN_URL

          The issue is closed only after all three tags are anonymously readable and both platforms are present.
          EOF
          gh issue comment 316 --body-file backfill-evidence.md
          if [[ "$DISTRIBUTION_OUTCOME" == success ]]; then
            gh issue close 316 --reason completed
            gh issue comment 308 --body \
              "The published server-image delivery criterion is now satisfied by the anonymously verified v0.11.2 backfill. See #316 and $RUN_URL."
            gh issue close 308 --reason completed
          fi
