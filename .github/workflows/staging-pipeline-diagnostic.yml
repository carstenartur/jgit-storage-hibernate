name: Bounded Staging Pipeline Diagnostic

on:
  workflow_dispatch:
  push:
    branches: ['diagnose/staging-pipeline-20261108']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnostic:
    name: Diagnostic only - 16 MiB / 32 MiB / one writer
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the diagnostic sources
        run: |
          set -euo pipefail
          mkdir -p target/staging-diagnostic
          python3 .github/scripts/test_run_staging_pipeline_diagnostic.py
          mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests \
            2>&1 | tee target/staging-diagnostic/build.log
      - name: Run one bounded diagnostic cell
        env:
          JGIT_EVIDENCE_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          prefix=jgit.storage.benchmark.staging-pipeline
          python3 .github/scripts/run_staging_pipeline_diagnostic.py \
            --output target/staging-diagnostic --timeout-seconds 180 \
            --dump-after-seconds 60 --kill-grace-seconds 10 -- \
            mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest='StagedChunkPipelineEvidenceTest#recordsPostgresqlPipelineEvidence' \
            '-DargLine=-Xmx4g -XX:ActiveProcessorCount=4' \
            "-D$prefix.enabled=true" "-D$prefix.diagnostic=true" \
            "-D$prefix.payload_mib=16" "-D$prefix.window_mib=32" "-D$prefix.writers=1" \
            "-D$prefix.storage=runner" "-D$prefix.requested_rtt_millis=0" \
            "-D$prefix.read_mib_per_second=0" "-D$prefix.warmups=0" "-D$prefix.repeats=1" \
            "-D$prefix.output=$GITHUB_WORKSPACE/target/staging-diagnostic/raw"
      - name: Check all diagnostic output for connection details
        id: evidence-privacy
        if: always()
        run: |
          python3 .github/scripts/validate_search_database_telemetry.py --privacy-only \
            target/staging-diagnostic jgit-storage-hibernate-benchmarks/target/surefire-reports
      - name: Upload partial diagnostic evidence
        if: always() && steps.evidence-privacy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: staging-pipeline-diagnostic
          path: |
            target/staging-diagnostic/**
            jgit-storage-hibernate-benchmarks/target/surefire-reports/**
          if-no-files-found: error
      - name: State diagnostic boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ### Diagnostic only

          This is one 16 MiB / 32 MiB-window / single-writer / runner-storage / 0 ms RTT cell.
          It has no warm-up and one repetition. The 4 GiB JVM heap and writer behavior are unchanged.
          Phase checkpoints and JVM thread stacks identify a wait; these timings cannot qualify performance.
          Native execution has a 180-second deadline, bounded thread capture and finite TERM/KILL cleanup.
          Original evidence run 42534328623 is preserved separately and is not qualified by this diagnostic.
          EOF
