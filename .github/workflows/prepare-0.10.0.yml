name: Prepare 0.10.0 snapshot coordinates

on:
  push:
    branches:
      - release/0.10.0-preparation

permissions:
  contents: write

concurrency:
  group: prepare-0.10.0-snapshot
  cancel-in-progress: false

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preparation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/0.10.0-preparation
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Prepare release snapshot version
        shell: bash
        run: |
          set -euo pipefail
          mvn -B versions:set \
            -DnewVersion=0.10.0-SNAPSHOT \
            -DgenerateBackupPoms=false
          python3 .github/scripts/update-release-metadata.py 0.10.0-SNAPSHOT
          python3 .github/scripts/verify-release-consistency.py
          python3 .github/scripts/verify-public-repository-publishing.py
          git diff --check

      - name: Commit prepared coordinates and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/prepare-0.10.0.yml
          git add pom.xml '*/pom.xml' CITATION.cff CITATION.md .zenodo.json codemeta.json \
            .github/workflows/prepare-0.10.0.yml
          git diff --cached --check
          git commit -m 'Prepare development version 0.10.0-SNAPSHOT'
          git push origin HEAD:release/0.10.0-preparation
