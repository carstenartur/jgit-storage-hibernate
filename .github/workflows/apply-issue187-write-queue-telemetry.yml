name: Apply issue 187 write-queue telemetry

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-issue187-write-queue-telemetry-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout write-queue telemetry branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker
        run: docker info

      - name: Detect pending integration helper
        id: helper
        shell: bash
        run: |
          if test -f .github/scripts/apply-issue187-write-queue-telemetry.py; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'The validated write-queue integration is already committed.'
          fi

      - name: Apply write-queue telemetry integration
        if: steps.helper.outputs.exists == 'true'
        run: |
          python3 .github/scripts/apply-issue187-write-queue-telemetry.py
          python3 .github/scripts/repair-issue187-write-queue-password-scan.py

      - name: Build benchmark dependencies
        run: mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests

      - name: Run telemetry and queue unit contracts
        run: |
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=DatabaseTelemetrySnapshotTest,DurableStripedWriteQueueTest

      - name: Run exact PostgreSQL write-queue telemetry smoke
        shell: bash
        run: |
          set -euo pipefail
          rm -rf target/issue187-write-queue
          mkdir -p target/issue187-write-queue
          mvn -B -pl jgit-storage-hibernate-benchmarks verify \
            -Pperformance-investigations \
            -Djgit.storage.benchmark.investigation=write-queue \
            -Djgit.storage.benchmark.investigation.profile=smoke \
            -Djgit.storage.benchmark.threads=4 \
            -Djgit.storage.benchmark.database-telemetry.enabled=true \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/issue187-write-queue/jmh-result.json"

      - name: Validate iteration-level native evidence and privacy
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import datetime
          import json
          from pathlib import Path

          root = Path('target/issue187-write-queue')
          telemetry_path = root / 'write-queue-database-telemetry.json'
          ndjson_path = root / 'write-queue-database-telemetry.ndjson'
          jmh_path = root / 'jmh-result.json'
          for path in (telemetry_path, ndjson_path, jmh_path):
              if not path.is_file() or path.stat().st_size < 3:
                  raise SystemExit(f'Missing retained evidence {path}')

          text = telemetry_path.read_text(encoding='utf-8')
          if 'NaN' in text or 'Infinity' in text:
              raise SystemExit('Write-queue telemetry is not strict JSON')
          observations = json.loads(text)['observations']
          jmh = json.loads(jmh_path.read_text(encoding='utf-8'))
          if len(observations) != 16:
              raise SystemExit(
                  f'Expected 16 smoke telemetry observations, found {len(observations)}'
              )
          if len(jmh) != 16:
              raise SystemExit(f'Expected 16 JMH results, found {len(jmh)}')

          def jmh_coordinate(item):
              method = item['benchmark'].rsplit('.', 1)[-1]
              params = item['params']
              scope = 'shared' if method == 'publishToSameRepository' else 'isolated'
              stripes = {
                  'direct': '0',
                  'queue-1': '1',
                  'queue-4': '4',
                  'queue-8': '8',
              }[params['executionMode']]
              return (
                  method,
                  params['backend'],
                  params['executionMode'],
                  params['payloadKiB'],
                  str(item['threads']),
                  scope,
                  stripes,
                  '2',
              )

          def telemetry_coordinate(item):
              coordinate = item['coordinate']
              return (
                  coordinate['benchmarkMethod'],
                  coordinate['backend'],
                  coordinate['executionMode'],
                  coordinate['payloadKiB'],
                  coordinate['threads'],
                  coordinate['repositoryScope'],
                  coordinate['stripes'],
                  coordinate['poolSize'],
              )

          jmh_coordinates = {jmh_coordinate(item) for item in jmh}
          telemetry_counts = collections.Counter(
              telemetry_coordinate(item) for item in observations
          )
          if set(telemetry_counts) != jmh_coordinates:
              raise SystemExit(
                  'JMH and native telemetry coordinates differ: '
                  f'{jmh_coordinates ^ set(telemetry_counts)}'
              )
          if any(count != 1 for count in telemetry_counts.values()):
              raise SystemExit(f'Duplicate smoke observations: {telemetry_counts}')

          wal_deltas = []
          for item in observations:
              coordinate = item['coordinate']
              if item['backend'] != 'postgresql':
                  raise SystemExit(f'Unexpected telemetry backend {item["backend"]}')
              if coordinate['databaseBackend'] != 'postgresql':
                  raise SystemExit(f'Unexpected database coordinate {coordinate}')
              if coordinate['measurementIteration'] != '1':
                  raise SystemExit(f'Unexpected iteration number {coordinate}')
              for field in ('coordinate', 'counters', 'gauges', 'metadata', 'unsupported'):
                  keys = list(item[field])
                  if keys != sorted(keys):
                      raise SystemExit(
                          f'{field} keys are not sorted for {coordinate}: {keys}'
                      )
              wal = item['counters'].get('postgresql.wal.insert_lsn_bytes')
              if wal is None or wal <= 0:
                  raise SystemExit(
                      f'Expected positive immediate WAL delta for {coordinate}: {wal}'
                  )
              wal_deltas.append(wal)
              start = datetime.datetime.fromisoformat(
                  item['startedAt'].replace('Z', '+00:00')
              )
              end = datetime.datetime.fromisoformat(
                  item['completedAt'].replace('Z', '+00:00')
              )
              if end < start:
                  raise SystemExit(f'Negative telemetry window for {coordinate}')

          ndjson_lines = [
              line
              for line in ndjson_path.read_text(encoding='utf-8').splitlines()
              if line
          ]
          if len(ndjson_lines) != len(observations):
              raise SystemExit(
                  f'NDJSON/aggregate count mismatch: {len(ndjson_lines)} != {len(observations)}'
              )
          for line in ndjson_lines:
              json.loads(line)

          forbidden = (
              'jgit.storage.benchmark.postgresql.url=',
              'jgit.storage.benchmark.postgresql.user=',
              'jgit.storage.benchmark.postgresql.password=',
              'jdbc:postgresql://',
              'Database JDBC URL',
              'Default catalog/schema',
          )
          for scan_root in (
              root,
              Path('jgit-storage-hibernate-benchmarks/target/failsafe-reports'),
          ):
              if not scan_root.exists():
                  continue
              for path in scan_root.rglob('*'):
                  if not path.is_file():
                      continue
                  content = path.read_bytes().decode('utf-8', errors='replace')
                  for token in forbidden:
                      if token in content:
                          raise SystemExit(f'Sensitive token {token!r} found in {path}')
          leftovers = list(
              Path('/tmp').glob('jgit-storage-benchmark-connection-*.properties')
          )
          if leftovers:
              raise SystemExit(f'Temporary credential files remain: {leftovers}')

          print(
              'Validated 16 exact write-queue iteration observations; '
              f'immediate WAL range {min(wal_deltas)}..{max(wal_deltas)} bytes'
          )
          PY

      - name: Verify source and workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F '@Setup(Level.Iteration)' \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/DurableWriteQueueBenchmark.java
          grep -F 'measurementIteration' \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/DurableWriteQueueBenchmark.java
          grep -F 'write-queue-database-telemetry.json' \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/PerformanceInvestigationsBenchmarkIT.java
          grep -F 'Validate write-queue native telemetry' \
            .github/workflows/performance-investigations.yml
          grep -F 'complete measurement iterations' \
            docs/operations/database-native-telemetry.md

      - name: Remove one-shot integration tooling
        run: |
          rm -f .github/scripts/apply-issue187-write-queue-telemetry.py
          rm -f .github/scripts/repair-issue187-write-queue-password-scan.py
          rm -f .github/workflows/apply-issue187-write-queue-telemetry.yml

      - name: Commit validated write-queue telemetry
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/DurableWriteQueueBenchmark.java \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/PerformanceInvestigationsBenchmarkIT.java \
            .github/workflows/performance-investigations.yml \
            docs/operations/database-native-telemetry.md \
            docs/performance-status.md
          for path in \
            .github/scripts/apply-issue187-write-queue-telemetry.py \
            .github/scripts/repair-issue187-write-queue-password-scan.py \
            .github/workflows/apply-issue187-write-queue-telemetry.yml; do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              git add -u -- "$path"
            fi
          done
          if git diff --cached --quiet; then
            echo 'Validated source already matches the branch; no commit required.'
            exit 0
          fi
          git commit -m 'Integrate native telemetry with write-queue benchmarks'
          git push origin "HEAD:${HEAD_REF}"

      - name: Upload exact write-queue telemetry evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue187-write-queue-native-telemetry
          path: |
            target/issue187-write-queue/**
            jgit-storage-hibernate-benchmarks/target/failsafe-reports/**
          if-no-files-found: error
