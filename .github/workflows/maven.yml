name: Java CI with Maven

on:
  push:
    branches: [ main, extract-core-hibernate-storage ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker for PostgreSQL integration tests
        run: docker info

      - name: Verify release tooling and repository consistency
        run: |
          bash -n \
            .github/scripts/release.sh \
            .github/scripts/verify-central-consumption.sh
          python3 -m py_compile \
            .github/scripts/build-central-bundle.py \
            .github/scripts/update-release-metadata.py \
            .github/scripts/test_update_release_metadata.py \
            .github/scripts/verify-central-bundle.py \
            .github/scripts/verify-central-publishing.py \
            .github/scripts/verify-release-consistency.py
          python3 .github/scripts/test_update_release_metadata.py
          python3 .github/scripts/verify-release-consistency.py
          python3 .github/scripts/verify-central-publishing.py

      - name: Build
        run: |
          set +e
          mvn -B -q verify > build.log 2>&1
          status=$?
          tail -n 80 build.log
          exit $status

      - name: Generate coverage and test-count badges
        if: always()
        run: python3 .github/scripts/generate-metrics-badges.py

      - name: Upload Maven build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-build-log
          path: build.log

      - name: Upload badge metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: badge-metrics
          path: docs/badges/*.json

      - name: Update badge data on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          if git diff --quiet -- docs/badges; then
            echo "Badge data unchanged"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add docs/badges/*.json
          git commit -m "Update build metric badges [skip ci]"
          git push

  central-release-contract:
    name: Maven Central release contract
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build signed Central bundle without publishing
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          chmod +x \
            .github/scripts/release.sh \
            .github/scripts/verify-central-consumption.sh
          CURRENT_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          case "$CURRENT_VERSION" in
            *-SNAPSHOT) RELEASE_VERSION=${CURRENT_VERSION%-SNAPSHOT} ;;
            *) echo "::error::Expected a SNAPSHOT development version, found $CURRENT_VERSION"; exit 1 ;;
          esac
          RELEASE_VERSION="$RELEASE_VERSION" \
          DRY_RUN=true \
          SKIP_TESTS=true \
          PUBLISH_GITHUB_PACKAGES=false \
            .github/scripts/release.sh 2>&1 | tee central-release-contract.log

      - name: Require Central bundle evidence
        run: test -s target/central-publishing/central-bundle.zip

      - name: Upload Central release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: central-release-contract
          path: |
            central-release-contract.log
            target/central-publishing/*.zip
          if-no-files-found: error
