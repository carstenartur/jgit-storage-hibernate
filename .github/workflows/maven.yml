name: Java CI with Maven

on:
  push:
    branches: [ main, extract-core-hibernate-storage ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Maven verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Verify Docker for database integration tests
        run: docker info
      - name: Parse release, publication and dashboard tooling
        run: |
          bash -n .github/scripts/release.sh .github/scripts/dispatch-generated-pr-checks.sh .github/scripts/verify-public-repository-consumption.sh
          python3 -m py_compile .github/scripts/prepare-public-repository.py .github/scripts/test_prepare_public_repository.py .github/scripts/verify-public-repository-publishing.py .github/scripts/update-release-metadata.py .github/scripts/test_update_release_metadata.py .github/scripts/verify-release-consistency.py .github/scripts/verify-security-policy.py .github/scripts/benchmark_consumer_relevance.py .github/scripts/test_benchmark_consumer_relevance.py .github/scripts/publish-benchmark-history-core.py .github/scripts/publish-benchmark-history.py .github/scripts/test_publish_benchmark_history.py .github/scripts/verify-benchmark-consumer-relevance.py .github/scripts/test_verify_benchmark_consumer_relevance.py .github/scripts/convert-jmh-backend-comparison.py .github/scripts/test_convert_jmh_backend_comparison.py .github/scripts/write-performance-badge.py .github/scripts/test_write_performance_badge.py .github/scripts/select_published_server_version.py .github/scripts/test_select_published_server_version.py .github/scripts/test_release_workflow_trigger.py .github/scripts/test_dispatch_generated_pr_checks.py .github/scripts/test_verify_public_repository_consumption.py
          python3 -m py_compile .github/scripts/test_ci_badge_workflow.py
          python3 -m py_compile .github/scripts/verify-database-test-evidence.py .github/scripts/test_verify_database_test_evidence.py
          bash -n .github/scripts/verify-central-profile.sh
          python3 -m py_compile .github/scripts/verify-central-bundle.py .github/scripts/test_verify_central_bundle.py .github/scripts/test_verify_public_repository_publishing.py
          node --check .github/benchmark-dashboard/dashboard.js
      - name: Test release, publication and dashboard tooling
        run: |
          python3 .github/scripts/test_update_release_metadata.py
          python3 .github/scripts/test_prepare_public_repository.py
          python3 .github/scripts/test_benchmark_consumer_relevance.py
          python3 .github/scripts/test_publish_benchmark_history.py
          python3 .github/scripts/test_verify_benchmark_consumer_relevance.py
          python3 .github/scripts/verify-benchmark-consumer-relevance.py --evidence target/benchmark-consumer-relevance/evidence.json
          python3 .github/scripts/test_convert_jmh_backend_comparison.py
          python3 .github/scripts/test_write_performance_badge.py
          python3 .github/scripts/test_select_published_server_version.py
          python3 .github/scripts/test_release_workflow_trigger.py
          python3 .github/scripts/test_dispatch_generated_pr_checks.py
          python3 .github/scripts/test_verify_public_repository_consumption.py
          python3 .github/scripts/test_ci_badge_workflow.py
          python3 .github/scripts/test_verify_database_test_evidence.py
          python3 .github/scripts/test_verify_public_repository_publishing.py
          python3 .github/scripts/test_verify_central_bundle.py
          python3 .github/scripts/test_native_followup_trigger.py
          python3 .github/scripts/test_consumer_publication_evidence.py
          python3 .github/scripts/test_summarize_publication_nonregression.py
          python3 .github/scripts/test_summarize_publication_gc_diagnostic.py
          python3 .github/scripts/test_verify_publication_diagnostic_source.py
          python3 .github/scripts/test_staging_pipeline_evidence.py
          python3 .github/scripts/test_run_staging_pipeline_diagnostic.py
          python3 .github/scripts/test_validate_ranked_scroll_evidence.py
          python3 .github/scripts/test_summarize_search_runtime_diagnostic.py
          node .github/benchmark-dashboard/dashboard.test.js
      - name: Replay retained native performance evidence
        run: |
          python3 docs/evidence/search-runtime-sustained-2026-11-08/test_reproduce.py
          python3 docs/evidence/search-runtime-sustained-2026-11-08/reproduce.py --output target/evidence-replay/search-runtime
          python3 docs/evidence/consumer-publication-2026-11-08/test_verify.py
          python3 docs/evidence/consumer-publication-2026-11-08/verify.py
          python3 docs/evidence/publication-paired-2026-11-08/reproduce.py --output target/evidence-replay/publication
          python3 docs/evidence/publication-gc-diagnostic-2026-11-08/reproduce.py --output target/evidence-replay/publication-gc
          python3 docs/evidence/publication-reftable-diagnostic-2026-11-08/reproduce.py --output target/evidence-replay/publication-reftable
          sha256sum -c docs/evidence/search-ranked-scroll-retained-2026-11-08/SHA256SUMS
          sha256sum -c docs/evidence/search-ranked-scroll-hosted-2026-11-08/SHA256SUMS
      - name: Verify release and security consistency
        run: |
          python3 .github/scripts/verify-release-consistency.py
          python3 .github/scripts/verify-security-policy.py
      - name: Verify public repository publishing contract
        run: python3 .github/scripts/verify-public-repository-publishing.py
      - name: Build
        run: |
          set +e; mvn -B -q verify > build.log 2>&1; status=$?; tail -n 80 build.log; exit $status
      - name: Verify Oracle and SQL Server test evidence
        run: python3 .github/scripts/verify-database-test-evidence.py
      - name: Generate coverage and test-count badges
        if: always()
        run: python3 .github/scripts/generate-metrics-badges.py
      - name: Upload Maven build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: maven-build-log, path: build.log}
      - name: Upload database qualification test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-test-reports
          path: |
            **/target/surefire-reports/TEST-*.xml
            **/target/failsafe-reports/TEST-*.xml
          if-no-files-found: warn
      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jacoco-module-reports
          path: '**/target/site/jacoco/jacoco.*'
          if-no-files-found: error
      - name: Upload badge metrics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: badge-metrics
          path: |
            docs/badges/coverage.json
            docs/badges/tests.json
          if-no-files-found: error
      - name: Upload benchmark consumer relevance evidence
        if: ${{ always() && hashFiles('target/benchmark-consumer-relevance/evidence.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: benchmark-consumer-relevance-evidence
          path: target/benchmark-consumer-relevance/evidence.json
          if-no-files-found: error

  public-repository-contract:
    name: Public Maven repository contract
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Stage and anonymously resolve a release repository
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x .github/scripts/release.sh .github/scripts/verify-public-repository-consumption.sh
          current=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          case "$current" in
            *-SNAPSHOT)
              release=${current%-SNAPSHOT}
              RELEASE_VERSION="$release" DRY_RUN=true SKIP_TESTS=true \
                .github/scripts/release.sh 2>&1 | tee public-repository-contract.log
              ;;
            [0-9]*.[0-9]*.[0-9]*)
              release=$current
              ;;
            *)
              echo "Unsupported project version for repository contract: $current" >&2
              exit 1
              ;;
          esac

          stage="$PWD/target/public-maven-repository"
          evidence="$PWD/target/public-repository-evidence/manifest.json"
          rm -rf "$stage" "$(dirname "$evidence")"
          mkdir -p "$stage"
          mvn -B -Ppublic-repository-release -DskipTests \
            -Dpublic.repository.directory="$stage" deploy \
            2>&1 | tee -a public-repository-contract.log
          python3 .github/scripts/prepare-public-repository.py \
            "$release" "$stage" "$evidence" \
            2>&1 | tee -a public-repository-contract.log
          MAVEN_COMMAND=mvn PUBLIC_REPOSITORY_ATTEMPTS=1 \
            .github/scripts/verify-public-repository-consumption.sh \
            "$release" "file://$stage" \
            2>&1 | tee -a public-repository-contract.log
      - name: Require repository evidence
        run: test -s target/public-repository-evidence/manifest.json
      - name: Verify optional Central bundle without publishing credentials
        run: |
          set -euo pipefail
          bash .github/scripts/verify-central-profile.sh 2>&1 | tee central-bundle-verification.log
      - name: Upload public repository evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: public-maven-repository-contract
          path: |
            public-repository-contract.log
            target/public-repository-evidence/manifest.json
            central-bundle-verification.log
          if-no-files-found: error
