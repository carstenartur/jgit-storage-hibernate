name: Java CI with Maven

on:
  push:
    branches: [ main, extract-core-hibernate-storage ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Verify Docker for PostgreSQL integration tests
        run: docker info
      - name: Parse release tooling
        run: |
          bash -n .github/scripts/release.sh .github/scripts/verify-public-repository-consumption.sh
          python3 -m py_compile .github/scripts/prepare-public-repository.py .github/scripts/test_prepare_public_repository.py .github/scripts/verify-public-repository-publishing.py .github/scripts/update-release-metadata.py .github/scripts/test_update_release_metadata.py .github/scripts/verify-release-consistency.py
      - name: Test release tooling
        run: |
          python3 .github/scripts/test_update_release_metadata.py
          python3 .github/scripts/test_prepare_public_repository.py
      - name: Verify release consistency
        run: python3 .github/scripts/verify-release-consistency.py
      - name: Verify public repository publishing contract
        run: python3 .github/scripts/verify-public-repository-publishing.py
      - name: Build
        run: |
          set +e; mvn -B -q verify > build.log 2>&1; status=$?; tail -n 80 build.log; exit $status
      - name: Generate coverage and test-count badges
        if: always()
        run: python3 .github/scripts/generate-metrics-badges.py
      - name: Upload Maven build log
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: maven-build-log, path: build.log}
      - name: Upload badge metrics
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: badge-metrics, path: 'docs/badges/*.json'}
      - name: Update badge data on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && success()
        run: |
          git diff --quiet -- docs/badges && exit 0
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/badges/*.json; git commit -m "Update build metric badges [skip ci]"; git push

  public-repository-contract:
    name: Public Maven repository contract
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-java@v5
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Stage and anonymously resolve a release repository
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          chmod +x .github/scripts/release.sh .github/scripts/verify-public-repository-consumption.sh
          current=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          case "$current" in *-SNAPSHOT) release=${current%-SNAPSHOT};; *) exit 1;; esac
          RELEASE_VERSION="$release" DRY_RUN=true SKIP_TESTS=true .github/scripts/release.sh 2>&1 | tee public-repository-contract.log
      - name: Require repository evidence
        run: test -s target/public-repository-evidence/manifest.json
      - name: Upload public repository evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-maven-repository-contract
          path: |
            public-repository-contract.log
            target/public-repository-evidence/manifest.json
          if-no-files-found: error
