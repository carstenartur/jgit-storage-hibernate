name: Java CI with Maven

on:
  push:
    branches: [ main, extract-core-hibernate-storage ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Verify Docker for PostgreSQL integration tests
        run: docker info
      - name: Parse release and publication tooling
        run: |
          bash -n .github/scripts/release.sh .github/scripts/verify-public-repository-consumption.sh
          python3 -m py_compile .github/scripts/prepare-public-repository.py .github/scripts/test_prepare_public_repository.py .github/scripts/verify-public-repository-publishing.py .github/scripts/update-release-metadata.py .github/scripts/test_update_release_metadata.py .github/scripts/verify-release-consistency.py .github/scripts/verify-security-policy.py .github/scripts/publish-benchmark-history.py .github/scripts/test_publish_benchmark_history.py .github/scripts/convert-jmh-backend-comparison.py .github/scripts/test_convert_jmh_backend_comparison.py
      - name: Test release and publication tooling
        run: |
          python3 .github/scripts/test_update_release_metadata.py
          python3 .github/scripts/test_prepare_public_repository.py
          python3 .github/scripts/test_publish_benchmark_history.py
          python3 .github/scripts/test_convert_jmh_backend_comparison.py
      - name: Verify release and security consistency
        run: |
          python3 .github/scripts/verify-release-consistency.py
          python3 .github/scripts/verify-security-policy.py
      - name: Verify public repository publishing contract
        run: python3 .github/scripts/verify-public-repository-publishing.py
      - name: Build
        run: |
          set +e; mvn -B -q verify > build.log 2>&1; status=$?; tail -n 80 build.log; exit $status
      - name: Generate coverage and test-count badges
        if: always()
        run: python3 .github/scripts/generate-metrics-badges.py
      - name: Upload Maven build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: maven-build-log, path: build.log}
      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-module-reports
          path: '**/target/site/jacoco/jacoco.*'
          if-no-files-found: error
      - name: Upload badge metrics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: badge-metrics
          path: |
            docs/badges/coverage.json
            docs/badges/tests.json
          if-no-files-found: error

  publish-build-badges:
    name: Publish build badges
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: repository-pages-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: Download generated badge data outside the worktree
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: badge-metrics
          path: ${{ runner.temp }}/build-badge-metrics
      - name: Publish generated badges to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          source_root="${RUNNER_TEMP}/build-badge-metrics"
          coverage_source="$(find "$source_root" -type f -name coverage.json -print -quit)"
          tests_source="$(find "$source_root" -type f -name tests.json -print -quit)"
          test -s "$coverage_source"
          test -s "$tests_source"

          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            empty_tree="$(git mktree </dev/null)"
            initial_commit="$(printf '%s\n' 'Initialize generated project pages' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$empty_tree")"
            git push origin "$initial_commit:refs/heads/gh-pages"
          fi

          pages_dir="${RUNNER_TEMP}/generated-pages-build"
          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git worktree remove --force "$pages_dir" >/dev/null 2>&1 || true
            git worktree prune
            git worktree add --detach "$pages_dir" origin/gh-pages

            mkdir -p "$pages_dir/badges"
            cp "$coverage_source" "$pages_dir/badges/coverage.json"
            cp "$tests_source" "$pages_dir/badges/tests.json"
            git -C "$pages_dir" add badges/coverage.json badges/tests.json

            if git -C "$pages_dir" diff --cached --quiet; then
              echo 'Build badge data unchanged'
              exit 0
            fi

            git -C "$pages_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Update build metric badges'
            if git -C "$pages_dir" push origin HEAD:gh-pages; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Could not publish build badges after three attempts' >&2
          exit 1

  public-repository-contract:
    name: Public Maven repository contract
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with: {distribution: temurin, java-version: '21', cache: maven}
      - name: Stage and anonymously resolve a release repository
        env:
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -o pipefail
          chmod +x .github/scripts/release.sh .github/scripts/verify-public-repository-consumption.sh
          current=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          case "$current" in *-SNAPSHOT) release=${current%-SNAPSHOT};; *) exit 1;; esac
          RELEASE_VERSION="$release" DRY_RUN=true SKIP_TESTS=true .github/scripts/release.sh 2>&1 | tee public-repository-contract.log
      - name: Require repository evidence
        run: test -s target/public-repository-evidence/manifest.json
      - name: Upload public repository evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: public-maven-repository-contract
          path: |
            public-repository-contract.log
            target/public-repository-evidence/manifest.json
          if-no-files-found: error
