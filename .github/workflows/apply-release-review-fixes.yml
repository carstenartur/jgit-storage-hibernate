name: Apply release recovery review fixes

on:
  push:
    branches:
      - 'fix/recover-partial-release-0.11.0'
    paths:
      - '.github/review-fixes.patch'

permissions:
  contents: write

jobs:
  apply:
    name: Apply reviewed recovery patch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull-request branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/recover-partial-release-0.11.0
          fetch-depth: 0
      - name: Apply patch and remove temporary machinery
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/review-fixes.patch
          git apply --check .github/review-fixes.patch
          git apply .github/review-fixes.patch
          rm .github/review-fixes.patch
          rm .github/workflows/apply-release-review-fixes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Address release recovery review findings'
          git push origin HEAD:fix/recover-partial-release-0.11.0
