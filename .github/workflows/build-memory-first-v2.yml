name: Build memory-first staging v2

on:
  push:
    branches:
      - perf/memory-first-staging-v2

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/memory-first-staging-v2
          fetch-depth: 0
      - name: Rebuild on current main
        shell: bash
        run: |
          set -euo pipefail
          old=d31e4f210f8777c856569b42dab68f420f5647ff
          git fetch origin "$old"

          buffer='jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/objects/PackExtensionStagingBuffer.java'
          store='jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/objects/StagedPackExtensionStore.java'
          memory_test='jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/objects/MemoryFirstPackStagingH2Test.java'
          buffer_test='jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/objects/PackExtensionStagingBufferTest.java'

          mkdir -p "$(dirname "$buffer")" "$(dirname "$memory_test")"
          git show "$old:$buffer" > "$buffer"
          git show "$old:$memory_test" > "$memory_test"
          git show "$old:$buffer_test" > "$buffer_test"
          git show "$old:$store" > "$RUNNER_TEMP/old-store.java"

          python - <<'PY'
          from pathlib import Path

          store_path = Path('jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/objects/StagedPackExtensionStore.java')
          current = store_path.read_text()
          old = Path('/home/runner/work/_temp/old-store.java').read_text()

          current = current.replace(
              'import io.github.carstenartur.jgit.storage.hibernate.entity.GitPackEntity;\n',
              'import io.github.carstenartur.jgit.storage.hibernate.entity.GitPackEntity;\n'
              'import io.github.carstenartur.jgit.storage.hibernate.objects.PackExtensionStagingBuffer.StagedPayload;\n'
              'import io.github.carstenartur.jgit.storage.hibernate.objects.PackExtensionStagingBuffer.StagedPayloadReader;\n')
          for line in (
              'import java.nio.channels.FileChannel;\n',
              'import java.nio.file.Files;\n',
              'import java.nio.file.Path;\n',
              'import java.nio.file.StandardOpenOption;\n'):
              current = current.replace(line, '')

          current = current.replace(
              ' * extension. Closing the stream retains the completed bytes in a bounded temporary file and creates\n'
              ' * no database row.\n',
              ' * extension. Closing the stream retains the completed bytes in bounded memory or a temporary file\n'
              ' * and creates no database row. Extensions spill once after the 256-KiB staging-memory limit or the\n'
              ' * process budget is exhausted.\n')
          current = current.replace(
              '    return new StagedOutputStream(key, this::register, storageByteCounters);\n',
              '    return new PackExtensionStagingBuffer(\n'
              '        storageByteCounters,\n'
              '        (payload, fileSize, createdAt) ->\n'
              '            register(new StagedExtension(key, payload, fileSize, createdAt)));\n')

          def extract(text, start, end):
              a = text.index(start)
              b = text.index(end, a)
              return text[a:b]

          def replace_section(text, start, end, replacement):
              a = text.index(start)
              b = text.index(end, a)
              return text[:a] + replacement + text[b:]

          current = replace_section(
              current,
              '  private List<PersistedExtension> persistPreparedPayloads(',
              '  private CommitResult publishPrepared(',
              extract(old,
                      '  private List<PersistedExtension> persistPreparedPayloads(',
                      '  private CommitResult publishPrepared('))

          current = replace_section(
              current,
              '  private CommittedExtension persistCommitted(',
              '  private static boolean isDuplicatePackExtension(',
              extract(old,
                      '  private CommittedExtension persistCommitted(',
                      '  private static boolean isDuplicatePackExtension('))

          read_inline = '  private byte[] readInline(FileChannel channel, long fileSize) throws IOException {'
          if read_inline in current:
              current = replace_section(current, read_inline, '  private void persistChunks(', '')
          current = replace_section(
              current,
              '  private void persistChunks(',
              '  private static long committedPayloadBytes(',
              extract(old,
                      '  private static void persistChunks(',
                      '  private void deletePreparedRows(').replace(
                          '  private static void persistChunks(', '  private void persistChunks(')
              + extract(current,
                        '  private static long committedPayloadBytes(',
                        '  private void deletePreparedRows('))

          staged_count = '''  int stagedExtensionCount() {
              return staged.size();
            }
          '''
          staged_metrics = staged_count + '''
            int stagedMemoryExtensionCount() {
              return (int) staged.values().stream().filter(StagedExtension::memoryBacked).count();
            }

            int stagedFileExtensionCount() {
              return (int) staged.values().stream().filter(extension -> !extension.memoryBacked()).count();
            }

            long stagedMemoryBytes() {
              return staged.values().stream()
                  .filter(StagedExtension::memoryBacked)
                  .mapToLong(StagedExtension::fileSize)
                  .sum();
            }

            io.github.carstenartur.jgit.storage.hibernate.transaction.StorageByteMetrics
                storageByteMetricsSnapshot() {
              return storageByteCounters.snapshot();
            }
          '''
          if current.count(staged_count) != 1:
              raise SystemExit('staged count source shape changed')
          current = current.replace(staged_count, staged_metrics)

          tail_marker = '  private static final class StagedExtension {'
          current = current[:current.index(tail_marker)] + old[old.index(tail_marker):]
          store_path.write_text(current)

          buffer_path = Path('jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/objects/PackExtensionStagingBuffer.java')
          buffer = buffer_path.read_text()
          buffer = buffer.replace('  private static final int INITIAL_CAPACITY = 1024;',
                                  '  private static final int INITIAL_CAPACITY = 16 * 1024;')
          buffer = buffer.replace(
              '  private final MemoryBudget ownerMemoryBudget;\n  private final CloseConsumer closeConsumer;\n',
              '  private final MemoryBudget ownerMemoryBudget;\n'
              '  private final StorageByteCounters storageByteCounters;\n'
              '  private final CloseConsumer closeConsumer;\n')
          old_constructors = '''  PackExtensionStagingBuffer(CloseConsumer closeConsumer) {
              this(new MemoryBudget(MAX_MEMORY_BYTES), closeConsumer);
            }

            PackExtensionStagingBuffer(MemoryBudget ownerMemoryBudget, CloseConsumer closeConsumer) {
              this.ownerMemoryBudget = Objects.requireNonNull(ownerMemoryBudget, "ownerMemoryBudget");
              this.closeConsumer = Objects.requireNonNull(closeConsumer, "closeConsumer");
            }
          '''
          new_constructors = '''  PackExtensionStagingBuffer(CloseConsumer closeConsumer) {
              this(null, StorageByteCounters.disabled(), closeConsumer);
            }

            PackExtensionStagingBuffer(
                StorageByteCounters storageByteCounters, CloseConsumer closeConsumer) {
              this(null, storageByteCounters, closeConsumer);
            }

            PackExtensionStagingBuffer(MemoryBudget ownerMemoryBudget, CloseConsumer closeConsumer) {
              this(ownerMemoryBudget, StorageByteCounters.disabled(), closeConsumer);
            }

            private PackExtensionStagingBuffer(
                MemoryBudget ownerMemoryBudget,
                StorageByteCounters storageByteCounters,
                CloseConsumer closeConsumer) {
              this.ownerMemoryBudget = ownerMemoryBudget;
              this.storageByteCounters =
                  Objects.requireNonNull(storageByteCounters, "storageByteCounters");
              this.closeConsumer = Objects.requireNonNull(closeConsumer, "closeConsumer");
            }
          '''
          if buffer.count(old_constructors) != 1:
              raise SystemExit('buffer constructor source shape changed')
          buffer = buffer.replace(old_constructors, new_constructors)

          buffer = buffer.replace(
              '        writePosition += count;\n      }\n      fileSize = writePosition;\n',
              '        storageByteCounters.recordTemporaryFileBytesWritten(count);\n'
              '        writePosition += count;\n      }\n      fileSize = writePosition;\n', 1)
          buffer = buffer.replace(
              '        position += count;\n      }\n      fileChannel = candidateChannel;\n',
              '        storageByteCounters.recordTemporaryFileBytesWritten(count);\n'
              '        position += count;\n      }\n      fileChannel = candidateChannel;\n', 1)

          buffer = buffer.replace(
              '        payload = new FilePayload(temporaryFile, fileSize);\n',
              '        payload = new FilePayload(temporaryFile, fileSize, storageByteCounters);\n')

          old_reserve = '''  private boolean reserveMemory(long bytes) {
              if (!ownerMemoryBudget.tryReserve(bytes)) {
                return false;
              }
              if (PROCESS_MEMORY_BUDGET.tryReserve(bytes)) {
                return true;
              }
              ownerMemoryBudget.release(bytes);
              return false;
            }

            private void releaseMemory(long bytes) {
              PROCESS_MEMORY_BUDGET.release(bytes);
              ownerMemoryBudget.release(bytes);
            }
          '''
          new_reserve = '''  private boolean reserveMemory(long bytes) {
              if (ownerMemoryBudget != null && !ownerMemoryBudget.tryReserve(bytes)) {
                return false;
              }
              if (PROCESS_MEMORY_BUDGET.tryReserve(bytes)) {
                return true;
              }
              if (ownerMemoryBudget != null) {
                ownerMemoryBudget.release(bytes);
              }
              return false;
            }

            private void releaseMemory(long bytes) {
              PROCESS_MEMORY_BUDGET.release(bytes);
              if (ownerMemoryBudget != null) {
                ownerMemoryBudget.release(bytes);
              }
            }
          '''
          if buffer.count(old_reserve) != 1:
              raise SystemExit('reserve source shape changed')
          buffer = buffer.replace(old_reserve, new_reserve)

          buffer = buffer.replace(
              '      ownerMemoryBudget.release(data.length);\n',
              '      if (ownerMemoryBudget != null) {\n'
              '        ownerMemoryBudget.release(data.length);\n'
              '      }\n')
          buffer = buffer.replace(
              '    private final long fileSize;\n    private final AtomicBoolean discarded = new AtomicBoolean();\n\n'
              '    private FilePayload(Path path, long fileSize) {\n'
              '      this.path = path;\n      this.fileSize = fileSize;\n    }\n',
              '    private final long fileSize;\n'
              '    private final StorageByteCounters storageByteCounters;\n'
              '    private final AtomicBoolean discarded = new AtomicBoolean();\n\n'
              '    private FilePayload(\n'
              '        Path path, long fileSize, StorageByteCounters storageByteCounters) {\n'
              '      this.path = path;\n'
              '      this.fileSize = fileSize;\n'
              '      this.storageByteCounters = storageByteCounters;\n'
              '    }\n')
          buffer = buffer.replace(
              '          return readFile(channel, fileSize, position, destination);\n',
              '          int count = readFile(channel, fileSize, position, destination);\n'
              '          if (count > 0) {\n'
              '            storageByteCounters.recordTemporaryFileBytesRead(count);\n'
              '          }\n'
              '          return count;\n')
          buffer_path.write_text(buffer)

          read_ahead = Path('jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/objects/ReadAheadHibernateObjDatabase.java')
          text = read_ahead.read_text()
          marker = '''  int stagedExtensionCount() {
              return stagedExtensions.stagedExtensionCount();
            }
          '''
          replacement = marker + '''
            int stagedMemoryExtensionCount() {
              return stagedExtensions.stagedMemoryExtensionCount();
            }

            int stagedFileExtensionCount() {
              return stagedExtensions.stagedFileExtensionCount();
            }

            long stagedMemoryBytes() {
              return stagedExtensions.stagedMemoryBytes();
            }
          '''
          if text.count(marker) != 1:
              raise SystemExit('read-ahead staging source shape changed')
          read_ahead.write_text(text.replace(marker, replacement))
          PY

          cat > jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/objects/MemoryFirstStorageByteMetricsH2Test.java <<'JAVA'
          /*
           * Copyright (C) 2026, Carsten Hammer and contributors.
           *
           * SPDX-License-Identifier: BSD-3-Clause
           */
          package io.github.carstenartur.jgit.storage.hibernate.objects;

          import static org.junit.jupiter.api.Assertions.assertEquals;

          import io.github.carstenartur.jgit.storage.hibernate.config.HibernateSessionFactoryProvider;
          import io.github.carstenartur.jgit.storage.hibernate.repository.HibernateRepository;
          import io.github.carstenartur.jgit.storage.hibernate.transaction.HibernateTransactionContext;
          import io.github.carstenartur.jgit.storage.hibernate.transaction.StorageByteMetrics;
          import java.util.List;
          import java.util.Properties;
          import java.util.UUID;
          import org.eclipse.jgit.internal.storage.dfs.DfsObjDatabase.PackSource;
          import org.eclipse.jgit.internal.storage.dfs.DfsOutputStream;
          import org.eclipse.jgit.internal.storage.dfs.DfsPackDescription;
          import org.eclipse.jgit.internal.storage.pack.PackExt;
          import org.junit.jupiter.api.Test;

          class MemoryFirstStorageByteMetricsH2Test {

            @Test
            void memoryOnlyInlinePublicationAvoidsAllTemporaryFileTraffic() throws Exception {
              byte[] payload = bytes(12_345, 17);
              try (HibernateSessionFactoryProvider provider = provider();
                  HibernateRepository repository =
                      HibernateRepository.create(provider.getSessionFactory(), "memory-byte-inline")) {
                repository.create(true);
                HibernateTransactionContext context =
                    new HibernateTransactionContext(provider.getSessionFactory());
                StorageByteCounters counters = StorageByteCounters.from(provider.getSessionFactory());
                StagedPackExtensionStore store =
                    new StagedPackExtensionStore("memory-byte-inline", context, counters);
                DfsPackDescription description =
                    ((ReadAheadHibernateObjDatabase) repository.getObjectDatabase())
                        .newPack(PackSource.RECEIVE);
                StorageByteMetrics before = store.storageByteMetricsSnapshot();

                write(store, description, payload);
                store.commit(List.of(description), null);

                StorageByteMetrics delta = store.storageByteMetricsSnapshot().minus(before);
                assertEquals(0, delta.temporaryFileBytesWritten());
                assertEquals(0, delta.temporaryFileBytesRead());
                assertEquals(payload.length, delta.databasePayloadBytesWritten());
              }
            }

            @Test
            void spilledPublicationCountsPhysicalFileTrafficExactly() throws Exception {
              byte[] payload = bytes(HibernateObjDatabase.PACK_CHUNK_SIZE + 37, 29);
              try (HibernateSessionFactoryProvider provider = provider();
                  HibernateRepository repository =
                      HibernateRepository.create(provider.getSessionFactory(), "memory-byte-spill")) {
                repository.create(true);
                HibernateTransactionContext context =
                    new HibernateTransactionContext(provider.getSessionFactory());
                StorageByteCounters counters = StorageByteCounters.from(provider.getSessionFactory());
                StagedPackExtensionStore store =
                    new StagedPackExtensionStore("memory-byte-spill", context, counters);
                DfsPackDescription description =
                    ((ReadAheadHibernateObjDatabase) repository.getObjectDatabase())
                        .newPack(PackSource.RECEIVE);
                StorageByteMetrics before = store.storageByteMetricsSnapshot();

                write(store, description, payload);
                store.commit(List.of(description), null);

                StorageByteMetrics delta = store.storageByteMetricsSnapshot().minus(before);
                assertEquals(payload.length, delta.temporaryFileBytesWritten());
                assertEquals(payload.length, delta.temporaryFileBytesRead());
                assertEquals(payload.length, delta.databasePayloadBytesWritten());
              }
            }

            private static void write(
                StagedPackExtensionStore store,
                DfsPackDescription description,
                byte[] payload)
                throws Exception {
              try (DfsOutputStream stream = store.open(description, PackExt.PACK)) {
                stream.write(payload, 0, payload.length);
              }
              description.addFileExt(PackExt.PACK);
              description.setFileSize(PackExt.PACK, payload.length);
            }

            private static byte[] bytes(int length, int seed) {
              byte[] result = new byte[length];
              int value = seed;
              for (int index = 0; index < result.length; index++) {
                value = value * 1103515245 + 12345;
                result[index] = (byte) (value >>> 16);
              }
              return result;
            }

            private static HibernateSessionFactoryProvider provider() {
              Properties properties = new Properties();
              properties.put(
                  "hibernate.connection.url",
                  "jdbc:h2:mem:memory-first-bytes-" + UUID.randomUUID() + ";DB_CLOSE_DELAY=-1");
              properties.put("hibernate.connection.driver_class", "org.h2.Driver");
              properties.put("hibernate.dialect", "org.hibernate.dialect.H2Dialect");
              properties.put("hibernate.hbm2ddl.auto", "create-drop");
              properties.put("hibernate.show_sql", "false");
              properties.put("hibernate.search.enabled", "false");
              properties.put("hibernate.connection.pool_size", "4");
              properties.put(HibernateTransactionContext.METRICS_ENABLED_PROPERTY, "true");
              return new HibernateSessionFactoryProvider(properties);
            }
          }
          JAVA

          cat > docs/operations/memory-first-staging.md <<'DOC'
          # Memory-first pack-extension staging

          Small JGit PACK, IDX and Reftable extensions begin in random-readable heap memory instead of creating a temporary file immediately.

          - one extension retains at most 256 KiB;
          - all repository instances share a 32 MiB process budget;
          - a narrower owner budget can force an earlier spill in tests or specialized integrations;
          - memory grows from a 16-KiB initial reservation, reducing global-budget contention for ordinary small extensions;
          - when either bound is exceeded, the written prefix is copied once to a temporary file and all later writes remain file-backed;
          - positional reads retain the same `DfsOutputStream` behavior before and after spill;
          - publication and rollback release the reservation or delete the temporary file exactly once.

          The merged `StorageByteMetrics` make the intended effect observable. A memory-only inline publication records database payload bytes but zero temporary-file bytes. A spilled extension records the exact file bytes written and reread during publication.

          Memory-first staging changes only derived unpublished state. Database visibility, the adaptive one-MiB two-phase selector, writer leases, repository locks and replacement race protection remain unchanged.
          DOC

          rm .github/workflows/build-memory-first-v2.yml
      - name: Commit rebuilt implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Rebuild bounded memory-first staging on current main'
          git push origin HEAD:perf/memory-first-staging-v2
