name: Report release 0.1.10 failure

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-0.1.10-status.yml'

permissions:
  actions: read
  contents: write

jobs:
  report:
    if: github.event.head_commit.message == 'Report release 0.1.10 failure'
    runs-on: ubuntu-latest
    steps:
      - name: Capture failed release log
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: '30149281130'
        run: |
          set -euo pipefail
          gh run view "$RUN_ID" --repo "$REPOSITORY" --log-failed > /tmp/release-failure.txt 2>&1 || true
          tail -n 400 /tmp/release-failure.txt > /tmp/release-failure-tail.txt
          cat /tmp/release-failure-tail.txt
          status_sha=$(gh api "repos/${REPOSITORY}/contents/.github/release-0.1.10-failure.txt?ref=main" --jq '.sha' 2>/dev/null || true)
          content=$(base64 -w0 /tmp/release-failure-tail.txt)
          if [[ -n "$status_sha" ]]; then
            gh api -X PUT "repos/${REPOSITORY}/contents/.github/release-0.1.10-failure.txt" -f message='Update release 0.1.10 failure log' -f content="$content" -f sha="$status_sha" -f branch=main >/dev/null
          else
            gh api -X PUT "repos/${REPOSITORY}/contents/.github/release-0.1.10-failure.txt" -f message='Update release 0.1.10 failure log' -f content="$content" -f branch=main >/dev/null
          fi
