name: Server image and Git protocol smoke

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.dockerignore'
      - '.env.example'
      - 'compose.yaml'
      - 'compose.build.yaml'
      - 'docs/current-release-version.txt'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-search/**'
      - 'jgit-storage-hibernate-smart-http/**'
      - 'jgit-storage-hibernate-spring-boot-*/**'
      - 'jgit-storage-hibernate-server/**'
      - 'jgit-storage-hibernate-testcontainers/**'
      - '.github/scripts/smoke_server_compose.sh'
      - '.github/workflows/server-image.yml'
  push:
    branches: [ main ]
    paths:
      - 'pom.xml'
      - '.dockerignore'
      - '.env.example'
      - 'compose.yaml'
      - 'compose.build.yaml'
      - 'docs/current-release-version.txt'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-search/**'
      - 'jgit-storage-hibernate-smart-http/**'
      - 'jgit-storage-hibernate-spring-boot-*/**'
      - 'jgit-storage-hibernate-server/**'
      - 'jgit-storage-hibernate-testcontainers/**'
      - '.github/scripts/smoke_server_compose.sh'
      - '.github/workflows/server-image.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-smoke:
    name: Build source image and exercise Git/PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      COMPOSE_FILE: compose.yaml:compose.build.yaml
      JSH_ADMIN_USERNAME: admin
      JSH_ADMIN_PASSWORD: source-smoke-${{ github.run_id }}
      JSH_DATABASE_PASSWORD: source-database-${{ github.run_id }}
      SMOKE_REPOSITORY: source-smoke
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify product modules
        run: |
          mvn -B -ntp \
            -pl 'jgit-storage-hibernate-spring-boot-autoconfigure,jgit-storage-hibernate-spring-boot-starter,jgit-storage-hibernate-server,jgit-storage-hibernate-testcontainers' \
            -am verify

      - name: Build and start current source
        run: |
          docker compose build git-server
          docker compose up -d postgres git-server

      - name: Exercise Git protocol, Search projection and restart
        run: .github/scripts/smoke_server_compose.sh

      - name: Report logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs postgres git-server || true

      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans

  released-smoke:
    name: Pull released image and exercise Git/PostgreSQL
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_NAME: ghcr.io/carstenartur/jgit-storage-hibernate-server
      JSH_ADMIN_USERNAME: admin
      JSH_ADMIN_PASSWORD: release-smoke-${{ github.run_id }}
      JSH_DATABASE_PASSWORD: release-database-${{ github.run_id }}
      SMOKE_REPOSITORY: release-smoke
    steps:
      - name: Checkout proposed Compose configuration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the currently published release
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            release_version="$(git show "$BASE_SHA:docs/current-release-version.txt")"
          else
            release_version="$(cat docs/current-release-version.txt)"
          fi
          release_version="${release_version//$'\r'/}"
          release_version="${release_version//$'\n'/}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Published release version must match X.Y.Z, received %s\n' \
              "$release_version" >&2
            exit 1
          fi
          printf 'JSH_SERVER_IMAGE=%s:%s\n' "$IMAGE_NAME" "$release_version" \
            >> "$GITHUB_ENV"
          printf 'Testing released image %s:%s with the proposed Compose file.\n' \
            "$IMAGE_NAME" "$release_version"

      - name: Pull and start released image without a source build
        run: |
          docker compose config --quiet
          docker compose pull postgres git-server
          docker compose up --no-build -d postgres git-server
          container_id="$(docker compose ps -q git-server)"
          actual_reference="$(docker inspect --format '{{ .Config.Image }}' "$container_id")"
          if [[ "$actual_reference" != "$JSH_SERVER_IMAGE" ]]; then
            printf 'Expected running image %s, found %s.\n' \
              "$JSH_SERVER_IMAGE" "$actual_reference" >&2
            exit 1
          fi

      - name: Exercise released Git protocol, Search projection and restart
        run: .github/scripts/smoke_server_compose.sh

      - name: Report logs on failure
        if: failure()
        run: |
          docker compose ps || true
          docker compose logs postgres git-server || true

      - name: Stop containers
        if: always()
        run: docker compose down -v --remove-orphans
