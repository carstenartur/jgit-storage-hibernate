name: Temporary harden consumer contract

on:
  push:
    branches:
      - ci/consumer-contracts

permissions:
  contents: write

concurrency:
  group: temporary-harden-consumer-contract
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/consumer-contracts
          fetch-depth: 0
      - name: Harden dynamic module loading and explicit job status
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          test_path = Path('.github/scripts/test_prepare_consumer_contract.py')
          text = test_path.read_text(encoding='utf-8')
          if 'import sys\n' not in text:
              text = text.replace('import os\n', 'import os\nimport sys\n', 1)
          anchor = 'PREPARE = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(PREPARE)'
          replacement = (
              'PREPARE = importlib.util.module_from_spec(SPEC)\n'
              'sys.modules[SPEC.name] = PREPARE\n'
              'SPEC.loader.exec_module(PREPARE)'
          )
          if anchor not in text:
              raise SystemExit('Could not locate dynamic consumer-tool import')
          test_path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          workflow_path = Path('.github/workflows/consumer-compatibility.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          env_anchor = '          LIBRARY_VERSION: ${{ needs.current-library.outputs.version }}\n'
          if '          JOB_STATUS: ${{ job.status }}\n' not in workflow:
              if env_anchor not in workflow:
                  raise SystemExit('Could not locate consumer summary environment')
              workflow = workflow.replace(
                  env_anchor,
                  env_anchor + '          JOB_STATUS: ${{ job.status }}\n',
                  1,
              )
          workflow = workflow.replace(
              'f"- Job status: `{os.environ.get(\'JOB_STATUS\', \'${{ job.status }}\')}`",',
              'f"- Job status: `{os.environ[\'JOB_STATUS\']}`",',
              1,
          )
          workflow_path.write_text(workflow, encoding='utf-8')

          Path('.github/workflows/temporary-harden-consumer-contract.yml').unlink()
          PY
          python3 .github/scripts/test_prepare_consumer_contract.py
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Harden consumer contract regression tooling'
          git push origin HEAD:ci/consumer-contracts
