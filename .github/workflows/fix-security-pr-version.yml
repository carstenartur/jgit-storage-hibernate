name: Fix Security PR documented version

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/fix-security-pr-version.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1-source
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Align documented Security version and verify
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/consuming.md')
          text = path.read_text(encoding='utf-8')
          old = '<artifactId>jgit-storage-hibernate-security</artifactId>\n  <version>0.11.0-SNAPSHOT</version>'
          new = '<artifactId>jgit-storage-hibernate-security</artifactId>\n  <version>0.10.0</version>'
          if text.count(old) != 1:
              raise SystemExit('Expected Security dependency version snippet was not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 .github/scripts/verify-release-consistency.py
          python3 .github/scripts/verify-security-policy.py
          mvn -B -ntp clean verify
          git diff --check
      - name: Commit the verified documentation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/consuming.md
          git commit -m 'docs: align Security dependency with current version'
          git push origin HEAD:refs/heads/feature/security-phase-1-source
