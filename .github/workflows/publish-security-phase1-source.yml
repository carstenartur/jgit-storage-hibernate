name: Publish Validated Security Phase 1 Source Branch

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/publish-security-phase1-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Materialize the reviewed Security source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/scripts/security-phase1-module.b64.part-00-0 \
            .github/scripts/security-phase1-module.b64.part-00-1 \
            .github/scripts/security-phase1-module.b64.part-01 \
            .github/scripts/security-phase1-module.b64.part-02 \
            .github/scripts/security-phase1-module.b64.part-03 \
            .github/scripts/security-phase1-module.b64.part-04 \
            > .github/scripts/security-phase1-module.b64
          python3 .github/scripts/generate-security-phase1.py

          test -f jgit-storage-hibernate-security/pom.xml
          test "$(find jgit-storage-hibernate-security/src/main/java -type f -name '*.java' | wc -l)" -eq 24
          test "$(find jgit-storage-hibernate-security/src/test/java -type f -name '*.java' | wc -l)" -eq 5
          test "$(find jgit-storage-hibernate-security/src/main/resources -type f -name 'V0_11_0__create_security_schema.sql' | wc -l)" -eq 4
      - name: Normalize the generated migration sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "jgit-storage-hibernate-security/src/main/resources/db/migration/"
              "jgit-storage-hibernate/security"
          )
          table_identifier = (
              r'(?:git_security_group_member|"git_security_group_member"|'
              r'\[git_security_group_member\])'
          )
          table_start = re.compile(
              rf"(?im)^\s*create\s+table\s+{table_identifier}\s*\("
          )
          index_start = re.compile(
              rf"(?im)^\s*create\s+(?:unique\s+)?index\b[^;]*?"
              rf"\bon\s+{table_identifier}\s*\("
          )
          alter_start = re.compile(
              rf"(?im)^\s*alter\s+table\s+{table_identifier}\b"
          )
          principal_start = re.compile(
              r'^\s*create\s+table\s+(?:\[|\")?git_security_principal(?:\]|\")?\s*\(',
              re.IGNORECASE,
          )
          group_start = re.compile(
              r'^\s*create\s+table\s+(?:\[|\")?git_security_group(?:\]|\")?\s*\(',
              re.IGNORECASE,
          )

          def take_statement(sql: str, start: int) -> tuple[str, str]:
              semicolon = sql.find(";", start)
              if semicolon < 0:
                  raise SystemExit(
                      "Security migration statement has no semicolon terminator near: "
                      + sql[start:start + 160]
                  )
              end = semicolon + 1
              suffix = re.match(
                  r"[ \t]*(?:\r?\n[ \t]*GO[ \t]*)?(?:\r?\n)?",
                  sql[end:],
                  flags=re.IGNORECASE,
              )
              if suffix:
                  end += suffix.end()
              return sql[start:end].strip(), sql[:start] + sql[end:]

          paths = sorted(root.glob("*/V0_11_0__create_security_schema.sql"))
          expected = {"h2", "hsqldb", "postgresql", "sqlserver"}
          found = {path.parent.name for path in paths}
          if found != expected:
              raise SystemExit(
                  f"Expected migrations for {sorted(expected)}, found {sorted(found)}"
              )

          for path in paths:
              sql = path.read_text(encoding="utf-8")
              table_match = table_start.search(sql)
              if table_match is None:
                  raise SystemExit(f"Missing membership table in {path}")
              membership_table, sql = take_statement(sql, table_match.start())
              if "membership_id" not in membership_table:
                  raise SystemExit(f"membership_id is absent from {path}")

              dependents: list[str] = []
              while True:
                  matches = [
                      match
                      for pattern in (index_start, alter_start)
                      if (match := pattern.search(sql)) is not None
                  ]
                  if not matches:
                      break
                  match = min(matches, key=lambda item: item.start())
                  statement, sql = take_statement(sql, match.start())
                  dependents.append(statement)

              reordered = sql.rstrip() + "\n\n" + membership_table + "\n"
              if dependents:
                  reordered += "\n" + "\n\n".join(dependents) + "\n"

              lines = reordered.splitlines()
              positions = {
                  "principal": next(
                      (i for i, line in enumerate(lines) if principal_start.search(line)), -1
                  ),
                  "group": next(
                      (i for i, line in enumerate(lines) if group_start.search(line)), -1
                  ),
                  "membership": next(
                      (i for i, line in enumerate(lines) if table_start.search(line)), -1
                  ),
              }
              if min(positions.values()) < 0 or not (
                  positions["principal"] < positions["membership"]
                  and positions["group"] < positions["membership"]
              ):
                  raise SystemExit(f"Invalid table order in {path}: {positions}")

              membership_offset = reordered.lower().find("git_security_group_member")
              for statement in dependents:
                  if reordered.find(statement) <= membership_offset:
                      raise SystemExit(
                          f"Dependent membership statement precedes its table in {path}"
                      )

              path.write_text(reordered, encoding="utf-8")
              print(
                  f"Verified {path.parent.name}: {positions}, "
                  f"dependent statements={len(dependents)}"
              )
          PY

          hsqldb_migration="jgit-storage-hibernate-security/src/main/resources/db/migration/jgit-storage-hibernate/security/hsqldb/V0_11_0__create_security_schema.sql"
          timestamp_with_zone='timestamp([[:space:]]*\([0-9]+\))?[[:space:]]+with[[:space:]]+time[[:space:]]+zone'
          test -f "$hsqldb_migration"
          grep -qiE "$timestamp_with_zone" "$hsqldb_migration"
          sed -Ei "s/$timestamp_with_zone/timestamp(6)/Ig" "$hsqldb_migration"
          if grep -qiE "$timestamp_with_zone" "$hsqldb_migration"; then
            echo 'HSQLDB security migration still contains zoned timestamp columns.' >&2
            exit 1
          fi
          grep -n 'timestamp(6)' "$hsqldb_migration"
      - name: Verify module boundaries and Security policy
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_verify_module_boundaries.py
          python3 .github/scripts/verify-module-boundaries.py \
            --root . \
            --json target/module-boundaries/security-phase1.json \
            --markdown target/module-boundaries/security-phase1.md
          python3 .github/scripts/verify-security-policy.py
      - name: Run the complete clean reactor
        shell: bash
        run: mvn -B -ntp clean verify
      - name: Publish one reviewable source commit on a dedicated branch
        shell: bash
        run: |
          set -euo pipefail

          publish_branch="feature/security-phase-1-source"
          git fetch origin main
          git reset --mixed origin/main

          rm -f .github/scripts/generate-security-phase1.py
          rm -f .github/scripts/security-phase1-module.b64
          rm -f .github/scripts/security-phase1-module.b64.part-*
          rm -f .github/workflows/inspect-security-javadoc-source.yml
          rm -f .github/workflows/materialize-security-phase1.yml
          rm -f .github/workflows/publish-security-phase1-source.yml
          find . -type d -name target -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          test -f jgit-storage-hibernate-security/pom.xml
          test "$(find jgit-storage-hibernate-security/src/main/java -type f -name '*.java' | wc -l)" -eq 24
          test "$(find jgit-storage-hibernate-security/src/test/java -type f -name '*.java' | wc -l)" -eq 5
          test "$(find jgit-storage-hibernate-security/src/main/resources -type f -name 'V0_11_0__create_security_schema.sql' | wc -l)" -eq 4

          git add -A
          git diff --cached --check

          if git diff --cached --name-only | grep -E \
            '(^|/)target/|(^|/)__pycache__/|\.class$|\.jar$|security-phase1-module\.b64|generate-security-phase1\.py|inspect-security-javadoc-source\.yml|materialize-security-phase1\.yml|publish-security-phase1-source\.yml'; then
            echo 'Forbidden bootstrap, diagnostic or build artifacts are staged.' >&2
            exit 1
          fi

          if git grep --cached -nE \
            'security-phase1-module\.b64|generate-security-phase1\.py|inspect-security-javadoc-source\.yml|materialize-security-phase1\.yml|publish-security-phase1-source\.yml'; then
            echo 'Bootstrap or diagnostic references remain in the final source tree.' >&2
            exit 1
          fi

          echo '::group::Clean Security source commit summary'
          git diff --cached --stat
          git status --short
          echo '::endgroup::'

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Add Security Phase 1 authorization module' \
            -m 'Add repository-scoped principals, groups, grants and protected-ref policies with deterministic deny precedence, auditable evidence and Flyway migrations for H2, HSQLDB, PostgreSQL and SQL Server.'

          git push origin "HEAD:refs/heads/${publish_branch}"
          echo "Published clean Security source branch ${publish_branch} at $(git rev-parse HEAD)"
