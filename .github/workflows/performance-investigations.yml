name: Performance Investigations

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
          - publication-nonregression
          - publication-gc-diagnostic
          - publication-gc-counterfactual
          - publication-reftable-comparison
  schedule:
    - cron: '23 5 * * 3'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/performance-investigations.yml'
      - '.github/scripts/convert-jmh-repository-aging.py'
      - '.github/scripts/test_convert_jmh_repository_aging.py'
      - '.github/scripts/test_performance_investigations_workflow.py'
      - '.github/scripts/test_native_followup_trigger.py'
      - '.github/scripts/summarize-publication-nonregression.py'
      - '.github/scripts/test_summarize_publication_nonregression.py'
      - '.github/scripts/summarize-publication-gc-diagnostic.py'
      - '.github/scripts/test_summarize_publication_gc_diagnostic.py'
      - '.github/scripts/verify-publication-diagnostic-source.py'
      - '.github/scripts/test_verify_publication_diagnostic_source.py'
      - '.github/scripts/prepare-publication-reftable-comparison.py'
      - '.github/scripts/test_prepare_publication_reftable_comparison.py'
      - '.github/scripts/summarize-publication-reftable-comparison.py'
      - '.github/scripts/test_summarize_publication_reftable_comparison.py'
      - '.github/scripts/validate_read_ahead_database_telemetry.py'
      - '.github/scripts/test_validate_read_ahead_database_telemetry.py'
      - '.github/scripts/validate_search_database_telemetry.py'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-benchmarks/**'
  push:
    branches: [ main, codex/performance-followup-20261108, codex/publication-gc-diagnostic-20261108, codex/publication-reftable-diagnostic-20261108, codex/publication-reftable-paired-20261108 ]
    paths:
      - '.github/workflows/performance-investigations.yml'
      - '.github/scripts/convert-jmh-repository-aging.py'
      - '.github/scripts/test_convert_jmh_repository_aging.py'
      - '.github/scripts/test_performance_investigations_workflow.py'
      - '.github/scripts/test_native_followup_trigger.py'
      - '.github/scripts/summarize-publication-nonregression.py'
      - '.github/scripts/test_summarize_publication_nonregression.py'
      - '.github/scripts/summarize-publication-gc-diagnostic.py'
      - '.github/scripts/test_summarize_publication_gc_diagnostic.py'
      - '.github/scripts/verify-publication-diagnostic-source.py'
      - '.github/scripts/test_verify_publication_diagnostic_source.py'
      - '.github/scripts/prepare-publication-reftable-comparison.py'
      - '.github/scripts/test_prepare_publication_reftable_comparison.py'
      - '.github/scripts/summarize-publication-reftable-comparison.py'
      - '.github/scripts/test_summarize_publication_reftable_comparison.py'
      - '.github/scripts/validate_read_ahead_database_telemetry.py'
      - '.github/scripts/test_validate_read_ahead_database_telemetry.py'
      - '.github/scripts/validate_search_database_telemetry.py'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-benchmarks/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Performance investigation workflow contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate sharding and aggregation contract
        run: |
          python3 -m py_compile .github/scripts/test_performance_investigations_workflow.py
          python3 .github/scripts/test_performance_investigations_workflow.py

      - name: Test read-ahead artifact validation
        run: python3 .github/scripts/test_validate_read_ahead_database_telemetry.py

      - name: Test paired publication evidence and stopping rules
        run: python3 .github/scripts/test_summarize_publication_nonregression.py

      - name: Test bounded GC diagnostic evidence
        run: |
          python3 .github/scripts/test_summarize_publication_gc_diagnostic.py
          python3 .github/scripts/test_verify_publication_diagnostic_source.py
          python3 .github/scripts/test_prepare_publication_reftable_comparison.py
          python3 .github/scripts/test_summarize_publication_reftable_comparison.py

      - name: Test exact native follow-up event selection
        run: python3 .github/scripts/test_native_followup_trigger.py

  investigate:
    if: >-
      (github.event_name != 'workflow_dispatch' || (inputs.profile != 'publication-nonregression' && inputs.profile != 'publication-gc-diagnostic' && inputs.profile != 'publication-gc-counterfactual' && inputs.profile != 'publication-reftable-comparison')) &&
      !(github.event_name == 'push' && (github.ref == 'refs/heads/codex/performance-followup-20261108' || github.ref == 'refs/heads/codex/publication-gc-diagnostic-20261108' || github.ref == 'refs/heads/codex/publication-reftable-diagnostic-20261108' || github.ref == 'refs/heads/codex/publication-reftable-paired-20261108'))
    name: ${{ matrix.investigation }} (${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }})
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        investigation:
          - write-queue
          - read-ahead
          - concurrent-large-pack

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build benchmark module with Maven
        shell: bash
        run: |
          mkdir -p "target/investigations/${{ matrix.investigation }}"
          set -o pipefail
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee "target/investigations/${{ matrix.investigation }}/maven-build.log"

      - name: Run selected investigation through Maven
        shell: bash
        run: |
          set -o pipefail
          profile="${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }}"
          telemetry_args=()
          if [[ '${{ matrix.investigation }}' == 'write-queue' || '${{ matrix.investigation }}' == 'read-ahead' ]]; then
            telemetry_args+=(
              '-Djgit.storage.benchmark.database-telemetry.enabled=true'
            )
          fi
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks verify \
            -Pperformance-investigations \
            -Dtest=DatabaseTelemetrySnapshotTest,DurableStripedWriteQueueTest \
            -Djgit.storage.benchmark.investigation="${{ matrix.investigation }}" \
            -Djgit.storage.benchmark.investigation.profile="$profile" \
            "${telemetry_args[@]}" \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/investigations/${{ matrix.investigation }}/jmh-result.json" 2>&1 \
            | tee "target/investigations/${{ matrix.investigation }}/maven-benchmark.log"

      - name: Validate write-queue native telemetry
        if: matrix.investigation == 'write-queue'
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import datetime
          import json
          from pathlib import Path

          root = Path('target/investigations/write-queue')
          telemetry_path = root / 'write-queue-database-telemetry.json'
          jmh_path = root / 'jmh-result.json'
          telemetry_text = telemetry_path.read_text(encoding='utf-8')
          if 'NaN' in telemetry_text or 'Infinity' in telemetry_text:
              raise SystemExit('Write-queue telemetry is not strict JSON')
          observations = json.loads(telemetry_text)['observations']
          jmh = json.loads(jmh_path.read_text(encoding='utf-8'))
          profile = '${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }}'
          iterations = 3 if profile == 'full' else 1
          expected = 96 if profile == 'full' else 16
          if len(observations) != expected:
              raise SystemExit(
                  f'Expected {expected} write-queue observations, found {len(observations)}'
              )

          def jmh_coordinate(item):
              method = item['benchmark'].rsplit('.', 1)[-1]
              params = item['params']
              scope = (
                  'shared'
                  if method == 'publishToSameRepository'
                  else 'isolated'
              )
              stripes = {
                  'direct': '0',
                  'queue-1': '1',
                  'queue-4': '4',
                  'queue-8': '8',
              }[params['executionMode']]
              return (
                  method,
                  params['backend'],
                  params['executionMode'],
                  params['payloadKiB'],
                  str(item['threads']),
                  scope,
                  stripes,
                  '2',
              )

          def telemetry_coordinate(item):
              coordinate = item['coordinate']
              return (
                  coordinate['benchmarkMethod'],
                  coordinate['backend'],
                  coordinate['executionMode'],
                  coordinate['payloadKiB'],
                  coordinate['threads'],
                  coordinate['repositoryScope'],
                  coordinate['stripes'],
                  coordinate['poolSize'],
              )

          jmh_coordinates = {jmh_coordinate(item) for item in jmh}
          telemetry_counts = collections.Counter(
              telemetry_coordinate(item) for item in observations
          )
          if set(telemetry_counts) != jmh_coordinates:
              raise SystemExit(
                  'JMH and native telemetry coordinate sets differ: '
                  f'{jmh_coordinates ^ set(telemetry_counts)}'
              )
          if any(count != iterations for count in telemetry_counts.values()):
              raise SystemExit(
                  f'Unexpected per-coordinate iteration counts: {telemetry_counts}'
              )

          iteration_numbers = collections.defaultdict(set)
          for item in observations:
              coordinate = item['coordinate']
              if item['backend'] != 'postgresql':
                  raise SystemExit(f'Unexpected telemetry backend: {item["backend"]}')
              if coordinate['databaseBackend'] != 'postgresql':
                  raise SystemExit(f'Unexpected database coordinate: {coordinate}')
              base = telemetry_coordinate(item)
              iteration_numbers[base].add(int(coordinate['measurementIteration']))
              for field in ('coordinate', 'counters', 'gauges', 'metadata', 'unsupported'):
                  keys = list(item[field])
                  if keys != sorted(keys):
                      raise SystemExit(
                          f'{field} keys are not deterministic for {coordinate}: {keys}'
                      )
              wal = item['counters'].get('postgresql.wal.insert_lsn_bytes')
              if wal is None or wal <= 0:
                  raise SystemExit(
                      f'Expected positive immediate WAL delta for {coordinate}: {wal}'
                  )
              start = datetime.datetime.fromisoformat(
                  item['startedAt'].replace('Z', '+00:00')
              )
              end = datetime.datetime.fromisoformat(
                  item['completedAt'].replace('Z', '+00:00')
              )
              if end < start:
                  raise SystemExit(f'Negative telemetry window for {coordinate}')
          expected_iterations = set(range(1, iterations + 1))
          if any(values != expected_iterations for values in iteration_numbers.values()):
              raise SystemExit(
                  f'Measurement iteration numbering is incomplete: {iteration_numbers}'
              )

          forbidden = (
              'jgit.storage.benchmark.postgresql.url=',
              'jgit.storage.benchmark.postgresql.user=',
              'jgit.storage.benchmark.postgresql.password=',
              'jdbc:postgresql://',
              'Database JDBC URL',
              'Default catalog/schema',
          )
          scan_roots = [
              root,
              Path('jgit-storage-hibernate-benchmarks/target/failsafe-reports'),
          ]
          for scan_root in scan_roots:
              if not scan_root.exists():
                  continue
              for path in scan_root.rglob('*'):
                  if not path.is_file():
                      continue
                  content = path.read_bytes().decode('utf-8', errors='replace')
                  for token in forbidden:
                      if token in content:
                          raise SystemExit(f'Sensitive token {token!r} found in {path}')
          leftovers = list(
              Path('/tmp').glob('jgit-storage-benchmark-connection-*.properties')
          )
          if leftovers:
              raise SystemExit(f'Temporary credential files remain: {leftovers}')
          print(
              f'Validated {len(observations)} native write-queue iteration observations '
              f'across {len(jmh_coordinates)} exact JMH coordinates'
          )
          PY

      - name: Validate read-ahead native telemetry
        id: read-ahead-native-validation
        if: matrix.investigation == 'read-ahead'
        run: |
          python3 .github/scripts/validate_read_ahead_database_telemetry.py \
            "${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }}" \
            target/investigations/read-ahead \
            jgit-storage-hibernate-benchmarks/target/failsafe-reports

      - name: Upload raw investigation results
        if: always() && (matrix.investigation != 'read-ahead' || steps.read-ahead-native-validation.outcome == 'success')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-investigation-${{ matrix.investigation }}-${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }}
          path: |
            target/investigations/${{ matrix.investigation }}/**
            jgit-storage-hibernate-benchmarks/target/failsafe-reports/**
          if-no-files-found: error

      - name: Report retained evidence
        if: always()
        run: |
          echo '### Performance investigation' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Investigation: `${{ matrix.investigation }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Profile: `${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Raw JMH JSON, console output, Maven logs and Failsafe reports are retained as one artifact.' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.investigation }}" = 'write-queue' ]; then
            echo '- This existing experiment measures striped scheduling and backpressure. Native PostgreSQL WAL/I/O/wait telemetry is retained per measurement iteration because concurrent invocations overlap and cannot be attributed safely one by one.' >> "$GITHUB_STEP_SUMMARY"
            echo '- Atomic receiver record batching is implemented separately by the production `DurableStripedWriteQueue` and its Hibernate adapter.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ matrix.investigation }}" = 'read-ahead' ]; then
            echo '- Native PostgreSQL telemetry brackets each measured pack-channel read operation; fixture setup and teardown are outside the window.' >> "$GITHUB_STEP_SUMMARY"
          fi

  repository-aging-smoke:
    name: repository-aging (smoke)
    needs: contract
    if: >-
      github.event_name != 'schedule' &&
      !(github.event_name == 'push' && (github.ref == 'refs/heads/codex/performance-followup-20261108' || github.ref == 'refs/heads/codex/publication-gc-diagnostic-20261108' || github.ref == 'refs/heads/codex/publication-reftable-diagnostic-20261108' || github.ref == 'refs/heads/codex/publication-reftable-paired-20261108')) &&
      (github.event_name != 'workflow_dispatch' || inputs.profile == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate repository-aging evidence converter
        run: |
          python3 -m py_compile .github/scripts/convert-jmh-repository-aging.py .github/scripts/test_convert_jmh_repository_aging.py
          python3 .github/scripts/test_convert_jmh_repository_aging.py

      - name: Build benchmark module with Maven
        shell: bash
        run: |
          mkdir -p target/investigations/repository-aging
          set -o pipefail
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee target/investigations/repository-aging/maven-build.log

      - name: Run repository-aging smoke investigation
        shell: bash
        run: |
          set -o pipefail
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks verify \
            -Pperformance-investigations \
            -Dtest=DatabaseTelemetrySnapshotTest,DurableStripedWriteQueueTest \
            -Djgit.storage.benchmark.investigation=repository-aging \
            -Djgit.storage.benchmark.investigation.profile=smoke \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/investigations/repository-aging/jmh-result.json" 2>&1 \
            | tee target/investigations/repository-aging/maven-benchmark.log

      - name: Derive repository-aging smoke evidence
        run: |
          python3 .github/scripts/convert-jmh-repository-aging.py \
            target/investigations/repository-aging/jmh-result.json \
            target/investigations/repository-aging/evidence
          cat target/investigations/repository-aging/evidence/repository-aging-policy-evidence.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload repository-aging smoke evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-investigation-repository-aging-smoke
          path: |
            target/investigations/repository-aging/**
            jgit-storage-hibernate-benchmarks/target/failsafe-reports/**
          if-no-files-found: error

  repository-aging-full-shard:
    name: repository-aging full — ${{ matrix.backend }} / ${{ matrix.cache_state }}
    needs: contract
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'full')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend:
          - hsqldb
          - postgresql
          - postgresql-hikari
          - sqlserver
        cache_state:
          - cold
          - warm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build benchmark module with Maven
        shell: bash
        run: |
          shard="target/investigations/repository-aging/${{ matrix.backend }}-${{ matrix.cache_state }}"
          mkdir -p "$shard"
          set -o pipefail
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee "$shard/maven-build.log"

      - name: Run one complete repository-aging shard
        shell: bash
        run: |
          set -o pipefail
          shard="target/investigations/repository-aging/${{ matrix.backend }}-${{ matrix.cache_state }}"
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks verify \
            -Pperformance-investigations \
            -Dtest=DatabaseTelemetrySnapshotTest,DurableStripedWriteQueueTest \
            -Djgit.storage.benchmark.investigation=repository-aging \
            -Djgit.storage.benchmark.investigation.profile=full \
            -Djgit.storage.benchmark.repository-aging.backend=${{ matrix.backend }} \
            -Djgit.storage.benchmark.repository-aging.cache-state=${{ matrix.cache_state }} \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/$shard/jmh-result.json" 2>&1 \
            | tee "$shard/maven-benchmark.log"

      - name: Collect shard Failsafe reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          shard="target/investigations/repository-aging/${{ matrix.backend }}-${{ matrix.cache_state }}"
          reports=jgit-storage-hibernate-benchmarks/target/failsafe-reports
          if [ -d "$reports" ]; then
            mkdir -p "$shard/failsafe-reports"
            cp -a "$reports"/. "$shard/failsafe-reports/"
          fi

      - name: Upload repository-aging shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-investigation-repository-aging-full-${{ matrix.backend }}-${{ matrix.cache_state }}
          path: target/investigations/repository-aging
          if-no-files-found: error

      - name: Report retained shard evidence
        if: always()
        run: |
          echo '### Repository-aging shard' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Backend: `${{ matrix.backend }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Cache state: `${{ matrix.cache_state }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- The shard retains all push counts, maintenance modes and benchmark methods for this backend/cache coordinate.' >> "$GITHUB_STEP_SUMMARY"

  repository-aging-full-summary:
    name: Merge and validate repository-aging full matrix
    needs: repository-aging-full-shard
    if: >-
      always() &&
      needs['repository-aging-full-shard'].result == 'success' &&
      (github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'full'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all repository-aging shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: performance-investigation-repository-aging-full-*
          path: target/repository-aging-shards
          merge-multiple: true

      - name: Merge the disjoint JMH result sets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('target/repository-aging-shards')
          expected = {
              f'{backend}-{cache}'
              for backend in ('hsqldb', 'postgresql', 'postgresql-hikari', 'sqlserver')
              for cache in ('cold', 'warm')
          }
          located = {}
          for path in sorted(root.rglob('jmh-result.json')):
              matches = expected.intersection(path.parts)
              if len(matches) != 1:
                  raise SystemExit(f'Cannot assign {path} to exactly one expected shard')
              shard = matches.pop()
              if shard in located:
                  raise SystemExit(f'Duplicate JMH result for shard {shard}: {located[shard]} and {path}')
              located[shard] = path
          if set(located) != expected:
              raise SystemExit(
                  f'Expected {len(expected)} repository-aging shards; missing={sorted(expected - set(located))}, '
                  f'unexpected={sorted(set(located) - expected)}'
              )

          merged = []
          manifest = {}
          for shard in sorted(expected):
              path = located[shard]
              payload = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(payload, list) or not payload:
                  raise SystemExit(f'Shard {shard} has no JMH result entries: {path}')
              for row in payload:
                  params = row['params']
                  if f"{params['backend']}-{params['cacheState']}" != shard:
                      raise SystemExit(f'Shard {shard} contains a result from another backend/cache state: {path}')
              merged.extend(payload)
              manifest[shard] = {'path': str(path), 'entries': len(payload)}

          output = Path('target/investigations/repository-aging')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'jmh-result.json').write_text(
              json.dumps(merged, indent=2) + '\n', encoding='utf-8'
          )
          (output / 'shard-manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(f'Merged {len(merged)} JMH entries from {len(located)} shards')
          PY

      - name: Derive complete repository-aging policy evidence
        run: |
          python3 .github/scripts/convert-jmh-repository-aging.py \
            --full-matrix \
            target/investigations/repository-aging/jmh-result.json \
            target/investigations/repository-aging/evidence
          cat target/investigations/repository-aging/evidence/repository-aging-policy-evidence.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload merged repository-aging evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance-investigation-repository-aging-full
          path: target/investigations/repository-aging/**
          if-no-files-found: error

  stateless-threshold:
    name: Stateful/stateless threshold at 16/128/512 MiB
    needs: contract
    if: >-
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && inputs.profile != 'publication-nonregression' && inputs.profile != 'publication-gc-diagnostic' && inputs.profile != 'publication-gc-counterfactual' && inputs.profile != 'publication-reftable-comparison')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build benchmark module with Maven
        shell: bash
        run: |
          mkdir -p target/stateless-threshold
          set -o pipefail
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee target/stateless-threshold/maven-build.log

      - name: Compare stateful and stateless at production batch size
        shell: bash
        run: |
          set -o pipefail
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks verify \
            -Pstateless-writer-threshold \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/stateless-threshold/jmh-result.json" 2>&1 \
            | tee target/stateless-threshold/maven-benchmark.log

      - name: Upload stateless threshold evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stateless-writer-threshold-results
          path: |
            target/stateless-threshold/**
            jgit-storage-hibernate-benchmarks/target/failsafe-reports/**
          if-no-files-found: error

      - name: Report stateless threshold matrix
        if: always()
        run: |
          echo '### Stateful/stateless large-pack threshold' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'PostgreSQL + HikariCP publishes deterministic 16, 128 and 512 MiB payloads with the production 16-chunk batch window.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Raw JMH JSON includes elapsed time, allocation, GC, JDBC execution, flush and byte-integrity counters.' >> "$GITHUB_STEP_SUMMARY"

  publication-nonregression:
    name: Publication policy / ${{ matrix.cell }}
    needs: contract
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'publication-nonregression') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/performance-followup-20261108' && !github.event.deleted)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        cell:
          - independent-1w-0ms
          - independent-1w-50ms
          - independent-16w-0ms
          - independent-16w-50ms
          - shared-8w-5ms
    env:
      PUBLICATION_CELL: ${{ matrix.cell }}
    steps:
      - name: Checkout immutable study source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build unchanged library and benchmark harness
        run: |
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks -am install -DskipTests

      - name: Run fixed paired protocol on a dedicated runner
        shell: bash
        run: |
          mkdir -p "target/publication-paired/$PUBLICATION_CELL"
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=PackPublicationPairedBenchmarkIT \
            -Djgit.storage.benchmark.publication.cell="$PUBLICATION_CELL" \
            -Djgit.storage.benchmark.source="$(git rev-parse HEAD)" \
            -Djgit.storage.benchmark.sourceTree="$(git rev-parse HEAD^{tree})" \
            -Dbenchmark.resultDirectory="$GITHUB_WORKSPACE/target/publication-paired/$PUBLICATION_CELL"

      - name: Validate all paired results and retain the observed conclusion
        run: |
          python3 .github/scripts/summarize-publication-nonregression.py \
            "target/publication-paired/$PUBLICATION_CELL"
          echo '### Preregistered paired publication result' >> "$GITHUB_STEP_SUMMARY"
          echo 'The result is observational; a complete unfavorable result does not fail data validation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The primary inference concerns throughput. Inspect retained latency, allocation and lock observations separately.' >> "$GITHUB_STEP_SUMMARY"

      - name: Check retained files for connection details
        id: publication-privacy
        if: always()
        run: |
          python3 .github/scripts/validate_search_database_telemetry.py --privacy-only \
            "target/publication-paired/$PUBLICATION_CELL"

      - name: Upload complete or diagnostic partial study evidence
        if: always() && steps.publication-privacy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-nonregression-${{ matrix.cell }}
          path: target/publication-paired/${{ matrix.cell }}/**
          if-no-files-found: error

  publication-gc-diagnostic:
    name: Publication allocation diagnostic / four fixed forks
    needs: contract
    if: >-
      (github.event_name == 'workflow_dispatch' && (inputs.profile == 'publication-gc-diagnostic' || inputs.profile == 'publication-gc-counterfactual')) ||
      (github.event_name == 'push' && (github.ref == 'refs/heads/codex/publication-gc-diagnostic-20261108' || github.ref == 'refs/heads/codex/publication-reftable-diagnostic-20261108') && !github.event.deleted)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLICATION_DIAGNOSTIC_VARIANT: ${{ ((github.event_name == 'workflow_dispatch' && inputs.profile == 'publication-gc-counterfactual') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/publication-reftable-diagnostic-20261108')) && 'reftable' || 'original' }}
    steps:
      - name: Checkout diagnostic source and original source identity
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up original Temurin 21.0.13+9
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven

      - name: Require exactly the declared library and workload changes
        shell: bash
        run: |
          mkdir -p target/publication-gc-diagnostic
          python3 .github/scripts/verify-publication-diagnostic-source.py \
            --variant "$PUBLICATION_DIAGNOSTIC_VARIANT" \
            --output target/publication-gc-diagnostic/unchanged-source-blobs.txt

      - name: Build declared library and test diagnostic sequence
        run: |
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks -am install \
            -Dtest=PublicationDiagnosticSequenceTest,PublicationPairingTest \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Verify configured reftable output against real JGit
        if: env.PUBLICATION_DIAGNOSTIC_VARIANT == 'reftable'
        run: |
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-core test -Dtest=ReftableOutputAlignmentTest

      - name: Run exactly four GC and JNI diagnostic forks
        run: |
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=PackPublicationGcDiagnosticIT \
            -Djgit.storage.benchmark.publication.diagnostic.variant="$PUBLICATION_DIAGNOSTIC_VARIANT" \
            -Djgit.storage.benchmark.source="$(git rev-parse HEAD)" \
            -Djgit.storage.benchmark.sourceTree="$(git rev-parse HEAD^{tree})" \
            -Dbenchmark.resultDirectory="$GITHUB_WORKSPACE/target/publication-gc-diagnostic"

      - name: Retain diagnostic observations without acceptance inference
        if: always()
        run: |
          python3 .github/scripts/summarize-publication-gc-diagnostic.py target/publication-gc-diagnostic
          echo '### Fixed publication allocation diagnostic' >> "$GITHUB_STEP_SUMMARY"
          echo 'All four predetermined child outcomes are retained. This is not a resumed non-regression study.' >> "$GITHUB_STEP_SUMMARY"
          cat target/publication-gc-diagnostic/summary.json >> "$GITHUB_STEP_SUMMARY"

      - name: Scan every retained diagnostic file for connection details
        id: diagnostic-privacy
        if: always()
        run: |
          python3 .github/scripts/validate_search_database_telemetry.py --privacy-only \
            target/publication-gc-diagnostic

      - name: Upload complete or partial diagnostic with all log segments
        if: always() && steps.diagnostic-privacy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-gc-diagnostic-${{ env.PUBLICATION_DIAGNOSTIC_VARIANT }}-jdk21
          path: target/publication-gc-diagnostic/**
          if-no-files-found: error

  publication-reftable-comparison:
    name: Reftable alignment comparison / four fixed pairs
    needs: contract
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.profile == 'publication-reftable-comparison') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/publication-reftable-paired-20261108' && !github.event.deleted)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout immutable comparison harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up original Temurin 21.0.13+9
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
          cache: maven

      - name: Require the declared original dependencies and workload
        run: |
          python3 .github/scripts/prepare-publication-reftable-comparison.py \
            --harness-source "$GITHUB_WORKSPACE" --verify-harness-only

      - name: Build both immutable historical core implementations
        shell: bash
        env:
          REFTABLE_BASELINE_SOURCE: ${{ runner.temp }}/reftable-baseline-source
          REFTABLE_CANDIDATE_SOURCE: ${{ runner.temp }}/reftable-candidate-source
        run: |
          git fetch --no-tags origin \
            96f1b08d5d0ca32f98508828c78074f12da688fc \
            fcd8eb6ba5fa009f50c20f927fe6e932aca6510b
          git worktree add --detach "$REFTABLE_BASELINE_SOURCE" 96f1b08d5d0ca32f98508828c78074f12da688fc
          git worktree add --detach "$REFTABLE_CANDIDATE_SOURCE" fcd8eb6ba5fa009f50c20f927fe6e932aca6510b
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -f "$REFTABLE_BASELINE_SOURCE/pom.xml" -pl jgit-storage-hibernate-core -am package -DskipTests
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -f "$REFTABLE_CANDIDATE_SOURCE/pom.xml" -pl jgit-storage-hibernate-core -am package -DskipTests

      - name: Audit source and every compiled core entry before measurement
        env:
          REFTABLE_BASELINE_SOURCE: ${{ runner.temp }}/reftable-baseline-source
          REFTABLE_CANDIDATE_SOURCE: ${{ runner.temp }}/reftable-candidate-source
        run: |
          python3 .github/scripts/prepare-publication-reftable-comparison.py \
            --baseline-source "$REFTABLE_BASELINE_SOURCE" \
            --candidate-source "$REFTABLE_CANDIDATE_SOURCE" \
            --harness-source "$GITHUB_WORKSPACE" \
            --output target/publication-reftable-comparison

      - name: Build harness and verify classpath identity and finite sequence
        run: |
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks -am install \
            -Dtest=PublicationDiagnosticSequenceTest,PublicationPairingTest,PublicationVariantClasspathTest,PublicationCoreIdentityProfilerTest \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Run exactly four implementation pairs on one host
        run: |
          mvn -B -Dmaven.wagon.http.retryHandler.count=5 \
            -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=PackPublicationReftableComparisonIT \
            -Djgit.storage.benchmark.source="$(git rev-parse HEAD)" \
            -Djgit.storage.benchmark.sourceTree="$(git rev-parse HEAD^{tree})" \
            -Dbenchmark.resultDirectory="$GITHUB_WORKSPACE/target/publication-reftable-comparison"

      - name: Validate all child identities and retain the fixed paired result
        run: |
          python3 .github/scripts/summarize-publication-reftable-comparison.py target/publication-reftable-comparison
          echo '### Controlled reftable implementation comparison' >> "$GITHUB_STEP_SUMMARY"
          echo 'Exactly four fixed pairs; failures or inconclusive results are retained. This does not qualify a publication policy or promote production tuning.' >> "$GITHUB_STEP_SUMMARY"

      - name: Scan retained comparison data for connection details
        id: reftable-comparison-privacy
        if: always()
        run: |
          python3 .github/scripts/validate_search_database_telemetry.py --privacy-only \
            target/publication-reftable-comparison

      - name: Upload complete or partial comparison and both exact core JARs
        if: always() && steps.reftable-comparison-privacy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: publication-reftable-controlled-four-pairs
          path: target/publication-reftable-comparison/**
          if-no-files-found: error
