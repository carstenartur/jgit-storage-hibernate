name: Performance Investigations

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
  schedule:
    - cron: '23 5 * * 3'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/performance-investigations.yml'
      - '.github/scripts/convert-jmh-repository-aging.py'
      - '.github/scripts/test_convert_jmh_repository_aging.py'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-benchmarks/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/performance-investigations.yml'
      - '.github/scripts/convert-jmh-repository-aging.py'
      - '.github/scripts/test_convert_jmh_repository_aging.py'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-benchmarks/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  investigate:
    name: ${{ matrix.investigation }} (${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        investigation:
          - write-queue
          - read-ahead
          - repository-aging
          - concurrent-large-pack

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate repository-aging evidence converter
        if: matrix.investigation == 'repository-aging'
        run: |
          python3 -m py_compile .github/scripts/convert-jmh-repository-aging.py .github/scripts/test_convert_jmh_repository_aging.py
          python3 .github/scripts/test_convert_jmh_repository_aging.py

      - name: Build benchmark module with Maven
        shell: bash
        run: |
          mkdir -p "target/investigations/${{ matrix.investigation }}"
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee "target/investigations/${{ matrix.investigation }}/maven-build.log"

      - name: Run selected investigation through Maven
        shell: bash
        run: |
          set -o pipefail
          profile="${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }}"
          telemetry_args=()
          if [ "${{ matrix.investigation }}" = 'write-queue' ]; then
            telemetry_args+=(
              '-Djgit.storage.benchmark.database-telemetry.enabled=true'
            )
          fi
          mvn -B -pl jgit-storage-hibernate-benchmarks verify \
            -Pperformance-investigations \
            -Dtest=DatabaseTelemetrySnapshotTest,DurableStripedWriteQueueTest \
            -Djgit.storage.benchmark.investigation="${{ matrix.investigation }}" \
            -Djgit.storage.benchmark.investigation.profile="$profile" \
            "${telemetry_args[@]}" \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/investigations/${{ matrix.investigation }}/jmh-result.json" 2>&1 \
            | tee "target/investigations/${{ matrix.investigation }}/maven-benchmark.log"

      - name: Validate write-queue native telemetry
        if: matrix.investigation == 'write-queue'
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import datetime
          import json
          from pathlib import Path

          root = Path('target/investigations/write-queue')
          telemetry_path = root / 'write-queue-database-telemetry.json'
          jmh_path = root / 'jmh-result.json'
          telemetry_text = telemetry_path.read_text(encoding='utf-8')
          if 'NaN' in telemetry_text or 'Infinity' in telemetry_text:
              raise SystemExit('Write-queue telemetry is not strict JSON')
          observations = json.loads(telemetry_text)['observations']
          jmh = json.loads(jmh_path.read_text(encoding='utf-8'))
          profile = '${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }}'
          iterations = 3 if profile == 'full' else 1
          expected = 96 if profile == 'full' else 16
          if len(observations) != expected:
              raise SystemExit(
                  f'Expected {expected} write-queue observations, found {len(observations)}'
              )

          def jmh_coordinate(item):
              method = item['benchmark'].rsplit('.', 1)[-1]
              params = item['params']
              scope = (
                  'shared'
                  if method == 'publishToSameRepository'
                  else 'isolated'
              )
              stripes = {
                  'direct': '0',
                  'queue-1': '1',
                  'queue-4': '4',
                  'queue-8': '8',
              }[params['executionMode']]
              return (
                  method,
                  params['backend'],
                  params['executionMode'],
                  params['payloadKiB'],
                  str(item['threads']),
                  scope,
                  stripes,
                  '2',
              )

          def telemetry_coordinate(item):
              coordinate = item['coordinate']
              return (
                  coordinate['benchmarkMethod'],
                  coordinate['backend'],
                  coordinate['executionMode'],
                  coordinate['payloadKiB'],
                  coordinate['threads'],
                  coordinate['repositoryScope'],
                  coordinate['stripes'],
                  coordinate['poolSize'],
              )

          jmh_coordinates = {jmh_coordinate(item) for item in jmh}
          telemetry_counts = collections.Counter(
              telemetry_coordinate(item) for item in observations
          )
          if set(telemetry_counts) != jmh_coordinates:
              raise SystemExit(
                  'JMH and native telemetry coordinate sets differ: '
                  f'{jmh_coordinates ^ set(telemetry_counts)}'
              )
          if any(count != iterations for count in telemetry_counts.values()):
              raise SystemExit(
                  f'Unexpected per-coordinate iteration counts: {telemetry_counts}'
              )

          iteration_numbers = collections.defaultdict(set)
          for item in observations:
              coordinate = item['coordinate']
              if item['backend'] != 'postgresql':
                  raise SystemExit(f'Unexpected telemetry backend: {item["backend"]}')
              if coordinate['databaseBackend'] != 'postgresql':
                  raise SystemExit(f'Unexpected database coordinate: {coordinate}')
              base = telemetry_coordinate(item)
              iteration_numbers[base].add(int(coordinate['measurementIteration']))
              for field in ('coordinate', 'counters', 'gauges', 'metadata', 'unsupported'):
                  keys = list(item[field])
                  if keys != sorted(keys):
                      raise SystemExit(
                          f'{field} keys are not deterministic for {coordinate}: {keys}'
                      )
              wal = item['counters'].get('postgresql.wal.insert_lsn_bytes')
              if wal is None or wal <= 0:
                  raise SystemExit(
                      f'Expected positive immediate WAL delta for {coordinate}: {wal}'
                  )
              start = datetime.datetime.fromisoformat(
                  item['startedAt'].replace('Z', '+00:00')
              )
              end = datetime.datetime.fromisoformat(
                  item['completedAt'].replace('Z', '+00:00')
              )
              if end < start:
                  raise SystemExit(f'Negative telemetry window for {coordinate}')
          expected_iterations = set(range(1, iterations + 1))
          if any(values != expected_iterations for values in iteration_numbers.values()):
              raise SystemExit(
                  f'Measurement iteration numbering is incomplete: {iteration_numbers}'
              )

          forbidden = (
              'jgit.storage.benchmark.postgresql.url=',
              'jgit.storage.benchmark.postgresql.user=',
              'jgit.storage.benchmark.postgresql.password=',
              'jdbc:postgresql://',
              'Database JDBC URL',
              'Default catalog/schema',
          )
          scan_roots = [
              root,
              Path('jgit-storage-hibernate-benchmarks/target/failsafe-reports'),
          ]
          for scan_root in scan_roots:
              if not scan_root.exists():
                  continue
              for path in scan_root.rglob('*'):
                  if not path.is_file():
                      continue
                  content = path.read_bytes().decode('utf-8', errors='replace')
                  for token in forbidden:
                      if token in content:
                          raise SystemExit(f'Sensitive token {token!r} found in {path}')
          leftovers = list(
              Path('/tmp').glob('jgit-storage-benchmark-connection-*.properties')
          )
          if leftovers:
              raise SystemExit(f'Temporary credential files remain: {leftovers}')
          print(
              f'Validated {len(observations)} native write-queue iteration observations '
              f'across {len(jmh_coordinates)} exact JMH coordinates'
          )
          PY

      - name: Derive repository-aging policy evidence
        if: matrix.investigation == 'repository-aging'
        shell: bash
        run: |
          python3 .github/scripts/convert-jmh-repository-aging.py \
            "target/investigations/repository-aging/jmh-result.json" \
            "target/investigations/repository-aging/evidence"
          cat target/investigations/repository-aging/evidence/repository-aging-policy-evidence.md \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw investigation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-investigation-${{ matrix.investigation }}-${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }}
          path: |
            target/investigations/${{ matrix.investigation }}/**
            jgit-storage-hibernate-benchmarks/target/failsafe-reports/**
          if-no-files-found: error

      - name: Report retained evidence
        if: always()
        run: |
          echo '### Performance investigation' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Investigation: `${{ matrix.investigation }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Profile: `${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Raw JMH JSON, console output, Maven logs and Failsafe reports are retained as one artifact.' >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ matrix.investigation }}" = 'write-queue' ]; then
            echo '- This existing experiment measures striped scheduling and backpressure. Native PostgreSQL WAL/I/O/wait telemetry is retained per measurement iteration because concurrent invocations overlap and cannot be attributed safely one by one.' >> "$GITHUB_STEP_SUMMARY"
            echo '- Atomic receiver record batching is implemented separately by the production `DurableStripedWriteQueue` and its Hibernate adapter.' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "${{ matrix.investigation }}" = 'repository-aging' ]; then
            echo '- Generated comparison and policy-evidence JSON retain measured break-even reads; no automatic maintenance trigger is changed by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          fi

  stateless-threshold:
    name: Stateful/stateless threshold at 16/128/512 MiB
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build benchmark module with Maven
        shell: bash
        run: |
          mkdir -p target/stateless-threshold
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee target/stateless-threshold/maven-build.log

      - name: Compare stateful and stateless at production batch size
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks verify \
            -Pstateless-writer-threshold \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/stateless-threshold/jmh-result.json" 2>&1 \
            | tee target/stateless-threshold/maven-benchmark.log

      - name: Upload stateless threshold evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stateless-writer-threshold-results
          path: |
            target/stateless-threshold/**
            jgit-storage-hibernate-benchmarks/target/failsafe-reports/**
          if-no-files-found: error

      - name: Report stateless threshold matrix
        if: always()
        run: |
          echo '### Stateful/stateless large-pack threshold' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'PostgreSQL + HikariCP publishes deterministic 16, 128 and 512 MiB payloads with the production 16-chunk batch window.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Raw JMH JSON includes elapsed time, allocation, GC, JDBC execution, flush and byte-integrity counters.' >> "$GITHUB_STEP_SUMMARY"
