name: Apply Public Maven Repository Refactor

on:
  push:
    branches:
      - fix/issue-62-maven-central
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: (github.head_ref == 'fix/issue-62-maven-central' || github.ref_name == 'fix/issue-62-maven-central') && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/issue-62-maven-central
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Apply refactor patch
        run: |
          set -euo pipefail
          cat .github/public-repo-patch/part-* | base64 --decode | gzip --decompress > /tmp/public-repository.patch
          test "$(sha256sum /tmp/public-repository.patch | cut -d' ' -f1)" = "03f9cd6c5b3d0d425e39a62801fdb4eb4f0da5d0fa3d3f29dde29ca07501f3e6"
          git apply --index /tmp/public-repository.patch
          rm -rf .github/public-repo-patch
      - name: Compile repository preparation script
        run: python3 -m py_compile .github/scripts/prepare-public-repository.py
      - name: Compile publishing contract script
        run: python3 -m py_compile .github/scripts/verify-public-repository-publishing.py
      - name: Parse release script
        run: bash -n .github/scripts/release.sh
      - name: Parse anonymous consumer script
        run: bash -n .github/scripts/verify-public-repository-consumption.sh
      - name: Verify public repository contract
        run: python3 .github/scripts/verify-public-repository-publishing.py
      - name: Verify release consistency
        run: python3 .github/scripts/verify-release-consistency.py
      - name: Parse Maven POMs
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          for path in Path('.').rglob('pom.xml'):
              if 'target' not in path.parts:
                  ET.parse(path)
          print('All Maven POMs parsed successfully')
          PY
      - name: Verify patch whitespace
        run: git diff --check
      - name: Restore workflows for connector-managed update
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/maven.yml .github/workflows/release.yml .github/workflows/publish-snapshot.yml .github/workflows/temp-public-repo-source-export.yml .github/workflows/temp-apply-public-repository-refactor.yml
      - name: Commit and push verified non-workflow changes
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: publish releases through anonymous Maven repository'
          git push origin HEAD:fix/issue-62-maven-central
