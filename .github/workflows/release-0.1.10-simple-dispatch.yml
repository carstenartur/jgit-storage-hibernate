name: Run release 0.1.10

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-0.1.10-simple-dispatch.yml'

permissions:
  actions: write
  contents: read

concurrency:
  group: release-run-0.1.10
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event.head_commit.message == 'Run release 0.1.10'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Dispatch and watch canonical release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          before=$(mktemp)
          gh api "repos/${REPOSITORY}/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=100" \
            --jq '.workflow_runs[].id' > "$before"

          gh workflow run release.yml \
            --repo "$REPOSITORY" \
            --ref main \
            -f release_version=0.1.10 \
            -f next_development_version=0.1.11-SNAPSHOT \
            -f skip_tests=false \
            -f dry_run=false

          run_id=''
          for attempt in $(seq 1 60); do
            while IFS= read -r candidate; do
              if ! grep -qx "$candidate" "$before"; then
                run_id="$candidate"
                break
              fi
            done < <(
              gh api "repos/${REPOSITORY}/actions/workflows/release.yml/runs?event=workflow_dispatch&per_page=100" \
                --jq '.workflow_runs | sort_by(.created_at) | reverse | .[].id'
            )
            [[ -n "$run_id" ]] && break
            sleep 2
          done
          rm -f "$before"

          [[ -n "$run_id" ]] || { echo '::error::Could not identify release workflow run'; exit 1; }
          echo "Release workflow run: $run_id"
          gh run watch "$run_id" --repo "$REPOSITORY" --exit-status
