name: Apply issue 187 telemetry hardening

on:
  push:
    branches:
      - feat/187-database-native-telemetry

permissions:
  contents: write

concurrency:
  group: apply-issue187-telemetry-hardening
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout telemetry branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/187-database-native-telemetry
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker
        run: docker info

      - name: Apply deterministic short-window hardening
        run: python3 .github/scripts/apply-issue187-telemetry-hardening.py

      - name: Build benchmark dependencies
        run: mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests

      - name: Run unit and profile-contract tests
        run: |
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=DatabaseTelemetrySnapshotTest,PackStorageLayoutBenchmarkTest

      - name: Run PostgreSQL native telemetry integration
        run: |
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=DatabaseNativeTelemetryIntegrationTest \
            -Djgit.storage.benchmark.database-telemetry.integration.enabled=true \
            -Djgit.storage.benchmark.database-telemetry.integration.backend=postgresql

      - name: Run SQL Server native telemetry integration
        run: |
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=DatabaseNativeTelemetryIntegrationTest \
            -Djgit.storage.benchmark.database-telemetry.integration.enabled=true \
            -Djgit.storage.benchmark.database-telemetry.integration.backend=sqlserver

      - name: Run exact PostgreSQL pack-layout telemetry smoke
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/issue187-hardened-pack-layout
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=PackStorageLayoutBenchmarkTest \
            -Djgit.storage.benchmark.pack-layout.enabled=true \
            -Djgit.storage.benchmark.pack-layout.backend=postgresql \
            -Djgit.storage.benchmark.pack-layout.profile=smoke \
            -Djgit.storage.benchmark.database-telemetry.enabled=true \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/issue187-hardened-pack-layout/jmh-result.json"

      - name: Verify immediate WAL, stable JSON and window boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime
          import json
          from pathlib import Path

          root = Path('target/issue187-hardened-pack-layout')
          telemetry_path = root / 'pack-storage-layout-database-telemetry.json'
          jmh_path = root / 'jmh-result.json'
          text = telemetry_path.read_text(encoding='utf-8')
          if 'NaN' in text or 'Infinity' in text:
              raise SystemExit('Telemetry output is not strict JSON')
          for forbidden in ('jdbc:', 'localhost', 'jgit_storage', 'telemetry-password'):
              if forbidden in text:
                  raise SystemExit(f'Telemetry leaked forbidden token {forbidden!r}')

          value = json.loads(text)
          observations = value['observations']
          if len(observations) != 32:
              raise SystemExit(f'Expected 32 smoke observations, found {len(observations)}')
          writes = [item for item in observations if item['coordinate']['operation'] == 'write']
          if len(writes) != 8:
              raise SystemExit(f'Expected 8 write observations, found {len(writes)}')
          for item in observations:
              for field in ('coordinate', 'counters', 'gauges', 'metadata', 'unsupported'):
                  keys = list(item[field])
                  if keys != sorted(keys):
                      raise SystemExit(
                          f'{field} keys are not deterministic for {item["coordinate"]}: {keys}'
                      )
              if 'postgresql.wal.insert_lsn_bytes' not in item['counters']:
                  raise SystemExit(f'Missing immediate WAL counter: {item["coordinate"]}')
              start = datetime.datetime.fromisoformat(item['startedAt'].replace('Z', '+00:00'))
              end = datetime.datetime.fromisoformat(item['completedAt'].replace('Z', '+00:00'))
              if end < start:
                  raise SystemExit(f'Negative telemetry window: {item["coordinate"]}')
          for item in writes:
              delta = item['counters']['postgresql.wal.insert_lsn_bytes']
              if delta <= 0:
                  raise SystemExit(
                      f'Write produced no immediate WAL delta for {item["coordinate"]}: {delta}'
                  )

          jmh = json.loads(jmh_path.read_text(encoding='utf-8'))
          if len(jmh) != len(observations):
              raise SystemExit(
                  f'JMH/telemetry cardinality mismatch: {len(jmh)} != {len(observations)}'
              )
          print(
              f'Validated {len(observations)} sorted observations; '
              f'all {len(writes)} writes have positive immediate WAL deltas'
          )
          PY

      - name: Verify source contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'captureCompletedAt' \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/DatabaseTelemetrySnapshot.java
          grep -F 'postgresql.wal.insert_lsn_bytes' \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/DatabaseTelemetryCollectors.java
          grep -F 'Collections.unmodifiableMap' \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/DatabaseTelemetrySnapshot.java
          grep -F 'cumulative statistics whose publication can lag' \
            docs/operations/database-native-telemetry.md

      - name: Remove one-shot hardening tooling
        run: |
          rm .github/scripts/apply-issue187-telemetry-hardening.py
          rm .github/workflows/apply-issue187-telemetry-hardening.yml

      - name: Commit validated hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/DatabaseTelemetryCollectors.java \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/DatabaseTelemetrySnapshot.java \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/DatabaseNativeTelemetryIntegrationTest.java \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/DatabaseTelemetrySnapshotTest.java \
            docs/operations/database-native-telemetry.md \
            .github/scripts/apply-issue187-telemetry-hardening.py \
            .github/workflows/apply-issue187-telemetry-hardening.yml
          if git diff --cached --quiet; then
            echo 'Expected issue #187 hardening produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Harden native telemetry window evidence'
          git push origin HEAD:feat/187-database-native-telemetry

      - name: Upload hardened telemetry evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue187-hardened-postgresql-telemetry
          path: |
            target/issue187-hardened-pack-layout/**
            jgit-storage-hibernate-benchmarks/target/surefire-reports/**
          if-no-files-found: warn
