name: Release

on:
  workflow_dispatch:
    inputs:
      next_development_version:
        description: 'Optional exact next version (X.Y.Z-SNAPSHOT); leave empty to use the increment choice'
        required: false
        type: string
        default: ''
      next_version_increment:
        description: 'Select the conventional next version when no exact version is supplied'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: 'Skip tests during a dry run; real releases reject this option'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Stage and verify the static Maven repository without publishing or tagging'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'release-request/**'
    paths:
      - '.github/release-request'

permissions:
  contents: write

concurrency:
  group: jgit-storage-hibernate-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Resolve repository-owned release plan
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_EXACT_NEXT: ${{ inputs.next_development_version }}
          INPUT_INCREMENT: ${{ inputs.next_version_increment }}
          INPUT_SKIP: ${{ inputs.skip_tests }}
          INPUT_DRY: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          release_pattern = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+$")
          snapshot_pattern = re.compile(r"^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT$")

          def root_version() -> str:
              root = ET.parse("pom.xml").getroot()
              value = root.findtext("{http://maven.apache.org/POM/4.0.0}version")
              if not value:
                  raise SystemExit("::error::Root pom.xml has no project version")
              return value.strip()

          def bump(release: str, increment: str) -> str:
              major, minor, patch = map(int, release.split("."))
              if increment == "patch":
                  patch += 1
              elif increment == "minor":
                  minor += 1
                  patch = 0
              elif increment == "major":
                  major += 1
                  minor = 0
                  patch = 0
              else:
                  raise SystemExit(
                      f"::error::Unsupported next_version_increment {increment!r}"
                  )
              return f"{major}.{minor}.{patch}-SNAPSHOT"

          event = os.environ["EVENT_NAME"]
          request_branch = ""
          if event == "workflow_dispatch":
              current = root_version()
              if not snapshot_pattern.fullmatch(current):
                  raise SystemExit(
                      f"::error::Current Maven version must use X.Y.Z-SNAPSHOT, found {current!r}"
                  )
              release = current.removesuffix("-SNAPSHOT")
              exact_next = os.environ.get("INPUT_EXACT_NEXT", "").strip()
              next_version = exact_next or bump(
                  release, os.environ.get("INPUT_INCREMENT", "patch") or "patch"
              )
              skip_tests = os.environ.get("INPUT_SKIP") or "false"
              dry_run = os.environ.get("INPUT_DRY") or "false"
          elif event == "push":
              request_branch = os.environ["REF_NAME"]
              if not request_branch.startswith("release-request/"):
                  raise SystemExit(
                      f"::error::Unexpected release request branch {request_branch!r}"
                  )
              branch_release = request_branch.removeprefix("release-request/")
              subprocess.run(
                  ["git", "fetch", "origin", request_branch], check=True
              )
              marker = subprocess.check_output(
                  [
                      "git",
                      "show",
                      f"origin/{request_branch}:.github/release-request",
                  ],
                  text=True,
              ).strip()
              try:
                  request = json.loads(marker)
              except json.JSONDecodeError:
                  request = {"release_version": marker}
              if not isinstance(request, dict):
                  raise SystemExit(
                      "::error::.github/release-request must be a version string or JSON object"
                  )
              release = str(request.get("release_version", "")).strip()
              if release != branch_release:
                  raise SystemExit(
                      f"::error::Release marker {release!r} does not match branch version {branch_release!r}"
                  )
              requested_next = request.get("next_development_version")
              if requested_next is None:
                  next_version = bump(release, "patch")
              elif not isinstance(requested_next, str):
                  raise SystemExit(
                      "::error::next_development_version in the release request must be a string"
                  )
              else:
                  next_version = requested_next.strip()
              skip_tests = "false"
              dry_run = "false"
          else:
              raise SystemExit(f"::error::Unsupported release event {event!r}")

          if not release_pattern.fullmatch(release):
              raise SystemExit(
                  f"::error::Resolved release version {release!r} must use X.Y.Z"
              )
          if not snapshot_pattern.fullmatch(next_version):
              raise SystemExit(
                  f"::error::Resolved next development version {next_version!r} must use X.Y.Z-SNAPSHOT"
              )
          if skip_tests not in {"true", "false"} or dry_run not in {"true", "false"}:
              raise SystemExit("::error::Boolean release inputs must be true or false")

          release_tuple = tuple(map(int, release.split(".")))
          next_tuple = tuple(
              map(int, next_version.removesuffix("-SNAPSHOT").split("."))
          )
          if next_tuple <= release_tuple:
              raise SystemExit(
                  f"::error::Next development version {next_version} must be newer than release {release}"
              )

          output = Path(os.environ["GITHUB_OUTPUT"])
          with output.open("a", encoding="utf-8") as handle:
              print(f"release_version={release}", file=handle)
              print(f"next_version={next_version}", file=handle)
              print(f"skip_tests={skip_tests}", file=handle)
              print(f"dry_run={dry_run}", file=handle)
              print(f"request_branch={request_branch}", file=handle)
          PY

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify security policy
        run: python3 .github/scripts/verify-security-policy.py

      - name: Run release state machine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.request.outputs.release_version }}
          NEXT_VERSION_INPUT: ${{ steps.request.outputs.next_version }}
          SKIP_TESTS: ${{ steps.request.outputs.skip_tests }}
          DRY_RUN: ${{ steps.request.outputs.dry_run }}
          SOURCE_BRANCH: main
          REQUEST_BRANCH: ${{ steps.request.outputs.request_branch }}
          PUBLIC_REPOSITORY_URL: https://raw.githubusercontent.com/carstenartur/jgit-storage-hibernate/maven-repository/
        run: |
          chmod +x .github/scripts/release.sh .github/scripts/verify-public-repository-consumption.sh
          python3 .github/scripts/verify-public-repository-publishing.py
          .github/scripts/release.sh
