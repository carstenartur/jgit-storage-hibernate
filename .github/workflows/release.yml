name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version without leading v in X.Y.Z format. Must match the current SNAPSHOT base.'
        required: true
        type: string
      next_development_version:
        description: 'Next development version in X.Y.Z-SNAPSHOT format. Leave empty to increment patch.'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip tests during a dry run; real releases reject this option'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Stage and verify the static Maven repository without publishing or tagging'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - 'release-request/**'

permissions:
  contents: write

concurrency:
  group: jgit-storage-hibernate-release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Resolve workflow inputs or guarded release request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE: ${{ inputs.release_version }}
          INPUT_NEXT: ${{ inputs.next_development_version }}
          INPUT_SKIP: ${{ inputs.skip_tests }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            version="$INPUT_RELEASE"; next="$INPUT_NEXT"; skip="$INPUT_SKIP"; dry="$INPUT_DRY"; request=''
          else
            version=${REF_NAME#release-request/}; request="$REF_NAME"; next=''; skip=false; dry=false
            git fetch origin "$REF_NAME"
            marker=$(git show "origin/$REF_NAME:.github/release-request" | tr -d '[:space:]')
            [[ "$marker" == "$version" ]] || { echo "::error::Release marker $marker does not match branch version $version"; exit 1; }
          fi
          echo "release_version=$version" >> "$GITHUB_OUTPUT"
          echo "next_version=$next" >> "$GITHUB_OUTPUT"
          echo "skip_tests=$skip" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "request_branch=$request" >> "$GITHUB_OUTPUT"
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run release state machine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.request.outputs.release_version }}
          NEXT_VERSION_INPUT: ${{ steps.request.outputs.next_version }}
          SKIP_TESTS: ${{ steps.request.outputs.skip_tests }}
          DRY_RUN: ${{ steps.request.outputs.dry_run }}
          SOURCE_BRANCH: main
          REQUEST_BRANCH: ${{ steps.request.outputs.request_branch }}
          PUBLIC_REPOSITORY_URL: https://raw.githubusercontent.com/carstenartur/jgit-storage-hibernate/maven-repository/
        run: |
          chmod +x .github/scripts/release.sh .github/scripts/verify-public-repository-consumption.sh
          python3 .github/scripts/verify-public-repository-publishing.py
          .github/scripts/release.sh
