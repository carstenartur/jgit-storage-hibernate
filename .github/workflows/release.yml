name: Release

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release version without leading v in X.Y.Z format. Must match the current SNAPSHOT base.'
        required: true
        type: string
      next_development_version:
        description: 'Next development version in X.Y.Z-SNAPSHOT format. Leave empty to increment patch.'
        required: false
        type: string
        default: ''
      skip_tests:
        description: 'Skip tests during a dry run; real releases reject this option'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Validate, sign and inspect a Central bundle without uploading, tagging or pushing'
        required: false
        type: boolean
        default: false
      publish_github_packages:
        description: 'Publish an optional secondary copy to GitHub Packages after Central succeeds'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish and prepare next development version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
      MAVEN_GPG_KEY: ${{ secrets.MAVEN_CENTRAL_GPG_PRIVATE_KEY }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_CENTRAL_GPG_PASSPHRASE }}
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up JDK 21 and Maven Central credentials
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD

      - name: Run release script
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          NEXT_VERSION_INPUT: ${{ inputs.next_development_version }}
          SKIP_TESTS: ${{ inputs.skip_tests }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_GITHUB_PACKAGES: ${{ inputs.publish_github_packages }}
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: |
          chmod +x \
            .github/scripts/release.sh \
            .github/scripts/verify-central-consumption.sh \
            .github/scripts/update-release-metadata.py \
            .github/scripts/verify-central-bundle.py \
            .github/scripts/verify-central-publishing.py \
            .github/scripts/verify-release-consistency.py
          python3 .github/scripts/verify-central-publishing.py
          .github/scripts/release.sh
