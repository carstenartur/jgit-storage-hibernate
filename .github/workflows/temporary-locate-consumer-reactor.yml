name: Temporary locate consumer reactor

on:
  push:
    branches:
      - ci/consumer-contracts

permissions:
  contents: write

concurrency:
  group: temporary-locate-consumer-reactor
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/consumer-contracts
          fetch-depth: 0

      - name: Follow the consolidated workflow
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            git fetch origin ci/consumer-contracts
            git reset --hard origin/ci/consumer-contracts
            if grep -Fq 'Classify baseline and candidate outcomes' \
                .github/workflows/consumer-compatibility.yml 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'The consolidated consumer workflow did not appear.' >&2
              exit 1
            fi
            sleep 5
          done

      - name: Patch artifact-root discovery
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/consumer-compatibility.yml')
          text = path.read_text(encoding='utf-8')
          download = '''      - name: Restore current reactor artifacts
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: current-consumer-reactor
          path: ${{ runner.temp }}/consumer-current-m2

'''
          locate = download + '''      - name: Locate the restored Maven repository root
        shell: bash
        run: |
          set -euo pipefail
          group_dir="$(find "${RUNNER_TEMP}/consumer-current-m2" -type d \
            -path '*/io/github/carstenartur' -print -quit)"
          test -n "$group_dir"
          repository_root="${group_dir%/io/github/carstenartur}"
          test -d "$repository_root/io/github/carstenartur"
          echo "CONSUMER_CURRENT_M2=$repository_root" >> "$GITHUB_ENV"
          find "$repository_root/io/github/carstenartur" -type f | sort

'''
          if 'name: Locate the restored Maven repository root' not in text:
              if download not in text:
                  raise SystemExit('Could not locate the artifact download step')
              text = text.replace(download, locate, 1)
          text = text.replace(
              '${RUNNER_TEMP}/consumer-current-m2/io/github/carstenartur',
              '${CONSUMER_CURRENT_M2}/io/github/carstenartur',
          )
          text = text.replace(
              '-Dmaven.repo.local="${RUNNER_TEMP}/consumer-current-m2"',
              '-Dmaven.repo.local="${CONSUMER_CURRENT_M2}"',
          )
          text = text.replace(
              'MAVEN_REPO_LOCAL: ${{ runner.temp }}/consumer-current-m2',
              'MAVEN_REPO_LOCAL: ${{ env.CONSUMER_CURRENT_M2 }}',
          )
          path.write_text(text, encoding='utf-8')

          for temporary in Path('.github/workflows').glob('temporary-*.yml'):
              temporary.unlink()
          PY

      - name: Verify and commit robust artifact discovery
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'CONSUMER_CURRENT_M2' .github/workflows/consumer-compatibility.yml
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/consumer-compatibility.yml')"
          python3 .github/scripts/test_prepare_consumer_contract.py
          python3 .github/scripts/test_verify_consumer_dependency_tree.py
          git diff --check
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Locate downloaded consumer reactor artifacts robustly'
          git push origin HEAD:ci/consumer-contracts
