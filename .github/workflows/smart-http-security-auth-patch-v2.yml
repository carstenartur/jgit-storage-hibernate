name: Smart HTTP Security authentication patch v2

on:
  push:
    branches:
      - feature/security-smart-http-authentication
    paths:
      - '.github/workflows/smart-http-security-auth-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    name: Patch and verify Smart HTTP authentication
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Normalize generated patch source
        run: python3 .github/scripts/normalize_smart_http_security_auth_patch.py

      - name: Apply authentication implementation
        run: python3 .github/scripts/smart_http_security_auth_patch.py

      - name: Verify module-boundary contracts
        run: |
          python3 .github/scripts/test_verify_module_boundaries.py
          python3 .github/scripts/verify-module-boundaries.py \
            --json target/module-boundaries/module-graph.json \
            --markdown target/module-boundaries/module-graph.md

      - name: Verify Smart HTTP and upstream modules
        run: >-
          mvn -B -ntp
          -pl jgit-storage-hibernate-smart-http
          -am
          verify

      - name: Commit implementation and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/smart-http-security-auth-patch.yml
          git rm .github/workflows/smart-http-security-auth-patch-v2.yml
          git rm .github/scripts/smart_http_security_auth_patch.py
          git rm .github/scripts/normalize_smart_http_security_auth_patch.py
          git commit -m "Add strict Smart HTTP Basic and Bearer authentication"
          git push origin HEAD:feature/security-smart-http-authentication

# Retry after making the generated patch replay-safe against the current adapter branch.
