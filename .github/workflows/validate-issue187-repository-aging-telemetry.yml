name: Finalize PR 295 validated workflow

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-pr295-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      EVIDENCE_RUN_ID: '32552607133'
      EXPECTED_SHA256: e5100884b946ec2caafb45fbfc38be638fb84ca9eba520dfb6126365c8f7a9d5

    steps:
      - name: Checkout current PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Download and verify validated durable workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf target/pr295-final-workflow
          mkdir -p target/pr295-final-workflow
          gh run download "$EVIDENCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name issue187-generated-aging-workflow \
            --dir target/pr295-final-workflow
          test -s target/pr295-final-workflow/performance-investigations.yml
          actual="$(sha256sum target/pr295-final-workflow/performance-investigations.yml | cut -d' ' -f1)"
          test "$actual" = "$EXPECTED_SHA256"
          grep -F 'Run exact PostgreSQL repository-aging native telemetry smoke' \
            target/pr295-final-workflow/performance-investigations.yml
          grep -F 'Validate repository-aging native telemetry' \
            target/pr295-final-workflow/performance-investigations.yml

      - name: Install durable workflow and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          cp target/pr295-final-workflow/performance-investigations.yml \
            .github/workflows/performance-investigations.yml
          rm -f .github/workflows/publish-pr295-validated-workflow.yml
          rm -f .github/ci-triggers/pr295-publish-workflow.txt
          rm .github/workflows/validate-issue187-repository-aging-telemetry.yml
          git diff --check
          test "$(sha256sum .github/workflows/performance-investigations.yml | cut -d' ' -f1)" = "$EXPECTED_SHA256"

      - name: Commit final durable workflow state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/performance-investigations.yml \
            .github/workflows/publish-pr295-validated-workflow.yml \
            .github/workflows/validate-issue187-repository-aging-telemetry.yml \
            .github/ci-triggers/pr295-publish-workflow.txt
          if git diff --cached --quiet; then
            echo 'Expected final PR 295 workflow publication produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Retain repository-aging native telemetry workflow'
          git push origin "HEAD:${HEAD_REF}"
