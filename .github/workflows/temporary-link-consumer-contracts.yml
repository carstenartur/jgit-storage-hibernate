name: Temporary link consumer contracts

on:
  push:
    branches:
      - ci/consumer-contracts

permissions:
  contents: write

concurrency:
  group: temporary-link-consumer-contracts
  cancel-in-progress: true

jobs:
  link:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/consumer-contracts
          fetch-depth: 0

      - name: Follow the consolidated branch and add the public link
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            git fetch origin ci/consumer-contracts
            git reset --hard origin/ci/consumer-contracts
            if grep -Fq 'same consumer commit twice' docs/operations/consumer-compatibility.md 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'The consolidated consumer documentation did not appear.' >&2
              exit 1
            fi
            sleep 5
          done

          python3 - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          link = 'docs/operations/consumer-compatibility.md'
          if link not in text:
              section = '''

## Consumer compatibility

The library is continuously checked against three active consumers with deliberately different contracts:

- **audio-analyzer** — embeddable runtime, stable packaging and no accidental heavy optional dependencies;
- **Taxonomy** — PostgreSQL, transactional repositories, Flyway, Hibernate Search, rebuild and restart;
- **sandbox** — Java 21, Java Analysis APIs, Tycho/OSGi resolution and installable Eclipse packaging.

A library optimization is not considered release-ready merely because its microbenchmark improves. Relevant changes must also pass the exact-current-artifact consumer matrix, while the enforced module graph keeps Core, Search, Java Analysis and Architecture independently selectable.

See [consumer-specific compatibility contracts](docs/operations/consumer-compatibility.md) for the baseline/candidate classification, retained evidence and merge policy.
'''
              path.write_text(text.rstrip() + section + '\n', encoding='utf-8')

          for temporary in Path('.github/workflows').glob('temporary-*.yml'):
              temporary.unlink()
          PY

      - name: Verify and commit the public documentation link
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'docs/operations/consumer-compatibility.md' README.md
          python3 .github/scripts/test_prepare_consumer_contract.py
          python3 .github/scripts/test_verify_consumer_dependency_tree.py
          python3 .github/scripts/test_verify_module_boundaries.py
          git diff --check
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Document the three active consumer contracts'
          git push origin HEAD:ci/consumer-contracts
