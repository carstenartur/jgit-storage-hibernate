name: Apply issue 162 protocol metrics documentation

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-issue162-protocol-metrics-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/162-git-aware-reflog-batching
          fetch-depth: 0

      - name: Apply metrics documentation patch
        run: python3 .github/scripts/apply-issue162-protocol-metrics-doc.py

      - name: Verify documentation contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F '| `REFLOG_BATCH_WRITE` | repository-locked atomic JDBC batch' \
            docs/protocol-storage-metrics.md
          grep -F 'delivery-ID replay, queue batch-size and database-native WAL/log evidence' \
            docs/protocol-storage-metrics.md
          grep -F '(git-aware-reflog-batching.md)' \
            docs/operations/durable-striped-write-queue.md
          git diff --check

      - name: Commit validated documentation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/protocol-storage-metrics.md
          if git diff --cached --quiet; then
            echo 'Expected protocol metrics documentation change' >&2
            exit 1
          fi
          git commit -m 'Document Git-aware reflog batch metrics'
          git push origin HEAD:feat/162-git-aware-reflog-batching
