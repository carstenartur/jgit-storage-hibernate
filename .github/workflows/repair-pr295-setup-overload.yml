name: Repair PR 295 setup overload

on:
  push:
    branches:
      - feat/187-repository-aging-telemetry

permissions:
  contents: write

concurrency:
  group: repair-pr295-setup-overload
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout telemetry branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/187-repository-aging-telemetry
          fetch-depth: 0

      - name: Preserve direct unit-test setup while keeping JMH parameters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-issue187-repository-aging-telemetry.py')
          text = path.read_text(encoding='utf-8')
          old = '''  @Setup(Level.Trial)
          public void setupTrial(BenchmarkParams benchmarkParams) throws Exception {
            suppressConnectionMetadataLogging();
            benchmarkMethod = benchmarkMethod(benchmarkParams);
            repositoryName =
          '''.replace('          ', '')
          new = '''  @Setup(Level.Trial)
          public void setupTrial(BenchmarkParams benchmarkParams) throws Exception {
            setupTrial(benchmarkMethod(benchmarkParams));
          }

          public void setupTrial() throws Exception {
            setupTrial("unit-test");
          }

          private void setupTrial(String benchmarkMethod) throws Exception {
            suppressConnectionMetadataLogging();
            this.benchmarkMethod = benchmarkMethod;
            repositoryName =
          '''.replace('          ', '')
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected one generated setup block, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python3 -m py_compile .github/scripts/apply-issue187-repository-aging-telemetry.py
          git diff --check

      - name: Remove one-shot repair workflow
        run: rm .github/workflows/repair-pr295-setup-overload.yml

      - name: Commit repaired transformation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/scripts/apply-issue187-repository-aging-telemetry.py \
            .github/workflows/repair-pr295-setup-overload.yml
          if git diff --cached --quiet; then
            echo 'Expected setup-overload repair produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Preserve repository-aging test setup entry point'
          git push origin HEAD:feat/187-repository-aging-telemetry
