name: Dispatch Full Repository Aging Evidence

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/repository-aging-full-evidence-request.json'
      - '.github/workflows/repository-aging-full-evidence-request.yml'
      - '.github/workflows/performance-investigations.yml'
      - '.github/scripts/validate_repository_aging_full_request.py'
      - '.github/scripts/test_validate_repository_aging_full_request.py'
      - '.github/scripts/test_repository_aging_full_evidence_request_workflow.py'
      - '.github/scripts/test_performance_investigations_workflow.py'
  push:
    branches: [ main ]
    paths:
      - '.github/repository-aging-full-evidence-request.json'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Reviewed full-aging dispatch contract
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed contract or request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Test request validation and workflow scope
        run: |
          python3 -m py_compile \
            .github/scripts/validate_repository_aging_full_request.py \
            .github/scripts/test_validate_repository_aging_full_request.py \
            .github/scripts/test_repository_aging_full_evidence_request_workflow.py \
            .github/scripts/test_performance_investigations_workflow.py
          python3 .github/scripts/test_validate_repository_aging_full_request.py
          python3 .github/scripts/test_repository_aging_full_evidence_request_workflow.py
          python3 .github/scripts/test_performance_investigations_workflow.py

      - name: Validate a dedicated request change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          request_path=.github/repository-aging-full-evidence-request.json
          git fetch --no-tags origin "$BASE_SHA"
          mapfile -t changed_paths < <(git diff --name-only "$BASE_SHA"...HEAD)
          request_changed=false
          for path in "${changed_paths[@]}"; do
            if [[ "$path" == "$request_path" ]]; then
              request_changed=true
              break
            fi
          done
          if [[ "$request_changed" == true ]]; then
            if [[ "${#changed_paths[@]}" -ne 1 \
                || "${changed_paths[0]}" != "$request_path" ]]; then
              printf 'A full-aging request PR may change only %s; found:\n' \
                "$request_path" >&2
              printf '  %s\n' "${changed_paths[@]}" >&2
              exit 1
            fi
            python3 .github/scripts/validate_repository_aging_full_request.py \
              --request "$request_path" \
              --expected-source-commit "$BASE_SHA"
          fi

  dispatch:
    name: Dispatch full aging matrix from protected main request
    if: github.event_name == 'push'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact protected request commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Validate dedicated request commit
        id: request
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          request_path=.github/repository-aging-full-evidence-request.json
          if [[ ! "$BEFORE_SHA" =~ ^[0-9a-f]{40}$ \
              || "$BEFORE_SHA" == 0000000000000000000000000000000000000000 ]]; then
            printf 'Request push has no valid protected-main predecessor: %s\n' \
              "$BEFORE_SHA" >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$AFTER_SHA" ]]; then
            printf 'Checked out request commit does not match push SHA %s.\n' \
              "$AFTER_SHA" >&2
            exit 1
          fi
          git fetch --no-tags origin "$BEFORE_SHA"
          mapfile -t changed_paths < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")
          if [[ "${#changed_paths[@]}" -ne 1 \
              || "${changed_paths[0]}" != "$request_path" ]]; then
            printf 'Protected request commit may change only %s; found:\n' \
              "$request_path" >&2
            printf '  %s\n' "${changed_paths[@]}" >&2
            exit 1
          fi
          python3 .github/scripts/validate_repository_aging_full_request.py \
            --request "$request_path" \
            --expected-source-commit "$BEFORE_SHA" \
            --github-output "$GITHUB_OUTPUT"
          printf 'target_commit=%s\n' "$AFTER_SHA" >> "$GITHUB_OUTPUT"

      - name: Confirm main still resolves to the reviewed request commit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          current_main="$(git rev-parse refs/remotes/origin/main)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            printf 'Main advanced from reviewed request %s to %s; refusing a stale dispatch.\n' \
              "$GITHUB_SHA" "$current_main" >&2
            exit 1
          fi

      - name: Dispatch and verify complete matrix on exact current main
        id: dispatch
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ steps.request.outputs.target_commit }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          runs_response="$(mktemp)"
          dispatch_started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          payload='{"ref":"main","inputs":{"profile":"full"}}'
          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/performance-investigations.yml/dispatches" \
            --data "$payload")"
          if [[ "$status" != 204 ]]; then
            printf 'Workflow dispatch failed with HTTP %s:\n' "$status" >&2
            cat "$response" >&2
            exit 1
          fi

          runs_url="https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/performance-investigations.yml/runs?event=workflow_dispatch&branch=main&head_sha=$TARGET_COMMIT&per_page=20"
          run_id=''
          for attempt in $(seq 1 12); do
            if curl --fail --silent --show-error \
                --header 'Accept: application/vnd.github+json' \
                --header "Authorization: Bearer $GITHUB_TOKEN" \
                --header 'X-GitHub-Api-Version: 2022-11-28' \
                "$runs_url" > "$runs_response"; then
              run_id="$(python3 - "$runs_response" "$TARGET_COMMIT" \
                "$dispatch_started_at" <<'PY'
          import json
          import sys

          path, target_commit, started_at = sys.argv[1:]
          payload = json.loads(open(path, encoding="utf-8").read())
          matching = [
              run
              for run in payload.get("workflow_runs", [])
              if run.get("event") == "workflow_dispatch"
              and run.get("head_branch") == "main"
              and run.get("head_sha") == target_commit
              and run.get("created_at", "") >= started_at
          ]
          if matching:
              print(max(matching, key=lambda run: run["created_at"])["id"])
          PY
              )"
              if [[ -n "$run_id" ]]; then
                break
              fi
            fi
            sleep 5
          done
          if [[ -z "$run_id" ]]; then
            printf 'No full Performance Investigations run resolved to reviewed commit %s.\n' \
              "$TARGET_COMMIT" >&2
            exit 1
          fi
          printf 'run_id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

      - name: Report reviewed dispatch
        run: |
          echo '### Full repository-aging matrix dispatched' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Request: `${{ steps.request.outputs.request_id }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Unchanged benchmark source: `${{ steps.request.outputs.source_commit }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Exact dispatched main commit: `${{ steps.request.outputs.target_commit }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Profile: `full`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Verified workflow run: [`${{ steps.dispatch.outputs.run_id }}`](https://github.com/${{ github.repository }}/actions/runs/${{ steps.dispatch.outputs.run_id }})' >> "$GITHUB_STEP_SUMMARY"
