name: Run release 0.1.12

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/temp-release-0.1.12.yml'

permissions:
  contents: write

concurrency:
  group: jgit-storage-hibernate-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout authoritative main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Determine whether release is still required
        id: state
        run: |
          # This dispatcher is idempotent and is retriggered only while the tag is absent.
          if git ls-remote --exit-code --tags origin refs/tags/v0.1.12 >/dev/null 2>&1; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Set up JDK 21
        if: steps.state.outputs.needed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run canonical release state machine
        if: steps.state.outputs.needed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: 0.1.12
          NEXT_VERSION_INPUT: 0.1.13-SNAPSHOT
          SKIP_TESTS: 'false'
          DRY_RUN: 'false'
          SOURCE_BRANCH: main
          PUBLIC_REPOSITORY_URL: https://raw.githubusercontent.com/carstenartur/jgit-storage-hibernate/maven-repository/
        run: |
          chmod +x .github/scripts/release.sh .github/scripts/verify-public-repository-consumption.sh
          python3 .github/scripts/verify-public-repository-publishing.py
          .github/scripts/release.sh
