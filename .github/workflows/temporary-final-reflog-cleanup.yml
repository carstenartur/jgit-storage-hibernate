name: Temporary final reflog cleanup

on:
  push:
    branches:
      - perf/reflog-index-evidence

permissions:
  contents: write

concurrency:
  group: temporary-final-reflog-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/reflog-index-evidence
          fetch-depth: 0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Follow the latest reflog branch and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            git fetch origin perf/reflog-index-evidence
            git reset --hard origin/perf/reflog-index-evidence
            if grep -Fq 'new ExpectedMigration("0.9.1", "add reflog reference key")' \
                jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/CoreSchemaMigrationIntegrationTest.java 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo 'The finalized reflog migration expectation did not appear.' >&2
              exit 1
            fi
            sleep 5
          done
          find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -delete
          git diff --check
          mkdir -p target

      - name: Re-run the complete Core verification
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-core -am verify 2>&1 \
            | tee target/reflog-final-verification.log

      - name: Commit cleanup only when needed
        shell: bash
        run: |
          set -euo pipefail
          test -s target/reflog-final-verification.log
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -print -quit)"
          git add -A
          if git diff --cached --quiet; then
            echo 'The reflog branch was already clean and fully verified.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Clean finalized reflog verification workflows'
          git push origin HEAD:perf/reflog-index-evidence

      - name: Upload final verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reflog-final-verification
          path: |
            target/reflog-final-verification.log
            jgit-storage-hibernate-core/target/surefire-reports/**
            jgit-storage-hibernate-core/target/failsafe-reports/**
          if-no-files-found: error
