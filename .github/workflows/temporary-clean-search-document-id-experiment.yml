name: Temporary clean Search document ID experiment

on:
  push:
    branches:
      - perf/search-document-id-compatibility

permissions:
  contents: write

concurrency:
  group: temporary-clean-search-document-id-experiment
  cancel-in-progress: true

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/search-document-id-compatibility
          fetch-depth: 0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Follow the tested document-ID candidate
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            git fetch origin perf/search-document-id-compatibility
            git reset --hard origin/perf/search-document-id-compatibility
            if grep -Fq '@DocumentId' \
                jgit-storage-hibernate-search/src/main/java/io/github/carstenartur/jgit/storage/hibernate/search/entity/GitCommitIndex.java 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo 'The numeric Search document-ID candidate did not appear.' >&2
              exit 1
            fi
            sleep 5
          done
          find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -delete
          test -f .github/workflows/search-document-id-experiment.yml
          git diff --check

      - name: Re-run focused batch and projection contracts
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/search-document-id-cleanup
          mvn -B -pl jgit-storage-hibernate-search -am \
            -Dtest=CommitProjectionJdbcBatchH2Test,CommitSearchProjectionH2Test \
            -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 \
            | tee target/search-document-id-cleanup/maven-test.log

      - name: Commit cleanup only when needed
        shell: bash
        run: |
          set -euo pipefail
          test -s target/search-document-id-cleanup/maven-test.log
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -print -quit)"
          git add -A
          if git diff --cached --quiet; then
            echo 'The Search document-ID experiment branch was already clean.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Clean the Search document-ID experiment branch'
          git push origin HEAD:perf/search-document-id-compatibility

      - name: Upload focused cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-document-id-cleanup
          path: |
            target/search-document-id-cleanup/**
            jgit-storage-hibernate-search/target/surefire-reports/**
          if-no-files-found: error
