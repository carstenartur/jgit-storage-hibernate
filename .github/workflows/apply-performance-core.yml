name: Apply core performance diagnostics

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/issues-161-166
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply staged changes
        run: |
          python3 .github/scripts/apply-performance-core.py
          rm .github/scripts/apply-performance-core.py
          rm .github/workflows/apply-performance-core.yml
          git diff --check

      - name: Run core tests
        run: mvn -B -pl jgit-storage-hibernate-core -am test

      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add adaptive publication and staging spill diagnostics'
          git push origin HEAD:perf/issues-161-166
