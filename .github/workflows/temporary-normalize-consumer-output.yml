name: Temporary normalize consumer output

on:
  push:
    branches:
      - ci/consumer-contracts

permissions:
  contents: write

concurrency:
  group: temporary-normalize-consumer-output
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/consumer-contracts
          fetch-depth: 0

      - name: Follow the commit-qualified workflow revision
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            git fetch origin ci/consumer-contracts
            git reset --hard origin/ci/consumer-contracts
            if grep -Fq 'candidate_version="${base_version}-consumer-' \
                .github/workflows/consumer-compatibility.yml 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'The commit-qualified consumer workflow did not appear.' >&2
              exit 1
            fi
            sleep 5
          done

      - name: Normalize output identifiers and clean temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/consumer-compatibility.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'source-version: ${{ steps.identity.outputs.source-version }}',
              'source_version: ${{ steps.identity.outputs.source_version }}',
          )
          text = text.replace(
              'echo "source-version=$source_version" >> "$GITHUB_OUTPUT"',
              'echo "source_version=$source_version" >> "$GITHUB_OUTPUT"',
          )
          path.write_text(text, encoding='utf-8')

          for temporary in Path('.github/workflows').glob('temporary-*.yml'):
              temporary.unlink()
          PY

      - name: Verify and commit normalized outputs
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'source_version: ${{ steps.identity.outputs.source_version }}' \
            .github/workflows/consumer-compatibility.yml
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/consumer-compatibility.yml')"
          git diff --check
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Normalize consumer workflow output identifiers'
          git push origin HEAD:ci/consumer-contracts
