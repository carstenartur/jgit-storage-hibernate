name: Inspect Security Phase 1 JPA Test Wiring

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/materialize-security-phase1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
      - name: Materialize the complete source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/scripts/security-phase1-module.b64.part-00-0 \
            .github/scripts/security-phase1-module.b64.part-00-1 \
            .github/scripts/security-phase1-module.b64.part-01 \
            .github/scripts/security-phase1-module.b64.part-02 \
            .github/scripts/security-phase1-module.b64.part-03 \
            .github/scripts/security-phase1-module.b64.part-04 \
            > .github/scripts/security-phase1-module.b64
          python3 .github/scripts/generate-security-phase1.py
      - name: Inspect embedded JPA test declarations and enhancement annotations
        shell: bash
        run: |
          set -euo pipefail
          root=jgit-storage-hibernate-security/src/test/java
          echo '::group::JPA test declarations with context'
          grep -RInE -B20 -A35 \
            'class[[:space:]]+(JpaSecureRefDatabaseDataIsolationTest|JpaSecureRefDatabaseTest|JpaSecurityOperationsTest)|@(BytecodeEnhanced|EnhancementOptions|ExtendWith|DomainModel|SessionFactory|ServiceRegistry)' \
            "$root" || true
          echo '::endgroup::'
          echo '::group::Imports related to Hibernate testing and JUnit extensions'
          grep -RInE \
            '^import[[:space:]].*(hibernate\.testing|Bytecode|Enhancement|junit\.jupiter\.api\.extension)' \
            "$root" || true
          echo '::endgroup::'
          echo '::group::Complete Java files containing embedded JPA tests'
          mapfile -t files < <(grep -RlE \
            'class[[:space:]]+(JpaSecureRefDatabaseDataIsolationTest|JpaSecureRefDatabaseTest|JpaSecurityOperationsTest)' \
            "$root" | sort)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo 'No embedded JPA test declarations found.' >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "===== $file ====="
            sed -n '1,520p' "$file"
          done
          echo '::endgroup::'
