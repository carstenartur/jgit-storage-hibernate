name: Materialize Security Phase 1

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/materialize-security-phase1.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    name: Generate reviewed security module
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Materialize reviewed source and remove bootstrap payload
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/scripts/security-phase1-module.b64.part-00-0 \
            .github/scripts/security-phase1-module.b64.part-00-1 \
            .github/scripts/security-phase1-module.b64.part-01 \
            .github/scripts/security-phase1-module.b64.part-02 \
            .github/scripts/security-phase1-module.b64.part-03 \
            .github/scripts/security-phase1-module.b64.part-04 \
            > .github/scripts/security-phase1-module.b64
          python3 .github/scripts/generate-security-phase1.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          migration_root = Path(
              "jgit-storage-hibernate-security/src/main/resources/db/migration/"
              "jgit-storage-hibernate/security"
          )
          migration_files = sorted(
              migration_root.glob("*/V0_11_0__create_security_schema.sql")
          )
          expected_dialects = {"h2", "hsqldb", "postgresql", "sqlserver"}
          found_dialects = {path.parent.name for path in migration_files}
          if found_dialects != expected_dialects:
              raise SystemExit(
                  "Unexpected security migration dialects: "
                  f"expected {sorted(expected_dialects)}, found {sorted(found_dialects)}"
              )

          identifier = r'(?:git_security_group_member|"git_security_group_member"|\[git_security_group_member\])'
          table_start = re.compile(
              rf"(?im)^\s*create\s+table\s+{identifier}\s*\("
          )
          member_index_start = re.compile(
              rf"(?im)^\s*create\s+(?:unique\s+)?index\b[^;]*?\bon\s+{identifier}\s*\("
          )
          member_alter_start = re.compile(
              rf"(?im)^\s*alter\s+table\s+{identifier}\b"
          )

          def take_statement(sql: str, start: int) -> tuple[str, str]:
              semicolon = sql.find(";", start)
              if semicolon < 0:
                  raise SystemExit(
                      "Security migration statement has no semicolon terminator near: "
                      + sql[start : start + 160]
                  )
              end = semicolon + 1
              suffix = re.match(
                  r"[ \t]*(?:\r?\n[ \t]*GO[ \t]*)?(?:\r?\n)?",
                  sql[end:],
                  flags=re.IGNORECASE,
              )
              if suffix:
                  end += suffix.end()
              return sql[start:end].strip(), sql[:start] + sql[end:]

          for path in migration_files:
              sql = path.read_text(encoding="utf-8")
              table_match = table_start.search(sql)
              if table_match is None:
                  raise SystemExit(f"Missing membership table in {path}")
              membership_table, sql = take_statement(sql, table_match.start())

              dependent_statements: list[str] = []
              while True:
                  matches = [
                      match
                      for pattern in (member_index_start, member_alter_start)
                      if (match := pattern.search(sql)) is not None
                  ]
                  if not matches:
                      break
                  match = min(matches, key=lambda item: item.start())
                  statement, sql = take_statement(sql, match.start())
                  dependent_statements.append(statement)

              reordered = sql.rstrip() + "\n\n" + membership_table + "\n"
              if dependent_statements:
                  reordered += "\n" + "\n\n".join(dependent_statements) + "\n"

              principal_position = reordered.lower().find(
                  "create table git_security_principal"
              )
              group_position = reordered.lower().find(
                  "create table git_security_group ("
              )
              membership_position = reordered.lower().find(
                  "create table git_security_group_member"
              )
              if min(principal_position, group_position, membership_position) < 0:
                  raise SystemExit(f"Cannot verify parent-table order in {path}")
              if not (
                  principal_position < membership_position
                  and group_position < membership_position
              ):
                  raise SystemExit(f"Invalid membership FK order remains in {path}")

              path.write_text(reordered, encoding="utf-8")
              print(
                  f"Ordered membership migration after principal/group tables for {path.parent.name}"
              )

          member_entities: list[tuple[Path, str]] = []
          for candidate in Path(
              "jgit-storage-hibernate-security/src/main/java"
          ).rglob("*.java"):
              source = candidate.read_text(encoding="utf-8")
              if "git_security_group_member" in source and "@Entity" in source:
                  member_entities.append((candidate, source))

          if len(member_entities) != 1:
              raise SystemExit(
                  "Expected one entity mapped to git_security_group_member, found "
                  f"{[str(path) for path, _ in member_entities]}"
              )

          member_entity, member_source = member_entities[0]
          id_position = member_source.find("@Id")
          if id_position < 0:
              raise SystemExit(f"Membership entity has no @Id mapping: {member_entity}")

          field_match = re.search(
              r"(?s)(@Id\b.{0,600}?\b(?:private|protected|public)\s+)"
              r"(int|Integer)(\s+([A-Za-z_$][\w$]*)\s*;)",
              member_source,
          )
          getter_match = re.search(
              r"(?s)(@Id\b.{0,600}?\b(?:private|protected|public)\s+)"
              r"(int|Integer)(\s+(get[A-Za-z_$][\w$]*)\s*\()",
              member_source,
          )

          tracked_tokens: set[str]
          if field_match is not None:
              property_name = field_match.group(4)
              capitalized = property_name[:1].upper() + property_name[1:]
              tracked_tokens = {
                  property_name,
                  "get" + capitalized,
                  "set" + capitalized,
              }
          elif getter_match is not None:
              getter_name = getter_match.group(4)
              suffix = getter_name[3:]
              property_name = suffix[:1].lower() + suffix[1:]
              tracked_tokens = {property_name, getter_name, "set" + suffix}
          else:
              snippet = member_source[id_position : id_position + 800]
              raise SystemExit(
                  f"Could not identify the int/Integer @Id contract in {member_entity}:\n{snippet}"
              )

          changed = 0
          aligned_lines: list[str] = []
          for line in member_source.splitlines(keepends=True):
              if any(token in line for token in tracked_tokens):
                  line, replacements = re.subn(
                      r"\b(?:int|Integer)\b", "Long", line
                  )
                  changed += replacements
              aligned_lines.append(line)
          if changed == 0:
              raise SystemExit(
                  f"The annotated membership identifier was not changed in {member_entity}"
              )

          member_source = "".join(aligned_lines)
          id_window = member_source[id_position : id_position + 800]
          if "Long" not in id_window:
              raise SystemExit(
                  f"Membership @Id contract is not Long after alignment in {member_entity}:\n{id_window}"
              )
          member_entity.write_text(member_source, encoding="utf-8")
          print(
              f"Aligned {changed} annotated membership identifier occurrence(s) to Long in {member_entity}"
          )
          PY
          rm -f .github/scripts/generate-security-phase1.py
          rm -f .github/scripts/security-phase1-module.b64*
          if find .github/scripts -maxdepth 1 -name 'security-phase1-module.b64*' -print -quit | grep -q .; then
            echo 'Security bootstrap payload remains after generation' >&2
            exit 1
          fi

      - name: Verify optional-module boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_verify_module_boundaries.py
          python3 .github/scripts/verify-module-boundaries.py \
            --root . \
            --json target/module-boundaries/security-phase1.json \
            --markdown target/module-boundaries/security-phase1.md
          python3 .github/scripts/verify-security-policy.py

      - name: Test the Security module and its required reactor
        shell: bash
        run: mvn -B -ntp -pl jgit-storage-hibernate-security -am test

      - name: Commit the reviewable source tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Carsten Hammer'
          git config user.email 'carsten.hammer@t-online.de'
          git add -A
          git diff --cached --check
          git commit -m 'Add optional security persistence and evaluator'
          git push origin HEAD:feature/security-phase-1
