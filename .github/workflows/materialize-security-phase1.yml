name: Inspect Security Phase 1 Archive Hygiene

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/materialize-security-phase1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
      - name: Materialize the complete source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/scripts/security-phase1-module.b64.part-00-0 \
            .github/scripts/security-phase1-module.b64.part-00-1 \
            .github/scripts/security-phase1-module.b64.part-01 \
            .github/scripts/security-phase1-module.b64.part-02 \
            .github/scripts/security-phase1-module.b64.part-03 \
            .github/scripts/security-phase1-module.b64.part-04 \
            > .github/scripts/security-phase1-module.b64
          python3 .github/scripts/generate-security-phase1.py
      - name: Inspect archive contents and stale JPA tests
        shell: bash
        run: |
          set -euo pipefail
          echo '::group::Every generated JPA Security source or class'
          find . -type f \( \
            -iname '*JpaSecureRefDatabase*' -o \
            -iname '*JpaSecurityOperations*' \
          \) -print | sort
          echo '::endgroup::'
          echo '::group::Generated target directories'
          find . -type d -name target -print | sort
          echo '::endgroup::'
          echo '::group::Tracked or generated build artifacts under Security module'
          find jgit-storage-hibernate-security -type f \( \
            -path '*/target/*' -o \
            -name '*.class' -o \
            -name '*.jar' \
          \) -print | sort | sed -n '1,400p'
          echo '::endgroup::'
          if find jgit-storage-hibernate-security -type f -path '*/target/*' -print -quit | grep -q .; then
            echo 'Security source archive contains forbidden target build output.' >&2
            exit 1
          fi
