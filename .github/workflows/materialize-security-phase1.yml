name: Trace Security Phase 1 Dynamic Test Methods

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/materialize-security-phase1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
      - name: Materialize the complete source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/scripts/security-phase1-module.b64.part-00-0 \
            .github/scripts/security-phase1-module.b64.part-00-1 \
            .github/scripts/security-phase1-module.b64.part-01 \
            .github/scripts/security-phase1-module.b64.part-02 \
            .github/scripts/security-phase1-module.b64.part-03 \
            .github/scripts/security-phase1-module.b64.part-04 \
            > .github/scripts/security-phase1-module.b64
          python3 .github/scripts/generate-security-phase1.py
      - name: Locate semantic JPA test method names and test factories
        shell: bash
        run: |
          set -euo pipefail
          root=jgit-storage-hibernate-security
          echo '::group::Exact failing method names in all materialized files'
          grep -RInE \
            'repositoryScopedRefReadsDoNotCrossRepositoryBoundary|allowsObjectInsertForRepositoryMember|objectIdDeleteRequiresStoredOwnerToMatch' \
            . \
            --exclude='security-phase1-module.b64*' \
            --exclude-dir=.git || true
          echo '::endgroup::'
          echo '::group::Every Security test annotation, factory and dynamic-test construction'
          grep -RInE -B3 -A8 \
            '@Test|@TestFactory|@TestTemplate|DynamicTest|DynamicContainer|InvocationContext|TestEngine|Launcher' \
            "$root/src/test" "$root/pom.xml" || true
          echo '::endgroup::'
          echo '::group::Complete Security test sources'
          while IFS= read -r file; do
            echo "===== $file ====="
            cat "$file"
          done < <(find "$root/src/test/java" -type f -name '*.java' -print | sort)
          echo '::endgroup::'
