name: Verify Security Phase 1 Source

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/materialize-security-phase1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Materialize the complete source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/scripts/security-phase1-module.b64.part-00-0 \
            .github/scripts/security-phase1-module.b64.part-00-1 \
            .github/scripts/security-phase1-module.b64.part-01 \
            .github/scripts/security-phase1-module.b64.part-02 \
            .github/scripts/security-phase1-module.b64.part-03 \
            .github/scripts/security-phase1-module.b64.part-04 \
            > .github/scripts/security-phase1-module.b64
          python3 .github/scripts/generate-security-phase1.py
      - name: Move membership tables behind their referenced parents without rewriting SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "jgit-storage-hibernate-security/src/main/resources/db/migration/"
              "jgit-storage-hibernate/security"
          )
          start_member = re.compile(
              r'^\s*create\s+table\s+(?:\[|\")?git_security_group_member(?:\]|\")?\s*\(',
              re.IGNORECASE,
          )
          start_principal = re.compile(
              r'^\s*create\s+table\s+(?:\[|\")?git_security_principal(?:\]|\")?\s*\(',
              re.IGNORECASE,
          )
          start_group = re.compile(
              r'^\s*create\s+table\s+(?:\[|\")?git_security_group(?:\]|\")?\s*\(',
              re.IGNORECASE,
          )

          for path in sorted(root.glob("*/V0_11_0__create_security_schema.sql")):
              lines = path.read_text(encoding="utf-8").splitlines(keepends=True)
              starts = [i for i, line in enumerate(lines) if start_member.search(line)]
              if len(starts) != 1:
                  raise SystemExit(f"Expected one membership table in {path}, found {starts}")
              start = starts[0]
              end = None
              for i in range(start + 1, len(lines)):
                  if lines[i].strip() == ");":
                      end = i + 1
                      if end < len(lines) and lines[end].strip().upper() == "GO":
                          end += 1
                      break
              if end is None:
                  raise SystemExit(f"No membership table terminator in {path}")
              block = lines[start:end]
              remaining = lines[:start] + lines[end:]
              while remaining and not remaining[-1].strip():
                  remaining.pop()
              transformed = "".join(remaining) + "\n\n" + "".join(block).lstrip()
              if not transformed.endswith("\n"):
                  transformed += "\n"
              transformed_lines = transformed.splitlines()
              positions = {
                  "principal": next((i for i, line in enumerate(transformed_lines) if start_principal.search(line)), -1),
                  "group": next((i for i, line in enumerate(transformed_lines) if start_group.search(line)), -1),
                  "membership": next((i for i, line in enumerate(transformed_lines) if start_member.search(line)), -1),
              }
              if min(positions.values()) < 0 or not (
                  positions["principal"] < positions["membership"]
                  and positions["group"] < positions["membership"]
              ):
                  raise SystemExit(f"Invalid transformed order in {path}: {positions}")
              if "membership_id" not in "".join(block):
                  raise SystemExit(f"membership_id was lost from {path}")
              path.write_text(transformed, encoding="utf-8")
              print(f"Verified lossless membership ordering for {path.parent.name}: {positions}")

          print("Generated security test sources:")
          for path in sorted(Path("jgit-storage-hibernate-security/src/test/java").rglob("*.java")):
              text = path.read_text(encoding="utf-8")
              classes = re.findall(r'\bclass\s+(\w+)', text)
              tests = re.findall(r'\bvoid\s+(\w+)\s*\(', text)
              print(path, "classes=", classes, "methods=", tests)
          PY
      - name: Verify architecture and security policy
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_verify_module_boundaries.py
          python3 .github/scripts/verify-module-boundaries.py \
            --root . \
            --json target/module-boundaries/security-phase1.json \
            --markdown target/module-boundaries/security-phase1.md
          python3 .github/scripts/verify-security-policy.py
      - name: Run the complete Security reactor tests
        shell: bash
        run: mvn -B -ntp -pl jgit-storage-hibernate-security -am test
