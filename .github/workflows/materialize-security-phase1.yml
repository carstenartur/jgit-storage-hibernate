name: Verify Security Phase 1 Source

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/materialize-security-phase1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Materialize the complete source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/scripts/security-phase1-module.b64.part-00-0 \
            .github/scripts/security-phase1-module.b64.part-00-1 \
            .github/scripts/security-phase1-module.b64.part-01 \
            .github/scripts/security-phase1-module.b64.part-02 \
            .github/scripts/security-phase1-module.b64.part-03 \
            .github/scripts/security-phase1-module.b64.part-04 \
            > .github/scripts/security-phase1-module.b64
          python3 .github/scripts/generate-security-phase1.py
      - name: Move the membership table together with every dependent statement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path(
              "jgit-storage-hibernate-security/src/main/resources/db/migration/"
              "jgit-storage-hibernate/security"
          )
          table_identifier = (
              r'(?:git_security_group_member|"git_security_group_member"|'
              r'\[git_security_group_member\])'
          )
          table_start = re.compile(
              rf"(?im)^\s*create\s+table\s+{table_identifier}\s*\("
          )
          index_start = re.compile(
              rf"(?im)^\s*create\s+(?:unique\s+)?index\b[^;]*?"
              rf"\bon\s+{table_identifier}\s*\("
          )
          alter_start = re.compile(
              rf"(?im)^\s*alter\s+table\s+{table_identifier}\b"
          )
          principal_start = re.compile(
              r'^\s*create\s+table\s+(?:\[|\")?git_security_principal(?:\]|\")?\s*\(',
              re.IGNORECASE,
          )
          group_start = re.compile(
              r'^\s*create\s+table\s+(?:\[|\")?git_security_group(?:\]|\")?\s*\(',
              re.IGNORECASE,
          )

          def take_statement(sql: str, start: int) -> tuple[str, str]:
              semicolon = sql.find(";", start)
              if semicolon < 0:
                  raise SystemExit(
                      "Security migration statement has no semicolon terminator near: "
                      + sql[start:start + 160]
                  )
              end = semicolon + 1
              suffix = re.match(
                  r"[ \t]*(?:\r?\n[ \t]*GO[ \t]*)?(?:\r?\n)?",
                  sql[end:],
                  flags=re.IGNORECASE,
              )
              if suffix:
                  end += suffix.end()
              return sql[start:end].strip(), sql[:start] + sql[end:]

          paths = sorted(root.glob("*/V0_11_0__create_security_schema.sql"))
          expected = {"h2", "hsqldb", "postgresql", "sqlserver"}
          found = {path.parent.name for path in paths}
          if found != expected:
              raise SystemExit(
                  f"Expected security migrations for {sorted(expected)}, found {sorted(found)}"
              )

          for path in paths:
              sql = path.read_text(encoding="utf-8")
              table_match = table_start.search(sql)
              if table_match is None:
                  raise SystemExit(f"Missing membership table in {path}")
              membership_table, sql = take_statement(sql, table_match.start())
              if "membership_id" not in membership_table:
                  raise SystemExit(f"membership_id is absent from {path}")

              dependent_statements: list[str] = []
              while True:
                  matches = [
                      match
                      for pattern in (index_start, alter_start)
                      if (match := pattern.search(sql)) is not None
                  ]
                  if not matches:
                      break
                  match = min(matches, key=lambda item: item.start())
                  statement, sql = take_statement(sql, match.start())
                  dependent_statements.append(statement)

              reordered = sql.rstrip() + "\n\n" + membership_table + "\n"
              if dependent_statements:
                  reordered += "\n" + "\n\n".join(dependent_statements) + "\n"

              lines = reordered.splitlines()
              positions = {
                  "principal": next(
                      (index for index, line in enumerate(lines) if principal_start.search(line)),
                      -1,
                  ),
                  "group": next(
                      (index for index, line in enumerate(lines) if group_start.search(line)),
                      -1,
                  ),
                  "membership": next(
                      (index for index, line in enumerate(lines) if table_start.search(line)),
                      -1,
                  ),
              }
              if min(positions.values()) < 0 or not (
                  positions["principal"] < positions["membership"]
                  and positions["group"] < positions["membership"]
              ):
                  raise SystemExit(f"Invalid table order in {path}: {positions}")
              membership_offset = reordered.lower().find("git_security_group_member")
              for statement in dependent_statements:
                  statement_offset = reordered.find(statement)
                  if statement_offset <= membership_offset:
                      raise SystemExit(
                          f"Dependent membership statement precedes its table in {path}"
                      )

              path.write_text(reordered, encoding="utf-8")
              print(
                  f"Verified complete membership statement ordering for "
                  f"{path.parent.name}: {positions}, dependents={len(dependent_statements)}"
              )
          PY
      - name: Verify architecture and security policy
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_verify_module_boundaries.py
          python3 .github/scripts/verify-module-boundaries.py \
            --root . \
            --json target/module-boundaries/security-phase1.json \
            --markdown target/module-boundaries/security-phase1.md
          python3 .github/scripts/verify-security-policy.py
      - name: Show the effective Security Hibernate test classpath
        shell: bash
        run: |
          set -euo pipefail
          echo '::group::jgit-storage-hibernate-security/pom.xml'
          cat jgit-storage-hibernate-security/pom.xml
          echo '::endgroup::'
          mvn -B -ntp -pl jgit-storage-hibernate-security -am dependency:tree \
            -Dverbose \
            -Dincludes=org.hibernate.orm:hibernate-core,org.hibernate.orm:hibernate-testing,jakarta.persistence:jakarta.persistence-api
          core_jar="$HOME/.m2/repository/org/hibernate/orm/hibernate-core/7.4.5.Final/hibernate-core-7.4.5.Final.jar"
          if [[ -f "$core_jar" ]]; then
            echo '::group::NoJtaPlatform presence in Hibernate Core 7.4.5.Final'
            jar tf "$core_jar" | grep -F 'NoJtaPlatform' || true
            echo '::endgroup::'
          fi
      - name: Run the complete Security reactor tests
        shell: bash
        run: mvn -B -ntp -pl jgit-storage-hibernate-security -am test
