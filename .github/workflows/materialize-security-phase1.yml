name: Inspect Security Phase 1 JPA Tests

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/materialize-security-phase1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
      - name: Materialize the complete source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/scripts/security-phase1-module.b64.part-00-0 \
            .github/scripts/security-phase1-module.b64.part-00-1 \
            .github/scripts/security-phase1-module.b64.part-01 \
            .github/scripts/security-phase1-module.b64.part-02 \
            .github/scripts/security-phase1-module.b64.part-03 \
            .github/scripts/security-phase1-module.b64.part-04 \
            > .github/scripts/security-phase1-module.b64
          python3 .github/scripts/generate-security-phase1.py
      - name: Inspect JPA test annotations and extensions
        shell: bash
        run: |
          set -euo pipefail
          root=jgit-storage-hibernate-security/src/test/java/io/github/carstenartur/jgit/storage/hibernate/security
          for file in \
            JpaSecureRefDatabaseDataIsolationTest.java \
            JpaSecureRefDatabaseTest.java \
            JpaSecurityOperationsTest.java; do
            echo "::group::$file"
            sed -n '1,260p' "$root/$file"
            echo '::endgroup::'
          done
          echo '::group::All Hibernate testing annotations and extensions in Security tests'
          grep -RInE 'Bytecode|Enhancement|ExtendWith|DomainModel|SessionFactory|ServiceRegistry|Jpa|hibernate-testing' \
            jgit-storage-hibernate-security/src/test/java \
            jgit-storage-hibernate-security/pom.xml || true
          echo '::endgroup::'
