name: Trace Security Phase 1 Generated Tests

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/materialize-security-phase1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Materialize the complete source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/scripts/security-phase1-module.b64.part-00-0 \
            .github/scripts/security-phase1-module.b64.part-00-1 \
            .github/scripts/security-phase1-module.b64.part-01 \
            .github/scripts/security-phase1-module.b64.part-02 \
            .github/scripts/security-phase1-module.b64.part-03 \
            .github/scripts/security-phase1-module.b64.part-04 \
            > .github/scripts/security-phase1-module.b64
          python3 .github/scripts/generate-security-phase1.py
      - name: Search every materialized text file for the JPA test names
        shell: bash
        run: |
          set -euo pipefail
          grep -RInE \
            'JpaSecureRefDatabaseDataIsolationTest|JpaSecureRefDatabaseTest|JpaSecurityOperationsTest' \
            . \
            --exclude='security-phase1-module.b64*' \
            --exclude-dir=.git || true
      - name: Cleanly compile all Security test sources
        shell: bash
        run: mvn -B -ntp -pl jgit-storage-hibernate-security -am clean test-compile -DskipTests
      - name: Trace generated sources and compiled test classes
        shell: bash
        run: |
          set -euo pipefail
          echo '::group::Generated test source directories and files'
          find jgit-storage-hibernate-security/target -type f \( \
            -path '*/generated-test-sources/*' -o \
            -path '*/generated-sources/*' \
          \) -print | sort || true
          echo '::endgroup::'
          echo '::group::All compiled Security test classes'
          find jgit-storage-hibernate-security/target/test-classes -type f -name '*.class' -print | sort || true
          echo '::endgroup::'
          echo '::group::Compiled JPA Security test classes'
          mapfile -t classes < <(find jgit-storage-hibernate-security/target/test-classes -type f \( \
            -name '*JpaSecureRefDatabase*' -o \
            -name '*JpaSecurityOperations*' \
          \) -print | sort)
          printf '%s\n' "${classes[@]-}"
          echo '::endgroup::'
          echo '::group::JARs containing the JPA Security test class names'
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          needles = (
              "JpaSecureRefDatabaseDataIsolationTest",
              "JpaSecureRefDatabaseTest",
              "JpaSecurityOperationsTest",
          )
          for jar in Path.home().joinpath('.m2/repository').rglob('*.jar'):
              try:
                  with zipfile.ZipFile(jar) as archive:
                      names = archive.namelist()
              except (OSError, zipfile.BadZipFile):
                  continue
              hits = [name for name in names if any(needle in name for needle in needles)]
              if hits:
                  print(jar)
                  for hit in hits:
                      print('  ', hit)
          PY
          echo '::endgroup::'
