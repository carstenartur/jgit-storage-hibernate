name: Inspect Security Phase 1 Membership Schema

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/materialize-security-phase1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
      - name: Materialize and print membership contracts
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/scripts/security-phase1-module.b64.part-00-0 \
            .github/scripts/security-phase1-module.b64.part-00-1 \
            .github/scripts/security-phase1-module.b64.part-01 \
            .github/scripts/security-phase1-module.b64.part-02 \
            .github/scripts/security-phase1-module.b64.part-03 \
            .github/scripts/security-phase1-module.b64.part-04 \
            > .github/scripts/security-phase1-module.b64
          python3 .github/scripts/generate-security-phase1.py
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("jgit-storage-hibernate-security")
          print("=== ENTITY FILES REFERENCING git_security_group_member ===")
          for path in sorted((root / "src/main/java").rglob("*.java")):
              text = path.read_text(encoding="utf-8")
              if "git_security_group_member" in text or "membership_id" in text:
                  print(f"--- {path} ---")
                  print(text)

          print("=== ENTITY FILES WITH @Id AND NUMERIC id ===")
          for path in sorted((root / "src/main/java").rglob("*.java")):
              text = path.read_text(encoding="utf-8")
              if "@Id" in text and re.search(r"\b(?:int|Integer|long|Long)\s+id\b", text):
                  print(f"--- {path} ---")
                  print(text)

          print("=== MEMBERSHIP TABLE BLOCKS ===")
          for path in sorted((root / "src/main/resources/db/migration").rglob("V0_11_0__create_security_schema.sql")):
              text = path.read_text(encoding="utf-8")
              match = re.search(
                  r"(?is)create\s+table\s+(?:\[|\")?git_security_group_member(?:\]|\")?\s*\(.*?\);",
                  text,
              )
              print(f"--- {path} ---")
              print(match.group(0) if match else "<membership table not matched>")
              for line in text.splitlines():
                  if "git_security_group_member" in line or re.search(r"\bmembership_id\b|\bid\b", line, re.I):
                      print("LINE:", line)
          PY
