name: Repair Security Source Publisher

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/fix-publish-security-phase1-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
          fetch-depth: 0
      - name: Replace the over-broad content gate with an index path gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/publish-security-phase1-source.yml')
          text = path.read_text(encoding='utf-8')
          old_command = 'if git diff --cached --name-only | grep -E \\'
          new_command = 'if git ls-files --cached | grep -E \\'
          if text.count(old_command) != 1:
              raise SystemExit('Expected staged-path gate was not found exactly once')
          text = text.replace(old_command, new_command)
          lines = text.splitlines(keepends=True)
          starts = [
              index
              for index, line in enumerate(lines)
              if 'if git grep --cached -nE' in line
          ]
          if len(starts) != 1:
              raise SystemExit('Expected content gate was not found exactly once')
          start = starts[0]
          end = start
          while end < len(lines) and lines[end].strip() != 'fi':
              end += 1
          if end == len(lines):
              raise SystemExit('Content gate has no closing fi')
          del lines[start:end + 1]
          path.write_text(''.join(lines), encoding='utf-8')
          PY

          rm -f .github/workflows/fix-publish-security-phase1-source.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/publish-security-phase1-source.yml \
            .github/workflows/fix-publish-security-phase1-source.yml
          git commit -m 'ci: use an index path gate for Security source publication'
          git push origin HEAD:refs/heads/feature/security-phase-1
