name: Repair Security Source Publisher

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/fix-publish-security-phase1-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
          fetch-depth: 0
      - name: Replace the over-broad content gate with an index path gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/publish-security-phase1-source.yml')
          text = path.read_text(encoding='utf-8')
          old = """          if git diff --cached --name-only | grep -E \\
            '(^|/)target/|(^|/)__pycache__/|\\.class$|\\.jar$|security-phase1-module\\.b64|generate-security-phase1\\.py|inspect-security-javadoc-source\\.yml|materialize-security-phase1\\.yml|publish-security-phase1-source\\.yml'; then
            echo 'Forbidden bootstrap, diagnostic or build artifacts are staged.' >&2
            exit 1
          fi

          if git grep --cached -nE \\
            'security-phase1-module\\.b64|generate-security-phase1\\.py|inspect-security-javadoc-source\\.yml|materialize-security-phase1\\.yml|publish-security-phase1-source\\.yml'; then
            echo 'Bootstrap or diagnostic references remain in the final source tree.' >&2
            exit 1
          fi
"""
          new = """          if git ls-files --cached | grep -E \\
            '(^|/)target/|(^|/)__pycache__/|\\.class$|\\.jar$|security-phase1-module\\.b64|generate-security-phase1\\.py|inspect-security-javadoc-source\\.yml|materialize-security-phase1\\.yml|publish-security-phase1-source\\.yml|fix-publish-security-phase1-source\\.yml'; then
            echo 'Forbidden bootstrap, diagnostic or build artifacts remain in the final index.' >&2
            exit 1
          fi
"""
          if text.count(old) != 1:
              raise SystemExit('Expected publisher gate was not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          rm -f .github/workflows/fix-publish-security-phase1-source.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/publish-security-phase1-source.yml \
            .github/workflows/fix-publish-security-phase1-source.yml
          git commit -m 'ci: use an index path gate for Security source publication'
          git push origin HEAD:refs/heads/feature/security-phase-1
