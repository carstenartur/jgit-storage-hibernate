name: Repair issue 285 patch helper

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: repair-issue285-helper-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Disambiguate the first traversal replacement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/apply-issue285-jmh-schema-validation.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def replace_once(text: str, old: str, new: str, description: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {description} match, found {count}")
              return text.replace(old, new)
          '''.replace('          ', '')
          addition = anchor + '''

          def replace_first(text: str, old: str, new: str, description: str) -> str:
              if old not in text:
                  raise SystemExit(f"Expected at least one {description} match")
              return text.replace(old, new, 1)
          '''.replace('          ', '')
          if text.count(anchor) != 1:
              raise SystemExit('Could not locate replace_once helper exactly once')
          text = text.replace(anchor, addition)

          target = '''layout = replace_once(
              layout,
              '    for key, metric in result.get("secondaryMetrics", {}).items():\\n',
          '''.replace('          ', '')
          replacement = target.replace('replace_once', 'replace_first', 1)
          if text.count(target) != 1:
              raise SystemExit('Could not locate layout secondary traversal replacement')
          text = text.replace(target, replacement)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove this one-shot workflow
        run: rm .github/workflows/repair-issue285-helper.yml

      - name: Commit helper repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/scripts/apply-issue285-jmh-schema-validation.py \
            .github/workflows/repair-issue285-helper.yml
          git commit -m 'Disambiguate issue 285 patch transformation'
          git push origin "HEAD:${HEAD_REF}"
