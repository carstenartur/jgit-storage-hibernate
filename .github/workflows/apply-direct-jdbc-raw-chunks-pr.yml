name: Apply and verify direct JDBC raw-chunk hot path

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'perf/direct-jdbc-pack-chunk-writer'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/direct-jdbc-pack-chunk-writer
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Remove ORM entity allocation from direct JDBC hot path
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path(
              'jgit-storage-hibernate-core/src/main/java/'
              'io/github/carstenartur/jgit/storage/hibernate/objects/'
              'StagedPackExtensionStore.java'
          )
          text = path.read_text(encoding='utf-8')
          import_line = (
              'import io.github.carstenartur.jgit.storage.hibernate.entity.'
              'GitPackChunkEntity;\n'
          )
          if import_line not in text:
              raise SystemExit('Expected GitPackChunkEntity import was not found')
          text = text.replace(import_line, '', 1)

          method_start = text.index('  private void persistChunks(')
          method_end = text.index(
              '\n  private static long committedPayloadBytes', method_start
          )
          replacement = '''  private void persistChunks(
              Session session, Long packId, StagedExtension stagedExtension) throws IOException {
            long fileSize = stagedExtension.fileSize();
            long position = 0;
            int chunkIndex = 0;
            List<byte[]> pendingChunks = new ArrayList<>(CHUNK_BATCH_SIZE);
            try (HibernatePackChunkWriter chunkWriter = HibernatePackChunkWriter.open(session);
                StagedPayloadReader reader = stagedExtension.openReader()) {
              while (position < fileSize) {
                int chunkLength =
                    (int) Math.min(HibernateObjDatabase.PACK_CHUNK_SIZE, fileSize - position);
                byte[] chunkData = new byte[chunkLength];
                ByteBuffer destination = ByteBuffer.wrap(chunkData);
                long chunkPosition = position;
                while (destination.hasRemaining()) {
                  int count = reader.read(chunkPosition, destination);
                  if (count <= 0) {
                    throw new IOException("Staged pack payload ended before declared size " + fileSize);
                  }
                  chunkPosition += count;
                }

                pendingChunks.add(chunkData);
                position += chunkLength;
                chunkIndex++;
                if (pendingChunks.size() == CHUNK_BATCH_SIZE) {
                  chunkWriter.insert(
                      packId, chunkIndex - pendingChunks.size(), pendingChunks);
                  pendingChunks.clear();
                }
              }
              if (!pendingChunks.isEmpty()) {
                chunkWriter.insert(packId, chunkIndex - pendingChunks.size(), pendingChunks);
              }
            }
          }
          '''
          text = text[:method_start] + replacement.rstrip() + text[method_end:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify core module
        shell: bash
        run: |
          git diff --check
          mvn -B -pl jgit-storage-hibernate-core -am test

      - name: Commit verified hot-path refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/apply-direct-jdbc-raw-chunks.yml \
            .github/workflows/apply-direct-jdbc-raw-chunks-pr.yml
          git add -A
          git commit -m 'Avoid ORM entity allocation in direct JDBC writer [direct-jdbc-raw-chunks-applied]'
          git push origin HEAD:perf/direct-jdbc-pack-chunk-writer
