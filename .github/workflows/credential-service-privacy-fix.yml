name: Credential service privacy fix

on:
  push:
    branches:
      - feature/security-credential-service
    paths:
      - '.github/workflows/credential-service-privacy-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    name: Patch and verify credential privacy
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Patch credential privacy contracts
        run: python3 .github/scripts/credential_service_privacy_fix.py

      - name: Run focused credential contracts
        run: >-
          mvn -B -ntp
          -pl jgit-storage-hibernate-security
          -am
          -Dtest=HibernateSecurityCredentialServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Commit source fix and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jgit-storage-hibernate-security/src/main/java/io/github/carstenartur/jgit/storage/hibernate/security/HibernateSecurityCredentialService.java
          git add jgit-storage-hibernate-security/src/test/java/io/github/carstenartur/jgit/storage/hibernate/security/HibernateSecurityCredentialServiceTest.java
          git rm .github/workflows/credential-service-privacy-fix.yml
          git rm .github/scripts/credential_service_privacy_fix.py
          git commit -m "Conceal password denials and stabilize token versions"
          git push origin HEAD:feature/security-credential-service
