name: Publish released server image

on:
  workflow_run:
    workflows: [ Release ]
    types: [ completed ]
  push:
    branches: [ main ]
    paths:
      - 'docs/current-release-version.txt'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-search/**'
      - 'jgit-storage-hibernate-smart-http/**'
      - 'jgit-storage-hibernate-spring-boot-*/**'
      - 'jgit-storage-hibernate-server/**'
      - '.github/scripts/verify-server-image-delivery.py'
      - '.github/workflows/server-image.yml'
      - '.github/workflows/server-image-release.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing immutable Git tag to publish (vX.Y.Z); empty uses docs/current-release-version.txt'
        required: false
        default: ''
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: released-server-image-${{ inputs.release_tag || github.event.workflow_run.id || github.sha }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/carstenartur/jgit-storage-hibernate-server

jobs:
  publish:
    name: Publish immutable release image and latest alias
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout delivery contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Verify server image delivery contract
        run: python3 .github/scripts/verify-server-image-delivery.py

      - name: Resolve and validate immutable release tag
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          release_tag=${REQUESTED_TAG}
          if [[ -z "$release_tag" ]]; then
            release_version=$(tr -d '[:space:]' < docs/current-release-version.txt)
            release_tag="v${release_version}"
          else
            release_version=${release_tag#v}
          fi

          if [[ ! "$release_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release image tag must use vX.Y.Z, found '$release_tag'."
            exit 1
          fi
          if [[ "$release_version" != "${release_tag#v}" ]]; then
            echo "::error::Release version and tag disagree."
            exit 1
          fi

          git fetch --force origin "refs/tags/$release_tag:refs/tags/$release_tag"
          release_sha=$(git rev-parse "$release_tag^{commit}")
          git show "$release_tag:pom.xml" > "${RUNNER_TEMP}/release-pom.xml"
          pom_version=$(python3 - "${RUNNER_TEMP}/release-pom.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse(sys.argv[1]).getroot()
          value = root.findtext("{http://maven.apache.org/POM/4.0.0}version")
          if value is None:
              raise SystemExit("release pom.xml has no project version")
          print(value.strip())
          PY
          )
          if [[ "$pom_version" != "$release_version" ]]; then
            echo "::error::$release_tag contains Maven version '$pom_version', expected '$release_version'."
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=$release_version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$release_sha" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Inspect immutable image tags
        id: existing
        shell: bash
        run: |
          set -euo pipefail
          version_ref="${IMAGE_NAME}:${{ steps.release.outputs.version }}"
          tag_ref="${IMAGE_NAME}:${{ steps.release.outputs.tag }}"
          version_exists=false
          tag_exists=false
          docker buildx imagetools inspect "$version_ref" >/dev/null 2>&1 && version_exists=true
          docker buildx imagetools inspect "$tag_ref" >/dev/null 2>&1 && tag_exists=true

          needs_build=false
          repair=none
          if [[ "$version_exists" == false && "$tag_exists" == false ]]; then
            needs_build=true
          elif [[ "$version_exists" == false ]]; then
            repair=version
          elif [[ "$tag_exists" == false ]]; then
            repair=tag
          fi

          echo "needs_build=$needs_build" >> "$GITHUB_OUTPUT"
          echo "repair=$repair" >> "$GITHUB_OUTPUT"

      - name: Checkout immutable release source
        if: steps.existing.outputs.needs_build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.tag }}
          path: release-source
          fetch-depth: 1

      - name: Derive release image metadata
        if: steps.existing.outputs.needs_build == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}
            type=raw,value=${{ steps.release.outputs.tag }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=jgit-storage-hibernate server
            org.opencontainers.image.description=PostgreSQL-backed Git Smart HTTP server with searchable history
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.release.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.licenses=BSD-3-Clause

      - name: Publish immutable multi-platform release image
        if: steps.existing.outputs.needs_build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: release-source
          file: release-source/jgit-storage-hibernate-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jgit-storage-hibernate-server-release
          cache-to: type=gha,mode=max,scope=jgit-storage-hibernate-server-release
          provenance: mode=max
          sbom: true

      - name: Repair a missing immutable alias
        if: steps.existing.outputs.repair != 'none'
        shell: bash
        run: |
          set -euo pipefail
          version_ref="${IMAGE_NAME}:${{ steps.release.outputs.version }}"
          tag_ref="${IMAGE_NAME}:${{ steps.release.outputs.tag }}"
          if [[ "${{ steps.existing.outputs.repair }}" == version ]]; then
            docker buildx imagetools create --tag "$version_ref" "$tag_ref"
          else
            docker buildx imagetools create --tag "$tag_ref" "$version_ref"
          fi

      - name: Move latest to the verified immutable release
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:latest" \
            "${IMAGE_NAME}:${{ steps.release.outputs.tag }}"

      - name: Anonymous pull verifies public release delivery
        shell: bash
        run: |
          set -euo pipefail
          docker logout ghcr.io
          image="${IMAGE_NAME}:${{ steps.release.outputs.version }}"
          settings="https://github.com/users/${GITHUB_REPOSITORY_OWNER}/packages/container/jgit-storage-hibernate-server/settings"
          if ! docker pull "$image"; then
            echo "::error title=GHCR package is not public::The image was published, but GitHub initializes new container packages as private. Open $settings, choose Change visibility -> Public, then rerun this workflow."
            {
              echo '### One-time GHCR visibility bootstrap required'
              echo
              echo "The image push succeeded, but an anonymous pull of \`$image\` failed because the new package is not public."
              echo
              echo "Open: $settings"
              echo
              echo 'Choose **Change visibility → Public**, confirm the irreversible change, and rerun this workflow.'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
