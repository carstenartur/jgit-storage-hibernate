name: Capture release 0.1.10 failed log

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/release-failure-report-2.yml'

permissions:
  actions: read
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Capture failed release log
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh run view 30149281130 --repo "$REPOSITORY" --log-failed > /tmp/failure.txt 2>&1 || true
          tail -n 500 /tmp/failure.txt > /tmp/failure-tail.txt
          content=$(base64 -w0 /tmp/failure-tail.txt)
          gh api -X PUT "repos/${REPOSITORY}/contents/.github/release-0.1.10-failure.txt" \
            -f message='Capture release 0.1.10 failure' \
            -f content="$content" \
            -f branch=main >/dev/null
