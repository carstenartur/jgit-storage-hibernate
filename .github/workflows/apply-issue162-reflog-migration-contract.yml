name: Apply issue 162 reflog migration contract

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-issue162-reflog-migration-contract-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/162-git-aware-reflog-batching
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply exact migration contract
        run: python3 .github/scripts/apply-issue162-reflog-migration-contract.py

      - name: Run focused Core contracts
        run: |
          mvn -B -pl jgit-storage-hibernate-core -am test \
            -Dtest=HibernateReflogBatchProcessorH2Test,GitReflogEntityMappingTest,CoreSchemaMigrationIntegrationTest \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Verify patch shape
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"0.9.2"' \
            jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/CoreSchemaMigrationIntegrationTest.java
          test "$(find jgit-storage-hibernate-core/src/main/resources/db/migration/jgit-storage-hibernate/core -name 'V0_9_2__add_reflog_delivery_id.sql' | wc -l)" -eq 4
          git diff --check

      - name: Prepare source-only validated commit
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- .github/workflows/git-aware-reflog-batch.yml
          git diff --check

      - name: Commit validated migration contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/CoreSchemaMigrationIntegrationTest.java \
            jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/refs/HibernateReflogBatchProcessorH2Test.java \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/ReflogBatchNativeTelemetryTest.java
          if git diff --cached --quiet; then
            echo 'Expected validated migration-contract changes' >&2
            exit 1
          fi
          git commit -m 'Validate reflog delivery migration contract'
          git push origin HEAD:feat/162-git-aware-reflog-batching
