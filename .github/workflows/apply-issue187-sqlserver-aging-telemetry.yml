name: Apply issue 187 SQL Server aging telemetry

on:
  push:
    branches:
      - feat/187-sqlserver-aging-telemetry
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-issue187-sqlserver-aging-telemetry
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HEAD_REF: feat/187-sqlserver-aging-telemetry

    steps:
      - name: Checkout telemetry branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Detect pending transformation
        id: helper
        shell: bash
        run: |
          if test -f .github/scripts/apply-issue187-sqlserver-aging-telemetry.py; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'The validated cross-database transformation is already committed.'
          fi

      - name: Set up JDK 21
        if: steps.helper.outputs.exists == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker
        if: steps.helper.outputs.exists == 'true'
        run: docker info

      - name: Apply SQL Server repository-aging support
        if: steps.helper.outputs.exists == 'true'
        run: |
          python3 .github/scripts/apply-issue187-sqlserver-aging-telemetry.py
          python3 -m py_compile .github/scripts/apply-issue187-sqlserver-aging-telemetry.py
          git diff --check

      - name: Build benchmark dependencies
        if: steps.helper.outputs.exists == 'true'
        run: mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests

      - name: Run snapshot and direct setup regressions
        if: steps.helper.outputs.exists == 'true'
        run: |
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=DatabaseTelemetrySnapshotTest,RepositoryAgingBenchmarkTest

      - name: Run PostgreSQL and SQL Server exact phase matrices
        if: steps.helper.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for backend in postgresql sqlserver; do
            root="$GITHUB_WORKSPACE/target/issue187-aging-$backend"
            rm -rf "$root"
            mkdir -p "$root"
            mvn -B -pl jgit-storage-hibernate-benchmarks verify \
              -Pperformance-investigations \
              -Dtest=DatabaseTelemetrySnapshotTest \
              -Djgit.storage.benchmark.investigation=repository-aging \
              -Djgit.storage.benchmark.investigation.profile=smoke \
              -Djgit.storage.benchmark.repository-aging.native-smoke=true \
              -Djgit.storage.benchmark.repository-aging.database-backend="$backend" \
              -Djgit.storage.benchmark.database-telemetry.enabled=true \
              -Dbenchmark.resultFile="$root/jmh-result.json" 2>&1 \
              | tee "$root/maven-benchmark.log"
          done

      - name: Validate cross-database phase attribution and privacy
        if: steps.helper.outputs.exists == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import collections
          import datetime
          import json
          from pathlib import Path

          metric_by_backend = {
              'postgresql': 'postgresql.wal.insert_lsn_bytes',
              'sqlserver': 'sqlserver.io.log.bytes_written',
          }
          summaries = []
          for backend, required_metric in metric_by_backend.items():
              root = Path(f'target/issue187-aging-{backend}')
              telemetry_path = root / 'repository-aging-database-telemetry.json'
              ndjson_path = root / 'repository-aging-database-telemetry.ndjson'
              jmh_path = root / 'jmh-result.json'
              output_path = root / 'repository-aging-jmh-output.txt'
              for path in (telemetry_path, ndjson_path, jmh_path, output_path):
                  if not path.is_file() or path.stat().st_size < 3:
                      raise SystemExit(f'Missing retained {backend} aging evidence {path}')

              telemetry_text = telemetry_path.read_text(encoding='utf-8')
              if 'NaN' in telemetry_text or 'Infinity' in telemetry_text:
                  raise SystemExit(f'{backend} telemetry is not strict JSON')
              observations = json.loads(telemetry_text)['observations']
              jmh = json.loads(jmh_path.read_text(encoding='utf-8'))
              if len(jmh) != 9:
                  raise SystemExit(
                      f'Expected 9 {backend} JMH results, found {len(jmh)}'
                  )
              if len(observations) != 27:
                  raise SystemExit(
                      f'Expected 27 {backend} phase observations, found {len(observations)}'
                  )

              def base_from_jmh(item):
                  params = item['params']
                  if params['backend'] != backend:
                      raise SystemExit(
                          f'Unexpected JMH backend {params["backend"]!r} in {backend} matrix'
                      )
                  return (
                      item['benchmark'].rsplit('.', 1)[-1],
                      params['backend'],
                      params['pushes'],
                      params['maintenanceMode'],
                      params['cacheState'],
                      params['deployment'],
                  )

              def base_from_observation(item):
                  coordinate = item['coordinate']
                  return (
                      coordinate['benchmarkMethod'],
                      coordinate['backend'],
                      coordinate['pushes'],
                      coordinate['maintenanceMode'],
                      coordinate['cacheState'],
                      coordinate['deployment'],
                  )

              jmh_bases = {base_from_jmh(item) for item in jmh}
              phase_counts = collections.Counter(
                  (base_from_observation(item), item['coordinate']['phase'])
                  for item in observations
              )
              telemetry_bases = {base for base, _ in phase_counts}
              if telemetry_bases != jmh_bases:
                  raise SystemExit(
                      f'{backend} JMH/telemetry coordinates differ: '
                      f'{telemetry_bases ^ jmh_bases}'
                  )
              expected_phases = {'fixture-build', 'maintenance', 'measurement'}
              for base in jmh_bases:
                  phases = {
                      phase
                      for (candidate, phase), count in phase_counts.items()
                      if candidate == base and count == 1
                  }
                  if phases != expected_phases:
                      raise SystemExit(
                          f'Incomplete {backend} phases for {base}: {phases}'
                      )

              metric_by_phase = collections.defaultdict(list)
              for item in observations:
                  coordinate = item['coordinate']
                  phase = coordinate['phase']
                  if item['backend'] != backend:
                      raise SystemExit(
                          f'Unexpected telemetry backend {item["backend"]!r}'
                      )
                  if coordinate['databaseBackend'] != backend:
                      raise SystemExit(
                          f'Unexpected database coordinate {coordinate}'
                      )
                  expected_iteration = '1' if phase == 'measurement' else '0'
                  if coordinate['measurementIteration'] != expected_iteration:
                      raise SystemExit(f'Unexpected phase iteration {coordinate}')
                  for field in (
                      'coordinate', 'counters', 'gauges', 'metadata', 'unsupported'
                  ):
                      keys = list(item[field])
                      if keys != sorted(keys):
                          raise SystemExit(
                              f'{backend} {field} keys are not deterministic for '
                              f'{coordinate}: {keys}'
                          )
                  value = item['counters'].get(required_metric)
                  if value is None or value < 0:
                      raise SystemExit(
                          f'Missing {required_metric} for {coordinate}: {value}'
                      )
                  metric_by_phase[phase].append(value)
                  if phase == 'fixture-build' and value <= 0:
                      raise SystemExit(
                          f'{backend} fixture build produced no log delta: {coordinate}'
                      )
                  if (
                      phase == 'maintenance'
                      and coordinate['maintenanceMode'] != 'none'
                      and value <= 0
                  ):
                      raise SystemExit(
                          f'{backend} maintenance produced no log delta: {coordinate}'
                      )
                  start = datetime.datetime.fromisoformat(
                      item['startedAt'].replace('Z', '+00:00')
                  )
                  end = datetime.datetime.fromisoformat(
                      item['completedAt'].replace('Z', '+00:00')
                  )
                  if end < start:
                      raise SystemExit(
                          f'Negative {backend} telemetry window for {coordinate}'
                      )

              ndjson_lines = [
                  line
                  for line in ndjson_path.read_text(encoding='utf-8').splitlines()
                  if line
              ]
              if len(ndjson_lines) != len(observations):
                  raise SystemExit(
                      f'{backend} NDJSON/aggregate count mismatch: '
                      f'{len(ndjson_lines)} != {len(observations)}'
                  )
              for line in ndjson_lines:
                  json.loads(line)

              summaries.append(
                  f'{backend}: '
                  + ', '.join(
                      f'{phase} {min(values)}..{max(values)} bytes'
                      for phase, values in sorted(metric_by_phase.items())
                  )
              )

          forbidden = (
              'jgit.storage.benchmark.postgresql.url=',
              'jgit.storage.benchmark.postgresql.user=',
              'jgit.storage.benchmark.postgresql.password=',
              'jgit.storage.benchmark.sqlserver.url=',
              'jgit.storage.benchmark.sqlserver.user=',
              'jgit.storage.benchmark.sqlserver.password=',
              'jdbc:postgresql://',
              'jdbc:sqlserver://',
              'Database JDBC URL',
              'Default catalog/schema',
          )
          scan_roots = [
              Path('target/issue187-aging-postgresql'),
              Path('target/issue187-aging-sqlserver'),
              Path('jgit-storage-hibernate-benchmarks/target/failsafe-reports'),
          ]
          for scan_root in scan_roots:
              if not scan_root.exists():
                  continue
              for path in scan_root.rglob('*'):
                  if not path.is_file():
                      continue
                  content = path.read_bytes().decode('utf-8', errors='replace')
                  for token in forbidden:
                      if token in content:
                          raise SystemExit(
                              f'Sensitive token {token!r} found in {path}'
                          )
          leftovers = list(
              Path('/tmp').glob('jgit-storage-benchmark-connection-*.properties')
          )
          if leftovers:
              raise SystemExit(f'Temporary credential files remain: {leftovers}')

          print('Validated cross-database repository-aging phases; ' + '; '.join(summaries))
          PY

      - name: Verify source and documentation contracts
        if: steps.helper.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'case PackStorageLayoutBenchmark.SQL_SERVER' \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/RepositoryAgingBenchmark.java
          grep -F 'REPOSITORY_AGING_DATABASE_BACKEND_PROPERTY' \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/PerformanceInvestigationsBenchmarkIT.java
          grep -F 'PostgreSQL and SQL Server' \
            docs/operations/database-native-telemetry.md

      - name: Remove transformation helper
        if: steps.helper.outputs.exists == 'true'
        run: rm .github/scripts/apply-issue187-sqlserver-aging-telemetry.py

      - name: Commit validated implementation
        if: steps.helper.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/RepositoryAgingBenchmark.java \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/PerformanceInvestigationsBenchmarkIT.java \
            docs/operations/database-native-telemetry.md \
            docs/performance-status.md \
            .github/scripts/apply-issue187-sqlserver-aging-telemetry.py
          if git diff --cached --quiet; then
            echo 'Expected SQL Server aging implementation produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Add SQL Server repository-aging phase telemetry'
          git push origin "HEAD:${HEAD_REF}"

      - name: Upload cross-database validation evidence
        if: steps.helper.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue187-cross-database-aging-telemetry
          path: |
            target/issue187-aging-postgresql/**
            target/issue187-aging-sqlserver/**
            jgit-storage-hibernate-benchmarks/target/failsafe-reports/**
          if-no-files-found: warn
