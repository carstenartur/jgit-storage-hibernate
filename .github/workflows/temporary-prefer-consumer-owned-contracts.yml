name: Temporary prefer consumer-owned contracts

on:
  push:
    branches:
      - ci/consumer-contracts

permissions:
  contents: write

concurrency:
  group: temporary-prefer-consumer-owned-contracts
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/consumer-contracts
          fetch-depth: 0
      - name: Add the repository-owned contract handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/consumer-compatibility.yml')
          text = path.read_text(encoding='utf-8')
          anchor = "      - name: Run audio-analyzer runtime contract\n"
          owned = """      - name: Run repository-owned consumer contract when available
        id: owned_contract
        shell: bash
        working-directory: consumer
        env:
          JGIT_STORAGE_HIBERNATE_VERSION: ${{ needs.current-library.outputs.version }}
          JGIT_STORAGE_HIBERNATE_COMMIT: ${{ needs.current-library.outputs.commit }}
          MAVEN_REPO_LOCAL: ${{ runner.temp }}/consumer-m2
        run: |
          set -euo pipefail
          contract=.github/jgit-storage-hibernate-contract.sh
          if [ ! -x "$contract" ]; then
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo 'No repository-owned contract yet; using the documented central fallback.'
            exit 0
          fi
          echo 'available=true' >> "$GITHUB_OUTPUT"
          set -o pipefail
          "$contract" 2>&1 \
            | tee ../target/consumer-compatibility/consumer-build.log

"""
          if 'id: owned_contract' not in text:
              if anchor not in text:
                  raise SystemExit('Could not locate consumer fallback steps')
              text = text.replace(anchor, owned + anchor, 1)

          replacements = {
              "if: matrix.consumer == 'audio-analyzer'": (
                  "if: matrix.consumer == 'audio-analyzer' && "
                  "steps.owned_contract.outputs.available != 'true'"
              ),
              "if: matrix.consumer == 'Taxonomy'": (
                  "if: matrix.consumer == 'Taxonomy' && "
                  "steps.owned_contract.outputs.available != 'true'"
              ),
              "if: matrix.consumer == 'sandbox'": (
                  "if: matrix.consumer == 'sandbox' && "
                  "steps.owned_contract.outputs.available != 'true'"
              ),
          }
          # Do not alter the earlier Docker readiness condition for Taxonomy.
          docker_marker = "      - name: Verify Docker for integration-capable consumers\n"
          docker_start = text.index(docker_marker)
          dependency_marker = "      - name: Resolve repository-owned dependency tree\n"
          dependency_start = text.index(dependency_marker)
          prefix = text[:dependency_start]
          suffix = text[dependency_start:]
          for old, new in replacements.items():
              suffix = suffix.replace(old, new, 1)
          text = prefix + suffix

          path.write_text(text, encoding='utf-8')
          Path('.github/workflows/temporary-prefer-consumer-owned-contracts.yml').unlink()
          PY
          python3 .github/scripts/test_prepare_consumer_contract.py
          git diff --check
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Prefer repository-owned consumer compatibility contracts'
          git push origin HEAD:ci/consumer-contracts
