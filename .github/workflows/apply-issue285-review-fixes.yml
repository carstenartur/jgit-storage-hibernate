name: Apply issue 285 review fixes

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-issue285-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      FULL_RUN_ID: '32445558882'
      CAPACITY_RUN_ID: '32505334226'
      CONCURRENCY_RUN_ID: '32445552863'

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Retain pre-review converters
        run: |
          mkdir -p /tmp/issue285-review-baseline
          cp .github/scripts/jmh_evidence_schema.py \
            /tmp/issue285-review-baseline/jmh_evidence_schema.py
          cp .github/scripts/convert-jmh-pack-storage-layout.py \
            /tmp/issue285-review-baseline/convert-jmh-pack-storage-layout.py
          cp .github/scripts/convert-jmh-pack-storage-layout-concurrency.py \
            /tmp/issue285-review-baseline/convert-jmh-pack-storage-layout-concurrency.py

      - name: Apply review fixes
        run: python3 .github/scripts/apply-issue285-review-fixes.py

      - name: Compile and run all converter regressions
        run: |
          python3 -m py_compile \
            .github/scripts/jmh_evidence_schema.py \
            .github/scripts/convert-jmh-pack-storage-layout.py \
            .github/scripts/convert-jmh-pack-storage-layout-concurrency.py \
            .github/scripts/test_convert_jmh_pack_storage_layout.py \
            .github/scripts/test_convert_jmh_pack_storage_layout_concurrency.py
          python3 .github/scripts/test_convert_jmh_pack_storage_layout.py
          python3 .github/scripts/test_convert_jmh_pack_storage_layout_concurrency.py

      - name: Download retained valid sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/issue285-review-source/full \
            target/issue285-review-source/capacity \
            target/issue285-review-source/concurrency
          gh run download "$FULL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name pack-storage-layout-production-decision-full \
            --dir target/issue285-review-source/full
          gh run download "$CAPACITY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name pack-storage-layout-production-decision-capacity \
            --dir target/issue285-review-source/capacity
          gh run download "$CONCURRENCY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name pack-storage-layout-postgresql-concurrency-smoke \
            --dir target/issue285-review-source/concurrency

      - name: Prove valid output is unchanged by review fixes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/issue285-review-equivalence
          for profile in full capacity; do
            PYTHONPATH=/tmp/issue285-review-baseline \
              python3 /tmp/issue285-review-baseline/convert-jmh-pack-storage-layout.py \
              "target/issue285-review-source/$profile/production-jmh-result.json" \
              "target/issue285-review-equivalence/baseline-$profile"
            python3 .github/scripts/convert-jmh-pack-storage-layout.py \
              "target/issue285-review-source/$profile/production-jmh-result.json" \
              "target/issue285-review-equivalence/current-$profile"
            diff -ru \
              "target/issue285-review-equivalence/baseline-$profile" \
              "target/issue285-review-equivalence/current-$profile"
          done
          source=target/issue285-review-source/concurrency/target/pack-storage-layout-concurrency/jmh-result.json
          PYTHONPATH=/tmp/issue285-review-baseline \
            python3 /tmp/issue285-review-baseline/convert-jmh-pack-storage-layout-concurrency.py \
            "$source" target/issue285-review-equivalence/baseline-concurrency
          python3 .github/scripts/convert-jmh-pack-storage-layout-concurrency.py \
            "$source" target/issue285-review-equivalence/current-concurrency
          diff -ru \
            target/issue285-review-equivalence/baseline-concurrency \
            target/issue285-review-equivalence/current-concurrency

      - name: Verify review contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'not value.is_integer()' .github/scripts/jmh_evidence_schema.py
          grep -F 'isinstance(value, bool)' .github/scripts/convert-jmh-pack-storage-layout.py
          grep -F 'isinstance(value, bool)' .github/scripts/convert-jmh-pack-storage-layout-concurrency.py
          grep -F 'Unsupported {context} score unit' .github/scripts/convert-jmh-pack-storage-layout.py
          grep -F 'Unsupported {context} score unit' .github/scripts/convert-jmh-pack-storage-layout-concurrency.py
          git diff --check

      - name: Remove one-shot review tooling
        run: |
          rm .github/scripts/apply-issue285-review-fixes.py
          rm .github/workflows/apply-issue285-review-fixes.yml

      - name: Commit validated review fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/scripts/jmh_evidence_schema.py \
            .github/scripts/convert-jmh-pack-storage-layout.py \
            .github/scripts/convert-jmh-pack-storage-layout-concurrency.py \
            .github/scripts/test_convert_jmh_pack_storage_layout.py \
            .github/scripts/test_convert_jmh_pack_storage_layout_concurrency.py \
            .github/scripts/apply-issue285-review-fixes.py \
            .github/workflows/apply-issue285-review-fixes.yml
          if git diff --cached --quiet; then
            echo 'Expected issue #285 review fixes produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Harden JMH numeric validation diagnostics'
          git push origin "HEAD:${HEAD_REF}"

      - name: Upload review equivalence evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue285-review-equivalence
          path: target/issue285-review-equivalence/**
          if-no-files-found: error
