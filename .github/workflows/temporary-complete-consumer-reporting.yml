name: Temporary complete consumer reporting

on:
  push:
    branches:
      - ci/consumer-contracts

permissions:
  contents: write

concurrency:
  group: temporary-complete-consumer-reporting
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/consumer-contracts
          fetch-depth: 0
      - name: Complete report fields and contract ownership docs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/consumer-compatibility.yml')
          workflow = workflow_path.read_text(encoding='utf-8')
          old = '''          modules = ', '.join(data.get('modules', [])) or 'unavailable'
          lines = [
              f"### {os.environ['CONSUMER']} consumer contract",
              '',
              f"- Consumer commit: `{commit}`",
              f"- Current library version: `{os.environ['LIBRARY_VERSION']}`",
              f"- Consumed modules: {modules}",
              f"- Contract: {os.environ['CONTRACT']}",
              f"- Job status: `{os.environ['JOB_STATUS']}`",
              '',
          ]
'''
          new = '''          modules = ', '.join(data.get('modules', [])) or 'unavailable'
          dependency_uses = data.get('dependencyUses', [])
          literal_versions = {
              use.get('declared_version')
              for use in dependency_uses
              if use.get('declared_version') not in {None, '(managed)'}
              and not str(use.get('declared_version')).startswith('${')
          }
          property_versions = {
              change.get('previous_value')
              for change in data.get('propertyChanges', [])
              if change.get('previous_value')
          }
          original_versions = sorted(literal_versions | property_versions)
          original = ', '.join(f'`{version}`' for version in original_versions) or 'managed/unavailable'
          changed_poms = ', '.join(
              f"`{pom}`" for pom in data.get('changedPoms', [])
          ) or 'none'
          lines = [
              f"### {os.environ['CONSUMER']} consumer contract",
              '',
              f"- Consumer commit: `{commit}`",
              f"- Original library declaration(s): {original}",
              f"- Substituted library version: `{os.environ['LIBRARY_VERSION']}`",
              f"- Consumed modules: {modules}",
              f"- Changed POMs: {changed_poms}",
              f"- Contract: {os.environ['CONTRACT']}",
              f"- Repository-owned contract available: `{os.environ.get('OWNED_CONTRACT', 'unknown')}`",
              f"- Job status: `{os.environ['JOB_STATUS']}`",
              '',
          ]
'''
          if old in workflow:
              workflow = workflow.replace(old, new, 1)
          elif 'Original library declaration(s)' not in workflow:
              raise SystemExit('Could not extend consumer summary')

          env_anchor = '          JOB_STATUS: ${{ job.status }}\n'
          owned_env = (
              '          OWNED_CONTRACT: '
              "${{ steps.owned_contract.outputs.available || 'false' }}\n"
          )
          if '          OWNED_CONTRACT:' not in workflow:
              if env_anchor not in workflow:
                  raise SystemExit('Could not locate summary environment')
              workflow = workflow.replace(env_anchor, env_anchor + owned_env, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          docs_path = Path('docs/operations/consumer-compatibility.md')
          docs = docs_path.read_text(encoding='utf-8')
          anchor = (
              'No compatibility run commits changes to a consumer repository. '
              'A missing dependency or a version that cannot be substituted deterministically '
              'is a failure rather than a silent skip.\n'
          )
          addition = (
              anchor
              + '\nEach consumer may provide an executable '
              + '`\.github/jgit-storage-hibernate-contract.sh`. The central matrix passes '
              + '`JGIT_STORAGE_HIBERNATE_VERSION`, `JGIT_STORAGE_HIBERNATE_COMMIT` and '
              + '`MAVEN_REPO_LOCAL` and prefers that repository-owned contract. The central '
              + 'commands are transitional fallbacks only; test ownership stays with the consumer.\n'
          )
          if 'JGIT_STORAGE_HIBERNATE_VERSION' not in docs:
              if anchor not in docs:
                  raise SystemExit('Could not locate consumer ownership documentation anchor')
              docs = docs.replace(anchor, addition, 1)
          docs_path.write_text(docs, encoding='utf-8')

          Path('.github/workflows/temporary-complete-consumer-reporting.yml').unlink()
          PY
          python3 .github/scripts/test_prepare_consumer_contract.py
          git diff --check
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Complete consumer contract reporting'
          git push origin HEAD:ci/consumer-contracts
