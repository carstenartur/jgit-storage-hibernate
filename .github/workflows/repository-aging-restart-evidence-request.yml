name: Dispatch Repository Aging Restart Evidence

on:
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/repository-aging-restart-evidence-request.yml'
      - '.github/scripts/validate_repository_aging_restart_request.py'
      - '.github/scripts/test_validate_repository_aging_restart_request.py'
      - '.github/scripts/test_repository_aging_restart_evidence_request_workflow.py'
  push:
    branches:
      - 'evidence/repository-aging-restart/**'
    paths:
      - '.github/repository-aging-restart-evidence-request.json'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    name: Reviewed dispatch contract
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test request validation and workflow scope
        run: |
          python3 -m py_compile \
            .github/scripts/validate_repository_aging_restart_request.py \
            .github/scripts/test_validate_repository_aging_restart_request.py \
            .github/scripts/test_repository_aging_restart_evidence_request_workflow.py
          python3 .github/scripts/test_validate_repository_aging_restart_request.py
          python3 .github/scripts/test_repository_aging_restart_evidence_request_workflow.py

  dispatch:
    name: Dispatch full evidence from current main
    if: github.event_name == 'push'
    permissions:
      actions: write
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate request against current main
        id: request
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/main:refs/remotes/origin/main
          source_commit="$(git rev-parse refs/remotes/origin/main)"
          python3 .github/scripts/validate_repository_aging_restart_request.py \
            --request .github/repository-aging-restart-evidence-request.json \
            --expected-source-commit "$source_commit" \
            --github-output "$GITHUB_OUTPUT"

      - name: Dispatch full restart evidence on main
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --silent --show-error \
            --output "$response" \
            --write-out '%{http_code}' \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/repository-aging-restart-evidence.yml/dispatches" \
            --data '{"ref":"main"}')"
          if [[ "$status" != 204 ]]; then
            printf 'Workflow dispatch failed with HTTP %s:\n' "$status" >&2
            cat "$response" >&2
            exit 1
          fi

      - name: Report reviewed dispatch
        run: |
          echo '### Full repository-aging restart evidence dispatched' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Request: `${{ steps.request.outputs.request-id }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Source: `${{ steps.request.outputs.source-commit }}`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Target workflow ref: `main`' >> "$GITHUB_STEP_SUMMARY"
