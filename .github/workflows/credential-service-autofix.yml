name: Credential service source fix

on:
  push:
    branches:
      - feature/security-credential-service
    paths:
      - .github/workflows/credential-service-autofix.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Patch credential service contracts
        shell: python
        run: |
          from pathlib import Path

          path = Path("jgit-storage-hibernate-security/src/main/java/io/github/carstenartur/jgit/storage/hibernate/security/HibernateSecurityCredentialService.java")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  '''            if (credential == null) {
              credential = new SecurityLocalCredentialEntity();
              credential.setPrincipalId(request.subjectPrincipalId());
              credential.setSecurityVersion(1);
              session.persist(credential);
            } else {
              credential.setSecurityVersion(nextVersion(credential.getSecurityVersion()));
            }
            credential.setPasswordAlgorithm(passwordHash.algorithm());
            credential.setPasswordVersion(passwordHash.version());
            credential.setPasswordHash(passwordHash.encodedHash());
            credential.setChangedAt(now);
            credential.setFailedAttemptCount(0);
            credential.setLockedUntil(null);
            record(
''',
                  '''            boolean newCredential = credential == null;
            if (newCredential) {
              credential = new SecurityLocalCredentialEntity();
              credential.setPrincipalId(request.subjectPrincipalId());
              credential.setSecurityVersion(1);
            } else {
              credential.setSecurityVersion(nextVersion(credential.getSecurityVersion()));
            }
            credential.setPasswordAlgorithm(passwordHash.algorithm());
            credential.setPasswordVersion(passwordHash.version());
            credential.setPasswordHash(passwordHash.encodedHash());
            credential.setChangedAt(now);
            credential.setFailedAttemptCount(0);
            credential.setLockedUntil(null);
            if (newCredential) {
              session.persist(credential);
            }
            record(
'''
              ),
              (
                  '''    try {
      AuthenticationOutcome outcome =
          sessionFactory.fromTransaction(
              session -> authenticatePassword(session, loginName, password, trace));
      return requireAuthenticated(outcome);
    } catch (DeniedAuthenticationAuditFailure denied) {
      throw denied.authenticationException();
    } catch (SecurityIdentityAuditPersistenceException auditFailure) {
      throw auditFailure;
    } catch (RuntimeException failure) {
      throw failedAuthentication(
          SecurityIdentityAuditOperation.PASSWORD_AUTHENTICATION,
          null,
          trace,
          SecurityCredentialKind.PASSWORD,
          null,
          failure);
    }
''',
                  '''    AuthenticationOutcome outcome;
    try {
      outcome =
          sessionFactory.fromTransaction(
              session -> authenticatePassword(session, loginName, password, trace));
    } catch (DeniedAuthenticationAuditFailure denied) {
      throw denied.authenticationException();
    } catch (SecurityIdentityAuditPersistenceException auditFailure) {
      throw auditFailure;
    } catch (RuntimeException failure) {
      throw failedAuthentication(
          SecurityIdentityAuditOperation.PASSWORD_AUTHENTICATION,
          null,
          trace,
          SecurityCredentialKind.PASSWORD,
          null,
          failure);
    }
    return requireAuthenticated(outcome);
'''
              ),
              (
                  '''    try {
      AuthenticationOutcome outcome =
          sessionFactory.fromTransaction(
              session -> authenticateAccessToken(session, tokenValue, prefix, trace));
      return requireAuthenticated(outcome);
    } catch (DeniedAuthenticationAuditFailure denied) {
      throw denied.authenticationException();
    } catch (SecurityIdentityAuditPersistenceException auditFailure) {
      throw auditFailure;
    } catch (RuntimeException failure) {
      throw failedAuthentication(
          SecurityIdentityAuditOperation.ACCESS_TOKEN_AUTHENTICATION,
          null,
          trace,
          SecurityCredentialKind.ACCESS_TOKEN,
          null,
          failure);
    }
''',
                  '''    AuthenticationOutcome outcome;
    try {
      outcome =
          sessionFactory.fromTransaction(
              session -> authenticateAccessToken(session, tokenValue, prefix, trace));
    } catch (DeniedAuthenticationAuditFailure denied) {
      throw denied.authenticationException();
    } catch (SecurityIdentityAuditPersistenceException auditFailure) {
      throw auditFailure;
    } catch (RuntimeException failure) {
      throw failedAuthentication(
          SecurityIdentityAuditOperation.ACCESS_TOKEN_AUTHENTICATION,
          null,
          trace,
          SecurityCredentialKind.ACCESS_TOKEN,
          null,
          failure);
    }
    return requireAuthenticated(outcome);
'''
              ),
              (
                  '''    if (permissionScopes.contains(null)) {
''',
                  '''    if (permissionScopes.stream().anyMatch(Objects::isNull)) {
'''
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one replacement match, found {count}")
              text = text.replace(old, new)

          path.write_text(text, encoding="utf-8")

      - name: Run focused credential contracts
        run: >-
          mvn -B -ntp
          -pl jgit-storage-hibernate-security
          -am
          -Dtest=HibernateSecurityCredentialServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Commit source fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jgit-storage-hibernate-security/src/main/java/io/github/carstenartur/jgit/storage/hibernate/security/HibernateSecurityCredentialService.java
          git rm .github/workflows/credential-service-autofix.yml
          git commit -m "Fix credential service transaction and denial paths"
          git push origin HEAD:feature/security-credential-service
