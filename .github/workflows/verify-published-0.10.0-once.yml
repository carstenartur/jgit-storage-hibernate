name: Verify published 0.10.0 once

on:
  push:
    branches:
      - fix/public-repository-parent-resolution

permissions:
  contents: write

concurrency:
  group: verify-published-0.10.0-once
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/public-repository-parent-resolution
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Resolve the published release anonymously
        env:
          PUBLIC_REPOSITORY_ATTEMPTS: '3'
          PUBLIC_REPOSITORY_RETRY_SECONDS: '5'
        run: |
          chmod +x .github/scripts/verify-public-repository-consumption.sh
          .github/scripts/verify-public-repository-consumption.sh 0.10.0

      - name: Remove the one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-published-0.10.0-once.yml
          git commit -m 'Remove one-shot public repository verification workflow'
          git push origin HEAD:fix/public-repository-parent-resolution
