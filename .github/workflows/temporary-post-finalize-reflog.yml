name: Temporary post-finalize reflog

on:
  push:
    branches:
      - perf/reflog-index-evidence

permissions:
  contents: write

concurrency:
  group: temporary-post-finalize-reflog
  cancel-in-progress: true

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/reflog-index-evidence
          fetch-depth: 0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Follow an earlier successful consolidating commit when present
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            git fetch origin perf/reflog-index-evidence
            git reset --hard origin/perf/reflog-index-evidence
            if [ ! -f .github/workflows/temporary-finalize-reflog-contracts.yml ]; then
              break
            fi
            sleep 5
          done

      - name: Apply idempotent final reflog expectations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path(
              'jgit-storage-hibernate-core/src/test/java/'
              'io/github/carstenartur/jgit/storage/hibernate'
          )
          migration = root / 'CoreSchemaMigrationIntegrationTest.java'
          text = migration.read_text(encoding='utf-8')
          old_tail = 'new ExpectedMigration("0.1.18", "optimize reverse reflog reads"));'
          new_tail = (
              'new ExpectedMigration("0.1.18", "optimize reverse reflog reads"),\n'
              '      new ExpectedMigration("0.9.1", "add reflog reference key"));'
          )
          if 'new ExpectedMigration("0.9.1", "add reflog reference key")' not in text:
              if old_tail not in text:
                  raise SystemExit('Could not extend the Core migration list')
              text = text.replace(old_tail, new_tail, 1)
          migration.write_text(text, encoding='utf-8')

          for path in root.rglob('*.java'):
              text = path.read_text(encoding='utf-8')
              original = text
              text = text.replace(
                  'assertEquals("0.1.18", flyway.info().current().getVersion().getVersion());',
                  'assertEquals("0.9.1", flyway.info().current().getVersion().getVersion());',
              )
              text = text.replace('IDX_REFLOG_REPO_REF_ID', 'IDX_REFLOG_REPO_REF_KEY_ID')
              text = text.replace('idx_reflog_repo_ref_id', 'idx_reflog_repo_ref_key_id')
              text = text.replace(
                  'indexExists(connection, "git_reflog", "idx_reflog_repo_id")',
                  'indexExists(connection, "git_reflog", "idx_reflog_repo_ref_key_id")',
              )
              if 'assertFalse(' in text and 'import static org.junit.jupiter.api.Assertions.assertFalse;' not in text:
                  anchor = 'import static org.junit.jupiter.api.Assertions.assertEquals;\n'
                  if anchor in text:
                      text = text.replace(
                          anchor,
                          anchor + 'import static org.junit.jupiter.api.Assertions.assertFalse;\n',
                          1,
                      )
              if text != original:
                  path.write_text(text, encoding='utf-8')

          def add_before(path: Path, anchor: str, lines: str, marker: str) -> None:
              if not path.is_file():
                  return
              text = path.read_text(encoding='utf-8')
              if marker in text:
                  return
              if anchor not in text:
                  raise SystemExit(f'Missing schema-adoption anchor in {path}')
              path.write_text(text.replace(anchor, lines + anchor, 1), encoding='utf-8')

          add_before(
              root / 'LegacyCoreSchemaAdoptionIntegrationTest.java',
              '      statement.execute("alter table git_reflog alter column repository_name set data type varchar(255)");',
              '      statement.execute("drop index if exists idx_reflog_repo_ref_key_id");\n'
              '      statement.execute("alter table git_reflog drop column if exists ref_name_key");\n',
              'drop column if exists ref_name_key',
          )
          add_before(
              root / 'LegacyCorePostgreSqlSchemaAdoptionIntegrationTest.java',
              '      statement.execute("alter table git_reflog alter column repository_name type varchar(255)");',
              '      statement.execute("drop index if exists idx_reflog_repo_ref_key_id");\n'
              '      statement.execute("alter table git_reflog drop column if exists ref_name_key");\n',
              'drop column if exists ref_name_key',
          )
          add_before(
              root / 'LegacyCoreSqlServerSchemaAdoptionIntegrationTest.java',
              '      statement.execute("alter table git_reflog alter column repository_name varchar(255) not null");',
              '      statement.execute("drop index if exists idx_reflog_repo_ref_key_id on git_reflog");\n'
              '      if (columnExists(connection, "git_reflog", "ref_name_key")) {\n'
              '        statement.execute("alter table git_reflog drop column ref_name_key");\n'
              '      }\n',
              'drop column ref_name_key',
          )

          sqlserver = root / 'CoreSqlServerSchemaMigrationIntegrationTest.java'
          if sqlserver.is_file():
              text = sqlserver.read_text(encoding='utf-8')
              index_assert = (
                  'assertTrue(indexExists(connection, "git_reflog", '
                  '"idx_reflog_repo_ref_key_id"));'
              )
              column_assert = 'assertTrue(columnExists(connection, "git_reflog", "ref_name_key"));'
              if index_assert in text and column_assert not in text:
                  text = text.replace(index_assert, index_assert + '\n      ' + column_assert, 1)
              sqlserver.write_text(text, encoding='utf-8')

          for temporary in Path('.github/workflows').glob('temporary-*.yml'):
              temporary.unlink()
          PY
          git diff --check
          mkdir -p target

      - name: Verify the complete Core contract
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-core -am verify 2>&1 \
            | tee target/reflog-contract-verification.log

      - name: Commit only after successful verification
        shell: bash
        run: |
          set -euo pipefail
          test -s target/reflog-contract-verification.log
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -print -quit)"
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Complete and verify reflog migration contracts'
          git push origin HEAD:perf/reflog-index-evidence

      - name: Upload complete Core evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reflog-contract-verification
          path: |
            target/reflog-contract-verification.log
            jgit-storage-hibernate-core/target/surefire-reports/**
            jgit-storage-hibernate-core/target/failsafe-reports/**
          if-no-files-found: error
