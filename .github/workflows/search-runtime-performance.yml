name: Hibernate Search Runtime Tuning

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Existing JMH matrix or bounded sustained/overload diagnostic
        required: true
        default: matrix
        type: choice
        options: [matrix, sustained]
      matrix:
        description: Runtime settings matrix (use smoke for 10,000 commits)
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
      workload:
        description: Total commits and burst commits
        default: '100-50'
        type: choice
        options:
          - '100-50'
          - '1000-50'
          - '1000-500'
          - '10000-50'
          - '10000-500'
      resources:
        description: Benchmark JVM CPU and heap budget
        default: host
        type: choice
        options:
          - host
          - constrained
          - normal
  schedule:
    - cron: '23 5 * * 4'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/search-runtime-performance.yml'
      - '.github/scripts/benchmark_units.py'
      - '.github/scripts/test_benchmark_units.py'
      - '.github/scripts/convert-jmh-search-runtime.py'
      - '.github/scripts/test_convert_jmh_search_runtime.py'
      - '.github/scripts/summarize-search-runtime-diagnostic.py'
      - '.github/scripts/test_summarize_search_runtime_diagnostic.py'
      - '.github/scripts/validate_search_database_telemetry.py'
      - '.github/scripts/publish-benchmark-history.py'
      - '.github/benchmark-dashboard/**'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-search/**'
      - 'jgit-storage-hibernate-benchmarks/**'
  push:
    branches:
      - main
      - 'benchmark/search-runtime-full-196-*'
      - codex/performance-followup-20261108
    paths:
      - '.github/benchmark-triggers/issue196-runtime-evidence.json'
      - '.github/workflows/search-runtime-performance.yml'
      - '.github/scripts/benchmark_units.py'
      - '.github/scripts/test_benchmark_units.py'
      - '.github/scripts/convert-jmh-search-runtime.py'
      - '.github/scripts/test_convert_jmh_search_runtime.py'
      - '.github/scripts/summarize-search-runtime-diagnostic.py'
      - '.github/scripts/test_summarize_search_runtime_diagnostic.py'
      - '.github/scripts/validate_search_database_telemetry.py'
      - '.github/scripts/publish-benchmark-history.py'
      - '.github/benchmark-dashboard/**'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-search/**'
      - 'jgit-storage-hibernate-benchmarks/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  select-runtime-runs:
    name: Select Search runtime workloads
    if: >-
      (github.event_name != 'workflow_dispatch' || inputs.mode != 'sustained') &&
      !(github.event_name == 'push' && github.ref == 'refs/heads/codex/performance-followup-20261108') &&
      (github.event_name != 'push' || !github.event.deleted)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select workload, settings and resources
        id: select
        env:
          RUNTIME_WORKLOAD: ${{ inputs.workload || '100-50' }}
          RUNTIME_RESOURCES: ${{ inputs.resources || 'host' }}
          RUNTIME_MATRIX: ${{ inputs.matrix || 'smoke' }}
        run: |
          python3 - <<'PY'
          import json
          import os

          event = os.environ['GITHUB_EVENT_NAME']
          ref = os.environ['GITHUB_REF_NAME']
          hosted = event == 'push' and ref.startswith('benchmark/search-runtime-full-196-')
          if hosted:
              coordinates = [
                  ('1000-500', 'normal', 'full'),
                  ('10000-50', 'normal', 'smoke'),
                  ('10000-500', 'normal', 'smoke'),
                  ('10000-500', 'constrained', 'smoke'),
              ]
          else:
              settings = 'full' if event == 'schedule' else os.environ['RUNTIME_MATRIX']
              coordinates = [(os.environ['RUNTIME_WORKLOAD'], os.environ['RUNTIME_RESOURCES'], settings)]

          runs = []
          for workload, resources, settings in coordinates:
              if settings == 'full' and workload.startswith('10000-'):
                  raise SystemExit('Use the smoke settings matrix for 10,000 commits.')
              suffix = f'-{workload}-{resources}-{settings}' if hosted else ''
              runs.append(dict(workload=workload, resources=resources, settings=settings,
                               artifact=f'hibernate-search-runtime-results{suffix}'))
          matrix = json.dumps({'include': runs}, separators=(',', ':'))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'matrix={matrix}', file=output)
          print(f'Search runtime runs: {matrix}')
          PY

  runtime-tuning:
    name: >-
      ${{ matrix.artifact == 'hibernate-search-runtime-results' && 'PostgreSQL + Lucene runtime coordination matrix' ||
          format('PostgreSQL + Lucene {0} ({1}, {2})', matrix.workload, matrix.resources, matrix.settings) }}
    needs: select-runtime-runs
    if: needs.select-runtime-runs.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.select-runtime-runs.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RUNTIME_WORKLOAD: ${{ matrix.workload }}
      RUNTIME_RESOURCES: ${{ matrix.resources }}
      RUNTIME_FULL: ${{ matrix.settings == 'full' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test runtime chart conversion and units
        run: |
          python3 .github/scripts/test_benchmark_units.py
          python3 .github/scripts/test_convert_jmh_search_runtime.py
          python3 .github/scripts/test_summarize_search_runtime_diagnostic.py

      - name: Build benchmark module with Maven
        shell: bash
        run: |
          mkdir -p target/search-runtime
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee target/search-runtime/maven-build.log

      - name: Check Lucene crash recovery and run the PostgreSQL runtime matrix
        shell: bash
        run: |
          set -o pipefail
          lscpu --json > target/search-runtime/cpu.json
          command=(mvn -B -pl jgit-storage-hibernate-benchmarks test
            -Dtest=SearchRuntimeRecoveryTest,HibernateSearchRuntimeTuningBenchmarkIT
            -Dsurefire.failIfNoSpecifiedTests=false
            "-Dsearch.runtime.full=$RUNTIME_FULL"
            "-Dsearch.runtime.workload=$RUNTIME_WORKLOAD"
            "-Dsearch.runtime.resources=$RUNTIME_RESOURCES"
            "-Dbenchmark.commit=$GITHUB_SHA"
            "-Dbenchmark.resultFile=$GITHUB_WORKSPACE/target/search-runtime/jmh-result.json")

          case "$RUNTIME_RESOURCES" in
            host) cpu_count=0 ;;
            constrained) cpu_count=1 ;;
            normal) cpu_count=4 ;;
            *) echo 'Unknown Search runtime resource profile.' >&2; exit 1 ;;
          esac
          if (( cpu_count > 0 )); then
            cpus="$(python3 - "$cpu_count" <<'PY'
          import os
          import sys

          count = int(sys.argv[1])
          available = sorted(os.sched_getaffinity(0))
          if len(available) < count:
              raise SystemExit(f'Resource profile needs {count} allowed CPUs, found {len(available)}')
          print(','.join(map(str, available[:count])))
          PY
            )"
            command=(taskset --cpu-list "$cpus" "${command[@]}")
          fi
          "${command[@]}" 2>&1 | tee target/search-runtime/maven-benchmark.log
          test -s target/search-runtime/environment.properties

      - name: Convert runtime results for grouped charts
        run: |
          python3 .github/scripts/convert-jmh-search-runtime.py \
            target/search-runtime/jmh-result.json \
            target/search-runtime/comparison.json
          cat target/search-runtime/comparison.json

      - name: Verify dashboard and runtime chart operations
        run: |
          test -s .github/benchmark-dashboard/index.html
          test -s .github/benchmark-dashboard/dashboard.js
          grep -F 'Hibernate Search runtime burst submission p50' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime burst ready p95' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime rebuild ready p99' target/search-runtime/comparison.json
          grep -F 'Hibernate Search concurrent query p95' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime burst visibility observation wait' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime burst visibility polls' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime burst prepared statements' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime burst committed index bytes' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime rebuild committed segments' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime rebuild sum of peak heap pools in bytes' target/search-runtime/comparison.json

      - name: Check Search runtime evidence for connection details
        id: evidence-privacy
        if: always()
        run: |
          python3 .github/scripts/validate_search_database_telemetry.py --privacy-only \
            target/search-runtime jgit-storage-hibernate-benchmarks/target/surefire-reports

      - name: Upload Search runtime evidence
        if: always() && steps.evidence-privacy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/search-runtime/**
            jgit-storage-hibernate-benchmarks/target/surefire-reports/**
          if-no-files-found: error

      - name: Report runtime tuning charts
        if: always()
        run: |
          echo '### Hibernate Search runtime tuning' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Full matrix: $RUNTIME_FULL" >> "$GITHUB_STEP_SUMMARY"
          echo "Total commits and burst commits: $RUNTIME_WORKLOAD; resources: $RUNTIME_RESOURCES" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'The matrix keeps the semantic Search profile fixed at content-v1 and varies runtime coordination, refresh, Lucene writer RAM/backend threads, and projection batching in controlled families.' >> "$GITHUB_STEP_SUMMARY"
          echo 'write-sync waits for a Lucene commit, sync waits for commit and refresh, read-sync waits for refresh, and async can acknowledge work before either. The index size and segment charts describe the committed index after graceful close.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The run artifact contains its exact workload, host, Java, and database metadata. Only default runs on main enter the chart history below.' >> "$GITHUB_STEP_SUMMARY"
          echo "[Runtime benchmark reproduction guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/operations/search-runtime-tuning.md)" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Burst submission p50](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-hibernate-search-runtime-burst-submission-p-50)' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Burst ready p95](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-hibernate-search-runtime-burst-ready-p-95)' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Concurrent query p95](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-hibernate-search-concurrent-query-p-95)' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Burst visibility polls](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-hibernate-search-runtime-burst-visibility-polls)' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Burst visibility observation wait](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-hibernate-search-runtime-burst-visibility-observation-wait)' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Rebuild ready p95](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-hibernate-search-runtime-rebuild-ready-p-95)' >> "$GITHUB_STEP_SUMMARY"

  sustained-diagnostic:
    name: Sustained ${{ matrix.scenario }} (${{ matrix.resources }})
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'sustained') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/codex/performance-followup-20261108' && !github.event.deleted)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        scenario: [reference, sync-async-r500]
        resources: [normal, constrained]
    env:
      DIAGNOSTIC_SCENARIO: ${{ matrix.scenario }}
      DIAGNOSTIC_RESOURCES: ${{ matrix.resources }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify diagnostic parser and lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_summarize_search_runtime_diagnostic.py
          mkdir -p target/search-runtime-sustained
          mvn -B -ntp -pl jgit-storage-hibernate-benchmarks -am install \
            -Dtest=SearchRuntimeDiagnosticWorkersTest,SearchRuntimeSustainedDiagnosticTest \
            -Dsurefire.failIfNoSpecifiedTests=false 2>&1 \
            | tee target/search-runtime-sustained/build-and-correctness.log
      - name: Run isolated PostgreSQL sustained and activity passes
        shell: bash
        run: |
          set -euo pipefail
          lscpu --json > target/search-runtime-sustained/cpu.json
          case "$DIAGNOSTIC_RESOURCES" in
            normal) cpu_count=4; heap_initial=768m; heap_limit=1g ;;
            constrained) cpu_count=1; heap_initial=256m; heap_limit=512m ;;
            *) exit 1 ;;
          esac
          cpus="$(python3 - "$cpu_count" <<'PY'
          import os, sys
          count = int(sys.argv[1])
          allowed = sorted(os.sched_getaffinity(0))
          if len(allowed) < count:
              raise SystemExit(f'Need {count} allowed CPUs, found {len(allowed)}')
          print(','.join(map(str, allowed[:count])))
          PY
          )"
          source="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse 'HEAD^{tree}')"
          taskset --cpu-list "$cpus" mvn -B -ntp -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=SearchRuntimeSustainedDiagnosticIT \
            -Dsearch.runtime.sustained.run=true \
            "-Dsearch.runtime.sustained.scenario=$DIAGNOSTIC_SCENARIO" \
            "-Dsearch.runtime.resources=$DIAGNOSTIC_RESOURCES" \
            "-Dsearch.runtime.sustained.output=$GITHUB_WORKSPACE/target/search-runtime-sustained/raw" \
            "-Dbenchmark.commit=$source" "-Dbenchmark.tree=$source_tree" \
            "-DargLine=-Xms$heap_initial -Xmx$heap_limit -XX:ActiveProcessorCount=$cpu_count -Dorg.jboss.logging.provider=jdk" \
            2>&1 | tee target/search-runtime-sustained/native-diagnostic.log
      - name: Validate exact-source completion and export observations
        run: |
          set -euo pipefail
          for pass in timing trace; do
            python3 .github/scripts/summarize-search-runtime-diagnostic.py \
              "target/search-runtime-sustained/raw/$pass" \
              --output "target/search-runtime-sustained/derived/$pass" \
              --require-source "$(git rev-parse HEAD)"
          done
          python3 - <<'PY'
          import pathlib
          import xml.etree.ElementTree as ET
          reports = list(pathlib.Path('jgit-storage-hibernate-benchmarks/target/surefire-reports').glob(
              'TEST-*.SearchRuntimeSustainedDiagnosticIT.xml'))
          assert len(reports) == 1, 'Missing native diagnostic test report'
          suite = ET.parse(reports[0]).getroot()
          assert int(suite.attrib['tests']) == 1
          assert all(int(suite.attrib.get(key, 0)) == 0 for key in ('failures', 'errors', 'skipped'))
          PY
          cat target/search-runtime-sustained/derived/timing/summary.md >> "$GITHUB_STEP_SUMMARY"
          cat target/search-runtime-sustained/derived/trace/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Check diagnostic evidence for connection details
        id: diagnostic-privacy
        if: always()
        run: |
          python3 .github/scripts/validate_search_database_telemetry.py --privacy-only \
            target/search-runtime-sustained jgit-storage-hibernate-benchmarks/target/surefire-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.diagnostic-privacy.outcome == 'success'
        with:
          name: search-runtime-sustained-${{ matrix.scenario }}-${{ matrix.resources }}
          path: |
            target/search-runtime-sustained
            jgit-storage-hibernate-benchmarks/target/surefire-reports
          if-no-files-found: error

  publish-runtime-history:
    name: Publish Hibernate Search runtime benchmark history
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: runtime-tuning
    runs-on: ubuntu-latest
    concurrency:
      group: repository-pages-publication-${{ github.repository }}
      # Preserve every suite; the default pending slot replaces other publishers.
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download runtime evidence outside the worktree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hibernate-search-runtime-results
          path: ${{ runner.temp }}/search-runtime-artifact

      - name: Publish generated runtime benchmark pages
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="${RUNNER_TEMP}/search-runtime-artifact"
          benchmark_source="$(find "$artifact_root" -type f -name comparison.json -print -quit)"
          dashboard_source="${GITHUB_WORKSPACE}/.github/benchmark-dashboard/index.html"
          dashboard_script_source="${GITHUB_WORKSPACE}/.github/benchmark-dashboard/dashboard.js"
          test -s "$benchmark_source"
          test -s "$dashboard_source"
          test -s "$dashboard_script_source"

          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            empty_tree="$(git mktree </dev/null)"
            initial_commit="$(printf '%s\n' 'Initialize generated project pages' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$empty_tree")"
            git push origin "$initial_commit:refs/heads/gh-pages"
          fi

          pages_dir="${RUNNER_TEMP}/generated-pages-search-runtime"
          summary_file="${RUNNER_TEMP}/search-runtime-summary.md"
          published_at="$(date +%s%3N)"

          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git worktree remove --force "$pages_dir" >/dev/null 2>&1 || true
            git worktree prune
            git worktree add --detach "$pages_dir" origin/gh-pages
            rm -f "$summary_file"

            python3 .github/scripts/publish-benchmark-history.py \
              --data-file "$pages_dir/dev/bench/data.js" \
              --benchmark-file "$benchmark_source" \
              --repository-dir "$GITHUB_WORKSPACE" \
              --repository-url "https://github.com/${GITHUB_REPOSITORY}" \
              --commit "$GITHUB_SHA" \
              --actor "$GITHUB_ACTOR" \
              --suite-name 'Hibernate Search runtime tuning' \
              --timestamp-ms "$published_at" \
              --summary-file "$summary_file" \
              --alert-threshold 1.5

            mkdir -p "$pages_dir/dev/bench"
            cp "$dashboard_source" "$pages_dir/dev/bench/index.html"
            cp "$dashboard_script_source" "$pages_dir/dev/bench/dashboard.js"
            git -C "$pages_dir" add dev/bench/index.html dev/bench/dashboard.js dev/bench/data.js

            if git -C "$pages_dir" diff --cached --quiet; then
              cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
              echo 'Search runtime benchmark history and dashboard unchanged'
              exit 0
            fi

            git -C "$pages_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Add Hibernate Search runtime benchmark for ${GITHUB_SHA}"
            if git -C "$pages_dir" push origin HEAD:gh-pages; then
              cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Could not publish Hibernate Search runtime history after three attempts' >&2
          exit 1
