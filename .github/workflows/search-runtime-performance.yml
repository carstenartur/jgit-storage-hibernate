name: Hibernate Search Runtime Tuning

on:
  workflow_dispatch:
    inputs:
      matrix:
        description: Runtime settings matrix (use smoke for 10,000 commits)
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - full
      workload:
        description: Total commits and burst commits
        default: '100-50'
        type: choice
        options:
          - '100-50'
          - '1000-50'
          - '1000-500'
          - '10000-50'
          - '10000-500'
      resources:
        description: Benchmark JVM CPU and heap budget
        default: host
        type: choice
        options:
          - host
          - constrained
          - normal
  schedule:
    - cron: '23 5 * * 4'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/search-runtime-performance.yml'
      - '.github/scripts/benchmark_units.py'
      - '.github/scripts/test_benchmark_units.py'
      - '.github/scripts/convert-jmh-search-runtime.py'
      - '.github/scripts/test_convert_jmh_search_runtime.py'
      - '.github/scripts/validate_search_database_telemetry.py'
      - '.github/scripts/publish-benchmark-history.py'
      - '.github/benchmark-dashboard/**'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-search/**'
      - 'jgit-storage-hibernate-benchmarks/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/search-runtime-performance.yml'
      - '.github/scripts/benchmark_units.py'
      - '.github/scripts/test_benchmark_units.py'
      - '.github/scripts/convert-jmh-search-runtime.py'
      - '.github/scripts/test_convert_jmh_search_runtime.py'
      - '.github/scripts/validate_search_database_telemetry.py'
      - '.github/scripts/publish-benchmark-history.py'
      - '.github/benchmark-dashboard/**'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-search/**'
      - 'jgit-storage-hibernate-benchmarks/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  runtime-tuning:
    name: PostgreSQL + Lucene runtime coordination matrix
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RUNTIME_WORKLOAD: ${{ inputs.workload || '100-50' }}
      RUNTIME_RESOURCES: ${{ inputs.resources || 'host' }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Select runtime matrix
        id: matrix
        shell: bash
        env:
          RUNTIME_MATRIX: ${{ inputs.matrix || 'smoke' }}
        run: |
          full=false
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$RUNTIME_MATRIX" == "full" ]]; then
            full=true
          fi
          if [[ "$full" == "true" && "$RUNTIME_WORKLOAD" == 10000-* ]]; then
            echo 'Use the smoke settings matrix for 10,000 commits.' >&2
            exit 1
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full matrix: $full; workload: $RUNTIME_WORKLOAD; resources: $RUNTIME_RESOURCES"

      - name: Test runtime chart conversion and units
        run: |
          python3 .github/scripts/test_benchmark_units.py
          python3 .github/scripts/test_convert_jmh_search_runtime.py

      - name: Build benchmark module with Maven
        shell: bash
        run: |
          mkdir -p target/search-runtime
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee target/search-runtime/maven-build.log

      - name: Run PostgreSQL and Lucene runtime matrix
        shell: bash
        env:
          RUNTIME_FULL: ${{ steps.matrix.outputs.full }}
        run: |
          set -o pipefail
          lscpu --json > target/search-runtime/cpu.json
          command=(mvn -B -pl jgit-storage-hibernate-benchmarks test
            -Dtest=HibernateSearchRuntimeTuningBenchmarkIT
            -Dsurefire.failIfNoSpecifiedTests=false
            "-Dsearch.runtime.full=$RUNTIME_FULL"
            "-Dsearch.runtime.workload=$RUNTIME_WORKLOAD"
            "-Dsearch.runtime.resources=$RUNTIME_RESOURCES"
            "-Dbenchmark.commit=$GITHUB_SHA"
            "-Dbenchmark.resultFile=$GITHUB_WORKSPACE/target/search-runtime/jmh-result.json")

          case "$RUNTIME_RESOURCES" in
            host) cpu_count=0 ;;
            constrained) cpu_count=1 ;;
            normal) cpu_count=4 ;;
            *) echo 'Unknown Search runtime resource profile.' >&2; exit 1 ;;
          esac
          if (( cpu_count > 0 )); then
            cpus="$(python3 - "$cpu_count" <<'PY'
          import os
          import sys

          count = int(sys.argv[1])
          available = sorted(os.sched_getaffinity(0))
          if len(available) < count:
              raise SystemExit(f'Resource profile needs {count} allowed CPUs, found {len(available)}')
          print(','.join(map(str, available[:count])))
          PY
            )"
            command=(taskset --cpu-list "$cpus" "${command[@]}")
          fi
          "${command[@]}" 2>&1 | tee target/search-runtime/maven-benchmark.log
          test -s target/search-runtime/environment.properties

      - name: Convert runtime results for grouped charts
        run: |
          python3 .github/scripts/convert-jmh-search-runtime.py \
            target/search-runtime/jmh-result.json \
            target/search-runtime/comparison.json
          cat target/search-runtime/comparison.json

      - name: Verify dashboard and runtime chart operations
        run: |
          test -s .github/benchmark-dashboard/index.html
          test -s .github/benchmark-dashboard/dashboard.js
          grep -F 'Hibernate Search runtime burst submission p50' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime burst ready p95' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime rebuild ready p99' target/search-runtime/comparison.json
          grep -F 'Hibernate Search concurrent query p95' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime burst visibility observation wait' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime burst visibility polls' target/search-runtime/comparison.json
          grep -F 'Hibernate Search runtime burst prepared statements' target/search-runtime/comparison.json

      - name: Check Search runtime evidence for connection details
        id: evidence-privacy
        if: always()
        run: |
          python3 .github/scripts/validate_search_database_telemetry.py --privacy-only \
            target/search-runtime jgit-storage-hibernate-benchmarks/target/surefire-reports

      - name: Upload Search runtime evidence
        if: always() && steps.evidence-privacy.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hibernate-search-runtime-results
          path: |
            target/search-runtime/**
            jgit-storage-hibernate-benchmarks/target/surefire-reports/**
          if-no-files-found: error

      - name: Report runtime tuning charts
        if: always()
        run: |
          echo '### Hibernate Search runtime tuning' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Full matrix: ${{ steps.matrix.outputs.full }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Total commits and burst commits: $RUNTIME_WORKLOAD; resources: $RUNTIME_RESOURCES" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'The matrix keeps the semantic Search profile fixed at content-v1 and varies runtime coordination, refresh, Lucene writer RAM/backend threads, and projection batching in controlled families.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The run artifact contains its exact workload, host, Java, and database metadata. Only default runs on main enter the chart history below.' >> "$GITHUB_STEP_SUMMARY"
          echo "[Runtime benchmark reproduction guide](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/operations/search-runtime-tuning.md)" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Burst submission p50](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-hibernate-search-runtime-burst-submission-p-50)' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Burst ready p95](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-hibernate-search-runtime-burst-ready-p-95)' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Concurrent query p95](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-hibernate-search-concurrent-query-p-95)' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Burst visibility polls](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-hibernate-search-runtime-burst-visibility-polls)' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Burst visibility observation wait](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-hibernate-search-runtime-burst-visibility-observation-wait)' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Rebuild ready p95](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-hibernate-search-runtime-rebuild-ready-p-95)' >> "$GITHUB_STEP_SUMMARY"

  publish-runtime-history:
    name: Publish Hibernate Search runtime benchmark history
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: runtime-tuning
    runs-on: ubuntu-latest
    concurrency:
      group: repository-pages-publication-${{ github.repository }}
      # Preserve every suite; the default pending slot replaces other publishers.
      queue: max
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download runtime evidence outside the worktree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: hibernate-search-runtime-results
          path: ${{ runner.temp }}/search-runtime-artifact

      - name: Publish generated runtime benchmark pages
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="${RUNNER_TEMP}/search-runtime-artifact"
          benchmark_source="$(find "$artifact_root" -type f -name comparison.json -print -quit)"
          dashboard_source="${GITHUB_WORKSPACE}/.github/benchmark-dashboard/index.html"
          dashboard_script_source="${GITHUB_WORKSPACE}/.github/benchmark-dashboard/dashboard.js"
          test -s "$benchmark_source"
          test -s "$dashboard_source"
          test -s "$dashboard_script_source"

          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            empty_tree="$(git mktree </dev/null)"
            initial_commit="$(printf '%s\n' 'Initialize generated project pages' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$empty_tree")"
            git push origin "$initial_commit:refs/heads/gh-pages"
          fi

          pages_dir="${RUNNER_TEMP}/generated-pages-search-runtime"
          summary_file="${RUNNER_TEMP}/search-runtime-summary.md"
          published_at="$(date +%s%3N)"

          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git worktree remove --force "$pages_dir" >/dev/null 2>&1 || true
            git worktree prune
            git worktree add --detach "$pages_dir" origin/gh-pages
            rm -f "$summary_file"

            python3 .github/scripts/publish-benchmark-history.py \
              --data-file "$pages_dir/dev/bench/data.js" \
              --benchmark-file "$benchmark_source" \
              --repository-dir "$GITHUB_WORKSPACE" \
              --repository-url "https://github.com/${GITHUB_REPOSITORY}" \
              --commit "$GITHUB_SHA" \
              --actor "$GITHUB_ACTOR" \
              --suite-name 'Hibernate Search runtime tuning' \
              --timestamp-ms "$published_at" \
              --summary-file "$summary_file" \
              --alert-threshold 1.5

            mkdir -p "$pages_dir/dev/bench"
            cp "$dashboard_source" "$pages_dir/dev/bench/index.html"
            cp "$dashboard_script_source" "$pages_dir/dev/bench/dashboard.js"
            git -C "$pages_dir" add dev/bench/index.html dev/bench/dashboard.js dev/bench/data.js

            if git -C "$pages_dir" diff --cached --quiet; then
              cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
              echo 'Search runtime benchmark history and dashboard unchanged'
              exit 0
            fi

            git -C "$pages_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Add Hibernate Search runtime benchmark for ${GITHUB_SHA}"
            if git -C "$pages_dir" push origin HEAD:gh-pages; then
              cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Could not publish Hibernate Search runtime history after three attempts' >&2
          exit 1
