name: Finalize issue 188 decision semantics

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: finalize-issue188-decision-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      SOURCE_RUN_ID: '32505334226'

    steps:
      - name: Checkout final-decision branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Apply three-state decision contract
        run: python3 .github/scripts/apply-issue188-final-decision-semantics.py

      - name: Verify converter regressions and documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_convert_jmh_pack_storage_layout.py
          grep -F 'retain-current-layout-no-cross-database-net-benefit' docs/operations/pack-storage-layout.md
          grep -F 'pending state is reserved for missing backends or required operations' docs/operations/pack-storage-layout.md
          git diff --check

      - name: Remove one-shot semantic tooling
        run: |
          rm .github/scripts/apply-issue188-final-decision-semantics.py
          rm .github/workflows/apply-issue188-final-decision-semantics.yml

      - name: Commit validated final decision contract
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/scripts/convert-jmh-pack-storage-layout.py \
            .github/scripts/test_convert_jmh_pack_storage_layout.py \
            docs/operations/pack-storage-layout.md \
            .github/scripts/apply-issue188-final-decision-semantics.py \
            .github/workflows/apply-issue188-final-decision-semantics.yml
          if git diff --cached --quiet; then
            echo 'Expected final decision semantic repair produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Distinguish completed pack-layout rejection from pending evidence'
          git push origin "HEAD:${HEAD_REF}"

      - name: Download retained complete capacity source evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/issue188-source
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name pack-storage-layout-production-decision-capacity \
            --dir target/issue188-source
          test -s target/issue188-source/production-jmh-result.json

      - name: Replay the final decision with the committed converter
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/convert-jmh-pack-storage-layout.py \
            target/issue188-source/production-jmh-result.json \
            target/issue188-final-decision/evidence
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('target/issue188-final-decision/evidence')
          evidence_path = root / 'pack-storage-layout-evidence.json'
          comparison_path = root / 'pack-storage-layout-comparison.json'
          evidence_text = evidence_path.read_text(encoding='utf-8')
          comparison_text = comparison_path.read_text(encoding='utf-8')
          evidence = json.loads(evidence_text)
          comparison = json.loads(comparison_text)

          assert evidence['decision'] == 'retain-current-layout-no-cross-database-net-benefit'
          assert evidence['crossDatabaseEvidenceComplete'] is True
          assert evidence['backends'] == ['postgresql', 'sqlserver']
          assert len(evidence['evidence']) == 64
          assert len(comparison) == 64
          assert {row['operation'] for row in evidence['evidence']} == {
              'write', 'sequential-read', 'short-read', 'random-read'
          }
          assert all(not candidate['eligible'] for candidate in evidence['layoutCandidates'])
          assert all(
              not backend['missingSparseOperations']
              for candidate in evidence['layoutCandidates']
              for backend in candidate['backendEvidence']
          )
          for text in (evidence_text, comparison_text):
              assert 'NaN' not in text
              assert 'Infinity' not in text
          PY
          mkdir -p target/issue188-final-decision
          python3 - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          metadata = {
              'schemaVersion': 1,
              'benchmarkRunId': int(os.environ['SOURCE_RUN_ID']),
              'benchmarkHead': '1ab124b9f5940910d82af586ee21c8d3a2f5d553',
              'benchmarkBase': '5e685cb433fda42647382785c8652c312d0bfb0e',
              'converterCommit': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'decision': 'retain-current-layout-no-cross-database-net-benefit',
          }
          Path('target/issue188-final-decision/replay-metadata.json').write_text(
              json.dumps(metadata, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Report replayed final decision
        shell: bash
        run: |
          cat target/issue188-final-decision/evidence/pack-storage-layout-evidence.md \
            >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo "Replayed retained capacity run: $SOURCE_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Converter commit: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final machine-readable decision
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue188-final-layout-decision
          path: target/issue188-final-decision/**
          if-no-files-found: error
