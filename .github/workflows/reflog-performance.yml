name: Reflog Performance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 4'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/reflog-performance.yml'
      - '.github/scripts/benchmark_units.py'
      - '.github/scripts/convert-jmh-reflog-performance.py'
      - '.github/scripts/test_convert_jmh_reflog_performance.py'
      - '.github/scripts/publish-benchmark-history.py'
      - '.github/benchmark-dashboard/**'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-benchmarks/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/reflog-performance.yml'
      - '.github/scripts/benchmark_units.py'
      - '.github/scripts/convert-jmh-reflog-performance.py'
      - '.github/scripts/test_convert_jmh_reflog_performance.py'
      - '.github/scripts/publish-benchmark-history.py'
      - '.github/benchmark-dashboard/**'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-benchmarks/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reflog-performance:
    name: PostgreSQL and SQL Server reverse-reflog index comparison
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:17.10-alpine
        env:
          POSTGRES_DB: reflog_benchmark
          POSTGRES_USER: benchmark
          POSTGRES_PASSWORD: benchmark
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U benchmark -d reflog_benchmark"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: JgitStorage-2026-Benchmark!
        ports:
          - 1433:1433

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Wait for SQL Server readiness
        shell: bash
        run: |
          set -euo pipefail
          container="$(docker ps --filter 'ancestor=mcr.microsoft.com/mssql/server:2022-CU20-ubuntu-22.04' --format '{{.ID}}' | head -n 1)"
          test -n "$container"
          for attempt in $(seq 1 90); do
            if docker logs "$container" 2>&1 | grep -Fq 'SQL Server is now ready for client connections'; then
              echo 'SQL Server is ready'
              exit 0
            fi
            sleep 2
          done
          docker logs "$container" >&2
          echo 'SQL Server did not become ready' >&2
          exit 1

      - name: Test reflog chart conversion
        run: python3 .github/scripts/test_convert_jmh_reflog_performance.py

      - name: Build benchmark classes and runtime classpath
        shell: bash
        run: |
          mkdir -p target/reflog-performance
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee target/reflog-performance/maven-build.log
          mvn -B dependency:get \
            -Dartifact=com.microsoft.sqlserver:mssql-jdbc:13.4.0.jre11
          mvn -B -q -pl jgit-storage-hibernate-benchmarks dependency:build-classpath \
            -DincludeScope=runtime \
            -Dmdep.outputFile="$GITHUB_WORKSPACE/target/reflog-performance/runtime-classpath.txt"
          test -s target/reflog-performance/runtime-classpath.txt

      - name: Run production database reflog comparison
        shell: bash
        env:
          SQLSERVER_PASSWORD: JgitStorage-2026-Benchmark!
        run: |
          set -euo pipefail
          driver="$HOME/.m2/repository/com/microsoft/sqlserver/mssql-jdbc/13.4.0.jre11/mssql-jdbc-13.4.0.jre11.jar"
          test -s "$driver"
          classpath="jgit-storage-hibernate-benchmarks/target/classes:$(cat target/reflog-performance/runtime-classpath.txt):$driver"
          java \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/reflog-performance/jmh-result.json" \
            -Djgit.storage.benchmark.reflog.postgresql.url='jdbc:postgresql://localhost:5432/reflog_benchmark' \
            -Djgit.storage.benchmark.reflog.postgresql.user=benchmark \
            -Djgit.storage.benchmark.reflog.postgresql.password=benchmark \
            -Djgit.storage.benchmark.reflog.sqlserver.url='jdbc:sqlserver://localhost:1433;databaseName=master;encrypt=true;trustServerCertificate=true' \
            -Djgit.storage.benchmark.reflog.sqlserver.user=sa \
            -Djgit.storage.benchmark.reflog.sqlserver.password="$SQLSERVER_PASSWORD" \
            -cp "$classpath" \
            io.github.carstenartur.jgit.storage.hibernate.benchmark.ReflogLookupBenchmarkRunner 2>&1 \
            | tee target/reflog-performance/runner.log

      - name: Convert results for grouped charts
        run: |
          python3 .github/scripts/convert-jmh-reflog-performance.py \
            target/reflog-performance/jmh-result.json \
            target/reflog-performance/comparison.json
          cat target/reflog-performance/comparison.json

      - name: Verify stable chart operations
        run: |
          grep -F 'Reflog latest entry' target/reflog-performance/comparison.json
          grep -F 'Reflog last 100 entries' target/reflog-performance/comparison.json
          grep -F 'PostgreSQL repository/ref-key/id index' target/reflog-performance/comparison.json
          grep -F 'SQL Server repository/ref-key/id index' target/reflog-performance/comparison.json

      - name: Upload reflog performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reflog-performance-results
          path: |
            target/reflog-performance/**
          if-no-files-found: error

      - name: Report reflog charts
        if: always()
        run: |
          echo '### Reverse-reflog index evidence' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'The retained matrix compares the legacy repository/id index with the portable repository/ref-key/id index on PostgreSQL 17.10 and SQL Server 2022 for 10,000 rows across 100 refs.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Latest entry chart](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-reflog-latest-entry)' >> "$GITHUB_STEP_SUMMARY"
          echo '- [Last 100 entries chart](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/#benchmark-reflog-last-100-entries)' >> "$GITHUB_STEP_SUMMARY"

  publish-reflog-history:
    name: Publish reflog benchmark history
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: reflog-performance
    runs-on: ubuntu-latest
    concurrency:
      group: repository-pages-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download reflog benchmark evidence outside the worktree
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: reflog-performance-results
          path: ${{ runner.temp }}/reflog-benchmark-artifact

      - name: Publish generated reflog benchmark pages
        shell: bash
        run: |
          set -euo pipefail
          artifact_root="${RUNNER_TEMP}/reflog-benchmark-artifact"
          benchmark_source="$(find "$artifact_root" -type f -name comparison.json -print -quit)"
          dashboard_source="${GITHUB_WORKSPACE}/.github/benchmark-dashboard/index.html"
          dashboard_script_source="${GITHUB_WORKSPACE}/.github/benchmark-dashboard/dashboard.js"
          test -s "$benchmark_source"
          test -s "$dashboard_source"
          test -s "$dashboard_script_source"

          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            empty_tree="$(git mktree </dev/null)"
            initial_commit="$(printf '%s\n' 'Initialize generated project pages' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$empty_tree")"
            git push origin "$initial_commit:refs/heads/gh-pages"
          fi

          pages_dir="${RUNNER_TEMP}/generated-pages-reflog"
          summary_file="${RUNNER_TEMP}/reflog-benchmark-summary.md"
          published_at="$(date +%s%3N)"

          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git worktree remove --force "$pages_dir" >/dev/null 2>&1 || true
            git worktree prune
            git worktree add --detach "$pages_dir" origin/gh-pages
            rm -f "$summary_file"

            python3 .github/scripts/publish-benchmark-history.py \
              --data-file "$pages_dir/dev/bench/data.js" \
              --benchmark-file "$benchmark_source" \
              --repository-dir "$GITHUB_WORKSPACE" \
              --repository-url "https://github.com/${GITHUB_REPOSITORY}" \
              --commit "$GITHUB_SHA" \
              --actor "$GITHUB_ACTOR" \
              --suite-name 'Reflog performance' \
              --timestamp-ms "$published_at" \
              --summary-file "$summary_file" \
              --alert-threshold 1.5

            mkdir -p "$pages_dir/dev/bench"
            cp "$dashboard_source" "$pages_dir/dev/bench/index.html"
            cp "$dashboard_script_source" "$pages_dir/dev/bench/dashboard.js"
            git -C "$pages_dir" add dev/bench/index.html dev/bench/dashboard.js dev/bench/data.js

            if git -C "$pages_dir" diff --cached --quiet; then
              cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
              echo 'Reflog benchmark history and dashboard unchanged'
              exit 0
            fi

            git -C "$pages_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Add reflog benchmark result for ${GITHUB_SHA}"
            if git -C "$pages_dir" push origin HEAD:gh-pages; then
              cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Could not publish reflog benchmark history after three attempts' >&2
          exit 1
