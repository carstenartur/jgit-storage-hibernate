name: Smart HTTP Security authentication patch

on:
  push:
    branches:
      - feature/security-smart-http-authentication
    paths:
      - '.github/workflows/smart-http-security-auth-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    name: Patch and verify Smart HTTP authentication
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Normalize generated patch source
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/scripts/smart_http_security_auth_patch.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '''    } catch (ServiceMayNotContinueException | ServiceNotAuthorizedException mapped) {
                    throw mapped;
''',
                  ''
              ),
              (
                  '''      assertTrue(
                    passwordHasher.lastVerified().stream()
                        .flatMapToInt(value -> new String(value).chars())
                        .allMatch(character -> character == 0));
''',
                  '''      assertTrue(passwordHasher.lastVerifiedWasCleared());
'''
              ),
              (
                  '''    List<char[]> lastVerified() {
                    return List.of(lastVerified.get());
                  }
''',
                  '''    boolean lastVerifiedWasCleared() {
                    char[] value = lastVerified.get();
                    if (value == null) {
                      return false;
                    }
                    for (char character : value) {
                      if (character != '\\0') {
                        return false;
                      }
                    }
                    return true;
                  }
'''
              ),
              (
                  '''  void authenticationStoreFailureRemainsServerError() {
                    HibernateSessionFactoryProvider provider = provider("failure");
                    SessionFactory sessionFactory = provider.getSessionFactory();
                    persistPrincipal(sessionFactory, "alice", "alice");
                    HibernateSecurityCredentialService credentials =
                        credentials(
                            sessionFactory,
                            new CapturingPasswordHasher(),
                            new HibernateSecurityIdentityAuditService(sessionFactory));
                    IssuedAccessToken token =
                        credentials.issueAccessToken(
                            SecurityManagementRequest.issueToken(ADMIN, "alice"),
                            Set.of(GitRepositoryPermission.READ),
                            Instant.now().plus(Duration.ofHours(1)));
                    SecuritySmartHttpAccessContextProvider authentication =
                        authentication(credentials, "failure");
                    sessionFactory.close();

                    ServiceMayNotContinueException failure =
                        assertThrows(
                            ServiceMayNotContinueException.class,
                            () ->
                                authentication.require(
                                    request(true, "Bearer " + token.tokenValue())));
                    assertEquals(500, failure.getStatusCode());
                    assertFalse(String.valueOf(failure.getMessage()).contains(token.tokenValue()));
                    provider.close();
                  }
''',
                  '''  void authenticationStoreFailureRemainsServerError() {
                    try (HibernateSessionFactoryProvider provider = provider("failure")) {
                      SessionFactory sessionFactory = provider.getSessionFactory();
                      persistPrincipal(sessionFactory, "alice", "alice");
                      HibernateSecurityCredentialService credentials =
                          credentials(
                              sessionFactory,
                              new CapturingPasswordHasher(),
                              new HibernateSecurityIdentityAuditService(sessionFactory));
                      IssuedAccessToken token =
                          credentials.issueAccessToken(
                              SecurityManagementRequest.issueToken(ADMIN, "alice"),
                              Set.of(GitRepositoryPermission.READ),
                              Instant.now().plus(Duration.ofHours(1)));
                      SecuritySmartHttpAccessContextProvider authentication =
                          authentication(credentials, "failure");
                      sessionFactory.close();

                      ServiceMayNotContinueException failure =
                          assertThrows(
                              ServiceMayNotContinueException.class,
                              () ->
                                  authentication.require(
                                      request(true, "Bearer " + token.tokenValue())));
                      assertEquals(500, failure.getStatusCode());
                      assertFalse(String.valueOf(failure.getMessage()).contains(token.tokenValue()));
                    }
                  }
'''
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one normalization match, found {count}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

      - name: Apply authentication implementation
        run: python3 .github/scripts/smart_http_security_auth_patch.py

      - name: Verify module-boundary contracts
        run: |
          python3 .github/scripts/test_verify_module_boundaries.py
          python3 .github/scripts/verify-module-boundaries.py \
            --json target/module-boundaries/module-graph.json \
            --markdown target/module-boundaries/module-graph.md

      - name: Verify Smart HTTP and upstream modules
        run: >-
          mvn -B -ntp
          -pl jgit-storage-hibernate-smart-http
          -am
          verify

      - name: Commit implementation and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm .github/workflows/smart-http-security-auth-patch.yml
          git rm .github/scripts/smart_http_security_auth_patch.py
          git commit -m "Add strict Smart HTTP Basic and Bearer authentication"
          git push origin HEAD:feature/security-smart-http-authentication
