name: Apply issue 188 complete sparse-evidence repair

on:
  push:
    branches:
      - fix/188-capacity-sparse-evidence-20260821

permissions:
  contents: write

concurrency:
  group: apply-issue188-complete-sparse-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply complete sparse-evidence repair
        run: python3 .github/scripts/apply-issue188-complete-sparse-fix.py

      - name: Run converter regressions
        run: python3 .github/scripts/test_convert_jmh_pack_storage_layout.py

      - name: Compile benchmark module and run profile contract tests
        run: |
          mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests
          mvn -B -pl jgit-storage-hibernate-benchmarks \
            -Dtest=PackStorageLayoutBenchmarkTest test

      - name: Verify documentation contract
        run: grep -F 'short-read and random-read comparisons' docs/operations/pack-storage-layout.md

      - name: Remove one-shot patch tooling
        run: |
          rm .github/scripts/apply-issue188-complete-sparse-fix.py
          rm .github/workflows/apply-issue188-complete-sparse-fix.yml

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/scripts/convert-jmh-pack-storage-layout.py \
            .github/scripts/test_convert_jmh_pack_storage_layout.py \
            docs/operations/pack-storage-layout.md \
            .github/scripts/apply-issue188-complete-sparse-fix.py \
            .github/workflows/apply-issue188-complete-sparse-fix.yml
          if git diff --cached --quiet; then
            echo 'Expected complete sparse-evidence repair produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Require both sparse-read operations for layout promotion'
          git push origin "HEAD:${GITHUB_REF_NAME}"
