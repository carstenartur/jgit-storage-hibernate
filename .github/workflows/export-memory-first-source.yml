name: Export memory-first staging source

on:
  push:
    branches:
      - perf/memory-first-staging
  pull_request:
    branches:
      - main
    types: [edited]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: perf/memory-first-staging
          fetch-depth: 0
      - name: Archive branch source
        shell: bash
        run: tar --exclude=.git -czf "$RUNNER_TEMP/memory-first-source.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: memory-first-source
          path: ${{ runner.temp }}/memory-first-source.tar.gz
          retention-days: 1
