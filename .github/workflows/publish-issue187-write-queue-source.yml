name: Publish issue 187 write-queue source

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: publish-issue187-write-queue-source-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Detect pending validated transformation
        id: helper
        shell: bash
        run: |
          if test -f .github/scripts/apply-issue187-write-queue-telemetry.py; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
            echo 'Validated source has already been published.'
          fi

      - name: Set up JDK 21
        if: steps.helper.outputs.exists == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply the already validated transformation
        if: steps.helper.outputs.exists == 'true'
        run: |
          python3 .github/scripts/apply-issue187-write-queue-telemetry.py
          python3 .github/scripts/repair-issue187-write-queue-password-scan.py

      - name: Recheck compilation and focused contracts
        if: steps.helper.outputs.exists == 'true'
        run: |
          mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=DatabaseTelemetrySnapshotTest,DurableStripedWriteQueueTest

      - name: Retain generated durable workflow and prepare code-only commit
        if: steps.helper.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/issue187-generated-workflow
          cp .github/workflows/performance-investigations.yml \
            target/issue187-generated-workflow/performance-investigations.yml
          sha256sum target/issue187-generated-workflow/performance-investigations.yml \
            > target/issue187-generated-workflow/SHA256SUMS
          git checkout -- .github/workflows/performance-investigations.yml
          rm .github/scripts/apply-issue187-write-queue-telemetry.py
          rm .github/scripts/repair-issue187-write-queue-password-scan.py
          git diff --check

      - name: Commit validated source and documentation
        if: steps.helper.outputs.exists == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/DurableWriteQueueBenchmark.java \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/PerformanceInvestigationsBenchmarkIT.java \
            docs/operations/database-native-telemetry.md \
            docs/performance-status.md \
            .github/scripts/apply-issue187-write-queue-telemetry.py \
            .github/scripts/repair-issue187-write-queue-password-scan.py
          if git diff --cached --quiet; then
            echo 'Expected validated source changes were not staged' >&2
            exit 1
          fi
          git commit -m 'Integrate native telemetry with write-queue benchmarks'
          git push origin "HEAD:${HEAD_REF}"

      - name: Upload exact generated durable workflow
        if: steps.helper.outputs.exists == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue187-generated-performance-workflow
          path: target/issue187-generated-workflow/**
          if-no-files-found: error
