name: Repair issue 285 concurrency equivalence proof

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: repair-issue285-concurrency-equivalence-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Normalize only legacy non-finite optional values before comparison
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/apply-issue285-concurrency-strict-json.yml')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              '      - name: Prove finite valid output remains byte-identical and strict\n',
              '      - name: Prove output differs only by canonical non-finite normalization\n',
          )
          old = '''          diff -ru \\
            target/issue285-concurrency-equivalence/baseline \\
            target/issue285-concurrency-equivalence/current
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in Path('target/issue285-concurrency-equivalence/current').glob('*.json'):
              text = path.read_text(encoding='utf-8')
              json.loads(text)
              assert 'NaN' not in text
              assert 'Infinity' not in text
          PY
'''
          new = '''          python3 - <<'PY'
          import json
          import math
          from pathlib import Path

          def normalize(value):
              if isinstance(value, float) and not math.isfinite(value):
                  return None
              if isinstance(value, list):
                  return [normalize(item) for item in value]
              if isinstance(value, dict):
                  return {key: normalize(item) for key, item in value.items()}
              return value

          baseline = Path('target/issue285-concurrency-equivalence/baseline')
          normalized_count = 0
          for path in baseline.glob('*.json'):
              raw = json.loads(path.read_text(encoding='utf-8'))
              normalized = normalize(raw)
              before = path.read_text(encoding='utf-8')
              after = json.dumps(normalized, indent=2, ensure_ascii=False) + '\\n'
              normalized_count += before.count('NaN') + before.count('Infinity')
              path.write_text(after, encoding='utf-8')
          if normalized_count != 12:
              raise SystemExit(
                  f'Expected 12 legacy non-finite uncertainty tokens, found {normalized_count}'
              )
          PY
          diff -ru \\
            target/issue285-concurrency-equivalence/baseline \\
            target/issue285-concurrency-equivalence/current
          python3 - <<'PY'
          import json
          from pathlib import Path

          for path in Path('target/issue285-concurrency-equivalence/current').glob('*.json'):
              text = path.read_text(encoding='utf-8')
              json.loads(text)
              assert 'NaN' not in text
              assert 'Infinity' not in text
          PY
'''
          if text.count(old) != 1:
              raise SystemExit('Could not locate concurrency equivalence block exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Verify repaired workflow parses as text contract
        shell: bash
        run: |
          grep -F 'canonical non-finite normalization' \
            .github/workflows/apply-issue285-concurrency-strict-json.yml
          grep -F 'Expected 12 legacy non-finite uncertainty tokens' \
            .github/workflows/apply-issue285-concurrency-strict-json.yml
          git diff --check

      - name: Remove this one-shot workflow
        run: rm .github/workflows/repair-issue285-concurrency-equivalence.yml

      - name: Commit equivalence-proof repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/workflows/apply-issue285-concurrency-strict-json.yml \
            .github/workflows/repair-issue285-concurrency-equivalence.yml
          if git diff --cached --quiet; then
            echo 'Expected concurrency equivalence repair produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Allow canonical concurrency uncertainty normalization'
          git push origin "HEAD:${HEAD_REF}"
