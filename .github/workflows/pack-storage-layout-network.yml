name: Pack Storage Layout Network RTT

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark scope
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
  schedule:
    - cron: '17 5 2 * *'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/pack-storage-layout-network.yml'
      - '.github/scripts/convert-jmh-pack-storage-layout.py'
      - '.github/scripts/test_convert_jmh_pack_storage_layout.py'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-benchmarks/**'
      - 'docs/operations/pack-storage-layout.md'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/pack-storage-layout-network.yml'
      - '.github/scripts/convert-jmh-pack-storage-layout.py'
      - '.github/scripts/test_convert_jmh_pack_storage_layout.py'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-benchmarks/**'
      - 'docs/operations/pack-storage-layout.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  postgresql-rtt:
    name: PostgreSQL calibrated RTT ${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profile || (github.event_name == 'schedule' && 'full' || 'smoke') }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker
        run: docker info

      - name: Validate evidence converter
        run: |
          python3 -m py_compile \
            .github/scripts/convert-jmh-pack-storage-layout.py \
            .github/scripts/test_convert_jmh_pack_storage_layout.py
          python3 .github/scripts/test_convert_jmh_pack_storage_layout.py

      - name: Build benchmark module
        run: mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests

      - name: Run calibrated RTT matrix
        run: |
          mkdir -p "$GITHUB_WORKSPACE/target/pack-storage-layout-network"
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=PackStorageLayoutNetworkBenchmarkTest \
            -Djgit.storage.benchmark.pack-layout.network.enabled=true \
            -Djgit.storage.benchmark.pack-layout.network.profile="$PROFILE" \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/pack-storage-layout-network/jmh-result.json"

      - name: Convert retained RTT evidence
        run: |
          python3 .github/scripts/convert-jmh-pack-storage-layout.py \
            target/pack-storage-layout-network/jmh-result.json \
            target/pack-storage-layout-network/evidence
          cat target/pack-storage-layout-network/evidence/pack-storage-layout-evidence.md \
            >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '### Calibrated RTT' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          cat target/pack-storage-layout-network/network-rtt-calibration.csv \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw calibrated RTT evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pack-storage-layout-postgresql-rtt-${{ env.PROFILE }}
          path: |
            target/pack-storage-layout-network/**
            jgit-storage-hibernate-benchmarks/target/surefire-reports/**
          if-no-files-found: error
