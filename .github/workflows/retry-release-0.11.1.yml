name: Finalize release 0.11.1

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths:
      - '.github/workflows/retry-release-0.11.1.yml'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: jgit-storage-hibernate-release
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.head_ref == 'release-automation/prepare-0.11.1-retry' }}
    name: Publish immutable release and prepare next development version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout merged release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify security policy
        run: python3 .github/scripts/verify-security-policy.py

      - name: Finalize release
        env:
          RELEASE_ACTION: finalize
          GITHUB_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          RELEASE_AUTOMATION_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN || github.token }}
          RELEASE_VERSION: '0.11.1'
          NEXT_VERSION_INPUT: '0.11.2-SNAPSHOT'
          SKIP_TESTS: 'false'
          DRY_RUN: 'false'
          REQUEST_BRANCH: 'release-request/0.11.1'
          RELEASE_PR_BRANCH: 'release/prepare-0.11.1'
          PUBLIC_REPOSITORY_URL: https://raw.githubusercontent.com/carstenartur/jgit-storage-hibernate/maven-repository/
        run: |
          chmod +x .github/scripts/release.sh .github/scripts/verify-public-repository-consumption.sh
          python3 .github/scripts/verify-public-repository-publishing.py
          .github/scripts/release.sh
