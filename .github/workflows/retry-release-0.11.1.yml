name: Fix release 0.11.1 review wording

on:
  pull_request:
    branches: [ main ]
    types: [ opened, synchronize, reopened ]
    paths:
      - '.github/workflows/retry-release-0.11.1.yml'

permissions:
  contents: write

concurrency:
  group: jgit-storage-hibernate-release-review-fix
  cancel-in-progress: false

jobs:
  fix-review-wording:
    if: ${{ github.head_ref == 'release-automation/prepare-0.11.1-retry' }}
    name: Clarify Security introduction version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/prepare-0.11.1
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Clarify historical version reference
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/consuming.md')
          old = (
              'Security is published in the documented `0.11.0` release. '
              'It remains optional: consumers add it only when they need stable '
              'principals, groups, repository/ref policy, credentials or audit.'
          )
          new = (
              'Security was introduced in `0.11.0` and remains available in the '
              'documented release line. It remains optional: consumers add it only '
              'when they need stable principals, groups, repository/ref policy, '
              'credentials or audit.'
          )
          text = path.read_text(encoding='utf-8')
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one stale Security release sentence')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit reviewed documentation fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/consuming.md
          git diff --cached --check
          git commit -m 'Clarify Security introduction version'
          git push origin HEAD:release/prepare-0.11.1
