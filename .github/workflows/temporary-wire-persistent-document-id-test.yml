name: Temporary wire persistent document ID test

on:
  push:
    branches:
      - perf/search-document-id-compatibility

permissions:
  contents: write

concurrency:
  group: temporary-wire-persistent-document-id-test
  cancel-in-progress: true

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/search-document-id-compatibility
          fetch-depth: 0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Follow the numeric document-ID candidate and wire the persistent fixture
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 45); do
            git fetch origin perf/search-document-id-compatibility
            git reset --hard origin/perf/search-document-id-compatibility
            if test -f jgit-storage-hibernate-search/src/test/java/io/github/carstenartur/jgit/storage/hibernate/search/PersistentNumericDocumentIdCompatibilityH2Test.java; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              echo 'Persistent numeric document-ID test did not appear.' >&2
              exit 1
            fi
            sleep 5
          done

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/search-document-id-experiment.yml')
          text = workflow.read_text(encoding='utf-8')
          old = '-Dtest=CommitProjectionJdbcBatchH2Test,CommitSearchProjectionH2Test \\'
          new = (
              '-Dtest=CommitProjectionJdbcBatchH2Test,CommitSearchProjectionH2Test,'
              'PersistentNumericDocumentIdCompatibilityH2Test \\'
          )
          if 'PersistentNumericDocumentIdCompatibilityH2Test' not in text:
              if old not in text:
                  raise SystemExit('Could not locate the focused Search test selection')
              text = text.replace(old, new, 1)
          workflow.write_text(text, encoding='utf-8')

          cleanup = Path('.github/workflows/temporary-clean-search-document-id-experiment.yml')
          if cleanup.is_file():
              cleanup_text = cleanup.read_text(encoding='utf-8')
              if 'PersistentNumericDocumentIdCompatibilityH2Test' not in cleanup_text:
                  cleanup_text = cleanup_text.replace(old, new, 1)
              cleanup.write_text(cleanup_text, encoding='utf-8')

          for temporary in Path('.github/workflows').glob('temporary-*.yml'):
              temporary.unlink()
          PY
          git diff --check

      - name: Verify batching and persistent index compatibility together
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/search-document-id-fixture
          mvn -B -pl jgit-storage-hibernate-search -am \
            -Dtest=CommitProjectionJdbcBatchH2Test,CommitSearchProjectionH2Test,PersistentNumericDocumentIdCompatibilityH2Test \
            -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 \
            | tee target/search-document-id-fixture/maven-test.log

      - name: Commit the clean permanent experiment
        shell: bash
        run: |
          set -euo pipefail
          test -s target/search-document-id-fixture/maven-test.log
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -print -quit)"
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Gate numeric Search document IDs with a persistent index fixture'
          git push origin HEAD:perf/search-document-id-compatibility

      - name: Upload focused compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: persistent-search-document-id-fixture
          path: |
            target/search-document-id-fixture/**
            jgit-storage-hibernate-search/target/surefire-reports/**
          if-no-files-found: error
