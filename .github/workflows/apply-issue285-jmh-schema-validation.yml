name: Apply issue 285 JMH schema validation

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  actions: read

concurrency:
  group: apply-issue285-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      FULL_RUN_ID: '32445558882'
      CAPACITY_RUN_ID: '32505334226'
      CONCURRENCY_RUN_ID: '32445552863'

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Retain baseline converters
        run: |
          mkdir -p /tmp/issue285-baseline
          cp .github/scripts/convert-jmh-pack-storage-layout.py \
            /tmp/issue285-baseline/convert-jmh-pack-storage-layout.py
          cp .github/scripts/convert-jmh-pack-storage-layout-concurrency.py \
            /tmp/issue285-baseline/convert-jmh-pack-storage-layout-concurrency.py

      - name: Apply schema-validation repair
        run: python3 .github/scripts/apply-issue285-jmh-schema-validation.py

      - name: Compile and run converter regressions
        run: |
          python3 -m py_compile \
            .github/scripts/jmh_evidence_schema.py \
            .github/scripts/convert-jmh-pack-storage-layout.py \
            .github/scripts/convert-jmh-pack-storage-layout-concurrency.py \
            .github/scripts/test_convert_jmh_pack_storage_layout.py \
            .github/scripts/test_convert_jmh_pack_storage_layout_concurrency.py
          python3 .github/scripts/test_convert_jmh_pack_storage_layout.py
          python3 .github/scripts/test_convert_jmh_pack_storage_layout_concurrency.py

      - name: Download retained valid JMH sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p target/issue285-source/full target/issue285-source/capacity target/issue285-source/concurrency
          gh run download "$FULL_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name pack-storage-layout-production-decision-full \
            --dir target/issue285-source/full
          gh run download "$CAPACITY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name pack-storage-layout-production-decision-capacity \
            --dir target/issue285-source/capacity
          gh run download "$CONCURRENCY_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name pack-storage-layout-postgresql-concurrency-smoke \
            --dir target/issue285-source/concurrency
          test -s target/issue285-source/full/production-jmh-result.json
          test -s target/issue285-source/capacity/production-jmh-result.json
          test -s target/issue285-source/concurrency/target/pack-storage-layout-concurrency/jmh-result.json

      - name: Prove valid evidence output is unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/issue285-equivalence
          for profile in full capacity; do
            python3 /tmp/issue285-baseline/convert-jmh-pack-storage-layout.py \
              "target/issue285-source/$profile/production-jmh-result.json" \
              "target/issue285-equivalence/baseline-$profile"
            python3 .github/scripts/convert-jmh-pack-storage-layout.py \
              "target/issue285-source/$profile/production-jmh-result.json" \
              "target/issue285-equivalence/current-$profile"
            diff -ru \
              "target/issue285-equivalence/baseline-$profile" \
              "target/issue285-equivalence/current-$profile"
          done
          python3 /tmp/issue285-baseline/convert-jmh-pack-storage-layout-concurrency.py \
            target/issue285-source/concurrency/target/pack-storage-layout-concurrency/jmh-result.json \
            target/issue285-equivalence/baseline-concurrency
          python3 .github/scripts/convert-jmh-pack-storage-layout-concurrency.py \
            target/issue285-source/concurrency/target/pack-storage-layout-concurrency/jmh-result.json \
            target/issue285-equivalence/current-concurrency
          diff -ru \
            target/issue285-equivalence/baseline-concurrency \
            target/issue285-equivalence/current-concurrency

      - name: Verify final patch shape
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'expected JSON object' .github/scripts/jmh_evidence_schema.py
          grep -F 'result_context(result, "pack-layout result"' .github/scripts/convert-jmh-pack-storage-layout.py
          grep -F 'result_context(result, "concurrency result"' .github/scripts/convert-jmh-pack-storage-layout-concurrency.py

      - name: Remove one-shot repair tooling
        run: |
          rm .github/scripts/apply-issue285-jmh-schema-validation.py
          rm .github/workflows/apply-issue285-jmh-schema-validation.yml

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            .github/scripts/jmh_evidence_schema.py \
            .github/scripts/convert-jmh-pack-storage-layout.py \
            .github/scripts/convert-jmh-pack-storage-layout-concurrency.py \
            .github/scripts/test_convert_jmh_pack_storage_layout.py \
            .github/scripts/test_convert_jmh_pack_storage_layout_concurrency.py \
            .github/scripts/apply-issue285-jmh-schema-validation.py \
            .github/workflows/apply-issue285-jmh-schema-validation.yml
          if git diff --cached --quiet; then
            echo 'Expected issue #285 repair produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Normalize malformed JMH schema failures'
          git push origin "HEAD:${HEAD_REF}"

      - name: Upload equivalence evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue285-valid-evidence-equivalence
          path: target/issue285-equivalence/**
          if-no-files-found: error
