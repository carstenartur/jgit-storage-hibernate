name: Maven Central

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Already published immutable release version, for example 0.12.1'
        required: true
        type: string
      mode:
        description: 'bundle: download ZIP; upload: manual Portal publish; release-upload: automatic publish after validation'
        required: true
        type: choice
        default: bundle
        options: [bundle, upload, release-upload]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/maven-central.yml'
      - '.github/scripts/run-central-published-release.sh'
      - '.github/scripts/setup-central-signing-key.sh'
      - '.github/scripts/test_setup_central_signing_key.py'
      - '.github/scripts/bundle-published-release.py'
      - '.github/scripts/test_bundle_published_release.py'
      - '.github/scripts/verify-central-bundle.py'
      - '.github/scripts/test_verify_central_bundle.py'

permissions:
  contents: read

concurrency:
  group: central-${{ github.event_name }}-${{ inputs.release_version || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  fixture:
    if: github.event_name == 'pull_request'
    name: Verify published 0.12.1 with a temporary test key
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout proposed tooling without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test Codespace key setup and recovery with disposable credentials
        run: python3 .github/scripts/test_setup_central_signing_key.py -v
      - name: Verify complete immutable release without secrets or upload
        run: bash .github/scripts/run-central-published-release.sh 0.12.1 fixture

  prepare:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    name: Prepare or upload selected immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout trusted current default-branch tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check optional automatic-upload credentials
        id: credentials
        env:
          CENTRAL_MODE: ${{ inputs.mode }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_FINGERPRINT: ${{ secrets.MAVEN_GPG_FINGERPRINT }}
          CENTRAL_USERNAME: ${{ inputs.mode != 'bundle' && secrets.CENTRAL_USERNAME || '' }}
          CENTRAL_PASSWORD: ${{ inputs.mode != 'bundle' && secrets.CENTRAL_PASSWORD || '' }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os
          required = ("MAVEN_GPG_KEY", "CENTRAL_USERNAME", "CENTRAL_PASSWORD")
          ready = True
          if os.environ.get("CENTRAL_MODE") == "release-upload":
              if not any(os.environ.get(name) for name in (*required, "MAVEN_GPG_PASSPHRASE", "MAVEN_GPG_FINGERPRINT")):
                  ready = False
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                      summary.write("Automatic Central upload skipped: no signing or Central credentials are configured. The GitHub release and public Maven repository remain available.\n")
              else:
                  missing = [name for name in required if not os.environ.get(name)]
                  if missing:
                      raise SystemExit("Incomplete automatic Central configuration; missing repository secrets: " + ", ".join(missing))
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"ready={str(ready).lower()}", file=output)
          PYTHON

      - name: Sign release and upload using the selected publication mode
        id: prepare
        if: steps.credentials.outputs.ready == 'true'
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          CENTRAL_MODE: ${{ inputs.mode }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          MAVEN_GPG_FINGERPRINT: ${{ secrets.MAVEN_GPG_FINGERPRINT }}
          CENTRAL_USERNAME: ${{ inputs.mode != 'bundle' && secrets.CENTRAL_USERNAME || '' }}
          CENTRAL_PASSWORD: ${{ inputs.mode != 'bundle' && secrets.CENTRAL_PASSWORD || '' }}
        run: bash .github/scripts/run-central-published-release.sh "$RELEASE_VERSION" "$CENTRAL_MODE"
      - name: Downloadable production-signed bundle and public provenance
        if: ${{ always() && steps.prepare.outputs.bundle_ready == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-bundle-${{ inputs.release_version }}
          path: |
            target/central-publishing/central-bundle.zip
            target/central-publishing/provenance.json
          if-no-files-found: error
          retention-days: 7
