name: Temporary finalize consumer BOM

on:
  push:
    branches:
      - feat/consumer-bom

permissions:
  contents: write

concurrency:
  group: temporary-finalize-consumer-bom
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/consumer-bom
          fetch-depth: 0

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Follow the wired BOM branch
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            git fetch origin feat/consumer-bom
            git reset --hard origin/feat/consumer-bom
            if grep -Fq '<module>jgit-storage-hibernate-bom</module>' pom.xml 2>/dev/null \
                && grep -Fq 'jgit-storage-hibernate-bom' .github/public-repository-consumer/pom.xml 2>/dev/null; then
              break
            fi
            if [ "$attempt" -eq 60 ]; then
              echo 'The BOM reactor/public-consumer wiring did not appear.' >&2
              exit 1
            fi
            sleep 5
          done

      - name: Remove temporary workflows and verify the permanent BOM contract
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -delete
          find .github/workflows -maxdepth 1 -name 'temporary-*.yaml' -delete
          mkdir -p target
          python3 .github/scripts/verify-bom-contract.py \
            --report target/bom-contract.json
          python3 -m py_compile .github/scripts/verify-bom-contract.py
          git diff --check

      - name: Verify complete reactor and staged anonymous consumption
        shell: bash
        run: |
          set -o pipefail
          mvn -B verify 2>&1 | tee target/bom-final-verify.log

      - name: Commit the clean BOM branch only when needed
        shell: bash
        run: |
          set -euo pipefail
          test -s target/bom-contract.json
          test -s target/bom-final-verify.log
          test -z "$(find .github/workflows -maxdepth 1 -name 'temporary-*.yml' -print -quit)"
          git add -A
          if git diff --cached --quiet; then
            echo 'The BOM branch was already clean and verified.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Finalize consumer BOM release and resolution contracts'
          git push origin HEAD:feat/consumer-bom

      - name: Upload final BOM evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-bom-final-evidence
          path: |
            target/bom-contract.json
            target/bom-final-verify.log
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: error
