name: Apply issue 265 release hardening

on:
  push:
    branches:
      - fix/release-automation-265
    paths:
      - '.github/scripts/agent_patch_issue_265.py'
      - '.github/workflows/agent-apply-issue-265.yml'

permissions:
  contents: write

concurrency:
  group: issue-265-release-hardening
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/release-automation-265
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply focused release hardening
        run: python3 .github/scripts/agent_patch_issue_265.py

      - name: Verify release tooling contracts
        run: |
          bash -n .github/scripts/release.sh
          python3 -m py_compile \
            .github/scripts/verify-release-consistency.py \
            .github/scripts/test_release_workflow_trigger.py \
            .github/scripts/test_release_status_consistency.py
          python3 .github/scripts/test_release_workflow_trigger.py
          python3 .github/scripts/test_release_status_consistency.py
          python3 .github/scripts/test_update_release_metadata.py
          python3 .github/scripts/verify-release-consistency.py
          python3 .github/scripts/verify-public-repository-publishing.py
          git diff --check

      - name: Run complete Maven verification
        run: |
          docker info >/dev/null
          mvn -B -ntp verify

      - name: Commit verified implementation and remove temporary driver
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/scripts/agent_patch_issue_265.py \
            .github/workflows/agent-apply-issue-265.yml
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Harden release PR creation and release-status documentation'
          git push origin HEAD:fix/release-automation-265
