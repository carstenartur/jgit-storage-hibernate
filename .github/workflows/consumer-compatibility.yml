name: Consumer Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '23 4 * * 2'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/consumer-compatibility.json'
      - '.github/scripts/verify-consumer-compatibility.py'
      - '.github/workflows/consumer-compatibility.yml'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-search/**'
      - 'jgit-storage-hibernate-java-analysis/**'
      - 'jgit-storage-hibernate-architecture/**'
  push:
    branches: [ main ]
    paths:
      - '.github/consumer-compatibility.json'
      - '.github/scripts/verify-consumer-compatibility.py'
      - '.github/workflows/consumer-compatibility.yml'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-search/**'
      - 'jgit-storage-hibernate-java-analysis/**'
      - 'jgit-storage-hibernate-architecture/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contract:
    name: Validate pinned consumer contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout storage candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate descriptor and workflow
        run: python3 .github/scripts/verify-consumer-compatibility.py

  audio-analyzer:
    name: Audio Analyzer — Core and Search workflow history
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout storage candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: storage
      - name: Checkout pinned Audio Analyzer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: carstenartur/audio-analyzer
          ref: 72b31843faa40ea73d95ad104ea29c7b22aa10f9
          path: consumer
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            storage/pom.xml
            storage/jgit-storage-hibernate-core/pom.xml
            storage/jgit-storage-hibernate-search/pom.xml
            consumer/pom.xml
            consumer/audio-app/pom.xml
      - name: Resolve candidate version
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn -q -f storage/pom.xml -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install candidate Core and Search modules locally
        shell: bash
        run: |
          mkdir -p evidence/audio-analyzer
          set -o pipefail
          mvn -B -f storage/pom.xml -pl jgit-storage-hibernate-search -am install \
            -DskipTests 2>&1 | tee evidence/audio-analyzer/upstream-install.log
      - name: Record resolved storage dependencies
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -o pipefail
          mvn -B -f consumer/audio-app/pom.xml dependency:tree \
            -Djgit-storage-hibernate.version="$CANDIDATE_VERSION" \
            -Dincludes=io.github.carstenartur:jgit-storage-hibernate-* 2>&1 \
            | tee evidence/audio-analyzer/dependency-tree.log
      - name: Compile and test workflow-history integration
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -o pipefail
          mvn -B -f consumer/pom.xml -pl audio-app -am test \
            -Djgit-storage-hibernate.version="$CANDIDATE_VERSION" 2>&1 \
            | tee evidence/audio-analyzer/consumer-build.log
      - name: Upload Audio Analyzer evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-audio-analyzer
          path: |
            evidence/audio-analyzer/**
            consumer/**/target/surefire-reports/**
          if-no-files-found: error

  taxonomy:
    name: Taxonomy — Core schema and migration contract
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout storage candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: storage
      - name: Checkout pinned Taxonomy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: carstenartur/Taxonomy
          ref: d2c1f5d53f45c8e2d51c3a6bbcaf5cc9bb2d847c
          path: consumer
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            storage/pom.xml
            storage/jgit-storage-hibernate-core/pom.xml
            consumer/pom.xml
            consumer/taxonomy-app/pom.xml
      - name: Resolve candidate version
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn -q -f storage/pom.xml -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install candidate Core module locally
        shell: bash
        run: |
          mkdir -p evidence/taxonomy
          set -o pipefail
          mvn -B -f storage/pom.xml -pl jgit-storage-hibernate-core -am install \
            -DskipTests 2>&1 | tee evidence/taxonomy/upstream-install.log
      - name: Record resolved storage dependencies
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          chmod +x consumer/mvnw
          set -o pipefail
          (cd consumer && ./mvnw -B -pl taxonomy-app dependency:tree \
            -Djgit-storage-hibernate.version="$CANDIDATE_VERSION" \
            -Dtaxonomy.model.download.skip=true \
            -Dtaxonomy.ui.skip=true \
            -Dtaxonomy.quality.skip=true \
            -Dincludes=io.github.carstenartur:jgit-storage-hibernate-*) 2>&1 \
            | tee evidence/taxonomy/dependency-tree.log
      - name: Test fail-closed Core schema contracts
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -o pipefail
          (cd consumer && ./mvnw -B -pl taxonomy-app -am test \
            -Djgit-storage-hibernate.version="$CANDIDATE_VERSION" \
            -Dtaxonomy.model.download.skip=true \
            -Dtaxonomy.ui.skip=true \
            -Dtaxonomy.quality.skip=true \
            -DskipITs=true \
            -DexcludedGroups=real-llm,onnx,db-postgres,db-mssql,db-oracle \
            -Dtest=JgitStorageHibernateIntegrationTest,JgitStorageOptimizedIndexContractTest,JgitStorageSchemaIndexValidationTest,JgitStorageSchemaMigrationConfigTest \
            -Dsurefire.failIfNoSpecifiedTests=false) 2>&1 \
            | tee evidence/taxonomy/consumer-build.log
      - name: Upload Taxonomy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-taxonomy
          path: |
            evidence/taxonomy/**
            consumer/**/target/surefire-reports/**
          if-no-files-found: error

  sandbox:
    name: Sandbox — Core lifecycle, adoption and packaging
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout storage candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: storage
      - name: Checkout pinned Sandbox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: carstenartur/sandbox
          ref: 6eec161d5bb224e90257773f5ecc7af4e0592359
          path: consumer
      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            storage/pom.xml
            storage/jgit-storage-hibernate-core/pom.xml
            consumer/pom.xml
            consumer/sandbox-jgit-storage-hibernate/pom.xml
            consumer/sandbox-jgit-server-webapp/pom.xml
      - name: Resolve candidate version
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn -q -f storage/pom.xml -DforceStdout help:evaluate -Dexpression=project.version | tail -n 1)"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Install candidate Core module locally
        shell: bash
        run: |
          mkdir -p evidence/sandbox
          set -o pipefail
          mvn -B -f storage/pom.xml -pl jgit-storage-hibernate-core -am install \
            -DskipTests 2>&1 | tee evidence/sandbox/upstream-install.log
      - name: Build and install the OSGi/plain-Maven bridge
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -o pipefail
          mvn -B -N -f consumer/pom.xml install 2>&1 \
            | tee evidence/sandbox/parent-install.log
          mvn -B -f consumer/sandbox-jgit-storage-hibernate/pom.xml install \
            -Djgit-storage-hibernate.version="$CANDIDATE_VERSION" 2>&1 \
            | tee evidence/sandbox/bridge-build.log
      - name: Test and shade the standalone server
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -o pipefail
          mvn -B -f consumer/sandbox-jgit-server-webapp/pom.xml package \
            -Djgit-storage-hibernate.version="$CANDIDATE_VERSION" 2>&1 \
            | tee evidence/sandbox/server-build.log
      - name: Record resolved storage dependencies
        shell: bash
        env:
          CANDIDATE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -o pipefail
          mvn -B -f consumer/sandbox-jgit-server-webapp/pom.xml dependency:tree \
            -Djgit-storage-hibernate.version="$CANDIDATE_VERSION" \
            -Dincludes=io.github.carstenartur:jgit-storage-hibernate-* 2>&1 \
            | tee evidence/sandbox/dependency-tree.log
      - name: Require OSGi and shaded packaging evidence
        shell: bash
        run: |
          test -s consumer/sandbox-jgit-storage-hibernate/target/classes/META-INF/MANIFEST.MF
          test -s consumer/sandbox-jgit-server-webapp/target/jgit-server.jar
      - name: Upload Sandbox evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-sandbox
          path: |
            evidence/sandbox/**
            consumer/sandbox-jgit-storage-hibernate/target/classes/META-INF/MANIFEST.MF
            consumer/sandbox-jgit-server-webapp/target/jgit-server.jar
            consumer/**/target/surefire-reports/**
          if-no-files-found: error
