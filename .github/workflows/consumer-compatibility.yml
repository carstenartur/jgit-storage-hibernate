name: Consumer Compatibility

on:
  workflow_dispatch:
  schedule:
    - cron: '37 3 * * 3'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/consumer-compatibility.yml'
      - '.github/scripts/prepare-consumer-contract.py'
      - '.github/scripts/test_prepare_consumer_contract.py'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-search/**'
      - 'jgit-storage-hibernate-java-analysis/**'
      - 'jgit-storage-hibernate-architecture/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/consumer-compatibility.yml'
      - '.github/scripts/prepare-consumer-contract.py'
      - '.github/scripts/test_prepare_consumer_contract.py'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-search/**'
      - 'jgit-storage-hibernate-java-analysis/**'
      - 'jgit-storage-hibernate-architecture/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  current-library:
    name: Build exact current reactor
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.version.outputs.value }}
      commit: ${{ steps.version.outputs.commit }}

    steps:
      - name: Checkout current library commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Test consumer preparation tooling
        run: python3 .github/scripts/test_prepare_consumer_contract.py

      - name: Resolve exact reactor identity
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)"
          test -n "$version"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          echo "Building consumer contract artifacts for $version at $GITHUB_SHA"

      - name: Install current reactor into an isolated repository
        shell: bash
        run: |
          set -euo pipefail
          repository="${RUNNER_TEMP}/consumer-m2"
          mkdir -p "$repository" target/consumer-compatibility
          set -o pipefail
          mvn -B -DskipTests -Dmaven.repo.local="$repository" install 2>&1 \
            | tee target/consumer-compatibility/library-build.log
          test -d "$repository/io/github/carstenartur"

      - name: Retain only repository-owned Maven artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/consumer-reactor-repository/io/github
          cp -R "${RUNNER_TEMP}/consumer-m2/io/github/carstenartur" \
            target/consumer-reactor-repository/io/github/
          find target/consumer-reactor-repository -type f | sort \
            > target/consumer-compatibility/reactor-artifacts.txt
          test -s target/consumer-compatibility/reactor-artifacts.txt

      - name: Upload current reactor repository
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-consumer-reactor
          path: target/consumer-reactor-repository/**
          if-no-files-found: error

      - name: Upload library build evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-library-build-evidence
          path: target/consumer-compatibility/**
          if-no-files-found: error

  consumers:
    name: ${{ matrix.consumer }} — ${{ matrix.contract }}
    needs: current-library
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - consumer: audio-analyzer
            repository: carstenartur/audio-analyzer
            contract: runtime package and unit linkage
            timeout: 45
          - consumer: Taxonomy
            repository: carstenartur/Taxonomy
            contract: PostgreSQL, migrations and indexed history
            timeout: 60
          - consumer: sandbox
            repository: carstenartur/sandbox
            contract: Java 21, Tycho/OSGi and Java analysis packaging
            timeout: 60

    steps:
      - name: Checkout compatibility tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: library
          fetch-depth: 1

      - name: Checkout ${{ matrix.consumer }} default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.repository }}
          path: consumer
          fetch-depth: 1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            library/pom.xml
            consumer/**/pom.xml

      - name: Restore current reactor artifacts
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: current-consumer-reactor
          path: ${{ runner.temp }}/consumer-m2

      - name: Record consumer and library identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/consumer-compatibility
          git -C consumer rev-parse HEAD > target/consumer-compatibility/consumer-commit.txt
          printf '%s\n' '${{ needs.current-library.outputs.commit }}' \
            > target/consumer-compatibility/library-commit.txt
          printf '%s\n' '${{ needs.current-library.outputs.version }}' \
            > target/consumer-compatibility/library-version.txt
          find "${RUNNER_TEMP}/consumer-m2/io/github/carstenartur" -type f | sort \
            > target/consumer-compatibility/restored-artifacts.txt

      - name: Substitute only jgit-storage-hibernate versions
        shell: bash
        run: |
          set -euo pipefail
          python3 library/.github/scripts/prepare-consumer-contract.py \
            --consumer '${{ matrix.consumer }}' \
            --root consumer \
            --version '${{ needs.current-library.outputs.version }}' \
            --report target/consumer-compatibility/contract.json
          git -C consumer diff -- pom.xml '**/pom.xml' \
            > target/consumer-compatibility/pom.patch
          cat target/consumer-compatibility/contract.json

      - name: Verify Docker for integration-capable consumers
        if: matrix.consumer == 'Taxonomy'
        run: docker info

      - name: Resolve repository-owned dependency tree
        shell: bash
        working-directory: consumer
        run: |
          set -euo pipefail
          if [ -x ./mvnw ]; then
            maven=(./mvnw)
          else
            maven=(mvn)
          fi
          mkdir -p ../target/consumer-compatibility
          set -o pipefail
          "${maven[@]}" -B \
            -Dmaven.repo.local="${RUNNER_TEMP}/consumer-m2" \
            -Dincludes=io.github.carstenartur \
            dependency:tree 2>&1 \
            | tee ../target/consumer-compatibility/dependency-tree.log
          grep -F 'io.github.carstenartur:jgit-storage-hibernate-' \
            ../target/consumer-compatibility/dependency-tree.log
          grep -F ':${{ needs.current-library.outputs.version }}' \
            ../target/consumer-compatibility/dependency-tree.log

      - name: Run audio-analyzer runtime contract
        if: matrix.consumer == 'audio-analyzer'
        shell: bash
        working-directory: consumer
        run: |
          set -euo pipefail
          if [ -x ./mvnw ]; then maven=(./mvnw); else maven=(mvn); fi
          set -o pipefail
          "${maven[@]}" -B \
            -Dmaven.repo.local="${RUNNER_TEMP}/consumer-m2" \
            -DskipITs \
            verify 2>&1 \
            | tee ../target/consumer-compatibility/consumer-build.log
          if grep -Fq 'jgit-storage-hibernate-benchmarks' \
              ../target/consumer-compatibility/dependency-tree.log; then
            echo 'audio-analyzer must not depend on the benchmark artifact' >&2
            exit 1
          fi

      - name: Run Taxonomy PostgreSQL and indexed-history contract
        if: matrix.consumer == 'Taxonomy'
        shell: bash
        working-directory: consumer
        run: |
          set -euo pipefail
          if [ -x ./mvnw ]; then maven=(./mvnw); else maven=(mvn); fi
          set -o pipefail
          "${maven[@]}" -B \
            -Dmaven.repo.local="${RUNNER_TEMP}/consumer-m2" \
            verify 2>&1 \
            | tee ../target/consumer-compatibility/consumer-build.log

      - name: Run sandbox Tycho/OSGi and Java-analysis contract
        if: matrix.consumer == 'sandbox'
        shell: bash
        working-directory: consumer
        run: |
          set -euo pipefail
          if [ -x ./mvnw ]; then maven=(./mvnw); else maven=(mvn); fi
          set -o pipefail
          xvfb-run -a "${maven[@]}" -B \
            -Dmaven.repo.local="${RUNNER_TEMP}/consumer-m2" \
            -DskipTests \
            verify 2>&1 \
            | tee ../target/consumer-compatibility/consumer-build.log
          if grep -Fq 'jgit-storage-hibernate-benchmarks' \
              ../target/consumer-compatibility/dependency-tree.log; then
            echo 'sandbox must not package the benchmark artifact' >&2
            exit 1
          fi

      - name: Summarize consumer contract
        if: always()
        shell: bash
        env:
          CONSUMER: ${{ matrix.consumer }}
          CONTRACT: ${{ matrix.contract }}
          LIBRARY_VERSION: ${{ needs.current-library.outputs.version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path('target/consumer-compatibility/contract.json')
          data = json.loads(report_path.read_text(encoding='utf-8')) if report_path.is_file() else {}
          consumer_commit = Path('target/consumer-compatibility/consumer-commit.txt')
          commit = consumer_commit.read_text(encoding='utf-8').strip() if consumer_commit.is_file() else 'unavailable'
          modules = ', '.join(data.get('modules', [])) or 'unavailable'
          lines = [
              f"### {os.environ['CONSUMER']} consumer contract",
              '',
              f"- Consumer commit: `{commit}`",
              f"- Current library version: `{os.environ['LIBRARY_VERSION']}`",
              f"- Consumed modules: {modules}",
              f"- Contract: {os.environ['CONTRACT']}",
              f"- Job status: `{os.environ.get('JOB_STATUS', '${{ job.status }}')}`",
              '',
          ]
          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('\n'.join(lines))
          PY

      - name: Upload ${{ matrix.consumer }} compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: consumer-${{ matrix.consumer }}-compatibility
          path: |
            target/consumer-compatibility/**
            consumer/**/target/surefire-reports/**
            consumer/**/target/failsafe-reports/**
            consumer/**/target/*.log
            consumer/**/target/repository/**
          if-no-files-found: error
