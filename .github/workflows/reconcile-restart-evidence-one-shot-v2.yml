name: Run idempotent restart evidence reconciler v2

on:
  push:
    branches:
      - automation/reconcile-restart-evidence-20260904-v3

concurrency:
  group: reconcile-restart-evidence-20260904
  cancel-in-progress: true

permissions:
  actions: read
  checks: read
  contents: write
  issues: write
  pull-requests: write

jobs:
  reconcile:
    name: Establish and verify protected restart evidence launch
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout one-shot reconciler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reconcile protected request and full evidence launch
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/reconcile-restart-evidence-one-shot.sh

      - name: Remove obsolete cancelled-helper diagnostics
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          comments="$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/issues/165/comments?per_page=100" | jq -s 'add')"
          while IFS=$'\t' read -r comment_id run_id; do
            [[ -n "$comment_id" && -n "$run_id" ]] || continue
            run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
              2>/dev/null || true)"
            if [[ -n "$run" \
                && "$(jq -r '.name // empty' <<< "$run")" \
                   == 'Run idempotent restart evidence reconciler' \
                && "$(jq -r '.conclusion // empty' <<< "$run")" == cancelled ]]; then
              gh api -X DELETE \
                "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
                >/dev/null 2>&1 || true
            fi
          done < <(jq -r '
            .[]
            | select((.body // "") | contains("<!-- restart-evidence-reconciler-failure:"))
            | [
                (.id | tostring),
                ((.body | capture("restart-evidence-reconciler-failure:(?<id>[0-9]+)").id) // "")
              ]
            | @tsv
          ' <<< "$comments")

      - name: Remove this one-shot branch after success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X DELETE \
            "repos/$GITHUB_REPOSITORY/git/refs/heads/automation/reconcile-restart-evidence-20260904-v3" \
            >/dev/null 2>&1 || true
