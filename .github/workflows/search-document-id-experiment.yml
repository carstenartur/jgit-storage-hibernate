name: Search Document ID Compatibility Experiment

on:
  workflow_dispatch:
  push:
    branches:
      - perf/search-document-id-compatibility
    paths:
      - '.github/workflows/search-document-id-experiment.yml'
      - 'jgit-storage-hibernate-search/**'
      - 'jgit-storage-hibernate-benchmarks/**'
      - 'pom.xml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compare-document-identifiers:
    name: Assigned ORM ID with numeric versus projection-key Lucene ID
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply the numeric document-ID candidate in the experiment workspace
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              'jgit-storage-hibernate-search/src/main/java/'
              'io/github/carstenartur/jgit/storage/hibernate/search/entity/GitCommitIndex.java'
          )
          text = path.read_text(encoding='utf-8')
          import_anchor = (
              'import org.hibernate.search.mapper.pojo.mapping.definition.annotation.FullTextField;\n'
          )
          if 'definition.annotation.DocumentId;' not in text:
              if import_anchor not in text:
                  raise SystemExit('Could not locate Hibernate Search annotation imports')
              text = text.replace(
                  import_anchor,
                  'import org.hibernate.search.mapper.pojo.mapping.definition.annotation.DocumentId;\n'
                  + import_anchor,
                  1,
              )
          id_position = text.find('private Long id;')
          if id_position < 0:
              raise SystemExit('Could not locate the generated numeric compatibility ID')
          prefix = text[max(0, id_position - 240):id_position]
          if '@DocumentId' not in prefix:
              column_candidates = [
                  '@Column(name = "id", insertable = false, updatable = false)\n  private Long id;',
                  '@Column(name = "id", updatable = false, insertable = false)\n  private Long id;',
              ]
              for candidate in column_candidates:
                  if candidate in text:
                      text = text.replace(candidate, '@DocumentId\n  ' + candidate, 1)
                      break
              else:
                  raise SystemExit('Could not attach @DocumentId to the numeric compatibility ID')
          path.write_text(text, encoding='utf-8')
          PY
          grep -F '@DocumentId' \
            jgit-storage-hibernate-search/src/main/java/io/github/carstenartur/jgit/storage/hibernate/search/entity/GitCommitIndex.java
          git diff --check

      - name: Prove real JDBC batching with the compatibility document ID
        shell: bash
        run: |
          set -o pipefail
          mkdir -p target/search-document-id-experiment/candidate
          mvn -B -pl jgit-storage-hibernate-search -am \
            -Dtest=CommitProjectionJdbcBatchH2Test,CommitSearchProjectionH2Test \
            -Dsurefire.failIfNoSpecifiedTests=false test 2>&1 \
            | tee target/search-document-id-experiment/candidate/h2-batch-test.log

      - name: Benchmark the numeric document-ID candidate
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks verify \
            -Psearch-performance \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/search-document-id-experiment/candidate/jmh-result.json" 2>&1 \
            | tee target/search-document-id-experiment/candidate/maven-benchmark.log

      - name: Benchmark the projection-key document-ID baseline
        shell: bash
        run: |
          set -euo pipefail
          baseline="${RUNNER_TEMP}/search-document-id-baseline"
          git worktree add --detach "$baseline" cb2ff21a691716e694fa196d2d11daf2b13d6ca2
          mkdir -p target/search-document-id-experiment/baseline
          set -o pipefail
          (
            cd "$baseline"
            mvn -B -pl jgit-storage-hibernate-benchmarks verify \
              -Psearch-performance \
              -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/search-document-id-experiment/baseline/jmh-result.json"
          ) 2>&1 | tee target/search-document-id-experiment/baseline/maven-benchmark.log

      - name: Compare elapsed time and database-work counters
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('target/search-document-id-experiment')
          baseline = json.loads((root / 'baseline/jmh-result.json').read_text(encoding='utf-8'))
          candidate = json.loads((root / 'candidate/jmh-result.json').read_text(encoding='utf-8'))

          def by_operation(results):
              return {entry['benchmark'].rsplit('.', 1)[-1]: entry for entry in results}

          old = by_operation(baseline)
          new = by_operation(candidate)
          if set(old) != set(new):
              raise SystemExit(
                  f'Benchmark operation mismatch: baseline={sorted(old)}, candidate={sorted(new)}'
              )

          interesting = (
              'prepare', 'statement', 'batch', 'transaction', 'query', 'entity',
              'gc.alloc.rate.norm', 'gc.count'
          )
          comparison = []
          markdown = [
              '# Search document-ID compatibility experiment',
              '',
              '| Operation | Baseline | Numeric @DocumentId | Ratio |',
              '|---|---:|---:|---:|',
          ]
          for operation in sorted(old):
              old_metric = old[operation]['primaryMetric']
              new_metric = new[operation]['primaryMetric']
              old_score = float(old_metric['score'])
              new_score = float(new_metric['score'])
              ratio = new_score / old_score if old_score else None
              markdown.append(
                  f"| `{operation}` | {old_score:.4f} {old_metric['scoreUnit']} | "
                  f"{new_score:.4f} {new_metric['scoreUnit']} | "
                  + ('—' if ratio is None else f'{ratio:.3f}×')
                  + ' |'
              )
              secondary = {}
              metric_names = set(old[operation].get('secondaryMetrics', {})) | set(
                  new[operation].get('secondaryMetrics', {})
              )
              for name in sorted(metric_names):
                  if any(token in name.lower() for token in interesting):
                      secondary[name] = {
                          'baseline': old[operation].get('secondaryMetrics', {}).get(name),
                          'candidate': new[operation].get('secondaryMetrics', {}).get(name),
                      }
              comparison.append(
                  {
                      'operation': operation,
                      'baselinePrimary': old_metric,
                      'candidatePrimary': new_metric,
                      'candidateToBaselineRatio': ratio,
                      'secondaryMetrics': secondary,
                  }
              )

          (root / 'comparison.json').write_text(
              json.dumps(comparison, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          (root / 'comparison.md').write_text(
              '\n'.join(markdown) + '\n', encoding='utf-8'
          )
          print('\n'.join(markdown))
          PY
          cat target/search-document-id-experiment/comparison.json

      - name: Require indexing and rebuild evidence
        run: |
          grep -F 'incrementalIndexing' target/search-document-id-experiment/comparison.json
          grep -F 'projectionRebuild' target/search-document-id-experiment/comparison.json
          grep -Ei 'prepare|statement|batch' target/search-document-id-experiment/comparison.json

      - name: Upload complete document-ID evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: search-document-id-compatibility-evidence
          path: |
            target/search-document-id-experiment/**
            jgit-storage-hibernate-search/target/surefire-reports/**
            jgit-storage-hibernate-benchmarks/target/failsafe-reports/**
          if-no-files-found: error

      - name: Report experiment
        if: always()
        run: |
          echo '### Search document-ID compatibility experiment' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compared assigned ORM projection keys with either projection-key or historical numeric Lucene document IDs.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The candidate is acceptable only when real JDBC batching survives and persistent-index migration evidence is added separately.' >> "$GITHUB_STEP_SUMMARY"
          if [ -s target/search-document-id-experiment/comparison.md ]; then
            cat target/search-document-id-experiment/comparison.md >> "$GITHUB_STEP_SUMMARY"
          fi
