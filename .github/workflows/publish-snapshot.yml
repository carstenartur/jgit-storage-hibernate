name: Publish Snapshot

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  publish-snapshot:
    name: Build and publish snapshot packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Verify version is a snapshot
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          case "$VERSION" in
            *-SNAPSHOT) echo "Publishing snapshot $VERSION" ;;
            *) echo "::error::Refusing to publish non-SNAPSHOT version $VERSION from snapshot workflow"; exit 1 ;;
          esac

      - name: Verify Docker for PostgreSQL integration tests
        run: docker info

      - name: Verify release and publishing consistency
        run: |
          python3 .github/scripts/verify-release-consistency.py
          python3 .github/scripts/verify-public-repository-publishing.py

      - name: Build and deploy snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -Pgithub-packages deploy
