name: Publish Snapshot

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read
  packages: write

jobs:
  publish-snapshot:
    name: Build and publish snapshot packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve snapshot publication
        id: snapshot
        run: |
          VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          case "$VERSION" in
            *-SNAPSHOT)
              echo "Publishing snapshot $VERSION"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::notice::Skipping snapshot publication for release version $VERSION"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Verify Docker for PostgreSQL integration tests
        if: steps.snapshot.outputs.publish == 'true'
        run: docker info

      - name: Verify release, security and publishing consistency
        if: steps.snapshot.outputs.publish == 'true'
        run: |
          python3 .github/scripts/verify-release-consistency.py
          python3 .github/scripts/verify-security-policy.py
          python3 .github/scripts/verify-public-repository-publishing.py

      - name: Build and deploy snapshot
        if: steps.snapshot.outputs.publish == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B -Pgithub-packages deploy
