name: Temporary reflog contract correction

on:
  push:
    branches:
      - perf/reflog-index-evidence

permissions:
  contents: write

concurrency:
  group: temporary-reflog-contract-correction
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/reflog-index-evidence
          fetch-depth: 0
      - name: Patch migration and adoption expectations
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path_name: str, old: str, new: str, count: int = 1) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f'{path}: expected {old!r} {count} time(s), found {actual}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace_exact(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/CoreSchemaMigrationIntegrationTest.java',
              'new ExpectedMigration("0.1.18", "optimize reverse reflog reads"));',
              'new ExpectedMigration("0.1.18", "optimize reverse reflog reads"),\n'
              '      new ExpectedMigration("0.9.1", "add reflog reference key"));',
          )

          replace_exact(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/CoreSqlServerSchemaMigrationIntegrationTest.java',
              'assertEquals("0.1.18", flyway.info().current().getVersion().getVersion());',
              'assertEquals("0.9.1", flyway.info().current().getVersion().getVersion());',
          )
          replace_exact(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/CoreSqlServerSchemaMigrationIntegrationTest.java',
              'assertTrue(indexExists(connection, "git_reflog", "idx_reflog_repo_id"));',
              'assertTrue(indexExists(connection, "git_reflog", "idx_reflog_repo_ref_key_id"));\n'
              '      assertTrue(columnExists(connection, "git_reflog", "ref_name_key"));',
          )

          replace_exact(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/StorageIndexContract.java',
              'assertTrue(reflogIndexes.contains("IDX_REFLOG_REPO_REF_ID"));',
              'assertTrue(reflogIndexes.contains("IDX_REFLOG_REPO_REF_KEY_ID"));',
          )

          replace_exact(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/LegacyCoreSchemaAdoptionIntegrationTest.java',
              'statement.execute("alter table git_reflog alter column repository_name set data type varchar(255)");',
              'statement.execute("drop index idx_reflog_repo_ref_key_id");\n'
              '      statement.execute("alter table git_reflog drop column ref_name_key");\n'
              '      statement.execute("alter table git_reflog alter column repository_name set data type varchar(255)");',
          )
          replace_exact(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/LegacyCoreSchemaAdoptionIntegrationTest.java',
              'assertTrue(columnExists(connection, "git_reflog", "message"));',
              'assertTrue(columnExists(connection, "git_reflog", "message"));\n'
              '      assertFalse(columnExists(connection, "git_reflog", "ref_name_key"));',
          )

          sqlserver_adoption = Path(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/LegacyCoreSqlServerSchemaAdoptionIntegrationTest.java'
          )
          text = sqlserver_adoption.read_text(encoding='utf-8')
          if text.count('"0.1.18"') != 1:
              raise SystemExit('Expected one SQL Server adoption latest-version assertion')
          text = text.replace('"0.1.18"', '"0.9.1"')
          anchor = 'statement.execute("alter table git_reflog alter column repository_name varchar(255) not null");'
          if text.count(anchor) != 1:
              raise SystemExit('Expected one SQL Server reflog downgrade anchor')
          text = text.replace(
              anchor,
              'statement.execute("drop index if exists idx_reflog_repo_ref_key_id on git_reflog");\n'
              '      statement.execute("alter table git_reflog drop column ref_name_key");\n'
              '      ' + anchor,
          )
          sqlserver_adoption.write_text(text, encoding='utf-8')

          replace_exact(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/LegacyCoreSqlServerPostAdoptionWriteIntegrationTest.java',
              'assertEquals("0.1.18", flyway.info().current().getVersion().getVersion());',
              'assertEquals("0.9.1", flyway.info().current().getVersion().getVersion());',
          )

          Path('.github/workflows/temporary-fix-reflog-contract.yml').unlink()
          PY
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Align reflog migration and adoption contracts with 0.9.1'
          git push origin HEAD:perf/reflog-index-evidence
