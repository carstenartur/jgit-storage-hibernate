name: Temporary Taxonomy adaptation pin

on:
  push:
    branches:
      - perf/reflog-index-evidence

permissions:
  contents: write

concurrency:
  group: temporary-taxonomy-adaptation-pin
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reflog candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/reflog-index-evidence
          fetch-depth: 0

      - name: Pin the exact coordinated Taxonomy commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          old = 'd2c1f5d53f45c8e2d51c3a6bbcaf5cc9bb2d847c'
          new = '579208b57f7baeaaaa114e1d861ce29f770ef6ce'
          paths = [
              Path('.github/consumer-compatibility.json'),
              Path('.github/workflows/consumer-compatibility.yml'),
          ]
          for path in paths:
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected the previous Taxonomy pin exactly once')
              path.write_text(text.replace(old, new), encoding='utf-8')
          Path('.github/workflows/temporary-pin-taxonomy-adaptation.yml').unlink()
          PY
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Validate reflog schema against the Taxonomy 0.9.1 adaptation'
          git push origin HEAD:perf/reflog-index-evidence
