name: Temporary test historical Search document ID

on:
  push:
    branches:
      - perf/search-document-id-compatibility

permissions:
  contents: write

concurrency:
  group: temporary-test-historical-search-document-id
  cancel-in-progress: true

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/search-document-id-compatibility
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Keep the released numeric Lucene document identifier
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path(
              'jgit-storage-hibernate-search/src/main/java/'
              'io/github/carstenartur/jgit/storage/hibernate/search/entity/GitCommitIndex.java'
          )
          text = path.read_text(encoding='utf-8')
          import_anchor = (
              'import org.hibernate.search.mapper.pojo.mapping.definition.annotation.FullTextField;\n'
          )
          if 'definition.annotation.DocumentId;' not in text:
              if import_anchor not in text:
                  raise SystemExit('Could not locate Hibernate Search annotation imports')
              text = text.replace(
                  import_anchor,
                  'import org.hibernate.search.mapper.pojo.mapping.definition.annotation.DocumentId;\n'
                  + import_anchor,
                  1,
              )

          candidates = [
              '@Column(name = "id", insertable = false, updatable = false)\n  private Long id;',
              '@Column(name = "id", updatable = false, insertable = false)\n  private Long id;',
          ]
          changed = False
          for candidate in candidates:
              if candidate in text and '@DocumentId\n  ' + candidate not in text:
                  text = text.replace(candidate, '@DocumentId\n  ' + candidate, 1)
                  changed = True
                  break
          if not changed and '@DocumentId' not in text[text.find('private Long id;') - 200:text.find('private Long id;')]:
              raise SystemExit('Could not locate the generated numeric compatibility ID')
          path.write_text(text, encoding='utf-8')

          Path('.github/workflows/temporary-test-historical-search-document-id.yml').unlink()
          PY
          git diff --check
          mvn -B -pl jgit-storage-hibernate-search -am \
            -Dtest=CommitProjectionJdbcBatchH2Test,CommitSearchProjectionH2Test \
            -Dsurefire.failIfNoSpecifiedTests=false test
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Retain the numeric Hibernate Search document identifier'
          git push origin HEAD:perf/search-document-id-compatibility
