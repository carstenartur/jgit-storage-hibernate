name: JGit Compatibility

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compatibility:
    name: JGit ${{ matrix.jgit }} / Java 21
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        jgit:
          - 7.5.0.202512021534-r
          - 7.6.0.202603022253-r
          - 7.7.0.202606012155-r
          - 7.7.1.202607240634-r

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify against JGit ${{ matrix.jgit }}
        run: |
          set +e
          mvn -B -q verify -Djgit.version=${{ matrix.jgit }} > jgit-compatibility.log 2>&1
          status=$?
          tail -n 120 jgit-compatibility.log
          exit $status

      - name: Upload compatibility build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jgit-compatibility-java-21-${{ matrix.jgit }}
          path: jgit-compatibility.log
