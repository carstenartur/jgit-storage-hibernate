name: Temporary reflog migration contract repair

on:
  push:
    branches:
      - perf/reflog-index-evidence

permissions:
  contents: write

concurrency:
  group: temporary-reflog-migration-contract-repair
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/reflog-index-evidence
          fetch-depth: 0

      - name: Align migration, index and legacy-adoption contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path_name: str, old: str, new: str, expected: int = 1) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              actual = text.count(old)
              if actual != expected:
                  raise SystemExit(
                      f'{path_name}: expected {old!r} {expected} time(s), found {actual}'
                  )
              path.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/CoreSchemaMigrationIntegrationTest.java',
              'List.of("0.1.4", "0.1.5", "0.1.14", "0.1.14.1", "0.1.14.2", "0.1.17", "0.1.18");',
              'List.of(\n'
              '          "0.1.4",\n'
              '          "0.1.5",\n'
              '          "0.1.14",\n'
              '          "0.1.14.1",\n'
              '          "0.1.14.2",\n'
              '          "0.1.17",\n'
              '          "0.1.18",\n'
              '          "0.9.1");',
          )

          replace(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/StorageIndexContract.java',
              '          "IDX_REFLOG_REPO_REF");',
              '          "IDX_REFLOG_REPO_REF",\n'
              '          "IDX_REFLOG_REPO_REF_ID");',
          )
          replace(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/StorageIndexContract.java',
              '    assertTrue(reflogIndexes.contains("IDX_REFLOG_REPO_REF_ID"));',
              '    assertTrue(reflogIndexes.contains("IDX_REFLOG_REPO_REF_KEY_ID"));',
          )

          replace(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/CoreSqlServerSchemaMigrationIntegrationTest.java',
              '    assertEquals("0.1.18", flyway.info().current().getVersion().getVersion());',
              '    assertEquals("0.9.1", flyway.info().current().getVersion().getVersion());',
          )
          replace(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/CoreSqlServerSchemaMigrationIntegrationTest.java',
              '      assertTrue(indexExists(connection, "git_reflog", "idx_reflog_repo_id"));',
              '      assertTrue(columnExists(connection, "git_reflog", "ref_name_key"));\n'
              '      assertTrue(\n'
              '          indexExists(connection, "git_reflog", "idx_reflog_repo_ref_key_id"));\n'
              '      assertFalse(indexExists(connection, "git_reflog", "idx_reflog_repo_id"));',
          )

          replace(
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/LegacyCoreSqlServerPostAdoptionWriteIntegrationTest.java',
              '    assertEquals("0.1.18", flyway.info().current().getVersion().getVersion());',
              '    assertEquals("0.9.1", flyway.info().current().getVersion().getVersion());',
          )

          adoption = (
              'jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/'
              'LegacyCoreSqlServerSchemaAdoptionIntegrationTest.java'
          )
          replace(
              adoption,
              '    assertEquals("0.1.18", flyway.info().current().getVersion().getVersion());',
              '    assertEquals("0.9.1", flyway.info().current().getVersion().getVersion());',
          )
          replace(
              adoption,
              '      statement.execute("drop index if exists idx_reflog_repo_id on git_reflog");',
              '      statement.execute(\n'
              '          "drop index if exists idx_reflog_repo_ref_key_id on git_reflog");\n'
              '      statement.execute(\n'
              '          "if col_length(\'git_reflog\', \'ref_name_key\') is not null "\n'
              '              + "alter table git_reflog drop column ref_name_key");\n'
              '      statement.execute("drop index if exists idx_reflog_repo_id on git_reflog");',
          )

          Path('.github/workflows/temporary-fix-reflog-migration-contracts.yml').unlink()
          PY

          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Align reflog migration and adoption contracts with 0.9.1'
          git push origin HEAD:perf/reflog-index-evidence
