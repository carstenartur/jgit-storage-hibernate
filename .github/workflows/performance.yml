name: JMH Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jmh:
    name: JGit repository backend comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build benchmark module with Maven
        shell: bash
        run: |
          mkdir -p target/benchmarks
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee target/benchmarks/maven-build.log

      - name: Run JUnit and Testcontainers benchmark comparison with Maven
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks verify \
            -Pbenchmark-comparison \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/benchmarks/jmh-result.json" 2>&1 \
            | tee target/benchmarks/maven-benchmark.log

      - name: Convert results for comparison charts
        run: |
          python3 .github/scripts/convert-jmh-backend-comparison.py \
            target/benchmarks/jmh-result.json \
            target/benchmarks/backend-comparison.json
          cat target/benchmarks/backend-comparison.json

      - name: Verify grouped dashboard template
        run: |
          test -s .github/benchmark-dashboard/index.html
          test -s .github/benchmark-dashboard/dashboard.js
          grep -F "Each chart groups the same JGit operation" .github/benchmark-dashboard/index.html
          grep -F "datasets" .github/benchmark-dashboard/dashboard.js

      - name: Generate JMH performance badge
        if: always()
        run: |
          if [ -s target/benchmarks/jmh-result.json ]; then
            python3 .github/scripts/write-performance-badge.py target/benchmarks/jmh-result.json
          fi

      - name: Upload JMH benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jmh-backend-comparison-results
          path: |
            target/benchmarks/*
            docs/badges/performance.json
          if-no-files-found: error

      - name: Report benchmark dashboard
        if: always()
        run: |
          echo '### Repository backend performance' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compared backends: JGit + filesystem, JGit + HSQLDB (in-memory), JGit + PostgreSQL, and JGit + PostgreSQL + HikariCP.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Related backend measurements are rendered as multiple lines in one chart per JGit operation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PostgreSQL is provided by the JUnit Testcontainers extension; the workflow only invokes Maven.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '[Open performance charts](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/)' >> "$GITHUB_STEP_SUMMARY"

  jdbc-batching:
    name: PostgreSQL JDBC batching comparison
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build benchmark module with Maven
        shell: bash
        run: |
          mkdir -p target/jdbc-batching
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee target/jdbc-batching/maven-build.log

      - name: Compare large-pack publication with batching off and on
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks verify \
            -Pjdbc-batch-comparison \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/jdbc-batching/jmh-result.json" 2>&1 \
            | tee target/jdbc-batching/maven-benchmark.log

          result_source="$(find jgit-storage-hibernate-benchmarks/target target \
            -type f \( -name 'jdbc-batch-jmh-result.json' -o -name 'jmh-result.json' \) \
            ! -path 'target/jdbc-batching/jmh-result.json' -print -quit)"
          output_source="$(find jgit-storage-hibernate-benchmarks/target target \
            -type f -name 'jdbc-batch-jmh-output.txt' \
            ! -path 'target/jdbc-batching/jmh-output.txt' -print -quit)"

          if [ -z "$result_source" ] && [ -s target/jdbc-batching/jmh-result.json ]; then
            result_source=target/jdbc-batching/jmh-result.json
          fi
          if [ -z "$output_source" ] && [ -s target/jdbc-batching/jmh-output.txt ]; then
            output_source=target/jdbc-batching/jmh-output.txt
          fi

          test -n "$result_source"
          test -s "$result_source"
          test -n "$output_source"
          test -s "$output_source"

          if [ "$(realpath "$result_source")" != "$(realpath -m target/jdbc-batching/jmh-result.json)" ]; then
            cp "$result_source" target/jdbc-batching/jmh-result.json
          fi
          if [ "$(realpath "$output_source")" != "$(realpath -m target/jdbc-batching/jmh-output.txt)" ]; then
            cp "$output_source" target/jdbc-batching/jmh-output.txt
          fi

      - name: Convert focused batch comparison
        run: |
          python3 .github/scripts/convert-jmh-backend-comparison.py \
            target/jdbc-batching/jmh-result.json \
            target/jdbc-batching/comparison.json
          cat target/jdbc-batching/comparison.json

      - name: Upload focused batch results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jdbc-batch-comparison-results
          path: target/jdbc-batching/*
          if-no-files-found: error

      - name: Report JDBC batch comparison
        if: always()
        run: |
          echo '### PostgreSQL JDBC batching' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'A focused twelve-MiB non-compressible pack is measured with Hibernate JDBC batching disabled and enabled.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The artifact includes elapsed time, prepared statements, entity inserts, flushes and real JDBC batch-execution events.' >> "$GITHUB_STEP_SUMMARY"

  pack-capacity:
    name: Chunked pack capacity 1/16/128 MiB
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify bounded chunk storage capacity
        run: mvn -B -pl jgit-storage-hibernate-core -Ppack-capacity verify

      - name: Upload capacity test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chunked-pack-capacity-results
          path: jgit-storage-hibernate-core/target/failsafe-reports/*
          if-no-files-found: error

  publish-history:
    name: Publish benchmark history and badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [jmh, jdbc-batching]
    runs-on: ubuntu-latest
    concurrency:
      group: repository-pages-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download standard benchmark results outside the worktree
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8
        with:
          name: jmh-backend-comparison-results
          path: ${{ runner.temp }}/jmh-benchmark-artifact

      - name: Download focused JDBC batch results outside the worktree
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8
        with:
          name: jdbc-batch-comparison-results
          path: ${{ runner.temp }}/jdbc-batch-benchmark-artifact

      - name: Publish generated benchmark pages
        shell: bash
        run: |
          set -euo pipefail
          standard_artifact_root="${RUNNER_TEMP}/jmh-benchmark-artifact"
          batch_artifact_root="${RUNNER_TEMP}/jdbc-batch-benchmark-artifact"
          standard_result_source="$(find "$standard_artifact_root" -type f -name jmh-result.json -print -quit)"
          batch_result_source="$(find "$batch_artifact_root" -type f -name jmh-result.json -print -quit)"
          benchmark_source="${RUNNER_TEMP}/combined-benchmark-comparison.json"
          badge_source="$(find "$standard_artifact_root" -type f -name performance.json -print -quit)"
          dashboard_source="${GITHUB_WORKSPACE}/.github/benchmark-dashboard/index.html"
          dashboard_script_source="${GITHUB_WORKSPACE}/.github/benchmark-dashboard/dashboard.js"
          test -s "$standard_result_source"
          test -s "$batch_result_source"
          python3 .github/scripts/convert-jmh-backend-comparison.py \
            "$standard_result_source" \
            "$batch_result_source" \
            "$benchmark_source"
          test -s "$benchmark_source"
          test -s "$badge_source"
          test -s "$dashboard_source"
          test -s "$dashboard_script_source"

          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            empty_tree="$(git mktree </dev/null)"
            initial_commit="$(printf '%s\n' 'Initialize generated project pages' | git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit-tree "$empty_tree")"
            git push origin "$initial_commit:refs/heads/gh-pages"
          fi

          pages_dir="${RUNNER_TEMP}/generated-pages-jmh"
          summary_file="${RUNNER_TEMP}/benchmark-comparison-summary.md"
          published_at="$(date +%s%3N)"

          for attempt in 1 2 3; do
            git fetch origin gh-pages
            git worktree remove --force "$pages_dir" >/dev/null 2>&1 || true
            git worktree prune
            git worktree add --detach "$pages_dir" origin/gh-pages
            rm -f "$summary_file"

            python3 .github/scripts/publish-benchmark-history.py \
              --data-file "$pages_dir/dev/bench/data.js" \
              --benchmark-file "$benchmark_source" \
              --repository-dir "$GITHUB_WORKSPACE" \
              --repository-url "https://github.com/${GITHUB_REPOSITORY}" \
              --commit "$GITHUB_SHA" \
              --actor "$GITHUB_ACTOR" \
              --timestamp-ms "$published_at" \
              --summary-file "$summary_file" \
              --alert-threshold 1.5

            mkdir -p "$pages_dir/dev/bench" "$pages_dir/badges"
            cp "$dashboard_source" "$pages_dir/dev/bench/index.html"
            cp "$dashboard_script_source" "$pages_dir/dev/bench/dashboard.js"
            cp "$badge_source" "$pages_dir/badges/performance.json"
            git -C "$pages_dir" add \
              dev/bench/index.html \
              dev/bench/dashboard.js \
              dev/bench/data.js \
              badges/performance.json

            if git -C "$pages_dir" diff --cached --quiet; then
              cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
              echo 'Benchmark history, grouped dashboard, and badge unchanged'
              exit 0
            fi

            git -C "$pages_dir" -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Add benchmark result for ${GITHUB_SHA}"
            if git -C "$pages_dir" push origin HEAD:gh-pages; then
              cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Could not publish benchmark history after three attempts' >&2
          exit 1
