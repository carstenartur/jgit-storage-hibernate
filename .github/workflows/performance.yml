name: JMH Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jmh:
    name: JGit repository backend comparison
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build benchmark module with Maven
        shell: bash
        run: |
          mkdir -p target/benchmarks
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee target/benchmarks/maven-build.log

      - name: Run JUnit and Testcontainers benchmark comparison with Maven
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks verify \
            -Pbenchmark-comparison \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/benchmarks/jmh-result.json" 2>&1 \
            | tee target/benchmarks/maven-benchmark.log

      - name: Convert results for comparison charts
        run: |
          python3 .github/scripts/convert-jmh-backend-comparison.py \
            target/benchmarks/jmh-result.json \
            target/benchmarks/backend-comparison.json
          cat target/benchmarks/backend-comparison.json

      - name: Generate JMH performance badge
        if: always()
        run: |
          if [ -f target/benchmarks/jmh-result.json ]; then
            python3 .github/scripts/write-performance-badge.py target/benchmarks/jmh-result.json
          fi

      - name: Upload JMH benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jmh-backend-comparison-results
          path: |
            target/benchmarks/*
            docs/badges/performance.json
          if-no-files-found: error

      - name: Report benchmark dashboard
        if: always()
        run: |
          echo '### Repository backend performance' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Compared backends: JGit + filesystem, JGit + HSQLDB (in-memory), JGit + PostgreSQL.' >> "$GITHUB_STEP_SUMMARY"
          echo 'PostgreSQL is provided by the JUnit Testcontainers extension; the workflow only invokes Maven.' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '[Open performance charts](https://carstenartur.github.io/jgit-storage-hibernate/dev/bench/)' >> "$GITHUB_STEP_SUMMARY"

  pack-capacity:
    name: Chunked pack capacity 1/16/128 MiB
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify bounded chunk storage capacity
        run: mvn -B -pl jgit-storage-hibernate-core -Ppack-capacity verify

      - name: Upload capacity test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chunked-pack-capacity-results
          path: jgit-storage-hibernate-core/target/failsafe-reports/*
          if-no-files-found: error

  publish-history:
    name: Publish benchmark history
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: jmh
    runs-on: ubuntu-latest
    concurrency:
      group: benchmark-history-publication-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download benchmark results outside the worktree
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8
        with:
          name: jmh-backend-comparison-results
          path: ${{ runner.temp }}/jmh-benchmark-artifact

      - name: Locate benchmark comparison artifact
        id: benchmark-artifact
        shell: bash
        run: |
          set -euo pipefail
          result="$(find "${RUNNER_TEMP}/jmh-benchmark-artifact" -type f -name backend-comparison.json -print -quit)"
          test -s "$result"
          echo "path=$result" >> "$GITHUB_OUTPUT"

      - name: Initialize benchmark history branch
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            exit 0
          fi
          empty_tree="$(git mktree </dev/null)"
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          initial_commit="$(printf '%s\n' 'Initialize benchmark history' | git commit-tree "$empty_tree")"
          git push origin "$initial_commit:refs/heads/gh-pages"

      - name: Store benchmark history and publish charts
        uses: benchmark-action/github-action-benchmark@67cf262e8c79ad6f86652f2cb0c4ea19dbd5660a # v1.22.1
        with:
          name: Repository backend comparison
          tool: customSmallerIsBetter
          output-file-path: ${{ steps.benchmark-artifact.outputs.path }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-repository: github.com/carstenartur/jgit-storage-hibernate
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '150%'
          comment-on-alert: true
          fail-on-alert: false
          alert-comment-cc-users: '@carstenartur'
          summary-always: true
          max-items-in-chart: 100

  update-performance-badge:
    name: Update JMH performance badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: jmh
    runs-on: ubuntu-latest
    concurrency:
      group: repository-badge-publication-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download generated badge outside the worktree
        uses: actions/download-artifact@974686ed5098c7f9c9289ec946b9058e496a2561 # v8
        with:
          name: jmh-backend-comparison-results
          path: ${{ runner.temp }}/jmh-benchmark-artifact

      - name: Commit performance badge without racing other badge jobs
        shell: bash
        run: |
          set -euo pipefail
          source_badge="$(find "${RUNNER_TEMP}/jmh-benchmark-artifact" -type f -path '*/docs/badges/performance.json' -print -quit)"
          if [ -z "$source_badge" ]; then
            source_badge="$(find "${RUNNER_TEMP}/jmh-benchmark-artifact" -type f -name performance.json -print -quit)"
          fi
          test -s "$source_badge"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main

            if cmp -s "$source_badge" docs/badges/performance.json; then
              echo 'Performance badge data unchanged'
              exit 0
            fi

            cp "$source_badge" docs/badges/performance.json
            git add docs/badges/performance.json
            git commit -m 'Update JMH performance badge [skip ci]'
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done

          echo 'Could not publish performance badge after three attempts' >&2
          exit 1
