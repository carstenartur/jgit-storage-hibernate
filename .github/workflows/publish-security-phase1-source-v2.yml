name: Publish Validated Security Phase 1 Source v2

on:
  push:
    branches:
      - feature/security-phase-1
    paths:
      - .github/workflows/publish-security-phase1-source-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/security-phase-1
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Materialize the reviewed Security source
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/scripts/security-phase1-module.b64.part-00-0 \
            .github/scripts/security-phase1-module.b64.part-00-1 \
            .github/scripts/security-phase1-module.b64.part-01 \
            .github/scripts/security-phase1-module.b64.part-02 \
            .github/scripts/security-phase1-module.b64.part-03 \
            .github/scripts/security-phase1-module.b64.part-04 \
            > .github/scripts/security-phase1-module.b64
          python3 .github/scripts/generate-security-phase1.py
          test -f jgit-storage-hibernate-security/pom.xml
          test "$(find jgit-storage-hibernate-security/src/main/java -type f -name '*.java' | wc -l)" -eq 24
          test "$(find jgit-storage-hibernate-security/src/test/java -type f -name '*.java' | wc -l)" -eq 5
          test "$(find jgit-storage-hibernate-security/src/main/resources -type f -name 'V0_11_0__create_security_schema.sql' | wc -l)" -eq 4
      - name: Normalize and validate Security migrations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('jgit-storage-hibernate-security/src/main/resources/db/migration/jgit-storage-hibernate/security')
          identifier = r'(?:git_security_group_member|"git_security_group_member"|\[git_security_group_member\])'
          table = re.compile(rf'(?im)^\s*create\s+table\s+{identifier}\s*\(')
          index = re.compile(rf'(?im)^\s*create\s+(?:unique\s+)?index\b[^;]*?\bon\s+{identifier}\s*\(')
          alter = re.compile(rf'(?im)^\s*alter\s+table\s+{identifier}\b')
          principal = re.compile(r'^\s*create\s+table\s+(?:\[|\")?git_security_principal(?:\]|\")?\s*\(', re.I)
          group = re.compile(r'^\s*create\s+table\s+(?:\[|\")?git_security_group(?:\]|\")?\s*\(', re.I)

          def take(sql, start):
              semicolon = sql.find(';', start)
              if semicolon < 0:
                  raise SystemExit('Security migration statement has no semicolon')
              end = semicolon + 1
              suffix = re.match(r'[ \t]*(?:\r?\n[ \t]*GO[ \t]*)?(?:\r?\n)?', sql[end:], re.I)
              if suffix:
                  end += suffix.end()
              return sql[start:end].strip(), sql[:start] + sql[end:]

          paths = sorted(root.glob('*/V0_11_0__create_security_schema.sql'))
          if {path.parent.name for path in paths} != {'h2', 'hsqldb', 'postgresql', 'sqlserver'}:
              raise SystemExit('Incomplete Security migration matrix')
          for path in paths:
              sql = path.read_text(encoding='utf-8')
              match = table.search(sql)
              if match is None:
                  raise SystemExit(f'Missing membership table in {path}')
              membership, sql = take(sql, match.start())
              if 'membership_id' not in membership:
                  raise SystemExit(f'Missing membership_id in {path}')
              dependents = []
              while True:
                  matches = [match for pattern in (index, alter) if (match := pattern.search(sql))]
                  if not matches:
                      break
                  statement, sql = take(sql, min(matches, key=lambda item: item.start()).start())
                  dependents.append(statement)
              reordered = sql.rstrip() + '\n\n' + membership + '\n'
              if dependents:
                  reordered += '\n' + '\n\n'.join(dependents) + '\n'
              lines = reordered.splitlines()
              positions = {
                  'principal': next((i for i, line in enumerate(lines) if principal.search(line)), -1),
                  'group': next((i for i, line in enumerate(lines) if group.search(line)), -1),
                  'membership': next((i for i, line in enumerate(lines) if table.search(line)), -1),
              }
              if min(positions.values()) < 0 or not (positions['principal'] < positions['membership'] and positions['group'] < positions['membership']):
                  raise SystemExit(f'Invalid table order in {path}: {positions}')
              path.write_text(reordered, encoding='utf-8')

          hsqldb = root / 'hsqldb' / 'V0_11_0__create_security_schema.sql'
          text = hsqldb.read_text(encoding='utf-8')
          text, count = re.subn(r'(?i)timestamp\s*(?:\(\s*\d+\s*\))?\s+with\s+time\s+zone', 'timestamp(6)', text)
          if count == 0:
              raise SystemExit('Expected zoned HSQLDB timestamp columns were not found')
          hsqldb.write_text(text, encoding='utf-8')
          PY
      - name: Verify architecture, policy and complete Maven reactor
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/test_verify_module_boundaries.py
          python3 .github/scripts/verify-module-boundaries.py \
            --root . \
            --json target/module-boundaries/security-phase1.json \
            --markdown target/module-boundaries/security-phase1.md
          python3 .github/scripts/verify-security-policy.py
          mvn -B -ntp clean verify
      - name: Publish one static source commit
        shell: bash
        run: |
          set -euo pipefail
          publish_branch='feature/security-phase-1-source'
          git fetch origin main
          git reset --mixed origin/main

          rm -f .github/scripts/generate-security-phase1.py
          rm -f .github/scripts/security-phase1-module.b64
          rm -f .github/scripts/security-phase1-module.b64.part-*
          rm -f .github/workflows/inspect-security-javadoc-source.yml
          rm -f .github/workflows/materialize-security-phase1.yml
          rm -f .github/workflows/publish-security-phase1-source.yml
          rm -f .github/workflows/publish-security-phase1-source-v2.yml
          rm -f .github/workflows/fix-publish-security-phase1-source.yml
          find . -type d -name target -prune -exec rm -rf {} +
          find . -type d -name __pycache__ -prune -exec rm -rf {} +

          test -f jgit-storage-hibernate-security/pom.xml
          test "$(find jgit-storage-hibernate-security/src/main/java -type f -name '*.java' | wc -l)" -eq 24
          test "$(find jgit-storage-hibernate-security/src/test/java -type f -name '*.java' | wc -l)" -eq 5
          test "$(find jgit-storage-hibernate-security/src/main/resources -type f -name 'V0_11_0__create_security_schema.sql' | wc -l)" -eq 4

          git add -A
          git diff --cached --check
          if git ls-files --cached | grep -E '(^|/)target/|(^|/)__pycache__/|\.class$|\.jar$|security-phase1-module\.b64|generate-security-phase1\.py|inspect-security-javadoc-source\.yml|materialize-security-phase1\.yml|publish-security-phase1-source|fix-publish-security-phase1-source'; then
            echo 'Forbidden bootstrap, diagnostic or build artifacts remain in the final index.' >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit \
            -m 'Add Security Phase 1 authorization module' \
            -m 'Add repository-scoped principals, groups, grants and protected-ref policies with deterministic deny precedence, auditable evidence and Flyway migrations for H2, HSQLDB, PostgreSQL and SQL Server.'
          git push origin "HEAD:refs/heads/${publish_branch}"
          echo "Published ${publish_branch} at $(git rev-parse HEAD)"
