          ```

          The default remains `stateful` until allocation, GC and elapsed-time measurements show a
          material advantage across the supported database matrix. The stateless writer is deliberately
          limited to `GitPackChunkEntity`, which is raw non-indexed payload data. Pack parents, publication
          metadata, reflogs and all Hibernate Search projections continue to use ordinary stateful
          sessions.

          The child `StatelessSession` is opened from the active parent session with `connection()`, so it
          shares the same JDBC connection and resource-local transaction. Parent and chunk inserts therefore
          roll back together. `CacheMode.IGNORE` prevents one-MiB payload arrays from entering the second-level
          cache, and explicit `insertMultiple()` batches preserve synchronous failure reporting without
          relying on stateless write-behind.

          The focused PostgreSQL benchmark compares stateful insertion with batching disabled, portable
          stateful batching, PostgreSQL batch rewriting and the stateless shared-transaction writer. Its GC
