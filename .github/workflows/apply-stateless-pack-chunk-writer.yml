name: Apply stateless pack chunk writer

on:
  push:
    branches: [ perf/stateless-pack-chunk-writer ]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: ${{ !contains(github.event.head_commit.message, '[stateless-writer-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/stateless-pack-chunk-writer
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply implementation and tests
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding="utf-8")

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected source fragment not found in {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          write(
              "jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/objects/HibernatePackChunkWriter.java",
              r'''/*
           * Copyright (C) 2026, Carsten Hammer and contributors.
           *
           * This program and the accompanying materials are made available under the
           * terms of the BSD 3-Clause License.
           *
           * SPDX-License-Identifier: BSD-3-Clause
           */
          package io.github.carstenartur.jgit.storage.hibernate.objects;

          import io.github.carstenartur.jgit.storage.hibernate.entity.GitPackChunkEntity;
          import java.util.List;
          import java.util.Locale;
          import java.util.Objects;
          import org.hibernate.CacheMode;
          import org.hibernate.Session;
          import org.hibernate.StatelessSession;

          /**
           * Internal insertion strategy for immutable pack payload chunks.
           *
           * <p>The default stateful path preserves the established persistence-context batching
           * behavior. The experimental stateless path opens a child session that shares the parent
           * session's JDBC connection and resource-local transaction. Only non-indexed raw chunk rows
           * pass through this class; searchable projections continue to use ordinary stateful sessions.
           */
          final class HibernatePackChunkWriter implements AutoCloseable {

            static final String MODE_PROPERTY = "jgit.storage.hibernate.pack.chunk_writer";
            static final String STATEFUL_MODE = "stateful";
            static final String STATELESS_MODE = "stateless";

            private final Session statefulSession;
            private final StatelessSession statelessSession;

            private HibernatePackChunkWriter(
                Session statefulSession, StatelessSession statelessSession) {
              this.statefulSession = statefulSession;
              this.statelessSession = statelessSession;
            }

            /**
             * Open the configured writer for a parent session whose pending parent insert was flushed.
             *
             * <p>The stateless path clears the parent persistence context before opening the child so
             * parent and child never manage the same entity instance. Calling {@code connection()} on
             * the child builder keeps parent, chunks and any later publication mutation in the same JDBC
             * transaction.
             */
            static HibernatePackChunkWriter open(Session parentSession) {
              Objects.requireNonNull(parentSession, "parentSession");
              if (configuredMode(parentSession) == Mode.STATELESS) {
                parentSession.clear();
                StatelessSession child =
                    parentSession
                        .statelessWithOptions()
                        .connection()
                        .initialCacheMode(CacheMode.IGNORE)
                        .open();
                return new HibernatePackChunkWriter(null, child);
              }
              return new HibernatePackChunkWriter(parentSession, null);
            }

            void insert(List<GitPackChunkEntity> chunks) {
              Objects.requireNonNull(chunks, "chunks");
              if (chunks.isEmpty()) {
                return;
              }
              if (statelessSession != null) {
                statelessSession.insertMultiple(List.copyOf(chunks));
                return;
              }
              for (GitPackChunkEntity chunk : chunks) {
                statefulSession.persist(chunk);
              }
              statefulSession.flush();
              statefulSession.clear();
            }

            boolean stateless() {
              return statelessSession != null;
            }

            @Override
            public void close() {
              if (statelessSession != null) {
                statelessSession.close();
              }
            }

            private static Mode configuredMode(Session session) {
              Object configured = session.getSessionFactory().getProperties().get(MODE_PROPERTY);
              if (configured == null || configured.toString().isBlank()) {
                return Mode.STATEFUL;
              }
              return switch (configured.toString().trim().toLowerCase(Locale.ROOT)) {
                case STATEFUL_MODE -> Mode.STATEFUL;
                case STATELESS_MODE -> Mode.STATELESS;
                default ->
                    throw new IllegalArgumentException(
                        "Unsupported "
                            + MODE_PROPERTY
                            + " value '"
                            + configured
                            + "'; expected '"
                            + STATEFUL_MODE
                            + "' or '"
                            + STATELESS_MODE
                            + "'");
              };
            }

            private enum Mode {
              STATEFUL,
              STATELESS
            }
          }
          '''.replace("          ", "", 1).replace("\n          ", "\n"))

          staged_store = "jgit-storage-hibernate-core/src/main/java/io/github/carstenartur/jgit/storage/hibernate/objects/StagedPackExtensionStore.java"
          replace_once(
              staged_store,
              r'''  private void persistChunks(
              Session session, Long packId, StagedExtension stagedExtension) throws IOException {
            long fileSize = stagedExtension.fileSize();
            long position = 0;
            int chunkIndex = 0;
            int pendingChunks = 0;
            try (StagedPayloadReader reader = stagedExtension.openReader()) {
              while (position < fileSize) {
                int chunkLength =
                    (int) Math.min(HibernateObjDatabase.PACK_CHUNK_SIZE, fileSize - position);
                byte[] chunkData = new byte[chunkLength];
                ByteBuffer destination = ByteBuffer.wrap(chunkData);
                long chunkPosition = position;
                while (destination.hasRemaining()) {
                  int count = reader.read(chunkPosition, destination);
                  if (count <= 0) {
                    throw new IOException("Staged pack payload ended before declared size " + fileSize);
                  }
                  chunkPosition += count;
                }

                GitPackChunkEntity chunk = new GitPackChunkEntity();
                chunk.setPackId(packId);
                chunk.setChunkIndex(chunkIndex);
                chunk.setChunkSize(chunkLength);
                chunk.setData(chunkData);
                session.persist(chunk);

                position += chunkLength;
                chunkIndex++;
                pendingChunks++;
                if (pendingChunks == CHUNK_BATCH_SIZE) {
                  session.flush();
                  session.clear();
                  pendingChunks = 0;
                }
              }
            }
            if (pendingChunks > 0) {
              session.flush();
            }
          }
          ''',
              r'''  private void persistChunks(
              Session session, Long packId, StagedExtension stagedExtension) throws IOException {
            long fileSize = stagedExtension.fileSize();
            long position = 0;
            int chunkIndex = 0;
            List<GitPackChunkEntity> pendingChunks = new ArrayList<>(CHUNK_BATCH_SIZE);
            try (HibernatePackChunkWriter chunkWriter = HibernatePackChunkWriter.open(session);
                StagedPayloadReader reader = stagedExtension.openReader()) {
              while (position < fileSize) {
                int chunkLength =
                    (int) Math.min(HibernateObjDatabase.PACK_CHUNK_SIZE, fileSize - position);
                byte[] chunkData = new byte[chunkLength];
                ByteBuffer destination = ByteBuffer.wrap(chunkData);
                long chunkPosition = position;
                while (destination.hasRemaining()) {
                  int count = reader.read(chunkPosition, destination);
                  if (count <= 0) {
                    throw new IOException("Staged pack payload ended before declared size " + fileSize);
                  }
                  chunkPosition += count;
                }

                GitPackChunkEntity chunk = new GitPackChunkEntity();
                chunk.setPackId(packId);
                chunk.setChunkIndex(chunkIndex);
                chunk.setChunkSize(chunkLength);
                chunk.setData(chunkData);
                pendingChunks.add(chunk);

                position += chunkLength;
                chunkIndex++;
                if (pendingChunks.size() == CHUNK_BATCH_SIZE) {
                  chunkWriter.insert(pendingChunks);
                  pendingChunks.clear();
                }
              }
              if (!pendingChunks.isEmpty()) {
                chunkWriter.insert(pendingChunks);
              }
            }
          }
          ''')

          write(
              "jgit-storage-hibernate-core/src/test/java/io/github/carstenartur/jgit/storage/hibernate/objects/HibernatePackChunkWriterH2Test.java",
              r'''/*
           * Copyright (C) 2026, Carsten Hammer and contributors.
           *
           * This program and the accompanying materials are made available under the
           * terms of the BSD 3-Clause License.
           *
           * SPDX-License-Identifier: BSD-3-Clause
           */
          package io.github.carstenartur.jgit.storage.hibernate.objects;

          import static org.junit.jupiter.api.Assertions.assertArrayEquals;
          import static org.junit.jupiter.api.Assertions.assertEquals;
          import static org.junit.jupiter.api.Assertions.assertFalse;
          import static org.junit.jupiter.api.Assertions.assertThrows;
          import static org.junit.jupiter.api.Assertions.assertTrue;

          import io.github.carstenartur.jgit.storage.hibernate.config.HibernateSessionFactoryProvider;
          import io.github.carstenartur.jgit.storage.hibernate.entity.GitPackChunkEntity;
          import io.github.carstenartur.jgit.storage.hibernate.entity.GitPackEntity;
          import io.github.carstenartur.jgit.storage.hibernate.entity.GitRepositoryLifecycleEntity;
          import io.github.carstenartur.jgit.storage.hibernate.repository.HibernateRepository;
          import java.time.Instant;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Properties;
          import java.util.Random;
          import java.util.UUID;
          import org.eclipse.jgit.lib.Constants;
          import org.eclipse.jgit.lib.ObjectId;
          import org.eclipse.jgit.lib.ObjectInserter;
          import org.hibernate.Session;
          import org.hibernate.Transaction;
          import org.junit.jupiter.api.Test;

          class HibernatePackChunkWriterH2Test {

            @Test
            void statelessWriterSharesTheOuterResourceLocalTransaction() {
              try (HibernateSessionFactoryProvider provider = provider(HibernatePackChunkWriter.STATELESS_MODE);
                  Session session = provider.getSessionFactory().openSession()) {
                Transaction transaction = session.beginTransaction();
                Long packId = persistParent(session);

                List<GitPackChunkEntity> chunks = chunks(packId, 3);
                try (HibernatePackChunkWriter writer = HibernatePackChunkWriter.open(session)) {
                  assertTrue(writer.stateless());
                  writer.insert(chunks);
                }

                assertEquals(3L, chunkCount(session, packId));
                transaction.rollback();
              }

              try (HibernateSessionFactoryProvider provider = providerForExistingDatabase()) {
                assertEquals(0L, totalPackCount(provider));
                assertEquals(0L, totalChunkCount(provider));
              }
            }

            @Test
            void defaultWriterRemainsStateful() {
              try (HibernateSessionFactoryProvider provider = provider(null);
                  Session session = provider.getSessionFactory().openSession()) {
                session.beginTransaction();
                try (HibernatePackChunkWriter writer = HibernatePackChunkWriter.open(session)) {
                  assertFalse(writer.stateless());
                }
                session.getTransaction().rollback();
              }
            }

            @Test
            void rejectsUnknownWriterMode() {
              try (HibernateSessionFactoryProvider provider = provider("mystery");
                  Session session = provider.getSessionFactory().openSession()) {
                session.beginTransaction();
                assertThrows(
                    IllegalArgumentException.class, () -> HibernatePackChunkWriter.open(session));
                session.getTransaction().rollback();
              }
            }

            @Test
            void statelessWriterPublishesAndReopensLargePackPayload() throws Exception {
              String databaseName = "stateless-reopen-" + UUID.randomUUID();
              Properties properties = h2Properties(databaseName);
              properties.put(
                  HibernatePackChunkWriter.MODE_PROPERTY, HibernatePackChunkWriter.STATELESS_MODE);
              byte[] payload = new byte[2 * 1024 * 1024 + 257];
              new Random(0x53544154454c4553L).nextBytes(payload);
              ObjectId objectId;

              try (HibernateSessionFactoryProvider provider =
                  new HibernateSessionFactoryProvider(properties)) {
                try (HibernateRepository repository =
                    HibernateRepository.create(provider.getSessionFactory(), "stateless-reopen")) {
                  repository.create(true);
                  try (ObjectInserter inserter = repository.newObjectInserter()) {
                    objectId = inserter.insert(Constants.OBJ_BLOB, payload);
                    inserter.flush();
                  }
                }

                assertTrue(totalChunkCount(provider) > 0L);
                try (HibernateRepository reopened =
                    HibernateRepository.create(provider.getSessionFactory(), "stateless-reopen")) {
                  assertArrayEquals(payload, reopened.open(objectId).getBytes());
                }
              }
            }

            private static final String ROLLBACK_DATABASE =
                "stateless-rollback-" + UUID.randomUUID();

            private static HibernateSessionFactoryProvider provider(String mode) {
              Properties properties = h2Properties(ROLLBACK_DATABASE);
              if (mode != null) {
                properties.put(HibernatePackChunkWriter.MODE_PROPERTY, mode);
              }
              return new HibernateSessionFactoryProvider(properties);
            }

            private static HibernateSessionFactoryProvider providerForExistingDatabase() {
              return new HibernateSessionFactoryProvider(h2Properties(ROLLBACK_DATABASE));
            }

            private static Properties h2Properties(String databaseName) {
              Properties properties = new Properties();
              properties.put(
                  "hibernate.connection.url",
                  "jdbc:h2:mem:" + databaseName + ";DB_CLOSE_DELAY=-1");
              properties.put("hibernate.connection.driver_class", "org.h2.Driver");
              properties.put("hibernate.dialect", "org.hibernate.dialect.H2Dialect");
              properties.put("hibernate.hbm2ddl.auto", "update");
              properties.put("hibernate.show_sql", "false");
              return properties;
            }

            private static Long persistParent(Session session) {
              Instant now = Instant.now();
              GitRepositoryLifecycleEntity lifecycle = new GitRepositoryLifecycleEntity();
              lifecycle.setRepositoryName("rollback");
              lifecycle.setCreatedAt(now);
              session.persist(lifecycle);

              GitPackEntity pack = new GitPackEntity();
              pack.setRepositoryName("rollback");
              pack.setPackName("pack-rollback");
              pack.setPackExtension("pack");
              pack.setData(null);
              pack.setFileSize(3L * 1024L * 1024L);
              pack.setCommitted(false);
              pack.setCreatedAt(now);
              session.persist(pack);
              session.flush();
              return pack.getId();
            }

            private static List<GitPackChunkEntity> chunks(Long packId, int count) {
              List<GitPackChunkEntity> chunks = new ArrayList<>(count);
              for (int index = 0; index < count; index++) {
                GitPackChunkEntity chunk = new GitPackChunkEntity();
                chunk.setPackId(packId);
                chunk.setChunkIndex(index);
                chunk.setChunkSize(4);
                chunk.setData(new byte[] {(byte) index, 1, 2, 3});
                chunks.add(chunk);
              }
              return chunks;
            }

            private static long chunkCount(Session session, Long packId) {
              return session
                  .createQuery(
                      "SELECT COUNT(c) FROM GitPackChunkEntity c WHERE c.packId = :packId",
                      Long.class)
                  .setParameter("packId", packId)
                  .getSingleResult();
            }

            private static long totalPackCount(HibernateSessionFactoryProvider provider) {
              try (Session session = provider.getSessionFactory().openSession()) {
                return session
                    .createQuery("SELECT COUNT(p) FROM GitPackEntity p", Long.class)
                    .getSingleResult();
              }
            }

            private static long totalChunkCount(HibernateSessionFactoryProvider provider) {
              try (Session session = provider.getSessionFactory().openSession()) {
                return session
                    .createQuery("SELECT COUNT(c) FROM GitPackChunkEntity c", Long.class)
                    .getSingleResult();
              }
            }
          }
