name: Apply and verify stateless pack chunk writer

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'perf/stateless-pack-chunk-writer'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: perf/stateless-pack-chunk-writer
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply implementation embedded in the preparation workflow
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/apply-stateless-pack-chunk-writer.yml').read_text(
              encoding='utf-8')
          start_marker = "          python3 <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          embedded = source[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in embedded.splitlines()) + '\n'

          strict_replace = '''def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Expected source fragment not found in {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")
          '''
          resilient_replace = '''def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  if (path.endswith("StagedPackExtensionStore.java")
                          and "private void persistChunks(" in old):
                      method_start = text.index("  private void persistChunks(")
                      method_end = text.index(
                          "\\n  private static long committedPayloadBytes", method_start)
                      target.write_text(
                          text[:method_start] + new.rstrip() + text[method_end:],
                          encoding="utf-8")
                      return
                  raise SystemExit(f"Expected source fragment not found in {path}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")
          '''
          if strict_replace not in script:
              raise SystemExit('Could not locate replace_once helper in embedded script')
          script = script.replace(strict_replace, resilient_replace, 1)

          Path('/tmp/apply-stateless-pack-chunk-writer.py').write_text(
              script, encoding='utf-8')
          subprocess.run(
              ['python3', '/tmp/apply-stateless-pack-chunk-writer.py'], check=True)
          PY

      - name: Verify complete reactor
        shell: bash
        run: |
          git diff --check
          mvn -B verify

      - name: Commit verified implementation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/workflows/apply-stateless-pack-chunk-writer.yml \
            .github/workflows/apply-stateless-pack-chunk-writer-pr.yml
          git add -A
          git commit -m 'Add stateless ORM pack chunk writer [stateless-writer-applied]'
          git push origin HEAD:perf/stateless-pack-chunk-writer
