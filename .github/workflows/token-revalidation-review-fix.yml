name: Token revalidation review fix

on:
  push:
    branches:
      - feature/security-token-revalidation
    paths:
      - '.github/workflows/token-revalidation-review-fix.yml'

permissions:
  contents: write

jobs:
  patch-and-verify:
    name: Patch and verify token revalidation
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Patch review findings
        run: python3 .github/scripts/token_revalidation_review_fix.py

      - name: Run focused revalidation contracts
        run: >-
          mvn -B -ntp
          -pl jgit-storage-hibernate-security
          -am
          -Dtest=HibernateCredentialScopedRepositoryAccessPolicyTest,HibernateSecurityCredentialServiceTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Commit review fixes and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add jgit-storage-hibernate-security/src/main/java/io/github/carstenartur/jgit/storage/hibernate/security/HibernateSecurityCredentialService.java
          git add jgit-storage-hibernate-security/src/main/java/io/github/carstenartur/jgit/storage/hibernate/security/HibernateCredentialScopedRepositoryAccessPolicy.java
          git add jgit-storage-hibernate-security/src/test/java/io/github/carstenartur/jgit/storage/hibernate/security/HibernateCredentialScopedRepositoryAccessPolicyTest.java
          git rm .github/workflows/token-revalidation-review-fix.yml
          git rm .github/scripts/token_revalidation_review_fix.py
          git commit -m "Address token revalidation review findings"
          git push origin HEAD:feature/security-token-revalidation
