name: Apply issue 187 database-native telemetry

on:
  push:
    branches:
      - feat/187-database-native-telemetry

permissions:
  contents: write

concurrency:
  group: apply-issue187-database-native-telemetry
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout telemetry branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/187-database-native-telemetry
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker
        run: docker info

      - name: Apply benchmark integration
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/apply-issue187-database-telemetry.py
          if git diff --quiet; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Validated telemetry integration is already committed.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build benchmark dependencies
        if: steps.patch.outputs.changed == 'true'
        run: mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests

      - name: Run unit and profile-contract tests
        if: steps.patch.outputs.changed == 'true'
        run: |
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=DatabaseTelemetrySnapshotTest,PackStorageLayoutBenchmarkTest

      - name: Run PostgreSQL native telemetry integration
        if: steps.patch.outputs.changed == 'true'
        run: |
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=DatabaseNativeTelemetryIntegrationTest \
            -Djgit.storage.benchmark.database-telemetry.integration.enabled=true \
            -Djgit.storage.benchmark.database-telemetry.integration.backend=postgresql

      - name: Run SQL Server native telemetry integration
        if: steps.patch.outputs.changed == 'true'
        run: |
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=DatabaseNativeTelemetryIntegrationTest \
            -Djgit.storage.benchmark.database-telemetry.integration.enabled=true \
            -Djgit.storage.benchmark.database-telemetry.integration.backend=sqlserver

      - name: Run exact PostgreSQL pack-layout telemetry smoke
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/issue187-pack-layout
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=PackStorageLayoutBenchmarkTest \
            -Djgit.storage.benchmark.pack-layout.enabled=true \
            -Djgit.storage.benchmark.pack-layout.backend=postgresql \
            -Djgit.storage.benchmark.pack-layout.profile=smoke \
            -Djgit.storage.benchmark.database-telemetry.enabled=true \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/issue187-pack-layout/jmh-result.json"
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('target/issue187-pack-layout/pack-storage-layout-database-telemetry.json')
          value = json.loads(path.read_text(encoding='utf-8'))
          observations = value['observations']
          if not observations:
              raise SystemExit('Expected native telemetry observations')
          if not all(item['backend'] == 'postgresql' for item in observations):
              raise SystemExit('Unexpected telemetry backend')
          if not all('postgresql.wal.bytes' in item['counters'] for item in observations):
              raise SystemExit('Missing PostgreSQL WAL-byte deltas')
          text = path.read_text(encoding='utf-8')
          if 'NaN' in text or 'Infinity' in text:
              raise SystemExit('Telemetry is not strict JSON')
          print(f'Validated {len(observations)} exact invocation observations')
          PY

      - name: Verify source and artifact contracts
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -F 'IterationType.MEASUREMENT' \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/PackStorageLayoutBenchmark.java
          grep -F 'pack-storage-layout-database-telemetry.json' \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/PackStorageLayoutBenchmarkTest.java
          grep -F 'PostgreSQL WAL/I/O and SQL Server log/file-I/O' docs/performance-status.md

      - name: Commit validated integration
        if: steps.patch.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            jgit-storage-hibernate-benchmarks/src/main/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/PackStorageLayoutBenchmark.java \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/PackStorageLayoutBenchmarkTest.java \
            docs/performance-status.md
          git commit -m 'Integrate native telemetry with pack-layout benchmarks'
          git push origin HEAD:feat/187-database-native-telemetry

      - name: Upload exact telemetry evidence
        if: steps.patch.outputs.changed == 'true' && always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue187-postgresql-pack-layout-telemetry
          path: |
            target/issue187-pack-layout/**
            jgit-storage-hibernate-benchmarks/target/surefire-reports/**
          if-no-files-found: warn
