name: Apply issue 188 capacity documentation repair

on:
  push:
    branches:
      - fix/188-capacity-sparse-evidence-20260821

permissions:
  contents: write

concurrency:
  group: apply-issue188-capacity-doc-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout patch branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Apply bounded documentation repair
        run: python3 .github/scripts/apply-issue188-capacity-doc-fix.py

      - name: Verify converter regressions
        run: python3 .github/scripts/test_convert_jmh_pack_storage_layout.py

      - name: Verify documented profile contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'explicit 512-MiB write, sequential, short and deterministic random-read evidence' docs/operations/pack-storage-layout.md
          grep -F 'missing sparse evidence fails closed' docs/operations/pack-storage-layout.md

      - name: Remove one-shot patch tooling
        run: |
          rm .github/scripts/apply-issue188-capacity-doc-fix.py
          rm .github/workflows/apply-issue188-capacity-doc-fix.yml

      - name: Commit validated documentation
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            docs/operations/pack-storage-layout.md \
            .github/scripts/apply-issue188-capacity-doc-fix.py \
            .github/workflows/apply-issue188-capacity-doc-fix.yml
          if git diff --cached --quiet; then
            echo 'Expected issue #188 documentation repair produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Document fail-closed capacity sparse evidence'
          git push origin "HEAD:${GITHUB_REF_NAME}"
