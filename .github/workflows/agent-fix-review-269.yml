name: Apply PR 269 review fix

on:
  push:
    branches:
      - fix/release-automation-265
    paths:
      - '.github/workflows/agent-fix-review-269.yml'

permissions:
  contents: write

concurrency:
  group: pr-269-review-fix
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/release-automation-265
          fetch-depth: 0

      - name: Bind all gh operations to the validated release token
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          release_path = Path('.github/scripts/release.sh')
          release = release_path.read_text(encoding='utf-8')
          old = '''if [[ "$DRY_RUN" == false && -z "$RELEASE_AUTOMATION_TOKEN" ]]; then
            fail "RELEASE_GITHUB_TOKEN is required for non-dry-run release automation"
          fi
          '''
          new = '''if [[ "$DRY_RUN" == false && -z "$RELEASE_AUTOMATION_TOKEN" ]]; then
            fail "RELEASE_GITHUB_TOKEN is required for non-dry-run release automation"
          fi
          if [[ "$DRY_RUN" == false ]]; then
            export GH_TOKEN="$RELEASE_AUTOMATION_TOKEN"
          fi
          '''
          if release.count(old) != 1:
              raise SystemExit(f'Expected one release token guard, found {release.count(old)}')
          release_path.write_text(release.replace(old, new, 1), encoding='utf-8')

          test_path = Path('.github/scripts/test_release_workflow_trigger.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '''        self.assertNotIn("No RELEASE_GITHUB_TOKEN is configured", self.script)
          '''
          replacement = '''        self.assertNotIn("No RELEASE_GITHUB_TOKEN is configured", self.script)
              self.assertIn('export GH_TOKEN="$RELEASE_AUTOMATION_TOKEN"', self.script)
          '''
          if test.count(anchor) != 1:
              raise SystemExit(f'Expected one release-token test anchor, found {test.count(anchor)}')
          test_path.write_text(test.replace(anchor, replacement, 1), encoding='utf-8')
          PY

      - name: Verify focused release contracts
        run: |
          bash -n .github/scripts/release.sh
          python3 .github/scripts/test_release_workflow_trigger.py
          python3 .github/scripts/test_release_status_consistency.py
          python3 .github/scripts/verify-release-consistency.py
          git diff --check

      - name: Commit verified review fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/agent-fix-review-269.yml
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Use the validated release token for all GitHub CLI calls'
          git push origin HEAD:fix/release-automation-265
