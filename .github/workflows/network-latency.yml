name: Network Latency Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '47 4 * * 1'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/network-latency.yml'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-benchmarks/**'
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/network-latency.yml'
      - 'pom.xml'
      - 'jgit-storage-hibernate-core/**'
      - 'jgit-storage-hibernate-benchmarks/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  network-latency:
    name: PostgreSQL batching at 0/1/5/10/20/50 ms RTT
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build benchmark module with Maven
        shell: bash
        run: |
          mkdir -p target/network-latency
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests 2>&1 \
            | tee target/network-latency/maven-build.log

      - name: Run calibrated Toxiproxy comparison with Maven
        shell: bash
        run: |
          set -o pipefail
          mvn -B -pl jgit-storage-hibernate-benchmarks verify \
            -Pnetwork-latency-comparison \
            -Dbenchmark.resultFile="$GITHUB_WORKSPACE/target/network-latency/jmh-result.json" 2>&1 \
            | tee target/network-latency/maven-benchmark.log

      - name: Upload network-latency results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: network-latency-batching-results
          path: |
            target/network-latency/**
            jgit-storage-hibernate-benchmarks/target/failsafe-reports/**
          if-no-files-found: error

      - name: Report network-latency matrix
        if: always()
        run: |
          echo '### PostgreSQL batching across realistic RTTs' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Toxiproxy applies deterministic upstream/downstream delays for 0, 1, 5, 10, 20 and 50 ms total RTT.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The Maven profile compares batching disabled, Hibernate batching, PostgreSQL reWriteBatchedInserts and the stateless ORM writer for a 16 MiB non-compressible publication through HikariCP.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The artifact contains raw JMH JSON, per-RTT output and a SELECT 1 calibration CSV.' >> "$GITHUB_STEP_SUMMARY"
