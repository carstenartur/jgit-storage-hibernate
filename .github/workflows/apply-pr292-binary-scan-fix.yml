name: Apply PR 292 binary-safe credential scan

on:
  pull_request:
    branches: [ main ]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

concurrency:
  group: apply-pr292-binary-scan-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEAD_REF: ${{ github.event.pull_request.head.ref }}

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_REF }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Apply binary-safe scan repair
        run: python3 .github/scripts/apply-pr292-binary-scan-fix.py

      - name: Build benchmark dependencies
        run: mvn -B -pl jgit-storage-hibernate-benchmarks -am install -DskipTests

      - name: Run credential and telemetry contracts
        run: |
          mvn -B -pl jgit-storage-hibernate-benchmarks test \
            -Dtest=PackStorageLayoutBenchmarkTest,DatabaseTelemetrySnapshotTest

      - name: Verify review contract
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'new String(Files.readAllBytes(file), StandardCharsets.UTF_8)' \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/PackStorageLayoutBenchmarkTest.java
          grep -F 'credentialScanToleratesNonUtf8Artifacts' \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/PackStorageLayoutBenchmarkTest.java
          git diff --check

      - name: Remove one-shot repair tooling
        run: |
          rm .github/scripts/apply-pr292-binary-scan-fix.py
          rm .github/workflows/apply-pr292-binary-scan-fix.yml

      - name: Commit validated review fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            jgit-storage-hibernate-benchmarks/src/test/java/io/github/carstenartur/jgit/storage/hibernate/benchmark/PackStorageLayoutBenchmarkTest.java \
            .github/scripts/apply-pr292-binary-scan-fix.py \
            .github/workflows/apply-pr292-binary-scan-fix.yml
          if git diff --cached --quiet; then
            echo 'Expected PR #292 review fix produced no staged changes' >&2
            exit 1
          fi
          git commit -m 'Make credential scan binary-safe'
          git push origin "HEAD:${HEAD_REF}"
